<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; width: 100vw; height: 100vh; background: transparent; }

        .social-wrapper {
            position: fixed; bottom: 15px; right: 20px; z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .social-wrapper.visible {
            opacity: 1;
        }
        .social-bg {
            position: absolute;
            width: 1591px;
            height: 82px;
            background: linear-gradient(90deg, transparent 0%, #1e293b 15%, #1e293b 100%);
            border-radius: 0 16px 16px 0;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translate(-69px, 12px);
        }
        .social-bg::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 70%;
            border: 2px solid #2a4a7a;
            border-left: none;
            border-radius: 0 16px 16px 0;
            mask: linear-gradient(90deg, transparent 0%, black 20%);
            -webkit-mask: linear-gradient(90deg, transparent 0%, black 20%);
        }
        .social-content {
            position: relative; z-index: 2;
            padding: 20px 28px;
            display: flex; align-items: center; gap: 30.4px;
            transform: translate(-40.3px, 14px);
        }
        .right-section { display: flex; flex-direction: column; gap: 4px; transform: translateY(2px); }
        .handle { 
            font-size: 29.5px; 
            font-weight: 500; 
            text-transform: lowercase; 
            letter-spacing: 0.2px; 
            transform: translate(47.9px, 14.9px);
        }
        .handle .at { color: #4AB5E8; }
        .handle .hush { color: #4AB5E8; }
        .handle .swish { color: #EB9861; }
        .subtitle { 
            font-size: 19px; 
            color: rgba(180, 190, 200, 0.7); 
            font-weight: 700; 
            letter-spacing: 6.8px; 
            text-transform: lowercase; 
            opacity: 0.73;
            transform: translate(6.3px, -43.8px);
        }
        .divider { width: 2px; height: 60px; background: #3b5998; }
        .socials { display: flex; gap: 11.1px; }
        .social-item { display: flex; flex-direction: column; align-items: center; gap: -10px; opacity: 0.69; }
        .social-item i {
            font-size: 23px;
            width: 35.5px; height: 35.5px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 145, 145, 0.2); border-radius: 12px;
        }
        .social-item.ig i { color: #00f2f2; }
        .social-item.yt i { color: #00f2f2; }
        .social-item.tt i { color: #00f2f2; }
        .social-item .count { 
            font-size: 18px; 
            color: #00f2f2; 
            font-weight: 700; 
            background: rgba(0, 145, 145, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 145, 145, 0.4);
        }
        
    </style>
</head>
<body>
    <div class="social-wrapper">
        <div class="social-bg"></div>
        <div class="social-content">
            <div class="socials">
                <div class="social-item ig"><i class="fab fa-instagram"></i><span class="count">146.8K</span></div>
                <div class="social-item yt"><i class="fab fa-youtube"></i><span class="count">5.1K</span></div>
                <div class="social-item tt"><i class="fab fa-tiktok"></i><span class="count">510</span></div>
            </div>
            <div class="divider"></div>
            <div class="right-section">
                <span class="handle"><span class="at">@</span><span class="hush">hush</span><span class="swish">swish</span></span>
                <span class="subtitle">silent basketball</span>
            </div>
        </div>
    </div>

    <script>
        // Socials Overlay Controller
        // Shows overlay when quarter is active (Q1-Q4) AND toggle is enabled
        // 10s delay for Q1 only

        const API_BASE = window.location.origin;
        const SHOW_DELAY_Q1 = 10000; // 10 seconds for Q1
        const POLL_INTERVAL = 1000; // Check every second

        let lastQuarter = null;
        let lastSocialsEnabled = false;
        let delayTimeout = null;
        let isVisible = false;
        let initialized = false;

        async function checkOverlayState() {
            try {
                // Check both quarter and socials toggle
                const [quarterRes, socialsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/quarter`),
                    fetch(`${API_BASE}/api/socials-enabled`)
                ]);

                if (!quarterRes.ok || !socialsRes.ok) return;

                const quarterData = await quarterRes.json();
                const socialsData = await socialsRes.json();
                const wrapper = document.querySelector('.social-wrapper');

                const socialsEnabled = socialsData && socialsData.enabled === true;
                const quarterActive = quarterData && quarterData.current && quarterData.startTime;

                // On first check, update lastSocialsEnabled and ensure hidden if toggle is off
                if (!initialized) {
                    lastSocialsEnabled = socialsEnabled;
                    initialized = true;
                    // On first load, always hide if toggle is disabled (don't trust initial state)
                    if (!socialsEnabled) {
                        hideOverlay(wrapper);
                        return;
                    }
                }

                // If toggle is disabled or no quarter - hide immediately
                if (!socialsEnabled || !quarterActive) {
                    if (delayTimeout) {
                        clearTimeout(delayTimeout);
                        delayTimeout = null;
                    }
                    hideOverlay(wrapper);
                    lastQuarter = null;
                    lastSocialsEnabled = socialsEnabled;
                    return;
                }

                // Both conditions met - check quarter logic
                const quarterChanged = quarterData.current !== lastQuarter;
                const toggleChanged = socialsEnabled !== lastSocialsEnabled;

                // If toggle was just disabled, hide immediately
                if (toggleChanged && !socialsEnabled) {
                    lastSocialsEnabled = socialsEnabled;
                    return; // Already hidden above
                }

                // Reset delay if quarter or toggle changed
                if (quarterChanged || toggleChanged) {
                    if (delayTimeout) {
                        clearTimeout(delayTimeout);
                        delayTimeout = null;
                    }
                    lastQuarter = quarterData.current;
                    lastSocialsEnabled = socialsEnabled;

                    // Only proceed if toggle is enabled
                    if (socialsEnabled) {
                        // Q1: Wait 10 seconds before showing
                        if (quarterData.current === 'Q1') {
                            const elapsed = Date.now() - quarterData.startTime;
                            const remaining = Math.max(0, SHOW_DELAY_Q1 - elapsed);
                            
                            if (remaining > 0) {
                                delayTimeout = setTimeout(() => {
                                    showOverlay(wrapper);
                                    delayTimeout = null;
                                }, remaining);
                            } else {
                                // Already past 10 seconds, show immediately
                                showOverlay(wrapper);
                            }
                        } else {
                            // Q2, Q3, Q4: Show immediately
                            showOverlay(wrapper);
                        }
                    }
                } else if (socialsEnabled && isVisible === false && !delayTimeout) {
                    // If already visible state matches but overlay isn't showing, make sure it shows
                    // This handles the case where the state was already correct on page load
                    if (quarterData.current === 'Q1') {
                        const elapsed = Date.now() - quarterData.startTime;
                        if (elapsed >= SHOW_DELAY_Q1) {
                            showOverlay(wrapper);
                        }
                    } else {
                        showOverlay(wrapper);
                    }
                }
            } catch (error) {
                // Silently handle errors
            }
        }

        function showOverlay(wrapper) {
            if (!isVisible) {
                wrapper.classList.add('visible');
                isVisible = true;
            }
        }

        function hideOverlay(wrapper) {
            if (isVisible) {
                wrapper.classList.remove('visible');
                isVisible = false;
            }
        }

        // Start polling
        checkOverlayState();
        setInterval(checkOverlayState, POLL_INTERVAL);
    </script>
</body>
</html>
