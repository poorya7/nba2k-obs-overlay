<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Games - Font Sizes Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: row;
            gap: 40px;
        }

        .main-content {
            display: flex;
            flex-direction: row;
            gap: 40px;
            flex: 1;
            align-items: flex-start;
        }

        .preview-section {
            flex: 0 0 auto;
            width: calc(50% - 220px);
            min-width: 0;
        }

        .preview-label {
            font-size: 18px;
            margin-bottom: 20px;
            color: #60a5fa;
            font-weight: bold;
        }

        .controls {
            width: 350px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #fbbf24;
            font-size: 16px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaa;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .control-group .value {
            display: inline-block;
            min-width: 50px;
            text-align: right;
            color: #60a5fa;
            font-weight: bold;
        }

        h2 {
            margin-top: 0;
            color: #60a5fa;
        }

        /* Override for testing */
        .other-games-box {
            display: block !important;
            opacity: 1 !important;
        }
        
        #upcomingBox {
            height: 476px !important;
            display: block !important;
        }
        
        #liveBox {
            height: 476px !important;
            display: block !important;
        }
        
        #upcoming-container {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height: 100%;
        }
        
        #live-container {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height: 100%;
        }

        /* Keep elements centered when sizes change */
        .preview-team {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        
        .matchup-preview.with-names {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #60a5fa;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <!-- Upcoming Games Preview -->
        <div class="preview-section">
            <div class="preview-label">UPCOMING GAMES</div>
            <div class="other-games-box" id="upcomingBox">
                <div class="other-games-content">
                    <div id="upcoming-container">
                        <!-- Game 1 -->
                        <div class="game-in-card compact">
                            <div class="live-indicator">
                                <span class="live-text upcoming-title">Upcoming</span>
                            </div>
                            <div class="matchup-preview with-names upcoming-matchup">
                                <div class="preview-team">
                                    <img class="preview-logo upcoming-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="LAL">
                                    <span class="preview-abbr upcoming-abbr">LAL</span>
                                </div>
                                <span class="vs-text upcoming-vs">vs</span>
                                <div class="preview-team">
                                    <span class="preview-abbr upcoming-abbr">GSW</span>
                                    <img class="preview-logo upcoming-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="GSW">
                                </div>
                            </div>
                            <div class="countdown-container">
                                <div class="countdown-label upcoming-label">Starts In</div>
                                <div class="countdown-time upcoming-time">02:34:12</div>
                            </div>
                        </div>

                        <div class="game-divider thick"></div>

                        <!-- Game 2 -->
                        <div class="game-in-card compact">
                            <div class="live-indicator">
                                <span class="live-text upcoming-title">Upcoming</span>
                            </div>
                            <div class="matchup-preview with-names upcoming-matchup">
                                <div class="preview-team">
                                    <img class="preview-logo upcoming-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/bos.png" alt="BOS">
                                    <span class="preview-abbr upcoming-abbr">BOS</span>
                                </div>
                                <span class="vs-text upcoming-vs">vs</span>
                                <div class="preview-team">
                                    <span class="preview-abbr upcoming-abbr">MIA</span>
                                    <img class="preview-logo upcoming-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/mia.png" alt="MIA">
                                </div>
                            </div>
                            <div class="countdown-container">
                                <div class="countdown-label upcoming-label">Starts In</div>
                                <div class="countdown-time upcoming-time">03:15:45</div>
                            </div>
                        </div>

                        <div class="game-divider thick"></div>

                        <!-- Game 3 -->
                        <div class="game-in-card compact">
                            <div class="live-indicator">
                                <span class="live-text upcoming-title">Upcoming</span>
                            </div>
                            <div class="matchup-preview with-names upcoming-matchup">
                                <div class="preview-team">
                                    <img class="preview-logo upcoming-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/dal.png" alt="DAL">
                                    <span class="preview-abbr upcoming-abbr">DAL</span>
                                </div>
                                <span class="vs-text upcoming-vs">vs</span>
                                <div class="preview-team">
                                    <span class="preview-abbr upcoming-abbr">PHX</span>
                                    <img class="preview-logo upcoming-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/phx.png" alt="PHX">
                                </div>
                            </div>
                            <div class="countdown-container">
                                <div class="countdown-label upcoming-label">Starts In</div>
                                <div class="countdown-time upcoming-time">05:22:30</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Games Preview -->
        <div class="preview-section">
            <div class="preview-label">LIVE GAMES</div>
            <div class="other-games-box" id="liveBox">
                <div class="other-games-content">
                    <div id="live-container">
                        <!-- Game 1 -->
                        <div class="game-in-card compact">
                            <div class="live-indicator">
                                <div class="live-dot"></div>
                                <span class="live-text live-title">Live</span>
                            </div>
                            <div class="teams">
                                <div class="team">
                                    <div class="team-left">
                                        <img class="team-logo live-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="LAL">
                                        <div class="team-abbr live-abbr">LAL</div>
                                    </div>
                                    <div class="score live-score">98</div>
                                </div>
                                <div class="team">
                                    <div class="team-left">
                                        <img class="team-logo live-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="GSW">
                                        <div class="team-abbr live-abbr">GSW</div>
                                    </div>
                                    <div class="score live-score">102</div>
                                </div>
                            </div>
                            <div class="game-status live-status">Q3 · 08:42</div>
                        </div>

                        <div class="game-divider thick"></div>

                        <!-- Game 2 -->
                        <div class="game-in-card compact">
                            <div class="live-indicator">
                                <div class="live-dot"></div>
                                <span class="live-text live-title">Live</span>
                            </div>
                            <div class="teams">
                                <div class="team">
                                    <div class="team-left">
                                        <img class="team-logo live-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/bos.png" alt="BOS">
                                        <div class="team-abbr live-abbr">BOS</div>
                                    </div>
                                    <div class="score live-score">85</div>
                                </div>
                                <div class="team">
                                    <div class="team-left">
                                        <img class="team-logo live-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/mia.png" alt="MIA">
                                        <div class="team-abbr live-abbr">MIA</div>
                                    </div>
                                    <div class="score live-score">79</div>
                                </div>
                            </div>
                            <div class="game-status live-status">Q2 · 02:15</div>
                        </div>

                        <div class="game-divider thick"></div>

                        <!-- Game 3 -->
                        <div class="game-in-card compact">
                            <div class="live-indicator">
                                <div class="live-dot"></div>
                                <span class="live-text live-title">Live</span>
                            </div>
                            <div class="teams">
                                <div class="team">
                                    <div class="team-left">
                                        <img class="team-logo live-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/dal.png" alt="DAL">
                                        <div class="team-abbr live-abbr">DAL</div>
                                    </div>
                                    <div class="score live-score">112</div>
                                </div>
                                <div class="team">
                                    <div class="team-left">
                                        <img class="team-logo live-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/phx.png" alt="PHX">
                                        <div class="team-abbr live-abbr">PHX</div>
                                    </div>
                                    <div class="score live-score">108</div>
                                </div>
                            </div>
                            <div class="game-status live-status">Q4 · 11:23</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <h2>🔴 Live Games Font Sizes</h2>
        
        <div class="control-section">
            
            <div class="control-group">
                <label>"Live" Title: <span class="value" id="liveTitleValue">16px</span></label>
                <input type="range" id="liveTitleSize" min="8" max="20" value="16" step="0.5">
            </div>

            <div class="control-group">
                <label>Team Abbr: <span class="value" id="liveAbbrValue">13px</span></label>
                <input type="range" id="liveAbbrSize" min="10" max="30" value="13" step="0.5">
            </div>

            <div class="control-group">
                <label>Score: <span class="value" id="liveScoreValue">15px</span></label>
                <input type="range" id="liveScoreSize" min="10" max="30" value="15" step="0.5">
            </div>

            <div class="control-group">
                <label>Logo Size: <span class="value" id="liveLogoValue">27px</span></label>
                <input type="range" id="liveLogoSize" min="20" max="40" value="27" step="1">
            </div>

            <div class="control-group">
                <label>Game Status: <span class="value" id="liveStatusValue">11px</span></label>
                <input type="range" id="liveStatusSize" min="8" max="20" value="11" step="0.5">
            </div>

            <div class="control-group">
                <label>Gap (Live → Teams): <span class="value" id="liveIndicatorGapValue">8px</span></label>
                <input type="range" id="liveIndicatorGapSize" min="0" max="30" value="8" step="1">
            </div>

            <div class="control-group">
                <label>Gap (Teams → Status): <span class="value" id="liveTeamsGapValue">8px</span></label>
                <input type="range" id="liveTeamsGapSize" min="0" max="30" value="8" step="1">
            </div>
        </div>

        <button onclick="copyCSS()">Copy CSS to Clipboard</button>
    </div>

    <script>
        // Live Games Controls
        const liveTitleSlider = document.getElementById('liveTitleSize');
        const liveTitleValue = document.getElementById('liveTitleValue');
        const liveAbbrSlider = document.getElementById('liveAbbrSize');
        const liveAbbrValue = document.getElementById('liveAbbrValue');
        const liveScoreSlider = document.getElementById('liveScoreSize');
        const liveScoreValue = document.getElementById('liveScoreValue');
        const liveLogoSlider = document.getElementById('liveLogoSize');
        const liveLogoValue = document.getElementById('liveLogoValue');
        const liveStatusSlider = document.getElementById('liveStatusSize');
        const liveStatusValue = document.getElementById('liveStatusValue');
        const liveIndicatorGapSlider = document.getElementById('liveIndicatorGapSize');
        const liveIndicatorGapValue = document.getElementById('liveIndicatorGapValue');
        const liveTeamsGapSlider = document.getElementById('liveTeamsGapSize');
        const liveTeamsGapValue = document.getElementById('liveTeamsGapValue');

        // Live Games Elements
        const liveTitles = document.querySelectorAll('.live-title');
        const liveAbbrs = document.querySelectorAll('.live-abbr');
        const liveScores = document.querySelectorAll('.live-score');
        const liveLogos = document.querySelectorAll('.live-logo');
        const liveStatuses = document.querySelectorAll('.live-status');
        const liveIndicators = document.querySelectorAll('#live-container .live-indicator');
        const liveTeamsContainers = document.querySelectorAll('#live-container .teams');

        // Live Games Handlers
        liveTitleSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveTitleValue.textContent = size;
            liveTitles.forEach(el => el.style.fontSize = size);
        });

        liveAbbrSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveAbbrValue.textContent = size;
            liveAbbrs.forEach(el => el.style.fontSize = size);
        });

        liveScoreSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveScoreValue.textContent = size;
            liveScores.forEach(el => el.style.fontSize = size);
        });

        liveLogoSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveLogoValue.textContent = size;
            liveLogos.forEach(el => {
                el.style.width = size;
                el.style.height = size;
            });
        });

        liveStatusSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveStatusValue.textContent = size;
            liveStatuses.forEach(el => el.style.fontSize = size);
        });

        liveIndicatorGapSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveIndicatorGapValue.textContent = size;
            liveIndicators.forEach(el => el.style.marginBottom = size);
        });

        liveTeamsGapSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            liveTeamsGapValue.textContent = size;
            liveTeamsContainers.forEach(el => el.style.marginBottom = size);
        });

        // Initialize all sliders on page load
        window.addEventListener('DOMContentLoaded', () => {
            liveTitleSlider.dispatchEvent(new Event('input'));
            liveAbbrSlider.dispatchEvent(new Event('input'));
            liveScoreSlider.dispatchEvent(new Event('input'));
            liveLogoSlider.dispatchEvent(new Event('input'));
            liveStatusSlider.dispatchEvent(new Event('input'));
            liveIndicatorGapSlider.dispatchEvent(new Event('input'));
            liveTeamsGapSlider.dispatchEvent(new Event('input'));
        });

        // Copy CSS to clipboard
        function copyCSS() {
            const css = `/* Other Games - Live Games Font Sizes */
.compact .live-text {
    font-size: ${liveTitleSlider.value}px;
}

.compact .team-abbr {
    font-size: ${liveAbbrSlider.value}px;
}

.compact .score {
    font-size: ${liveScoreSlider.value}px;
}

.compact .team-logo {
    width: ${liveLogoSlider.value}px;
    height: ${liveLogoSlider.value}px;
}

.compact .game-status {
    font-size: ${liveStatusSlider.value}px;
}

.compact .live-indicator {
    margin-bottom: ${liveIndicatorGapSlider.value}px;
}

.compact .teams {
    margin-bottom: ${liveTeamsGapSlider.value}px;
}`;

            navigator.clipboard.writeText(css).then(() => {
                alert('CSS copied to clipboard! ✅');
            });
        }
    </script>
</body>
</html>
