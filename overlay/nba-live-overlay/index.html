<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/overlay/nba-live-overlay/">
    <title>NBA Game Stats Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Current Game Box (top-anchored, grows from bottom for MVP) -->
    <div class="current-game-box" id="currentGameBox">
        <div class="current-game-content" id="currentGameContent">
            <div class="game-status" data-status>3rd QTR - 4:15</div>
            
            <div class="teams">
                <!-- Home Team -->
                <div class="team" data-team="home">
                    <img class="team-logo" data-logo="home" src="" alt="Home Team">
                    <div class="team-name" data-abbr="home">---</div>
                    <div class="score" data-score="home">0</div>
                </div>
                
                <!-- Away Team -->
                <div class="team" data-team="away">
                    <img class="team-logo" data-logo="away" src="" alt="Away Team">
                    <div class="team-name" data-abbr="away">---</div>
                    <div class="score" data-score="away">0</div>
                </div>
            </div>
            
            <div class="team-stats">
                <div class="stats-row">
                    <div class="stat-label">FGM/FGA</div>
                    <div class="stat-value">28/47</div>
                    <div class="stat-value">32/63</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">REB/OFF</div>
                    <div class="stat-value">19/12</div>
                    <div class="stat-value">18/9</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">AST/TO</div>
                    <div class="stat-value">26/10</div>
                    <div class="stat-value">32/11</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">3-PT</div>
                    <div class="stat-value">9/28 (32.1%)</div>
                    <div class="stat-value">6/24 (25.0%)</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">FT</div>
                    <div class="stat-value">7/13 (53.8%)</div>
                    <div class="stat-value">13/14 (92.9%)</div>
                </div>
            </div>

            <!-- MVP Player Section -->
            <div class="mvp-section">
                <div class="mvp-content">
                    <div class="photo-container">
                        <img class="player-pic" src="" alt="MVP Player">
                        <img class="player-team-logo" src="" alt="Team">
                    </div>
                    <div class="player-info">
                        <div class="mvp-header">
                            <span class="mvp-label">⭐ MVP</span>
                            <span class="player-name">---</span>
                        </div>
                        <div class="player-stats">
                            <div class="stat-item">
                                <div class="stat-value" data-stat="pts">0</div>
                                <div class="stat-label">PTS</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" data-stat="reb">0</div>
                                <div class="stat-label">REB</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" data-stat="ast">0</div>
                                <div class="stat-label">AST</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Play-by-Play Box (right under game box) - Hidden by default, shown when data arrives -->
    <div class="play-by-play-box anim-21" id="playByPlayBox" style="display: none;">
        <div class="pbp-box" id="pbpBoxContent">
            <div class="pbp-photo-container">
                <img class="pbp-photo" id="pbpPhoto" src="" alt="Player">
            </div>
            <div class="pbp-icon" id="pbpIcon"></div>
            <div class="pbp-content">
                <div class="pbp-time" id="pbpTime"></div>
                <div class="pbp-text" id="pbpText">
                    <span class="pbp-player" id="pbpPlayer"></span> <span class="pbp-action" id="pbpAction"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Play-by-Play Processor Module -->
    <script src="utils/play-by-play-processor.js"></script>
    
    <script>
        // Initialize play-by-play processor
        const pbpProcessor = new PlayByPlayProcessor();
        window.pbpProcessor = pbpProcessor; // Expose for app-controller.js

        const pbpPhoto = document.getElementById('pbpPhoto');
        const pbpTime = document.getElementById('pbpTime');
        const pbpPlayer = document.getElementById('pbpPlayer');
        const pbpAction = document.getElementById('pbpAction');
        const pbpIcon = document.getElementById('pbpIcon');
        const playByPlayBox = document.getElementById('playByPlayBox');
        
        let lastTimeoutAnalysisPlayId = null; // Track last timeout play we requested analysis for
        
        // Score tracking for display animations (separate from processor's dedup tracking)
        let lastHomeScore = null;
        let lastAwayScore = null;

        // Store current audio to manage playback
        let currentPbpAudio = null;
        let currentAnalysisAudio = null; // For timeout/halftime/dead-air analysis
        let analysisAudioUrl = null; // Cache the audio blob URL
        let analysisLastPosition = 0; // Track playback position for resuming
        let analysisTimestamp = null; // Track when analysis was generated
        let analysisInterrupted = false; // Track if analysis was interrupted by play-by-play
        let deadAirTimer = null; // Timer for dead air detection
        let lastPlayTimestamp = Date.now(); // Track when last play occurred

        // Function to request game analysis audio during timeout/halftime/dead-air
        async function requestGameAnalysisAudio(gameId, forceRegenerate = false, isShortAnalysis = false) {
            if (!gameId) {
                console.error('❌ requestGameAnalysisAudio called without gameId');
                return;
            }
            
            console.log('🎤 requestGameAnalysisAudio called for gameId:', gameId, 'forceRegenerate:', forceRegenerate);
            
            // Save current playback position if audio is playing
            if (currentAnalysisAudio && !currentAnalysisAudio.paused) {
                analysisLastPosition = currentAnalysisAudio.currentTime;
                currentAnalysisAudio.pause();
            }
            
            // Check if we should use cached audio (less than 10 minutes old, not forcing regenerate)
            const TEN_MINUTES = 10 * 60 * 1000;
            const useCached = !forceRegenerate && analysisAudioUrl && analysisTimestamp && 
                             (Date.now() - analysisTimestamp) < TEN_MINUTES;
            
            if (useCached && !analysisInterrupted) {
                console.log('✅ Using cached analysis audio');
                // Use cached audio, resume from last position (only if not interrupted)
                if (!currentAnalysisAudio || currentAnalysisAudio.src !== analysisAudioUrl) {
                    if (currentAnalysisAudio) {
                        currentAnalysisAudio.pause();
                        const oldUrl = currentAnalysisAudio.src;
                        if (oldUrl.startsWith('blob:')) {
                            URL.revokeObjectURL(oldUrl);
                        }
                    }
                    currentAnalysisAudio = new Audio(analysisAudioUrl);
                }
                currentAnalysisAudio.currentTime = analysisLastPosition;
                currentAnalysisAudio.play().catch((error) => {
                    console.error('❌ Failed to play cached analysis audio:', error);
                });
                analysisInterrupted = false; // Reset flag
                return;
            } else if (useCached && analysisInterrupted) {
                // If interrupted, don't use cache - request fresh audio
                console.log('🔄 Cached analysis was interrupted, requesting fresh audio');
                analysisInterrupted = false; // Reset flag
            }
            
            console.log(`🔄 Requesting new ${isShortAnalysis ? 'SHORT' : 'LONG'} analysis audio from server...`);
            
            // Generate new analysis audio
            const homeTeam = (window.gameView?.elements?.homeAbbr?.textContent || 
                             document.querySelector('[data-abbr="home"]')?.textContent || 
                             'Home Team').trim();
            const awayTeam = (window.gameView?.elements?.awayAbbr?.textContent || 
                             document.querySelector('[data-abbr="away"]')?.textContent || 
                             'Away Team').trim();
            const homeScore = window.gameView?.elements?.homeScore?.textContent?.trim() || '0';
            const awayScore = window.gameView?.elements?.awayScore?.textContent?.trim() || '0';
            const currentScore = `${homeTeam} ${homeScore} - ${awayScore} ${awayTeam}`;
            
            console.log('📊 Analysis request data:', { gameId, homeTeam, awayTeam, currentScore, forceRegenerate, isShortAnalysis });
            
            try {
                const response = await fetch('http://localhost:3000/api/game-analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gameId: gameId,
                        homeTeam: homeTeam,
                        awayTeam: awayTeam,
                        currentScore: currentScore,
                        forceRegenerate: forceRegenerate,
                        isShortAnalysis: isShortAnalysis
                    })
                });
                
                console.log('📡 Analysis API response status:', response.status, response.statusText);
                
                if (!response.ok) {
                    console.error('❌ Game analysis request failed:', response.status, response.statusText);
                    return;
                }
                
                // Get audio blob, cache it, and play it
                const audioBlob = await response.blob();
                console.log('🎵 Received audio blob, size:', audioBlob.size, 'bytes');
                
                if (!audioBlob || audioBlob.size === 0) {
                    console.error('❌ Game analysis audio blob is empty');
                    return;
                }
                
                // Clean up old audio URL if exists
                if (analysisAudioUrl && analysisAudioUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(analysisAudioUrl);
                }
                
                analysisAudioUrl = URL.createObjectURL(audioBlob);
                const generatedAt = response.headers.get('X-Generated-At');
                analysisTimestamp = generatedAt ? parseInt(generatedAt) : Date.now();
                analysisLastPosition = 0; // Reset position for new audio
                analysisInterrupted = false; // Reset interruption flag
                
                console.log('✅ Created audio URL, attempting to play...');
                
                // Clean up old audio object if exists
                if (currentAnalysisAudio) {
                    currentAnalysisAudio.pause();
                    currentAnalysisAudio = null; // Clear reference
                    const oldUrl = currentAnalysisAudio?.src;
                    if (oldUrl && oldUrl.startsWith('blob:') && oldUrl !== analysisAudioUrl) {
                        URL.revokeObjectURL(oldUrl);
                    }
                }
                
                // Create new audio and play from start
                currentAnalysisAudio = new Audio(analysisAudioUrl);
                currentAnalysisAudio.currentTime = 0; // Always start from beginning
                currentAnalysisAudio.play().then(() => {
                    console.log('✅ Game analysis audio is now playing from start');
                }).catch((error) => {
                    console.error('❌ Failed to play game analysis audio:', error);
                });
            } catch (error) {
                console.error('❌ Error requesting game analysis audio:', error);
            }
        }
        
        // Function to handle dead air detection (no play-by-play for 8 seconds)
        function handleDeadAir(gameId) {
            console.log('🔍 handleDeadAir called with gameId:', gameId);
            if (!gameId) {
                console.error('❌ handleDeadAir called without gameId');
                return;
            }
            
            // Only start timer if we don't already have one running
            if (deadAirTimer) {
                console.log('⏱️ Dead air timer already running, not resetting');
                // Timer already running, don't reset it
                return;
            }
            
            console.log('⏱️ Starting dead air timer (8s) for gameId:', gameId);
            
            // Set new timer for 8 seconds
            deadAirTimer = setTimeout(() => {
                console.log('🔊 Dead air detected (8s), requesting game analysis for gameId:', gameId);
                deadAirTimer = null; // Clear timer before making request
                
                // Check if 10 minutes have passed since last analysis generation
                const TEN_MINUTES = 10 * 60 * 1000;
                const shouldRegenerate = !analysisTimestamp || (Date.now() - analysisTimestamp) >= TEN_MINUTES;
                console.log('📊 Analysis check - timestamp:', analysisTimestamp, 'shouldRegenerate:', shouldRegenerate);
                
                // Request SHORT analysis audio for dead air (will use cache if recent, or regenerate if old)
                requestGameAnalysisAudio(gameId, shouldRegenerate, true).catch((error) => {
                    console.error('❌ Error in requestGameAnalysisAudio:', error);
                });
            }, 8000); // 8 seconds
        }
        
        // Function to stop dead air analysis when new play comes in
        function stopDeadAirAnalysis() {
            // Clear dead air timer
            if (deadAirTimer) {
                clearTimeout(deadAirTimer);
                deadAirTimer = null;
            }
            
            // Stop analysis audio (but save position for resuming)
            if (currentAnalysisAudio && !currentAnalysisAudio.paused) {
                analysisLastPosition = currentAnalysisAudio.currentTime;
                currentAnalysisAudio.pause();
            }
        }

        // Function to enhance play-by-play text for energetic, enthusiastic commentator-style TTS
        // The text is formatted to sound like an excited sports commentator while staying accurate
        function enhanceTextForCommentator(playerName, actionText) {
            const action = actionText.toLowerCase();
            const playerUpper = playerName.toUpperCase();
            
            // Detect play types and enhance with energetic, enthusiastic commentator style
            // Text formatted to naturally sound like an excited sports commentator
            if (action.includes('3-point') || action.includes('three') || action.includes('3pt')) {
                // Three-pointer - very exciting! Sound energetic and enthusiastic!
                const variations = [
                    `${playerUpper}... FOR THREE... BANG!!! HE HITS IT!!!`,
                    `OH!! ${playerUpper} DRAINS THE THREE-POINTER!!! WOW!!!`,
                    `${playerUpper} — THREE POINTER — YES!!! WHAT A SHOT!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('dunk') || action.includes('slam')) {
                // Dunk - very exciting! Sound energetic and enthusiastic!
                const variations = [
                    `${playerUpper}... WITH THE DUNK!!! INCREDIBLE!!!`,
                    `OH!! ${playerUpper} THROWS IT DOWN!!! WHAT A SLAM!!!`,
                    `${playerUpper} — SLAM DUNK — YES!!! UNBELIEVABLE!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('layup') || action.includes('lay-up')) {
                // Layup - exciting! Sound energetic!
                const variations = [
                    `${playerUpper}... WITH THE LAYUP!!! NICE!!!`,
                    `${playerUpper} FINISHES AT THE RIM!!! GOOD!!!`,
                    `${playerUpper} — LAYUP — YES!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('free throw')) {
                // Free throw - straightforward but energetic
                const variations = [
                    `${playerUpper}... AT THE LINE... AND IT'S GOOD!!!`,
                    `${playerUpper} CONVERTS THE FREE THROW!!!`,
                    `${playerUpper} — FREE THROW — GOOD!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('timeout')) {
                // Timeout - keep it simple but energetic
                return `TIMEOUT!!! ${actionText.toUpperCase()}!!!`;
            } else {
                // Generic exciting enhancement - make it sound energetic and enthusiastic like a sports commentator
                const variations = [
                    `${playerUpper}... ${actionText.toUpperCase()}!!!`,
                    `OH!! ${playerUpper} ${actionText.toUpperCase()}!!! WOW!!!`,
                    `${playerUpper} — ${actionText.toUpperCase()}!!! YES!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            }
        }

        // Function to generate TTS audio for play-by-play text
        async function generatePlayByPlayAudio(playText, enhance = false) {
            try {
                // Stop any currently playing play-by-play audio
                if (currentPbpAudio) {
                    currentPbpAudio.pause();
                    currentPbpAudio = null;
                }
                
                // Stop analysis audio when play-by-play starts (mark as interrupted)
                if (currentAnalysisAudio && !currentAnalysisAudio.paused) {
                    currentAnalysisAudio.pause();
                    currentAnalysisAudio = null;
                    analysisLastPosition = 0; // Reset position
                    analysisInterrupted = true; // Mark as interrupted - don't resume this audio
                }

                const requestBody = {
                    text: playText, // Original play-by-play text
                    voice: 'alloy',
                    model: 'tts-1',
                    speed: 1.0,
                    enhance: enhance // If true, server will use AI to enhance it
                };
                

                const response = await fetch('http://localhost:3000/api/text-to-speech', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    return null;
                }

                
                // Get audio blob
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                return audioUrl;
            } catch (error) {
                return null;
            }
        }

        // Helper for async delay
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Function to update play-by-play display with exit/enter animations
        // IMPORTANT: Waits for TTS BEFORE starting animations (no empty frame!)
        async function updatePlayByPlay(play) {
            if (!play || !playByPlayBox) return;
            
            // Don't show play-by-play if MVP is visible
            if (window.mvpView && window.mvpView.getVisibility && window.mvpView.getVisibility()) {
                playByPlayBox.style.display = 'none';
                return;
            }
            
            // Update game overlay time from play-by-play data
            if (play.period && play.clock && window.gameView) {
                const quarter = pbpProcessor.formatPeriodToQuarter(play.period);
                window.gameView.updateStatusText(quarter, play.clock);
            }
            
            // Update scores from play-by-play data if scores are available
            if (window.gameView && lastHomeScore === null && window.gameView.elements && window.gameView.elements.homeScore) {
                const currentHomeScore = parseInt(window.gameView.elements.homeScore.textContent) || 0;
                const currentAwayScore = parseInt(window.gameView.elements.awayScore.textContent) || 0;
                lastHomeScore = currentHomeScore;
                lastAwayScore = currentAwayScore;
            }
            
            if (window.gameView && play.homeScore !== null && play.awayScore !== null) {
                const homeScoreChanged = play.homeScore !== lastHomeScore;
                const awayScoreChanged = play.awayScore !== lastAwayScore;
                
                if (homeScoreChanged) {
                    window.gameView.updateScore('home', play.homeScore, true);
                    lastHomeScore = play.homeScore;
                }
                if (awayScoreChanged) {
                    window.gameView.updateScore('away', play.awayScore, true);
                    lastAwayScore = play.awayScore;
                }
            }
            
            // Determine what image to use
            const pbpPhotoContainer = document.querySelector('.pbp-photo-container');
            let imageToLoad = play.playerPhoto;
            let isTeamLogo = false;
            
            if (play.isTimeout || play.isTeamEvent) {
                isTeamLogo = true;
                imageToLoad = play.teamLogo;
                if (!imageToLoad && window.gameView && window.gameView.elements) {
                    const actionUpper = play.action.toUpperCase();
                    const homeAbbr = (window.gameView.elements.homeAbbr?.textContent || '').trim().toUpperCase();
                    const awayAbbr = (window.gameView.elements.awayAbbr?.textContent || '').trim().toUpperCase();
                    
                    let useHome = true;
                    if (awayAbbr && actionUpper.includes(awayAbbr)) {
                        useHome = false;
                    } else if (homeAbbr && actionUpper.includes(homeAbbr)) {
                        useHome = true;
                    } else if (play.timeoutTeam === 'away') {
                        useHome = false;
                    }
                    
                    const logoEl = useHome ? window.gameView.elements.homeLogo : window.gameView.elements.awayLogo;
                    if (logoEl && logoEl.src && logoEl.src.trim() !== '' && !logoEl.src.endsWith('/')) {
                        imageToLoad = logoEl.src;
                    }
                }
                
                // Request analysis audio for timeout
                if (lastTimeoutAnalysisPlayId !== play.id) {
                    lastTimeoutAnalysisPlayId = play.id;
                    const currentGameId = window.gameView?.gameId || window.appController?.selectedGameId;
                    if (currentGameId) {
                        setTimeout(() => {
                            requestGameAnalysisAudio(currentGameId, true, false);
                        }, 10000);
                    }
                }
            } else {
                stopDeadAirAnalysis();
            }
            
            // Prepare TTS text
            const originalPlayText = (play.isTimeout || play.isTeamEvent)
                ? play.action
                : `${play.playerName} ${play.action}`;
            
            // ========== WAIT FOR TTS FIRST (current play still visible) ==========
            // Don't preload images (CORS issues) - browser handles them natively
            const audioUrl = await generatePlayByPlayAudio(originalPlayText, true);
            
            // ========== NOW START ANIMATIONS (TTS is ready) ==========
            
            // Show the box if it was hidden
            if (playByPlayBox.style.display === 'none') {
                playByPlayBox.style.display = 'block';
            }
            
            const pbpBox = document.getElementById('pbpBoxContent');
            const photoImg = pbpPhoto;
            const pbpContent = document.querySelector('.pbp-content');
            
            // Remove animation state classes and reset styles
            playByPlayBox.classList.remove('exiting', 'entering');
            photoImg.style.transform = '';
            photoImg.style.opacity = '';
            photoImg.style.filter = '';
            photoImg.style.animation = '';
            photoImg.style.clipPath = '';
            
            if (pbpContent) {
                pbpContent.style.transform = '';
                pbpContent.style.opacity = '';
                pbpContent.style.filter = '';
                pbpContent.style.animation = '';
                pbpContent.style.clipPath = '';
            }
            
            pbpIcon.style.transform = '';
            pbpIcon.style.opacity = '';
            pbpIcon.style.filter = '';
            pbpIcon.style.animation = '';
            pbpIcon.style.clipPath = '';
            
            // Start exit animation
            playByPlayBox.classList.add('anim-21', 'exiting');
            void pbpPhoto.offsetWidth; // Force reflow
            
            // Wait for exit animation (content exits 0-0.5s, pic fades 0.5-0.8s)
            await delay(800);
            
            // Update content (while still in "exiting" state, content is hidden)
            if (isTeamLogo) {
                if (pbpPhotoContainer) {
                    pbpPhotoContainer.style.display = '';
                    pbpPhotoContainer.style.border = 'none';
                }
                if (imageToLoad) {
                    pbpPhoto.src = imageToLoad;
                }
                pbpPhoto.alt = play.timeoutTeam === 'home' ? 'Home Team' : 'Away Team';
            } else {
                if (pbpPhotoContainer) {
                    pbpPhotoContainer.style.display = '';
                    pbpPhotoContainer.style.border = '';
                }
                pbpPhoto.src = play.playerPhoto;
                pbpPhoto.alt = play.playerName;
            }
            
            pbpTime.textContent = `Q${play.period} ${play.clock}`;
            pbpPlayer.textContent = (play.isTimeout || play.isTeamEvent) ? '' : play.playerName;
            pbpAction.textContent = play.action;
            pbpIcon.textContent = (play.isTimeout || play.isTeamEvent) ? '' : play.icon;
            
            // Start enter animation
            playByPlayBox.classList.remove('exiting');
            playByPlayBox.classList.add('entering');
            void pbpPhoto.offsetWidth; // Force reflow
            
            // Play audio shortly after enter animation starts
            if (audioUrl) {
                setTimeout(() => {
                    if (currentPbpAudio) {
                        currentPbpAudio.pause();
                        currentPbpAudio = null;
                    }
                    
                    if (currentAnalysisAudio && !currentAnalysisAudio.paused) {
                        currentAnalysisAudio.pause();
                        currentAnalysisAudio = null;
                        analysisLastPosition = 0;
                        analysisInterrupted = true;
                    }
                    
                    currentPbpAudio = new Audio(audioUrl);
                    currentPbpAudio.play().catch(() => {});
                }, 200);
            }
            
            // Clean up after enter animation completes
            await delay(700);
            playByPlayBox.classList.remove('entering');
            
            photoImg.style.opacity = '';
            photoImg.style.clipPath = '';
            photoImg.style.filter = '';
            if (pbpContent) {
                pbpContent.style.opacity = '';
                pbpContent.style.clipPath = '';
                pbpContent.style.filter = '';
            }
            pbpIcon.style.opacity = '';
            pbpIcon.style.clipPath = '';
            pbpIcon.style.filter = '';
        }

        // Function to check and update play-by-play from API data
        async function checkAndUpdatePlayByPlay(gameId, nbaApi, gameState) {
            console.log('🔄 checkAndUpdatePlayByPlay called - gameId:', gameId, 'gameState:', gameState);
            if (!gameId || !nbaApi) {
                console.log('⚠️ checkAndUpdatePlayByPlay: Missing gameId or nbaApi, returning');
                return;
            }
            
            // If game is in halftime, final, or pregame, show status text instead of plays
            if (gameState === 'halftime' || gameState === 'final' || gameState === 'pregame') {
                if (!playByPlayBox) return;
                
                // Don't show if MVP is visible
                if (window.mvpView && window.mvpView.getVisibility && window.mvpView.getVisibility()) {
                    playByPlayBox.style.display = 'none';
                    return;
                }
                
                const pbpTime = document.getElementById('pbpTime');
                const pbpPlayer = document.getElementById('pbpPlayer');
                const pbpAction = document.getElementById('pbpAction');
                const pbpIcon = document.getElementById('pbpIcon');
                const pbpPhoto = document.getElementById('pbpPhoto');
                const pbpPhotoContainer = document.querySelector('.pbp-photo-container');
                
                if (gameState === 'halftime') {
                    // Show halftime status
                    playByPlayBox.style.display = 'block';
                    if (pbpTime) pbpTime.textContent = 'Halftime';
                    if (pbpPlayer) pbpPlayer.textContent = '';
                    if (pbpAction) pbpAction.textContent = '';
                    if (pbpIcon) pbpIcon.textContent = ''; // Remove icon
                    // Hide photo container to avoid empty frame
                    if (pbpPhotoContainer) pbpPhotoContainer.style.display = 'none';
                    if (pbpPhoto) pbpPhoto.src = '';
                    
                    // Request LONG game analysis audio for halftime (wait 10 seconds to avoid overlapping with play-by-play)
                    setTimeout(() => {
                        requestGameAnalysisAudio(gameId, true, false); // false = long analysis
                    }, 10000); // Wait 10 seconds before starting analysis
                } else if (gameState === 'final') {
                    // Show final status
                    playByPlayBox.style.display = 'block';
                    if (pbpTime) pbpTime.textContent = 'Final';
                    if (pbpPlayer) pbpPlayer.textContent = '';
                    if (pbpAction) pbpAction.textContent = '';
                    if (pbpIcon) pbpIcon.textContent = ''; // Remove icon
                    // Hide photo container to avoid empty frame
                    if (pbpPhotoContainer) pbpPhotoContainer.style.display = 'none';
                    if (pbpPhoto) pbpPhoto.src = '';
                } else {
                    // Pregame - hide play-by-play
                    playByPlayBox.style.display = 'none';
                }
                
                // Stop dead air analysis if game is not in timeout/halftime
                if (gameState !== 'halftime') {
                    stopDeadAirAnalysis();
                }
                
                return; // Don't fetch plays during halftime/final/pregame
            }
            
            try {
                const plays = await nbaApi.getPlayByPlay(gameId);
                if (!plays || plays.length === 0) {
                    console.log('📭 No plays found, checking for dead air...');
                    handleDeadAir(gameId);
                    return;
                }
                
                // Build team context from gameView for logo resolution
                const teamContext = {
                    homeAbbr: (window.gameView?.elements?.homeAbbr?.textContent || '').trim(),
                    awayAbbr: (window.gameView?.elements?.awayAbbr?.textContent || '').trim(),
                    homeLogo: window.gameView?.elements?.homeLogo?.src || '',
                    awayLogo: window.gameView?.elements?.awayLogo?.src || ''
                };
                
                // Use processor to find first valid, non-duplicate play
                const transformedPlay = pbpProcessor.findNewPlay(plays, teamContext);
                
                if (!transformedPlay) {
                    // No valid new play found - check for dead air
                    console.log('📭 No valid new play found, checking for dead air...');
                    handleDeadAir(gameId);
                    return;
                }
                
                // New play found! Stop dead air analysis
                stopDeadAirAnalysis();
                
                // Reset timeout analysis tracking if this is not a timeout
                if (!transformedPlay.isTimeout) {
                    lastTimeoutAnalysisPlayId = null;
                }
                
                // Send play-by-play data to server for storage
                try {
                    await fetch('http://localhost:3000/api/play-by-play', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            gameId: gameId,
                            play: {
                                period: transformedPlay.period,
                                clock: transformedPlay.clock,
                                playerName: transformedPlay.playerName,
                                action: transformedPlay.action,
                                homeScore: transformedPlay.homeScore,
                                awayScore: transformedPlay.awayScore,
                                isTimeout: transformedPlay.isTimeout
                            }
                        })
                    });
                } catch (error) {
                    // Silently handle errors
                }
                
                await updatePlayByPlay(transformedPlay);
            } catch (error) {
                // Silently handle errors
            }
        }
        
        // Function to reset play-by-play tracking (call when game changes)
        function resetPlayByPlayTracking() {
            pbpProcessor.reset();
            lastTimeoutAnalysisPlayId = null; // Reset timeout analysis tracking
            lastHomeScore = null; // Reset display score tracking
            lastAwayScore = null;
        }

        // Expose functions for integration
        window.updatePlayByPlay = updatePlayByPlay;
        window.checkAndUpdatePlayByPlay = checkAndUpdatePlayByPlay;
        window.resetPlayByPlayTracking = resetPlayByPlayTracking;
    </script>

        // Initialize unified box animator

        unifiedBoxAnimator.init(document.getElementById('otherGamesBox'));

        const playByPlayBoxElement = document.getElementById('playByPlayBox');

            originalMvpShow(playerData);
            // Hide play-by-play when MVP shows
            if (playByPlayBoxElement) {
                playByPlayBoxElement.style.display = 'none';
            }
        };
        
        mvpView.hide = function() {
            originalMvpHide();
            // When MVP hides, play-by-play can show again
            // It will be shown on the next updatePlayByPlay call if there's new data
        };
        
        const otherGamesView = new OtherGamesView();
        const otherGamesContainerView = new OtherGamesContainerView();
        
        // Initialize core managers
        const stateManager = new StateManager();
        const simulationManager = new SimulationManager();

        const mvpController = new MvpController(mvpView, stateManager);

            modeCoordinator
        });

            appController.start();
        });

            appController.stop();
        });
