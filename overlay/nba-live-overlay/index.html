<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/overlay/nba-live-overlay/">
    <title>NBA Game Stats Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Current Game Box (top-anchored, grows from bottom for MVP) -->
    <div class="current-game-box" id="currentGameBox">
        <div class="current-game-content" id="currentGameContent">
            <div class="teams">
                <!-- Away Team (left side) -->
                <div class="team" data-team="away">
                    <img class="team-logo" data-logo="away" src="" alt="Away Team">
                    <div class="team-name" data-abbr="away">---</div>
                    <div class="score" data-score="away">0</div>
                </div>
                
                <!-- Game Status (between teams) -->
                <div class="game-status" data-status><div>Q3</div><div>4:15</div></div>
                
                <!-- Home Team (right side) -->
                <div class="team" data-team="home">
                    <img class="team-logo" data-logo="home" src="" alt="Home Team">
                    <div class="team-name" data-abbr="home">---</div>
                    <div class="score" data-score="home">0</div>
                </div>
            </div>
            
            <div class="team-stats">
                <div class="stats-row">
                    <div class="stat-label">FGM/FGA</div>
                    <div class="stat-value">28/47</div>
                    <div class="stat-value">32/63</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">REB/OFF</div>
                    <div class="stat-value">19/12</div>
                    <div class="stat-value">18/9</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">AST/TO</div>
                    <div class="stat-value">26/10</div>
                    <div class="stat-value">32/11</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">3-PT</div>
                    <div class="stat-value">9/28 (32.1%)</div>
                    <div class="stat-value">6/24 (25.0%)</div>
                </div>
                <div class="stats-row">
                    <div class="stat-label">FT</div>
                    <div class="stat-value">7/13 (53.8%)</div>
                    <div class="stat-value">13/14 (92.9%)</div>
                </div>
            </div>

            <!-- MVP Player Section -->
            <div class="mvp-section">
                <div class="mvp-content">
                    <div class="photo-container">
                        <img class="player-pic" src="" alt="MVP Player">
                        <img class="player-team-logo" src="" alt="Team">
                    </div>
                    <div class="player-info">
                        <div class="mvp-header">
                            <span class="mvp-label">⭐ MVP</span>
                            <span class="player-name">---</span>
                        </div>
                        <div class="player-stats">
                            <div class="stat-item">
                                <div class="stat-value" data-stat="pts">0</div>
                                <div class="stat-label">PTS</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" data-stat="reb">0</div>
                                <div class="stat-label">REB</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" data-stat="ast">0</div>
                                <div class="stat-label">AST</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Play-by-Play Box (right under game box) - Hidden by default, shown when data arrives -->
    <div class="play-by-play-box anim-21" id="playByPlayBox" style="display: none;">
        <div class="pbp-box" id="pbpBoxContent">
            <div class="pbp-photo-container">
                <img class="pbp-photo" id="pbpPhoto" src="" alt="Player">
            </div>
            <img class="pbp-icon" id="pbpIcon" src="" alt="Team">
            <div class="pbp-content">
                <div class="pbp-time"><span id="pbpQuarter"></span> <span id="pbpClock"></span></div>
                <div class="pbp-text" id="pbpText">
                    <span class="pbp-player" id="pbpPlayer"></span> <span class="pbp-action" id="pbpAction"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Play-by-Play Processor Module -->
    <script src="utils/play-by-play-processor.js"></script>
    
    <script>
        // Initialize play-by-play processor
        const pbpProcessor = new PlayByPlayProcessor();
        window.pbpProcessor = pbpProcessor; // Expose for app-controller.js

        const pbpPhoto = document.getElementById('pbpPhoto');
        const pbpQuarter = document.getElementById('pbpQuarter');
        const pbpClock = document.getElementById('pbpClock');
        const pbpPlayer = document.getElementById('pbpPlayer');
        const pbpAction = document.getElementById('pbpAction');
        const pbpIcon = document.getElementById('pbpIcon');
        const playByPlayBox = document.getElementById('playByPlayBox');
        
        
        // Score tracking for display animations (separate from processor's dedup tracking)
        let lastHomeScore = null;
        let lastAwayScore = null;

        // Store current audio to manage playback
        let currentPbpAudio = null;
        
        // Crossfade: fade out audio over duration (ms)
        function fadeOutAudio(audio, duration = 1000) {
            if (!audio) return;
            const startVolume = audio.volume;
            const steps = 20; // Number of fade steps
            const stepDuration = duration / steps;
            const volumeStep = startVolume / steps;
            
            let currentStep = 0;
            const fadeInterval = setInterval(() => {
                currentStep++;
                const newVolume = Math.max(0, startVolume - (volumeStep * currentStep));
                audio.volume = newVolume;
                
                if (currentStep >= steps) {
                    clearInterval(fadeInterval);
                    audio.pause();
                    audio.volume = 1; // Reset for reuse
                }
            }, stepDuration);
        }

        // Function to enhance play-by-play text for energetic, enthusiastic commentator-style TTS
        // The text is formatted to sound like an excited sports commentator while staying accurate
        function enhanceTextForCommentator(playerName, actionText) {
            const action = actionText.toLowerCase();
            const playerUpper = playerName.toUpperCase();
            
            // Detect play types and enhance with energetic, enthusiastic commentator style
            // Text formatted to naturally sound like an excited sports commentator
            if (action.includes('3-point') || action.includes('three') || action.includes('3pt')) {
                // Three-pointer - very exciting! Sound energetic and enthusiastic!
                const variations = [
                    `${playerUpper}... FOR THREE... BANG!!! HE HITS IT!!!`,
                    `OH!! ${playerUpper} DRAINS THE THREE-POINTER!!! WOW!!!`,
                    `${playerUpper} — THREE POINTER — YES!!! WHAT A SHOT!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('dunk') || action.includes('slam')) {
                // Dunk - very exciting! Sound energetic and enthusiastic!
                const variations = [
                    `${playerUpper}... WITH THE DUNK!!! INCREDIBLE!!!`,
                    `OH!! ${playerUpper} THROWS IT DOWN!!! WHAT A SLAM!!!`,
                    `${playerUpper} — SLAM DUNK — YES!!! UNBELIEVABLE!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('layup') || action.includes('lay-up')) {
                // Layup - exciting! Sound energetic!
                const variations = [
                    `${playerUpper}... WITH THE LAYUP!!! NICE!!!`,
                    `${playerUpper} FINISHES AT THE RIM!!! GOOD!!!`,
                    `${playerUpper} — LAYUP — YES!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('free throw')) {
                // Free throw - straightforward but energetic
                const variations = [
                    `${playerUpper}... AT THE LINE... AND IT'S GOOD!!!`,
                    `${playerUpper} CONVERTS THE FREE THROW!!!`,
                    `${playerUpper} — FREE THROW — GOOD!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            } else if (action.includes('timeout')) {
                // Timeout - keep it simple but energetic
                return `TIMEOUT!!! ${actionText.toUpperCase()}!!!`;
            } else {
                // Generic exciting enhancement - make it sound energetic and enthusiastic like a sports commentator
                const variations = [
                    `${playerUpper}... ${actionText.toUpperCase()}!!!`,
                    `OH!! ${playerUpper} ${actionText.toUpperCase()}!!! WOW!!!`,
                    `${playerUpper} — ${actionText.toUpperCase()}!!! YES!!!`
                ];
                return variations[Math.floor(Math.random() * variations.length)];
            }
        }

        // TTS Voice configuration
        // Two voices: "angry ogre" for subs/timeouts, "blondie - seductive" for everything else
        let ttsVoiceAngryOgre = null;
        let ttsVoiceBlondie = null;
        
        // Load specific voices from ElevenLabs
        async function loadTTSVoices() {
            try {
                const response = await fetch('http://localhost:3000/api/elevenlabs-voices');
                if (!response.ok) return;
                const data = await response.json();
                const voices = data.voices || [];
                
                // Find angry ogre
                const angryOgre = voices.find(v => v.name.toLowerCase().includes('angry ogre'));
                if (angryOgre) {
                    ttsVoiceAngryOgre = angryOgre.id;
                    console.log(`🎙️ Loaded voice: Angry Ogre (${angryOgre.id})`);
                }
                
                // Find blondie - seductive
                const blondie = voices.find(v => v.name.toLowerCase().includes('blondie') && v.name.toLowerCase().includes('seductive'));
                if (blondie) {
                    ttsVoiceBlondie = blondie.id;
                }
                
                if (!ttsVoiceAngryOgre || !ttsVoiceBlondie) {
                    console.warn('⚠️ Could not find all required voices. Found:', 
                        ttsVoiceAngryOgre ? 'Angry Ogre' : 'NO Angry Ogre',
                        ttsVoiceBlondie ? 'Blondie' : 'NO Blondie');
                }
            } catch (e) {
                console.error('Failed to load TTS voices:', e);
            }
        }
        loadTTSVoices();
        
        // Detect if play should use Ogre voice (subs, timeouts, rebounds)
        // Combined frequency: ~47% (about 1 in 2 plays)
        function isOgrePlay(text) {
            const lowerText = text.toLowerCase();
            return lowerText.includes('enters the game') ||  // substitutions
                   lowerText.includes('timeout') ||          // timeouts
                   lowerText.includes('rebound');            // rebounds
        }
        
        // Transform rebound text: "Player Name defensive rebound" → "defensive rebound, Player Name"
        function transformForTTS(text) {
            const lowerText = text.toLowerCase();
            
            // Check if it's a rebound
            if (lowerText.includes('rebound')) {
                // Pattern: "Player Name (offensive|defensive) rebound"
                const reboundMatch = text.match(/^(.+?)\s+((?:offensive|defensive)\s+rebound)$/i);
                if (reboundMatch) {
                    const playerName = reboundMatch[1];
                    const reboundType = reboundMatch[2];
                    return `${reboundType}, ${playerName}`;
                }
            }
            
            return text; // No transformation needed
        }
        
        // Counter for Blondie plays to add "Oh!" or "Wow!" every 3rd play
        let blondiePlayCount = 0;
        
        // Add excitement to Blondie plays (every 3rd play alternates Oh!/Wow!)
        function addBlondieExcitement(text) {
            blondiePlayCount++;
            
            // Every 3rd play, add excitement
            if (blondiePlayCount % 3 === 0) {
                // Alternate between "Oh!" (at start) and "Wow!" (at end)
                // Cycle: 3rd play = Oh!, 6th play = Wow!, 9th = Oh!, 12th = Wow!...
                const cyclePosition = Math.floor(blondiePlayCount / 3);
                if (cyclePosition % 2 === 1) {
                    // Odd cycle (3, 9, 15...) = "Oh!" at start
                    return `Oh! ${text}`;
                } else {
                    // Even cycle (6, 12, 18...) = "Wow!" at end
                    return `${text} Wow!`;
                }
            }
            
            return text; // Normal play, no excitement added
        }
        
        // Extract player name and action from play text
        function extractPlayerAndAction(text) {
            // Pattern: "Player Name action description"
            // Player names are capitalized words at the start
            const match = text.match(/^([A-Z][a-z]+(?:\s+[A-Z][a-z'-]+)*)\s+(.+)$/);
            if (match) {
                return { playerName: match[1], actionText: match[2] };
            }
            return { playerName: '', actionText: text };
        }
        
        // Shorten long action text using OpenAI (if > 34 chars)
        const ACTION_LENGTH_THRESHOLD = 34;
        
        async function shortenIfNeeded(text) {
            const { playerName, actionText } = extractPlayerAndAction(text);
            
            // Only shorten if action text exceeds threshold
            if (actionText.length <= ACTION_LENGTH_THRESHOLD) {
                return text; // Short enough, no change needed
            }

            try {
                const response = await fetch('http://localhost:3000/api/shorten-play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerName, actionText })
                });
                
                if (!response.ok) {
                    console.warn('⚠️ Shorten API failed, using original');
                    return text;
                }
                
                const data = await response.json();
                const shortened = playerName ? `${playerName} ${data.shortened}` : data.shortened;
                return shortened;
            } catch (error) {
                console.error('❌ Shorten API error:', error);
                return text; // Fallback to original
            }
        }
        
        // Function to generate TTS audio for play-by-play text
        async function generatePlayByPlayAudio(playText, enhance = false) {
            try {
                // Don't stop current audio here - crossfade happens when new audio plays
                // (handled in updatePlayByPlay)
                
                // Pick voice based on play type:
                // - Angry Ogre: substitutions, timeouts, rebounds (~47% of plays)
                // - Blondie - Seductive: everything else (~53% of plays)
                let voiceToUse;
                if (isOgrePlay(playText)) {
                    voiceToUse = ttsVoiceAngryOgre;
                } else {
                    voiceToUse = ttsVoiceBlondie;
                }
                
                // Fallback if voices not loaded yet
                if (!voiceToUse) {
                    return null;
                }
                
                // Step 1: Shorten long text using OpenAI (if > 34 chars action)
                let ttsText = await shortenIfNeeded(playText);
                
                // Step 2: Transform text for TTS (e.g., reverse order for rebounds)
                ttsText = transformForTTS(ttsText);
                
                // Step 3: Add excitement for Blondie plays (every 3rd play)
                if (voiceToUse === ttsVoiceBlondie) {
                    ttsText = addBlondieExcitement(ttsText);
                }

                const requestBody = {
                    text: ttsText,
                    voiceId: voiceToUse,
                    model: 'eleven_flash_v2_5' // Fastest model
                };

                const response = await fetch('http://localhost:3000/api/elevenlabs-tts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    return null;
                }

                // Get audio blob
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                return audioUrl;
            } catch (error) {
                return null;
            }
        }

        // Helper for async delay
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Function to update play-by-play display with exit/enter animations
        // IMPORTANT: Waits for TTS BEFORE starting animations (no empty frame!)
        async function updatePlayByPlay(play) {
            if (!play || !playByPlayBox) return;
            
            // Update game overlay time from play-by-play data
            if (play.period && play.clock && window.gameView) {
                const quarter = pbpProcessor.formatPeriodToQuarter(play.period);
                window.gameView.updateStatusText(quarter, play.clock);
            }
            
            // Update scores from play-by-play data if scores are available
            if (window.gameView && lastHomeScore === null && window.gameView.elements && window.gameView.elements.homeScore) {
                const currentHomeScore = parseInt(window.gameView.elements.homeScore.textContent) || 0;
                const currentAwayScore = parseInt(window.gameView.elements.awayScore.textContent) || 0;
                lastHomeScore = currentHomeScore;
                lastAwayScore = currentAwayScore;
            }
            
            if (window.gameView && play.homeScore !== null && play.awayScore !== null) {
                const homeScoreChanged = play.homeScore !== lastHomeScore;
                const awayScoreChanged = play.awayScore !== lastAwayScore;
                
                if (homeScoreChanged) {
                    window.gameView.updateScore('home', play.homeScore, true);
                    lastHomeScore = play.homeScore;
                }
                if (awayScoreChanged) {
                    window.gameView.updateScore('away', play.awayScore, true);
                    lastAwayScore = play.awayScore;
                }
            }
            
            // Determine what image to use
            const pbpPhotoContainer = document.querySelector('.pbp-photo-container');
            let imageToLoad = play.playerPhoto;
            let isTeamLogo = false;
            
            if (play.isTimeout || play.isTeamEvent) {
                isTeamLogo = true;
                imageToLoad = play.teamLogo;
                if (!imageToLoad && window.gameView && window.gameView.elements) {
                    const actionUpper = play.action.toUpperCase();
                    const homeAbbr = (window.gameView.elements.homeAbbr?.textContent || '').trim().toUpperCase();
                    const awayAbbr = (window.gameView.elements.awayAbbr?.textContent || '').trim().toUpperCase();
                    
                    let useHome = true;
                    if (awayAbbr && actionUpper.includes(awayAbbr)) {
                        useHome = false;
                    } else if (homeAbbr && actionUpper.includes(homeAbbr)) {
                        useHome = true;
                    } else if (play.timeoutTeam === 'away') {
                        useHome = false;
                    }
                    
                    const logoEl = useHome ? window.gameView.elements.homeLogo : window.gameView.elements.awayLogo;
                    if (logoEl && logoEl.src && logoEl.src.trim() !== '' && !logoEl.src.endsWith('/')) {
                        imageToLoad = logoEl.src;
                    }
                }
                
            }
            
            // Prepare TTS text
            const originalPlayText = (play.isTimeout || play.isTeamEvent)
                ? play.action
                : `${play.playerName} ${play.action}`;
            
            // ========== WAIT FOR TTS FIRST (current play still visible) ==========
            // Don't preload images (CORS issues) - browser handles them natively
            const audioUrl = await generatePlayByPlayAudio(originalPlayText, true);
            
            // ========== NOW START ANIMATIONS (TTS is ready) ==========
            
            // Show the box if it was hidden
            if (playByPlayBox.style.display === 'none') {
                playByPlayBox.style.display = 'block';
            }
            
            const pbpBox = document.getElementById('pbpBoxContent');
            const photoImg = pbpPhoto;
            const pbpContent = document.querySelector('.pbp-content');
            
            // Remove animation state classes and reset styles
            playByPlayBox.classList.remove('exiting', 'entering');
            photoImg.style.transform = '';
            photoImg.style.opacity = '';
            photoImg.style.filter = '';
            photoImg.style.animation = '';
            photoImg.style.clipPath = '';
            
            if (pbpContent) {
                pbpContent.style.transform = '';
                pbpContent.style.opacity = '';
                pbpContent.style.filter = '';
                pbpContent.style.animation = '';
                pbpContent.style.clipPath = '';
            }
            
            pbpIcon.style.transform = '';
            pbpIcon.style.opacity = '';
            pbpIcon.style.filter = '';
            pbpIcon.style.animation = '';
            pbpIcon.style.clipPath = '';
            
            // Start exit animation
            playByPlayBox.classList.add('anim-21', 'exiting');
            void pbpPhoto.offsetWidth; // Force reflow
            
            // Wait for exit animation (content exits 0-0.5s, pic fades 0.5-0.8s)
            await delay(800);
            
            // Update content (while still in "exiting" state, content is hidden)
            if (isTeamLogo) {
                if (pbpPhotoContainer) {
                    pbpPhotoContainer.style.display = '';
                    pbpPhotoContainer.style.border = 'none';
                }
                if (imageToLoad) {
                    pbpPhoto.src = imageToLoad;
                }
                pbpPhoto.alt = play.timeoutTeam === 'home' ? 'Home Team' : 'Away Team';
            } else {
                if (pbpPhotoContainer) {
                    pbpPhotoContainer.style.display = '';
                    pbpPhotoContainer.style.border = '';
                }
                pbpPhoto.src = play.playerPhoto;
                pbpPhoto.alt = play.playerName;
            }
            
            pbpQuarter.textContent = `Q${play.period}`;
            pbpClock.textContent = play.clock;
            pbpPlayer.textContent = (play.isTimeout || play.isTeamEvent) ? '' : play.playerName;
            pbpAction.textContent = play.action;
            // Show team logo in icon area ONLY for regular plays (not timeouts/team events)
            // For timeouts, logo already shows in the photo circle
            if (play.isTimeout || play.isTeamEvent) {
                pbpIcon.style.display = 'none';
            } else if (play.teamLogo) {
                pbpIcon.src = play.teamLogo;
                pbpIcon.style.display = 'block';
            } else {
                // Fallback: hide icon if no team logo available
                pbpIcon.style.display = 'none';
            }
            
            // Start enter animation
            playByPlayBox.classList.remove('exiting');
            playByPlayBox.classList.add('entering');
            void pbpPhoto.offsetWidth; // Force reflow
            
            // Play audio shortly after enter animation starts (with crossfade)
            if (audioUrl) {
                setTimeout(() => {
                    // Fade out old audio instead of stopping abruptly
                    if (currentPbpAudio) {
                        fadeOutAudio(currentPbpAudio, 1000); // 1 second fade
                    }
                    
                    // Start new audio immediately at full volume
                    currentPbpAudio = new Audio(audioUrl);
                    currentPbpAudio.volume = 1;
                    currentPbpAudio.play().catch(() => {});
                }, 200);
            }
            
            // Clean up after enter animation completes
            await delay(700);
            playByPlayBox.classList.remove('entering');
            
            photoImg.style.opacity = '';
            photoImg.style.clipPath = '';
            photoImg.style.filter = '';
            if (pbpContent) {
                pbpContent.style.opacity = '';
                pbpContent.style.clipPath = '';
                pbpContent.style.filter = '';
            }
            pbpIcon.style.opacity = '';
            pbpIcon.style.clipPath = '';
            pbpIcon.style.filter = '';
        }

        // Function to check and update play-by-play from API data
        async function checkAndUpdatePlayByPlay(gameId, nbaApi, gameState) {
            if (!gameId || !nbaApi) return;
            
            // Hide play-by-play during halftime, final, or pregame
            if (gameState === 'halftime' || gameState === 'final' || gameState === 'pregame') {
                if (playByPlayBox) {
                    playByPlayBox.style.display = 'none';
                }
                return;
            }
            
            try {
                const plays = await nbaApi.getPlayByPlay(gameId);
                if (!plays || plays.length === 0) {
                    return;
                }
                
                // Build team context from gameView for logo resolution
                const teamContext = {
                    homeId: window.gameView?.teamIds?.home || '',
                    awayId: window.gameView?.teamIds?.away || '',
                    homeAbbr: (window.gameView?.elements?.homeAbbr?.textContent || '').trim(),
                    awayAbbr: (window.gameView?.elements?.awayAbbr?.textContent || '').trim(),
                    homeLogo: window.gameView?.elements?.homeLogo?.src || '',
                    awayLogo: window.gameView?.elements?.awayLogo?.src || ''
                };
                
                // Use processor to find first valid, non-duplicate play
                const transformedPlay = pbpProcessor.findNewPlay(plays, teamContext);
                
                if (!transformedPlay) {
                    return;
                }
                
                // Send play-by-play data to server for storage
                try {
                    await fetch('http://localhost:3000/api/play-by-play', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            gameId: gameId,
                            play: {
                                period: transformedPlay.period,
                                clock: transformedPlay.clock,
                                playerName: transformedPlay.playerName,
                                action: transformedPlay.action,
                                homeScore: transformedPlay.homeScore,
                                awayScore: transformedPlay.awayScore,
                                isTimeout: transformedPlay.isTimeout
                            }
                        })
                    });
                } catch (error) {
                    // Silently handle errors
                }
                
                await updatePlayByPlay(transformedPlay);
            } catch (error) {
                // Silently handle errors
            }
        }
        
        // Function to reset play-by-play tracking (call when game changes)
        function resetPlayByPlayTracking() {
            pbpProcessor.reset();
            lastHomeScore = null; // Reset display score tracking
            lastAwayScore = null;
        }

        // Expose functions for integration
        window.updatePlayByPlay = updatePlayByPlay;
        window.checkAndUpdatePlayByPlay = checkAndUpdatePlayByPlay;
        window.resetPlayByPlayTracking = resetPlayByPlayTracking;
    </script>

    <script src="utils/game-data-formatter.js"></script>
    <script src="utils/transition-animator.js"></script>
    <script src="utils/unified-box-animator.js"></script>
    
    <!-- Game feature -->
    <script src="game/game-view.js"></script>
    
    <!-- Other games feature -->
    <script src="other-games/other-games-view.js"></script>
    <script src="other-games/other-games-controller.js"></script>
    <script src="other-games/other-games-container-view.js"></script>
    
    <!-- MVP feature -->
    <script src="mvp/mvp-view.js"></script>
    <script src="mvp/mvp-controller.js"></script>
    <script src="mvp/mvp-integration.js"></script>
    
    <!-- Main controllers -->
    <script src="mode-coordinator.js"></script>
    <script src="app-controller.js"></script>
    
    <script>
        // ==================== CLEAN INITIALIZATION ====================
        // All business logic extracted into modular classes
        
        // Initialize dependencies
        const api = new ApiClient();
        const nbaApi = window.NBAApi;
        
        // Initialize unified box animator
        const unifiedBoxAnimator = new UnifiedBoxAnimator();
        unifiedBoxAnimator.init(document.getElementById('otherGamesBox'));
        
        const gameView = new GameView(unifiedBoxAnimator);
        const mvpView = new MvpView();
        const otherGamesView = new OtherGamesView();
        const otherGamesContainerView = new OtherGamesContainerView();
        
        // Initialize core managers
        const stateManager = new StateManager();
        const simulationManager = new SimulationManager();
        const gameDataFormatter = new GameDataFormatter(stateManager);
        
        // Initialize MVP controller with state manager (for mode checking)
        const mvpController = new MvpController(mvpView, stateManager);
        const mvpIntegration = new MvpIntegration();
        
        // Initialize mode coordinator
        const modeCoordinator = new ModeCoordinator({
            api,
            nbaApi,
            gameView,
            mvpView,
            otherGamesView,
            otherGamesContainerView,
            stateManager,
            simulationManager,
            gameDataFormatter,
            unifiedBoxAnimator
        });
        
        // Initialize main app controller with all dependencies
        const appController = new AppController({
            api,
            nbaApi,
            gameView,
            mvpView,
            mvpController,
            mvpIntegration,
            otherGamesView,
            stateManager,
            simulationManager,
            gameDataFormatter,
            modeCoordinator
        });
        
        // Start the overlay when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            appController.start();
        });
        
        // Cleanup timers when page unloads (OBS hides source, browser navigates away, etc.)
        window.addEventListener('beforeunload', () => {
            appController.stop();
        });
        
        // Expose for debugging/testing
        window.appController = appController;
        window.gameView = gameView;
        window.mvpView = mvpView; // Expose MVP view for play-by-play visibility checks
        
        // Listen for updates from test page
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'UPDATE_TEAM_SPACING') {
                const spacing = event.data.spacing;
                document.querySelectorAll('.teams').forEach(el => {
                    el.style.gap = spacing + 'px';
                });
            }
            
            if (event.data && event.data.type === 'UPDATE_STATS_SPACING') {
                const spacing = event.data.spacing;
                document.querySelectorAll('.stats-row').forEach(el => {
                    el.style.gap = spacing + 'px';
                });
            }

            if (event.data && event.data.type === 'UPDATE_PBP_GAP') {
                const gap = event.data.gap;
                const pbpBox = document.querySelector('.pbp-box');
                if (pbpBox) {
                    pbpBox.style.gap = gap + 'px';
                }
            }

            if (event.data && event.data.type === 'UPDATE_PBP_TOP') {
                const top = event.data.top;
                const pbpBox = document.querySelector('.play-by-play-box');
                if (pbpBox) {
                    pbpBox.style.top = top + 'px';
                }
            }

            if (event.data && event.data.type === 'UPDATE_QUARTER_COLOR') {
                const color = event.data.color;
                let styleEl = document.getElementById('custom-quarter-color');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'custom-quarter-color';
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = `
                    .game-status > div:first-child { color: ${color} !important; }
                    #pbpQuarter { color: ${color} !important; }
                `;
            }
            
            if (event.data && event.data.type === 'UPDATE_GAME_TIME_COLOR') {
                const color = event.data.color;
                let styleEl = document.getElementById('custom-time-color');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'custom-time-color';
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = `
                    .game-status > div:last-child { color: ${color} !important; }
                    #pbpClock { color: ${color} !important; }
                `;
            }
            
            if (event.data && event.data.type === 'UPDATE_PBP_ACTION_COLOR') {
                const color = event.data.color;
                let styleEl = document.getElementById('custom-pbp-action-color');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'custom-pbp-action-color';
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = `
                    #pbpAction { color: ${color} !important; }
                `;
            }
            
            if (event.data && event.data.type === 'UPDATE_MVP_PHOTO_SIZE') {
                const size = event.data.size;
                const playerPic = document.querySelector('.mvp-content .player-pic');
                if (playerPic) {
                    playerPic.style.width = size + 'px';
                    playerPic.style.height = size + 'px';
                }
            }

            if (event.data && event.data.type === 'UPDATE_STAT_STYLE') {
                const styleId = event.data.styleId;
                applyStatComparisonStyle(styleId);
            }
        });

        // ==================== STAT COMPARISON LOGIC ====================
        let currentStatStyle = 'none';

        function parseStatForComparison(text, statLabel) {
            // Parse stat values and return a comparable number
            // Formats: "21/46", "27/11", "13/7", "5/15 (33.3%)", "10/13 (76.9%)"
            if (!text) return 0;
            
            const label = statLabel.toUpperCase();
            
            // For shooting stats with percentage, use the percentage
            const pctMatch = text.match(/\((\d+\.?\d*)%\)/);
            if (pctMatch) {
                return parseFloat(pctMatch[1]);
            }
            
            // For AST/TO, use assists (first number)
            // For REB/OFF, use total rebounds (first number)
            // For FGM/FGA, use made shots (first number)
            const match = text.match(/^(\d+)/);
            if (match) {
                return parseInt(match[1], 10);
            }
            return 0;
        }

        function calculateProportion(leftText, rightText, statLabel) {
            // Calculate proportion for magnitude-based visualizations
            // Returns { leftPct: 0-100, rightPct: 0-100, winner: 'left'|'right'|'tie', margin: 0-100 }
            const leftVal = parseStatForComparison(leftText, statLabel);
            const rightVal = parseStatForComparison(rightText, statLabel);
            const total = leftVal + rightVal;
            
            if (total === 0) {
                return { leftPct: 50, rightPct: 50, winner: 'tie', margin: 0 };
            }
            
            const leftPct = (leftVal / total) * 100;
            const rightPct = (rightVal / total) * 100;
            const margin = Math.abs(leftPct - rightPct);
            
            let winner = 'tie';
            if (leftVal > rightVal) winner = 'left';
            else if (rightVal > leftVal) winner = 'right';
            
            return { leftPct, rightPct, winner, margin, leftVal, rightVal };
        }

        function applyStatComparisonStyle(styleId) {
            currentStatStyle = styleId;
            
            // Get all stat rows
            const statsRows = document.querySelectorAll('.team-stats .stats-row');
            
            statsRows.forEach(row => {
                const statValues = row.querySelectorAll('.stat-value');
                const statLabel = row.querySelector('.stat-label');
                
                if (statValues.length < 2) return;
                
                const leftEl = statValues[0];
                const rightEl = statValues[1];
                const labelText = statLabel ? statLabel.textContent : '';
                
                // Clear previous styles
                clearStatStyles(row, leftEl, rightEl);
                
                if (styleId === 'none') return;
                
                // Calculate proportions
                const props = calculateProportion(leftEl.textContent, rightEl.textContent, labelText);
                
                // Apply the selected style
                applyMagnitudeStyle(row, leftEl, rightEl, props, styleId);
            });
        }

        function clearStatStyles(row, leftEl, rightEl) {
            // Remove dynamically added elements
            row.querySelectorAll('.stat-split-bar, .stat-badge, .stat-dots, .stat-mini-bar, .stat-edge').forEach(el => el.remove());
            
            // Reset inline styles
            [leftEl, rightEl].forEach(el => {
                el.style.removeProperty('color');
                el.style.removeProperty('opacity');
                el.style.removeProperty('font-size');
                el.style.removeProperty('transform');
                el.style.removeProperty('text-shadow');
                el.style.removeProperty('background');
                el.style.removeProperty('position');
                el.className = 'stat-value'; // Reset to base class
            });
            
            row.style.removeProperty('background');
            row.style.removeProperty('position');
        }

        function applyMagnitudeStyle(row, leftEl, rightEl, props, styleId) {
            const { leftPct, rightPct, winner } = props;
            
            switch(styleId) {
                case 'split-bar':
                    applySplitBar(row, leftPct, rightPct, winner);
                    break;
                case 'dot-stack':
                    applyDotStack(leftEl, rightEl, leftPct, rightPct);
                    break;
                case 'mini-chart':
                    applyMiniChart(leftEl, rightEl, leftPct, rightPct, winner);
                    break;
                case 'vertical-bars':
                    applyVerticalBars(leftEl, rightEl, leftPct, rightPct, winner);
                    break;
                case 'ring-progress':
                    applyRingProgress(leftEl, rightEl, leftPct, rightPct, winner);
                    break;
                case 'block-stack':
                    applyBlockStack(leftEl, rightEl, leftPct, rightPct);
                    break;
                case 'advantage-bar':
                    applyAdvantageBar(row, leftPct, rightPct, winner);
                    break;
                case 'difference-badge':
                    applyDifferenceBadge(leftEl, rightEl, props);
                    break;
                case 'size-difference':
                    applySizeDifference(leftEl, rightEl, props);
                    break;
                case 'color-intensity':
                    applyColorIntensity(leftEl, rightEl, props);
                    break;
                case 'plus-blocks':
                    applyPlusBlocks(leftEl, rightEl, props);
                    break;
            }
        }

        // Style 1: Split Bar - horizontal bar between stats
        function applySplitBar(row, leftPct, rightPct, winner) {
            const bar = document.createElement('div');
            bar.className = 'stat-split-bar';
            bar.innerHTML = `
                <div class="split-left" style="width: ${leftPct}%; background: ${winner === 'left' ? '#4ade80' : '#64748b'};"></div>
                <div class="split-right" style="width: ${rightPct}%; background: ${winner === 'right' ? '#4ade80' : '#64748b'};"></div>
            `;
            row.appendChild(bar);
        }

        // Style 2: Dot Stack - dots showing relative performance
        function applyDotStack(leftEl, rightEl, leftPct, rightPct) {
            [leftEl, rightEl].forEach((el, idx) => {
                const pct = idx === 0 ? leftPct : rightPct;
                const filledDots = Math.round((pct / 100) * 5); // 5 dots max
                
                const dots = document.createElement('span');
                dots.className = 'stat-dots';
                dots.style.cssText = `
                    font-size: 8px;
                    margin-left: 8px;
                    letter-spacing: 2px;
                `;
                dots.innerHTML = Array(5).fill(0).map((_, i) => 
                    `<span style="color: ${i < filledDots ? '#4ade80' : '#334155'}">●</span>`
                ).join('');
                el.appendChild(dots);
            });
        }

        // Style 3: Mini Chart - tiny bar chart next to value
        function applyMiniChart(leftEl, rightEl, leftPct, rightPct, winner) {
            [leftEl, rightEl].forEach((el, idx) => {
                const pct = idx === 0 ? leftPct : rightPct;
                const isWinner = (idx === 0 && winner === 'left') || (idx === 1 && winner === 'right');
                
                const chart = document.createElement('span');
                chart.className = 'stat-mini-bar';
                chart.style.cssText = `
                    display: inline-block;
                    width: 40px;
                    height: 8px;
                    background: #1e293b;
                    border-radius: 4px;
                    margin-left: 10px;
                    overflow: hidden;
                    vertical-align: middle;
                `;
                chart.innerHTML = `<span style="display: block; width: ${pct}%; height: 100%; background: ${isWinner ? '#4ade80' : '#64748b'}; border-radius: 4px;"></span>`;
                el.appendChild(chart);
            });
        }

        // Style 4: Vertical Bars - small vertical bar chart
        function applyVerticalBars(leftEl, rightEl, leftPct, rightPct, winner) {
            [leftEl, rightEl].forEach((el, idx) => {
                const pct = idx === 0 ? leftPct : rightPct;
                const isWinner = (idx === 0 && winner === 'left') || (idx === 1 && winner === 'right');
                const height = Math.max(20, (pct / 100) * 100); // Scale to max 100% of container
                
                const bar = document.createElement('span');
                bar.className = 'stat-mini-bar';
                bar.style.cssText = `
                    display: inline-flex;
                    align-items: flex-end;
                    width: 12px;
                    height: 28px;
                    background: #1e293b;
                    border-radius: 3px;
                    margin-left: 10px;
                    overflow: hidden;
                    vertical-align: middle;
                `;
                bar.innerHTML = `<span style="display: block; width: 100%; height: ${height}%; background: ${isWinner ? '#4ade80' : '#64748b'}; border-radius: 3px;"></span>`;
                el.appendChild(bar);
            });
        }

        // Style 5: Ring Progress - circular progress ring
        function applyRingProgress(leftEl, rightEl, leftPct, rightPct, winner) {
            [leftEl, rightEl].forEach((el, idx) => {
                const pct = idx === 0 ? leftPct : rightPct;
                const isWinner = (idx === 0 && winner === 'left') || (idx === 1 && winner === 'right');
                const color = isWinner ? '#4ade80' : '#64748b';
                const circumference = 2 * Math.PI * 8; // radius = 8
                const offset = circumference - (pct / 100) * circumference;
                
                const ring = document.createElement('span');
                ring.className = 'stat-mini-bar';
                ring.style.cssText = `
                    display: inline-block;
                    margin-left: 10px;
                    vertical-align: middle;
                `;
                ring.innerHTML = `
                    <svg width="22" height="22" style="transform: rotate(-90deg);">
                        <circle cx="11" cy="11" r="8" fill="none" stroke="#1e293b" stroke-width="3"/>
                        <circle cx="11" cy="11" r="8" fill="none" stroke="${color}" stroke-width="3"
                            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
                    </svg>
                `;
                el.appendChild(ring);
            });
        }

        // Style 6: Block Stack - 5 squares like battery indicator
        function applyBlockStack(leftEl, rightEl, leftPct, rightPct) {
            [leftEl, rightEl].forEach((el, idx) => {
                const pct = idx === 0 ? leftPct : rightPct;
                const filledBlocks = Math.round((pct / 100) * 5);
                
                const blocks = document.createElement('span');
                blocks.className = 'stat-mini-bar';
                blocks.style.cssText = `
                    display: inline-flex;
                    gap: 2px;
                    margin-left: 10px;
                    vertical-align: middle;
                `;
                blocks.innerHTML = Array(5).fill(0).map((_, i) => 
                    `<span style="width: 6px; height: 14px; background: ${i < filledBlocks ? '#4ade80' : '#334155'}; border-radius: 2px;"></span>`
                ).join('');
                el.appendChild(blocks);
            });
        }

        // Style 7: Advantage Bar - single bar extending toward winner based on margin
        function applyAdvantageBar(row, leftPct, rightPct, winner) {
            const margin = Math.abs(leftPct - rightPct);
            const maxWidth = 60; // max width in px
            const barWidth = (margin / 50) * maxWidth; // 50% margin = full width
            
            const container = document.createElement('div');
            container.className = 'stat-split-bar';
            container.style.cssText = `
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                bottom: 4px;
                width: ${maxWidth * 2}px;
                height: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 0;
            `;
            
            if (winner === 'tie') {
                container.innerHTML = `<div style="width: 4px; height: 6px; background: #64748b; border-radius: 2px;"></div>`;
            } else {
                const direction = winner === 'left' ? 'right' : 'left';
                container.innerHTML = `
                    <div style="width: 4px; height: 6px; background: #64748b; border-radius: 2px;"></div>
                    <div style="position: absolute; ${direction}: 50%; width: ${barWidth}px; height: 6px; background: #4ade80; border-radius: ${winner === 'left' ? '2px 0 0 2px' : '0 2px 2px 0'}; margin-${direction}: 2px;"></div>
                `;
            }
            row.appendChild(container);
        }

        // Style 8: Difference Badge - shows +X% on winner
        function applyDifferenceBadge(leftEl, rightEl, props) {
            const { leftPct, rightPct, winner, leftVal, rightVal } = props;
            if (winner === 'tie') return;
            
            const diff = Math.abs(leftVal - rightVal);
            const pctDiff = Math.abs(leftPct - rightPct).toFixed(0);
            
            const winnerEl = winner === 'left' ? leftEl : rightEl;
            const loserEl = winner === 'left' ? rightEl : leftEl;
            
            const badge = document.createElement('span');
            badge.className = 'stat-badge';
            badge.style.cssText = `
                font-size: 12px;
                color: #4ade80;
                margin-left: 8px;
                font-weight: 700;
                background: rgba(74, 222, 128, 0.15);
                padding: 2px 6px;
                border-radius: 4px;
            `;
            badge.textContent = `+${diff}`;
            winnerEl.appendChild(badge);
            
            // Dim the loser
            loserEl.style.opacity = '0.6';
        }

        // Style 9: Size Difference - winner grows based on margin
        function applySizeDifference(leftEl, rightEl, props) {
            const { winner, margin } = props;
            if (winner === 'tie') return;
            
            // Scale: 0% margin = 1x, 50% margin = 1.3x
            const scale = 1 + Math.min(0.3, (margin / 50) * 0.3);
            const shrink = 1 - Math.min(0.2, (margin / 50) * 0.2);
            
            const winnerEl = winner === 'left' ? leftEl : rightEl;
            const loserEl = winner === 'left' ? rightEl : leftEl;
            
            winnerEl.style.transform = `scale(${scale})`;
            winnerEl.style.color = '#4ade80';
            loserEl.style.transform = `scale(${shrink})`;
            loserEl.style.opacity = '0.5';
        }

        // Style 10: Color Intensity - winner color intensity based on margin
        function applyColorIntensity(leftEl, rightEl, props) {
            const { winner, margin } = props;
            
            // Intensity: 0% margin = 0.4 opacity, 50% margin = 1.0 opacity
            const intensity = 0.4 + Math.min(0.6, (margin / 40) * 0.6);
            
            const winnerEl = winner === 'left' ? leftEl : rightEl;
            const loserEl = winner === 'left' ? rightEl : leftEl;
            
            if (winner !== 'tie') {
                winnerEl.style.color = `rgba(74, 222, 128, ${intensity})`;
                winnerEl.style.textShadow = `0 0 ${margin / 3}px rgba(74, 222, 128, ${intensity * 0.5})`;
                loserEl.style.color = `rgba(248, 113, 113, ${0.3 + intensity * 0.3})`;
                loserEl.style.opacity = `${1 - (margin / 150)}`;
            }
        }

        // Style 11: Plus Blocks - shows advantage as extra blocks
        function applyPlusBlocks(leftEl, rightEl, props) {
            const { leftPct, rightPct, winner } = props;
            if (winner === 'tie') return;
            
            const margin = Math.abs(leftPct - rightPct);
            const advantageBlocks = Math.min(5, Math.ceil(margin / 10)); // 1 block per 10% margin
            
            [leftEl, rightEl].forEach((el, idx) => {
                const isWinner = (idx === 0 && winner === 'left') || (idx === 1 && winner === 'right');
                
                const blocks = document.createElement('span');
                blocks.className = 'stat-mini-bar';
                blocks.style.cssText = `
                    display: inline-flex;
                    gap: 2px;
                    margin-left: 10px;
                    vertical-align: middle;
                `;
                
                if (isWinner) {
                    blocks.innerHTML = Array(advantageBlocks).fill(0).map(() => 
                        `<span style="width: 6px; height: 14px; background: #4ade80; border-radius: 2px;"></span>`
                    ).join('');
                } else {
                    // Show empty blocks for loser to indicate deficit
                    blocks.innerHTML = Array(advantageBlocks).fill(0).map(() => 
                        `<span style="width: 6px; height: 14px; background: #334155; border-radius: 2px;"></span>`
                    ).join('');
                }
                el.appendChild(blocks);
            });
        }


        // Expose for re-applying after data updates
        window.applyStatComparisonStyle = applyStatComparisonStyle;
        window.getCurrentStatStyle = () => currentStatStyle;
        
        /* OLD CODE REMOVED - Now in modular classes:
         * - generateSimulationData() → SimulationManager
         * - resetAndHideOverlay() → AppController
         * - shouldShowOverlayBasedOnQuarter() → AppController
         * - updateFromAPI() → AppController
         * - detectStateAndUpdate() → AppController
         * - formatGameDataForView() → AppController
         * - checkSimulatedMVP() → AppController
         * - All state variables → StateManager
         */
        
    </script>
