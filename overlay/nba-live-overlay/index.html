<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/overlay/nba-live-overlay/">
    <title>NBA Game Stats Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Current Game Stats Overlay -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <!-- Home Team -->
            <div class="team" data-team="home">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="" alt="Home Team">
                    <div class="team-abbr" data-abbr="home">---</div>
                </div>
                <div class="score" data-score="home">0</div>
            </div>
            
            <!-- Away Team -->
            <div class="team" data-team="away">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="" alt="Away Team">
                    <div class="team-abbr" data-abbr="away">---</div>
                </div>
                <div class="score" data-score="away">0</div>
            </div>
        </div>
        
        <div class="game-status" data-status>Q1 · 12:00</div>

        <!-- MVP Player Section -->
        <div class="mvp-section">
            <div class="mvp-content">
                <div class="photo-container">
                    <img class="player-pic" src="" alt="MVP Player">
                    <img class="player-team-logo" src="" alt="Team">
                </div>
                <div class="player-info">
                    <div class="mvp-header">
                        <span class="mvp-label">⭐ MVP</span>
                        <span class="player-name">---</span>
                    </div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <div class="stat-value" data-stat="pts">0</div>
                            <div class="stat-label">PTS</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" data-stat="reb">0</div>
                            <div class="stat-label">REB</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" data-stat="ast">0</div>
                            <div class="stat-label">AST</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Other Games Overlay -->
    <div class="other-games-overlay" id="other-games">
        <div class="other-game-card">
            <div id="games-container">
                <!-- Games will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- NBA API utilities -->
    <script src="../_shared/config.js"></script>
    <script src="../_shared/nbaApi.js"></script>
    <script src="../_shared/apiClient.js"></script>
    
    <!-- Shared utilities -->
    <script src="shared/game-utils.js"></script>
    <script src="shared/state-manager.js"></script>
    <script src="shared/simulation-manager.js"></script>
    <script src="shared/game-data-formatter.js"></script>
    
    <!-- Game feature -->
    <script src="game/game-view.js"></script>
    
    <!-- Other games feature -->
    <script src="other-games/other-games-view.js"></script>
    <script src="other-games/other-games-controller.js"></script>
    
    <!-- MVP feature -->
    <script src="mvp/mvp-view.js"></script>
    <script src="mvp/mvp-controller.js"></script>
    <script src="mvp/mvp-integration.js"></script>
    
    <!-- Main controllers -->
    <script src="mode-coordinator.js"></script>
    <script src="app-controller.js"></script>
    
    <script>
        // ==================== CLEAN INITIALIZATION ====================
        // All business logic extracted into modular classes
        
        // Initialize dependencies
        const api = new ApiClient();
        const nbaApi = window.NBAApi;
        const gameView = new GameView();
        const mvpView = new MvpView();
        const mvpController = new MvpController(mvpView);
        const mvpIntegration = new MvpIntegration();
        const otherGamesView = new OtherGamesView();
        
        // Initialize core managers
        const stateManager = new StateManager();
        const simulationManager = new SimulationManager();
        const gameDataFormatter = new GameDataFormatter(stateManager);
        
        // Initialize mode coordinator
        const modeCoordinator = new ModeCoordinator({
            api,
            nbaApi,
            gameView,
            mvpView,
            otherGamesView,
            stateManager,
            simulationManager,
            gameDataFormatter
        });
        
        // Initialize main app controller with all dependencies
        const appController = new AppController({
            api,
            nbaApi,
            gameView,
            mvpView,
            mvpController,
            mvpIntegration,
            otherGamesView,
            stateManager,
            simulationManager,
            gameDataFormatter,
            modeCoordinator
        });
        
        // Start the overlay when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            appController.start();
        });
        
        // Expose for debugging/testing
        window.appController = appController;
        window.gameView = gameView;
        
        /* OLD CODE REMOVED - Now in modular classes:
         * - generateSimulationData() → SimulationManager
         * - resetAndHideOverlay() → AppController
         * - shouldShowOverlayBasedOnQuarter() → AppController
         * - updateFromAPI() → AppController
         * - detectStateAndUpdate() → AppController
         * - formatGameDataForView() → AppController
         * - checkSimulatedMVP() → AppController
         * - All state variables → StateManager
         */
    </script>

</body>
</html>
