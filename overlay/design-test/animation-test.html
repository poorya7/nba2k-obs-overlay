<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Animation Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
}

.background {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: url('../../game-stream.png');
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.overlay-container {
  position: fixed;
  top: 40px;
  left: 40px;
  z-index: 10;
}

.overlay-pill .pill {
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  border-radius: 50px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.overlay-pill .team {
  display: flex;
  align-items: center;
  gap: 6px;
}

.overlay-pill .logo {
  width: 22px;
  height: 22px;
  border-radius: 50%;
}

.overlay-pill .score {
  font-size: 20px;
  font-weight: 900;
  color: #4CAF50;
  font-family: 'Poppins', sans-serif;
  position: relative;
  display: inline-block;
  width: 35px;
  text-align: center;
}

.overlay-pill .vs {
  font-size: 11px;
  color: #666;
  font-weight: 700;
}

.overlay-pill .status-pill {
  background: rgba(255, 71, 87, 0.3);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 900;
  color: #ff4757;
}

.overlay-pill .time-pill {
  background: rgba(0, 150, 136, 0.25);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  color: #26A69A;
}

/* ===== ANIMATION 1: PULSE ===== */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.score.anim-pulse {
  animation: pulse 0.4s ease-out;
}

/* ===== ANIMATION 2: PULSE SOFT ===== */
@keyframes pulseSoft {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.score.anim-pulse-soft {
  animation: pulseSoft 0.5s ease-in-out;
}

/* ===== ANIMATION 3: FLASH ===== */
@keyframes flash {
  0%, 100% { 
    color: #4CAF50;
    text-shadow: none;
  }
  50% { 
    color: #fff;
    text-shadow: 0 0 20px #4CAF50, 0 0 30px #4CAF50;
  }
}

.score.anim-flash {
  animation: flash 0.5s ease-out;
}

/* ===== ANIMATION 4: FLASH DOUBLE ===== */
@keyframes flashDouble {
  0%, 100% { 
    color: #4CAF50;
    text-shadow: none;
  }
  25%, 75% { 
    color: #fff;
    text-shadow: 0 0 20px #4CAF50, 0 0 30px #4CAF50;
  }
  50% {
    color: #4CAF50;
    text-shadow: 0 0 10px #4CAF50;
  }
}

.score.anim-flash-double {
  animation: flashDouble 0.6s ease-out;
}

/* ===== ANIMATION 5: SLIDE UP ===== */
@keyframes slideUp {
  0% { 
    transform: translateY(20px);
    opacity: 0;
  }
  100% { 
    transform: translateY(0);
    opacity: 1;
  }
}

.score.anim-slide {
  animation: slideUp 0.4s ease-out;
}

/* ===== ANIMATION 6: SLIDE UP FADE ===== */
@keyframes slideUpFade {
  0% { 
    transform: translateY(30px) scale(0.8);
    opacity: 0;
  }
  100% { 
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

.score.anim-slide-fade {
  animation: slideUpFade 0.5s ease-out;
}

/* ===== ANIMATION 7: GLOW PULSE ===== */
@keyframes glowPulse {
  0%, 100% { 
    transform: scale(1);
    text-shadow: 0 0 5px #4CAF50;
  }
  50% { 
    transform: scale(1.2);
    text-shadow: 0 0 20px #4CAF50, 0 0 30px #4CAF50, 0 0 40px #4CAF50;
  }
}

.score.anim-glow {
  animation: glowPulse 0.6s ease-out;
}

/* ===== ANIMATION 8: GLOW BURST ===== */
@keyframes glowBurst {
  0% { 
    transform: scale(1);
    text-shadow: 0 0 5px #4CAF50;
  }
  30% { 
    transform: scale(1.4);
    text-shadow: 0 0 30px #4CAF50, 0 0 50px #4CAF50, 0 0 70px #4CAF50;
  }
  100% { 
    transform: scale(1);
    text-shadow: 0 0 5px #4CAF50;
  }
}

.score.anim-glow-burst {
  animation: glowBurst 0.7s ease-out;
}

/* ===== ANIMATION 9: PULSE FLASH ===== */
@keyframes pulseFlash {
  0% { 
    transform: scale(1);
    color: #4CAF50;
    text-shadow: none;
  }
  50% { 
    transform: scale(1.3);
    color: #fff;
    text-shadow: 0 0 25px #4CAF50, 0 0 35px #4CAF50;
  }
  100% { 
    transform: scale(1);
    color: #4CAF50;
    text-shadow: none;
  }
}

.score.anim-pulse-flash {
  animation: pulseFlash 0.5s ease-out;
}

/* ===== ANIMATION 10: SLIDE GLOW ===== */
@keyframes slideGlow {
  0% { 
    transform: translateY(25px);
    opacity: 0;
    text-shadow: none;
  }
  50% {
    text-shadow: 0 0 20px #4CAF50, 0 0 30px #4CAF50;
  }
  100% { 
    transform: translateY(0);
    opacity: 1;
    text-shadow: 0 0 5px #4CAF50;
  }
}

.score.anim-slide-glow {
  animation: slideGlow 0.5s ease-out;
}

/* Control Panel */
.control-panel {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.9);
  padding: 30px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  z-index: 100;
  backdrop-filter: blur(10px);
}

.control-panel h2 {
  font-size: 20px;
  margin-bottom: 20px;
  text-align: center;
  color: #4CAF50;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.anim-btn {
  padding: 12px 20px;
  background: rgba(76, 175, 80, 0.2);
  border: 2px solid #4CAF50;
  border-radius: 8px;
  color: #4CAF50;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.anim-btn:hover {
  background: rgba(76, 175, 80, 0.4);
  transform: translateY(-2px);
}

.anim-btn.active {
  background: #4CAF50;
  color: #000;
}

.score-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.score-btn {
  padding: 15px 30px;
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.score-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.score-btn.left {
  border-color: #42A5F5;
  color: #42A5F5;
}

.score-btn.right {
  border-color: #FF9800;
  color: #FF9800;
}

.info {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #888;
}
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="overlay-container">
    <div class="overlay-pill">
      <div class="pill">
        <div class="status-pill">🔴 LIVE</div>
        <div class="team">
          <img src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" class="logo">
          <span class="score" id="leftScore">11</span>
        </div>
        <div class="vs">-</div>
        <div class="team">
          <span class="score" id="rightScore">13</span>
          <img src="https://a.espncdn.com/i/teamlogos/nba/500/orl.png" class="logo">
        </div>
        <div class="time-pill">Q3 8:32</div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <h2>🎬 Score Animation Test</h2>
    
    <div class="button-grid">
      <button class="anim-btn active" data-anim="pulse">1. Pulse</button>
      <button class="anim-btn" data-anim="pulse-soft">2. Pulse Soft</button>
      <button class="anim-btn" data-anim="flash">3. Flash</button>
      <button class="anim-btn" data-anim="flash-double">4. Flash Double</button>
      <button class="anim-btn" data-anim="slide">5. Slide Up</button>
      <button class="anim-btn" data-anim="slide-fade">6. Slide Fade</button>
      <button class="anim-btn" data-anim="glow">7. Glow Pulse</button>
      <button class="anim-btn" data-anim="glow-burst">8. Glow Burst</button>
      <button class="anim-btn" data-anim="pulse-flash">9. Pulse Flash</button>
      <button class="anim-btn" data-anim="slide-glow">10. Slide Glow</button>
    </div>

    <div class="score-buttons">
      <button class="score-btn left" id="leftBtn">⬅️ Warriors Score +2</button>
      <button class="score-btn right" id="rightBtn">Magic Score +2 ➡️</button>
    </div>

    <div class="info">
      Click an animation style above, then click a score button to see it in action!
    </div>
  </div>

  <script>
    let currentAnimation = 'pulse';
    let leftScore = 11;
    let rightScore = 13;

    const leftScoreEl = document.getElementById('leftScore');
    const rightScoreEl = document.getElementById('rightScore');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const animBtns = document.querySelectorAll('.anim-btn');

    // Select animation
    animBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        animBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentAnimation = btn.dataset.anim;
      });
    });

    // Animate score
    function animateScore(scoreEl, newScore) {
      // Remove any existing animation
      scoreEl.className = 'score';
      
      // Force reflow
      void scoreEl.offsetWidth;
      
      // Update score
      scoreEl.textContent = newScore;
      
      // Add animation
      scoreEl.classList.add(`anim-${currentAnimation}`);
      
      // Remove animation class after it completes
      setTimeout(() => {
        scoreEl.classList.remove(`anim-${currentAnimation}`);
      }, 1000);
    }

    // Left score button
    leftBtn.addEventListener('click', () => {
      leftScore += 2;
      animateScore(leftScoreEl, leftScore);
    });

    // Right score button
    rightBtn.addEventListener('click', () => {
      rightScore += 2;
      animateScore(rightScoreEl, rightScore);
    });
  </script>
</body>
</html>
