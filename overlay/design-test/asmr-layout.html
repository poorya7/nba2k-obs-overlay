<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR Basketball Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #gameplay-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Channel Branding - TOP LEFT */
        .channel-branding {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 15, 15, 0.7);
            backdrop-filter: blur(15px);
            padding: 12px 24px;
            border-radius: 16px;
            border: 2px solid rgba(74, 222, 128, 0.4);
            box-shadow: 0 4px 25px rgba(74, 222, 128, 0.2);
            display: inline-block;
        }

        .branding-text {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 500;
            color: #f0fdf4;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }

        .asmr-badge {
            display: inline-block;
            background: rgba(74, 222, 128, 0.3);
            color: #4ade80;
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 1.5px;
            margin-left: 10px;
            text-transform: uppercase;
        }

        /* Game Stats - BOTTOM LEFT */
        .game-stats {
            position: fixed;
            top: calc(100vh - 350px);
            left: 20px;
            z-index: 10;
            background: rgba(10, 15, 15, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            width: 200px;
            box-shadow: 0 8px 40px rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-text {
            font-size: 11px;
            font-weight: 600;
            color: #4ade80;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .nba-label {
            font-size: 9px;
            font-weight: 400;
            color: #86efac;
            letter-spacing: 1.5px;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 14px 0;
        }

        .team {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.2));
        }

        .team-abbr {
            font-size: 14px;
            font-weight: 500;
            color: #bbf7d0;
        }

        .score {
            font-size: 28px;
            font-weight: 600;
            color: #f0fdf4;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        .game-status {
            font-size: 12px;
            color: #86efac;
            font-weight: 400;
            margin-top: 10px;
            margin-bottom: 0;
            letter-spacing: 1.5px;
            text-align: center;
        }

        /* MVP Section */
        .mvp-container {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(74, 222, 128, 0.2);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.5s ease-in-out;
        }

        .mvp-container.show {
            max-height: 100px;
            opacity: 1;
        }

        .mvp {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .mvp-image {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid rgba(74, 222, 128, 0.3);
            object-fit: cover;
        }

        .mvp-info {
            flex: 1;
        }

        .mvp-label {
            font-size: 8px;
            font-weight: 400;
            color: #86efac;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .mvp-name {
            font-size: 13px;
            font-weight: 600;
            color: #f0fdf4;
            margin-bottom: 5px;
        }

        .mvp-stats {
            display: flex;
            gap: 10px;
            font-size: 10px;
        }

        .stat {
            color: #bbf7d0;
        }

        .stat-value {
            font-weight: 600;
            color: #f0fdf4;
            margin-right: 2px;
            font-size: 11px;
        }

        .stat-label {
            font-weight: 400;
            color: #86efac;
        }
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../game.mp4" type="video/mp4">
    </video>

    <!-- Channel Branding - TOP LEFT -->
    <div class="channel-branding">
        <span class="branding-text">Silent Basketball</span>
        <span class="asmr-badge">ASMR</span>
    </div>

    <!-- Game Stats - BOTTOM LEFT -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Lakers">
                    <div class="team-abbr">LAL</div>
                </div>
                <div class="score">82</div>
            </div>
            
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Warriors">
                    <div class="team-abbr">GSW</div>
                </div>
                <div class="score">78</div>
            </div>
        </div>
        
        <div class="game-status">Q3 · 8:32</div>
        
        <div class="mvp-container" id="mvp-container">
            <div class="mvp">
                <img class="mvp-image" src="https://a.espncdn.com/i/headshots/nba/players/full/1966.png" alt="LeBron James">
                <div class="mvp-info">
                    <div class="mvp-label">MVP</div>
                    <div class="mvp-name">LeBron</div>
                    <div class="mvp-stats">
                        <div class="stat">
                            <span class="stat-value">28</span>
                            <span class="stat-label">PTS</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">8</span>
                            <span class="stat-label">REB</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">11</span>
                            <span class="stat-label">AST</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mvpContainer = document.getElementById('mvp-container');
        
        function toggleMVP() {
            mvpContainer.classList.add('show');
            
            setTimeout(() => {
                mvpContainer.classList.remove('show');
                setTimeout(toggleMVP, 30000);
            }, 5000);
        }
        
        setTimeout(toggleMVP, 10000);
    </script>
</body>
</html>
