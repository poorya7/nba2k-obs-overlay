<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR Basketball Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #gameplay-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Channel Branding - TOP LEFT */
        .channel-branding {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .main-text {
            font-family: 'Russo One', sans-serif;
            font-size: 31px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.7),
                         0 2px 4px rgba(0, 0, 0, 0.6);
            opacity: 0.22;
        }

        .sub-text {
            font-family: 'Russo One', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 5px;
            margin-top: 3px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7);
            opacity: 0.154;
        }

        /* Game Stats - BOTTOM LEFT - Blue Neon Theme */
        .game-stats {
            position: fixed;
            bottom: 260px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 16px;
            width: 175px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.4);
            opacity: 0.7;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-text {
            font-size: 11px;
            font-weight: 600;
            color: #60a5fa;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .nba-label {
            font-size: 9px;
            font-weight: 400;
            color: #93c5fd;
            letter-spacing: 1.5px;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 10px 0 8px 0;
        }

        .team {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-logo {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }

        .team-abbr {
            font-size: 14px;
            font-weight: 500;
            color: #bfdbfe;
        }

        .score {
            font-size: 16px;
            font-weight: 600;
            color: #dbeafe;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .game-status {
            font-size: 13px;
            color: #86efac;
            font-weight: 400;
            margin-top: 8px;
            margin-bottom: 0;
            letter-spacing: 1.5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../game.mp4" type="video/mp4">
    </video>

    <!-- Channel Branding - TOP LEFT -->
    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <!-- Game Stats - BOTTOM LEFT -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Lakers">
                    <div class="team-abbr">LAL</div>
                </div>
                <div class="score">82</div>
            </div>
            
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Warriors">
                    <div class="team-abbr">GSW</div>
                </div>
                <div class="score">78</div>
            </div>
        </div>
        
        <div class="game-status">Q3 · 8:32</div>
    </div>
</body>
</html>
