<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Overlay - Test Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Test controls styling */
        .test-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #4CAF50;
            max-width: 350px;
            color: white;
            font-family: 'Inter', monospace;
        }

        .test-controls h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #4CAF50;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #2196F3;
        }

        button.secondary:hover {
            background: #0b7dda;
        }

        input[type="number"] {
            width: 70px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }

        .score-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .console-log {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 10px;
            max-height: 120px;
            overflow-y: auto;
            color: #4CAF50;
        }

        /* Animation Styles */
        .score.anim-nba {
            animation: nbaScore 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes nbaScore {
            0% { 
                transform: scale(1);
                color: #dbeafe;
            }
            40% { 
                transform: scale(1.5);
                color: #fbbf24;
                text-shadow: 0 0 25px #fbbf24;
            }
            100% { 
                transform: scale(1);
                color: #dbeafe;
            }
        }

        .score.anim-bounce {
            animation: bounceScore 0.6s ease;
        }

        @keyframes bounceScore {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-15px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(-8px); }
        }

        .score.anim-flash {
            animation: flashScore 0.4s ease;
        }

        @keyframes flashScore {
            0%, 100% { 
                opacity: 1;
                color: #dbeafe;
            }
            50% { 
                opacity: 0.3;
                color: #ffffff;
            }
        }

        .score.anim-pop {
            animation: popScore 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popScore {
            0% { 
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% { 
                transform: scale(1.3);
            }
            100% { 
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Old score slides out (up) - Slot reel style */
        .anim-slide-out {
            animation: slideOut 0.35s linear forwards;
        }

        @keyframes slideOut {
            0% { 
                transform: translateY(0);
                opacity: 1;
            }
            100% { 
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        /* New score slides in (from bottom) - Slot reel style */
        .score.anim-slide-in {
            animation: slideIn 0.3s linear forwards;
            animation-delay: 0.08s;
            opacity: 0; /* Hidden until animation starts */
        }

        @keyframes slideIn {
            0% { 
                transform: translateY(20px);
                opacity: 0;
            }
            1% {
                opacity: 1;
            }
            100% { 
                transform: translateY(0);
                opacity: 1;
            }
        }

        .score.anim-shake {
            animation: shakeScore 0.5s ease;
        }

        @keyframes shakeScore {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .score.anim-highlight {
            animation: highlightScore 0.8s ease;
        }

        @keyframes highlightScore {
            0%, 100% {
                background: transparent;
                color: #dbeafe;
            }
            50% {
                background: rgba(251, 191, 36, 0.3);
                color: #fbbf24;
                padding: 4px 8px;
                border-radius: 6px;
            }
        }
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../../game.mp4" type="video/mp4">
    </video>

    <!-- Channel Branding -->
    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <!-- Game Stats Overlay -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <div class="team" data-team="home">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="" alt="Home Team">
                    <div class="team-abbr" data-abbr="home">---</div>
                </div>
                <div class="score" data-score="home">0</div>
            </div>
            
            <div class="team" data-team="away">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="" alt="Away Team">
                    <div class="team-abbr" data-abbr="away">---</div>
                </div>
                <div class="score" data-score="away">0</div>
            </div>
        </div>
        
        <div class="game-status" data-status>Q1 · 12:00</div>
    </div>

    <!-- Test Controls -->
    <div class="test-controls">
        <h2>🎮 Test Controls</h2>

        <div class="control-group">
            <label>Test Score Animations</label>
            <div style="margin-bottom: 10px; font-size: 10px; color: rgba(255,255,255,0.5);">
                Click to see animation on HOME score (LAL)
            </div>
            <div class="button-group">
                <button onclick="testAnimation('glow')">Glow Pulse</button>
                <button onclick="testAnimation('nba')">NBA Style</button>
                <button onclick="testAnimation('bounce')">Bounce</button>
            </div>
            <div class="button-group" style="margin-top: 8px;">
                <button onclick="testAnimation('flash')">Flash</button>
                <button onclick="testAnimation('pop')">Pop</button>
                <button onclick="testAnimation('slide')">Slide</button>
            </div>
            <div class="button-group" style="margin-top: 8px;">
                <button onclick="testAnimation('shake')">Shake</button>
                <button onclick="testAnimation('highlight')">Highlight</button>
                <button onclick="testAnimation('none')">No Animation</button>
            </div>
        </div>

        <div class="control-group">
            <label>Current Animation</label>
            <div style="padding: 8px; background: rgba(76, 175, 80, 0.2); border-radius: 6px; text-align: center; font-weight: 600; color: #4CAF50;">
                <span id="currentAnim">glow</span>
            </div>
        </div>

        <div class="console-log" id="log">
            Ready to test...
        </div>
    </div>

    <script>
        /**
         * GameView - Handles all DOM updates for the game stats overlay
         */
        class GameView {
            constructor() {
                this.elements = {
                    homeAbbr: document.querySelector('[data-abbr="home"]'),
                    awayAbbr: document.querySelector('[data-abbr="away"]'),
                    homeLogo: document.querySelector('[data-logo="home"]'),
                    awayLogo: document.querySelector('[data-logo="away"]'),
                    homeScore: document.querySelector('[data-score="home"]'),
                    awayScore: document.querySelector('[data-score="away"]'),
                    gameStatus: document.querySelector('[data-status]')
                };
            }

            updateTeam(team, abbr, logoUrl) {
                if (team !== 'home' && team !== 'away') {
                    console.error('Invalid team. Must be "home" or "away"');
                    return;
                }
                const abbrElement = this.elements[`${team}Abbr`];
                const logoElement = this.elements[`${team}Logo`];
                if (abbrElement) abbrElement.textContent = abbr;
                if (logoElement) {
                    logoElement.src = logoUrl;
                    logoElement.alt = abbr;
                }
            }

            updateScore(team, newScore, animate = false, animType = null) {
                if (team !== 'home' && team !== 'away') {
                    console.error('Invalid team. Must be "home" or "away"');
                    return;
                }
                const scoreElement = this.elements[`${team}Score`];
                if (!scoreElement) return;
                const oldScore = parseInt(scoreElement.textContent) || 0;
                const shouldAnimate = animate && newScore > oldScore;
                scoreElement.textContent = newScore;
                if (shouldAnimate) {
                    const anim = animType || window.currentAnimType || 'glow';
                    this.playScoreAnimation(scoreElement, anim);
                }
            }

            playScoreAnimation(element, animType) {
                animType = animType || 'glow';
                
                // Remove all animation classes
                element.classList.remove('anim-glow', 'anim-nba', 'anim-bounce', 'anim-flash', 'anim-pop', 'anim-slide-in', 'anim-shake', 'anim-highlight');
                
                if (animType === 'none') return;
                
                // Force reflow
                void element.offsetWidth;
                
                // Add the selected animation
                element.classList.add('anim-' + animType);
                
                // Remove after animation completes
                const duration = animType === 'highlight' ? 800 : 600;
                setTimeout(function() {
                    element.classList.remove('anim-' + animType);
                }, duration);
            }

            playScoreAnimationWithValue(element, animType, newValue) {
                if (animType !== 'slide') {
                    element.textContent = newValue;
                    this.playScoreAnimation(element, animType);
                    return;
                }

                // Special handling for slide animation
                const rect = element.getBoundingClientRect();
                
                // Create clone for old score sliding out
                const clone = element.cloneNode(true);
                clone.style.position = 'absolute';
                clone.style.left = rect.left + 'px';
                clone.style.top = rect.top + 'px';
                clone.style.width = rect.width + 'px';
                clone.style.height = rect.height + 'px';
                clone.style.textAlign = 'right';
                clone.style.margin = '0';
                clone.style.zIndex = '1000';
                clone.classList.add('anim-slide-out');
                document.body.appendChild(clone);
                
                // Update element with new score and animate it in
                element.textContent = newValue;
                element.classList.add('anim-slide-in');
                
                // Clean up after animations complete (0.08s delay + 0.3s animation)
                setTimeout(function() {
                    if (clone.parentNode) {
                        document.body.removeChild(clone);
                    }
                    element.classList.remove('anim-slide-in');
                    element.style.opacity = ''; // Reset opacity
                }, 400);
            }

            updateGameStatus(quarter, time) {
                if (this.elements.gameStatus) {
                    this.elements.gameStatus.textContent = `${quarter} · ${time}`;
                }
            }

            updateBothTeams(homeTeam, awayTeam) {
                this.updateTeam('home', homeTeam.abbr, homeTeam.logoUrl);
                this.updateTeam('away', awayTeam.abbr, awayTeam.logoUrl);
            }

            updateAll(gameData) {
                const { home, away, quarter, time } = gameData;
                if (home) {
                    if (home.abbr !== undefined && home.logoUrl !== undefined) {
                        this.updateTeam('home', home.abbr, home.logoUrl);
                    }
                    if (home.score !== undefined) {
                        this.updateScore('home', home.score, home.animate);
                    }
                }
                if (away) {
                    if (away.abbr !== undefined && away.logoUrl !== undefined) {
                        this.updateTeam('away', away.abbr, away.logoUrl);
                    }
                    if (away.score !== undefined) {
                        this.updateScore('away', away.score, away.animate);
                    }
                }
                if (quarter !== undefined && time !== undefined) {
                    this.updateGameStatus(quarter, time);
                }
            }

            reset() {
                this.updateTeam('home', '---', '');
                this.updateTeam('away', '---', '');
                this.updateScore('home', 0);
                this.updateScore('away', 0);
                this.updateGameStatus('Q1', '12:00');
            }
        }
        
        // Make gameView globally available for button handlers
        window.gameView = new GameView();

        // Global variable to track current animation type
        window.currentAnimType = 'glow';

        // Test animation function
        window.testAnimation = function(animType) {
            window.currentAnimType = animType;
            
            // Update the display
            document.getElementById('currentAnim').textContent = animType;
            
            // Get current score and increment it
            const scoreElement = document.querySelector('[data-score="home"]');
            const currentScore = parseInt(scoreElement.textContent);
            const newScore = currentScore + 2;
            
            // For slide animation, DON'T update yet - animation will handle it
            if (animType === 'slide') {
                window.gameView.playScoreAnimationWithValue(scoreElement, animType, newScore);
            } else {
                // For other animations, update score then animate
                scoreElement.textContent = newScore;
                window.gameView.playScoreAnimation(scoreElement, animType);
            }
            
            log('Testing: ' + animType + ' animation (+2 points)');
        };

        window.log = function(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML = '[' + timestamp + '] ' + message + '<br>' + logDiv.innerHTML;
        };

        // Auto-load demo data on start
        setTimeout(function() {
            window.gameView.updateAll({
                home: {
                    abbr: 'LAL',
                    logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png',
                    score: 98
                },
                away: {
                    abbr: 'GSW',
                    logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/gsw.png',
                    score: 95
                },
                quarter: 'Q3',
                time: '7:23'
            });
            log('🎮 Animation Test Page Ready!');
            log('Click any animation to test it on the HOME score');
        }, 100);
    </script>
</body>
</html>
