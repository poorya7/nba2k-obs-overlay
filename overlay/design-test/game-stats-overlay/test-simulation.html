<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Simulation Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 12px;
            min-width: 250px;
        }

        .controls h3 {
            color: #60a5fa;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .controls button:hover {
            background: rgba(59, 130, 246, 0.4);
            color: #dbeafe;
        }

        .controls button.active {
            background: rgba(134, 239, 172, 0.3);
            color: #86efac;
            border-color: #86efac;
        }

        .sim-info {
            color: #93c5fd;
            font-size: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.6;
            font-variant-numeric: tabular-nums;
        }

        .sim-info .label {
            color: #60a5fa;
            font-weight: 600;
        }

        .speed-control {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .speed-control button {
            flex: 1;
            padding: 6px;
            font-size: 11px;
        }

        .speed-control button.active {
            background: rgba(59, 130, 246, 0.6);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../../game.mp4" type="video/mp4">
    </video>

    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Upcoming</span>
            <span class="nba-label">NBA</span>
        </div>

        <div class="teams">
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Lakers">
                    <div class="team-abbr" data-abbr="home">LAL</div>
                </div>
                <div class="score" data-score="home">0</div>
            </div>
            
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Warriors">
                    <div class="team-abbr" data-abbr="away">GSW</div>
                </div>
                <div class="score" data-score="away">0</div>
            </div>
        </div>

        <div class="game-status" data-status>Q1 · 12:00</div>
    </div>

    <div class="controls">
        <h3>Game Simulation</h3>
        
        <button id="btn-start" class="active">▶ Start Simulation</button>
        <button id="btn-pause">⏸ Pause</button>
        <button id="btn-reset">↻ Reset</button>

        <div class="sim-info">
            <div><span class="label">State:</span> <span id="info-state">Pre-Game</span></div>
            <div><span class="label">Time:</span> <span id="info-time">--:--</span></div>
            <div><span class="label">Speed:</span> <span id="info-speed">10x</span></div>
        </div>

        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
            <div style="color: #60a5fa; font-size: 11px; margin-bottom: 8px; font-weight: 600;">SIMULATION SPEED</div>
            <div class="speed-control">
                <button class="speed-btn" data-speed="1">1x</button>
                <button class="speed-btn" data-speed="5">5x</button>
                <button class="speed-btn active" data-speed="10">10x</button>
                <button class="speed-btn" data-speed="20">20x</button>
                <button class="speed-btn" data-speed="50">50x</button>
            </div>
        </div>
    </div>

    <script src="game-view.js"></script>
    <script>
        const gameView = new GameView();
        const sampleData = {
            homeTeam: { abbr: 'LAL', logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png' },
            awayTeam: { abbr: 'GSW', logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/gsw.png' }
        };

        // Simulation state
        let isRunning = false;
        let isPaused = false;
        let simulationSpeed = 10; // 10x real-time
        let currentPhase = 'pregame'; // pregame, q1, q2, halftime, q3, q4, final
        let timeRemaining = 0; // in seconds
        let homeScore = 0;
        let awayScore = 0;
        let pregameCountdown = 10; // Start with 10 seconds for testing
        let intervalId = null;
        let pendingTimeouts = []; // Track all pending timeouts
        let isTransitioning = false; // Prevent overlapping transitions

        // Update info display
        function updateInfo() {
            document.getElementById('info-state').textContent = currentPhase.toUpperCase();
            if (currentPhase === 'pregame') {
                document.getElementById('info-time').textContent = formatCountdown(pregameCountdown);
            } else if (currentPhase === 'halftime') {
                document.getElementById('info-time').textContent = 'Halftime';
            } else if (currentPhase === 'final') {
                document.getElementById('info-time').textContent = 'Final';
            } else {
                document.getElementById('info-time').textContent = formatGameTime(timeRemaining);
            }
            document.getElementById('info-speed').textContent = simulationSpeed + 'x';
        }

        // Format countdown (HH:MM:SS)
        function formatCountdown(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Format game time (M:SS)
        function formatGameTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        // Get quarter name
        function getQuarterName(phase) {
            const map = { q1: 'Q1', q2: 'Q2', q3: 'Q3', q4: 'Q4' };
            return map[phase] || 'Q1';
        }

        // Randomly update score (realistic increments)
        function updateScores() {
            // Random chance to score (about every 20 seconds of game time)
            if (Math.random() < 0.05) {
                const scoringTeam = Math.random() < 0.5 ? 'home' : 'away';
                const points = Math.random() < 0.7 ? 2 : 3; // 70% two-pointers, 30% three-pointers
                
                if (scoringTeam === 'home') {
                    homeScore += points;
                } else {
                    awayScore += points;
                }
                
                return { team: scoringTeam, newScore: scoringTeam === 'home' ? homeScore : awayScore };
            }
            return null;
        }

        // Main simulation loop
        async function simulationTick() {
            if (!isRunning || isPaused || isTransitioning) return;

            if (currentPhase === 'pregame') {
                pregameCountdown--;
                
                // Directly update countdown element (no need to re-transition)
                const countdownElement = document.querySelector('.countdown-time');
                if (countdownElement) {
                    countdownElement.textContent = formatCountdown(pregameCountdown);
                }

                if (pregameCountdown <= 0) {
                    isTransitioning = true;
                    
                    // Stay on 00:00:00 for half a second before transitioning
                    const timeoutId = setTimeout(async () => {
                        if (!isRunning || isPaused) {
                            isTransitioning = false;
                            return;
                        }
                        
                        // Start Q1
                        currentPhase = 'q1';
                        timeRemaining = 720; // 12 minutes = 720 seconds
                        homeScore = 0;
                        awayScore = 0;
                        await gameView.transitionToState('live', {
                            home: { ...sampleData.homeTeam, score: homeScore },
                            away: { ...sampleData.awayTeam, score: awayScore },
                            quarter: 'Q1',
                            time: formatGameTime(timeRemaining)
                        });
                        isTransitioning = false;
                    }, 500);
                    pendingTimeouts.push(timeoutId);
                }
            } else if (currentPhase === 'halftime') {
                isTransitioning = true;
                
                // Halftime lasts 5 seconds (simulated)
                const timeoutId = setTimeout(async () => {
                    if (!isRunning || isPaused) {
                        isTransitioning = false;
                        return;
                    }
                    currentPhase = 'q3';
                    timeRemaining = 720;
                    await gameView.transitionToState('live', {
                        home: { ...sampleData.homeTeam, score: homeScore },
                        away: { ...sampleData.awayTeam, score: awayScore },
                        quarter: 'Q3',
                        time: formatGameTime(timeRemaining)
                    });
                    isTransitioning = false;
                }, 5000 / simulationSpeed);
                pendingTimeouts.push(timeoutId);
            } else if (currentPhase === 'final') {
                // Stay on final screen
                return;
            } else {
                // Active quarter (q1, q2, q3, q4)
                timeRemaining--;
                
                // Check for score updates
                const scoreUpdate = updateScores();
                if (scoreUpdate) {
                    gameView.updateScore(scoreUpdate.team, scoreUpdate.newScore, true);
                }

                // Update game status
                gameView.updateGameStatus(getQuarterName(currentPhase), formatGameTime(timeRemaining));

                // Check for quarter end
                if (timeRemaining <= 0 && !isTransitioning) {
                    isTransitioning = true;
                    
                    if (currentPhase === 'q1') {
                        currentPhase = 'q2';
                        timeRemaining = 720;
                        await gameView.transitionToState('live', {
                            home: { ...sampleData.homeTeam, score: homeScore },
                            away: { ...sampleData.awayTeam, score: awayScore },
                            quarter: 'Q2',
                            time: formatGameTime(timeRemaining)
                        });
                    } else if (currentPhase === 'q2') {
                        currentPhase = 'halftime';
                        await gameView.transitionToState('halftime', {
                            home: { ...sampleData.homeTeam, score: homeScore },
                            away: { ...sampleData.awayTeam, score: awayScore }
                        });
                    } else if (currentPhase === 'q3') {
                        currentPhase = 'q4';
                        timeRemaining = 720;
                        await gameView.transitionToState('live', {
                            home: { ...sampleData.homeTeam, score: homeScore },
                            away: { ...sampleData.awayTeam, score: awayScore },
                            quarter: 'Q4',
                            time: formatGameTime(timeRemaining)
                        });
                    } else if (currentPhase === 'q4') {
                        currentPhase = 'final';
                        await gameView.transitionToState('final', {
                            home: { ...sampleData.homeTeam, score: homeScore },
                            away: { ...sampleData.awayTeam, score: awayScore }
                        });
                    }
                    
                    isTransitioning = false;
                }
            }

            updateInfo();
        }

        // Start simulation
        function startSimulation() {
            if (isRunning) return;
            isRunning = true;
            isPaused = false;
            document.getElementById('btn-start').classList.add('active');
            document.getElementById('btn-pause').classList.remove('active');
            
            intervalId = setInterval(simulationTick, 1000 / simulationSpeed);
        }

        // Pause simulation
        function pauseSimulation() {
            isPaused = !isPaused;
            document.getElementById('btn-pause').classList.toggle('active');
        }

        // Reset simulation
        async function resetSimulation() {
            isRunning = false;
            isPaused = false;
            clearInterval(intervalId);
            
            currentPhase = 'pregame';
            pregameCountdown = 10;
            homeScore = 0;
            awayScore = 0;
            timeRemaining = 0;

            document.getElementById('btn-start').classList.remove('active');
            document.getElementById('btn-pause').classList.remove('active');

            await gameView.transitionToState('pregame', {
                homeTeam: sampleData.homeTeam,
                awayTeam: sampleData.awayTeam,
                countdown: formatCountdown(pregameCountdown)
            });

            updateInfo();
        }

        // Speed controls
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                simulationSpeed = parseInt(btn.dataset.speed);
                
                if (isRunning) {
                    clearInterval(intervalId);
                    intervalId = setInterval(simulationTick, 1000 / simulationSpeed);
                }
                
                updateInfo();
            });
        });

        // Button handlers
        document.getElementById('btn-start').addEventListener('click', startSimulation);
        document.getElementById('btn-pause').addEventListener('click', pauseSimulation);
        document.getElementById('btn-reset').addEventListener('click', resetSimulation);

        // Initialize
        resetSimulation();
    </script>
</body>
</html>
