<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Game State Mockup</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .countdown-label {
            font-size: 10px;
            font-weight: 500;
            color: #93c5fd;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 3px;
        }

        .countdown-time {
            font-size: 24px;
            font-weight: 700;
            color: #dbeafe;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            margin-bottom: 10px;
        }

        .matchup-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .preview-logo {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }

        .vs-text {
            font-size: 11px;
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../../game.mp4" type="video/mp4">
    </video>

    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Upcoming</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="matchup-preview">
            <img class="preview-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Lakers">
            <span class="vs-text">vs</span>
            <img class="preview-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Warriors">
        </div>
        
        <div class="countdown-label">Game Starts In</div>
        <div class="countdown-time">02:15:34</div>
    </div>
</body>
</html>
