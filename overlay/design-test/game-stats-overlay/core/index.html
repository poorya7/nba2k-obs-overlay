<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Game Stats Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Game Stats Overlay - OBS Browser Source Ready -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <!-- Home Team -->
            <div class="team" data-team="home">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="" alt="Home Team">
                    <div class="team-abbr" data-abbr="home">---</div>
                </div>
                <div class="score" data-score="home">0</div>
            </div>
            
            <!-- Away Team -->
            <div class="team" data-team="away">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="" alt="Away Team">
                    <div class="team-abbr" data-abbr="away">---</div>
                </div>
                <div class="score" data-score="away">0</div>
            </div>
        </div>
        
        <div class="game-status" data-status>Q1 · 12:00</div>
    </div>

    <!-- Game View Controller -->
    <script src="game-view.js"></script>
    <script>
        // Initialize GameView
        const gameView = new GameView();
        
        // Example: Initialize with demo data (remove this in production)
        gameView.transitionToState('live', {
            home: {
                abbr: 'LAL',
                logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png',
                score: 82
            },
            away: {
                abbr: 'GSW',
                logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/gsw.png',
                score: 78
            },
            quarter: 'Q3',
            time: '8:32'
        });

        // Make gameView globally available for API integration
        window.gameView = gameView;
        
        // TODO: Replace demo data with real NBA API integration
        // Example:
        // async function updateFromAPI() {
        //     const response = await fetch('/api/selected-game');
        //     const { gameId } = await response.json();
        //     const game = await window.NBAApi.getGameById(gameId);
        //     gameView.transitionToState(game.state, game.data);
        // }
        // setInterval(updateFromAPI, 10000);
    </script>
</body>
</html>
