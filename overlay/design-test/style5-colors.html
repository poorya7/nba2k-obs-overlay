  <meta charset="UTF-8">

  <title>Style 5 - Color Variations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}

.page-header {
  text-align: center;
  padding: 30px 20px;
  background: rgba(0, 0, 0, 0.9);
}

.page-header h1 {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 8px;
}

.page-header p {
  color: #999;
  font-size: 14px;
}

.variations-container {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.variation-section {
  position: relative;
  width: 100%;
  height: 100vh;
  background-image: url('../../game-stream.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 40px;
}

.variation-label {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(0, 0, 0, 0.8);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  border: 1px solid rgba(255, 255, 255, 0.3);
}

/* ===== BASE STYLE ===== */
.overlay-pill .pill {
  backdrop-filter: blur(10px);
  border-radius: 50px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.overlay-pill .team {
  display: flex;
  align-items: center;
  gap: 6px;
}

.overlay-pill .logo {
  width: 22px;
  height: 22px;
  border-radius: 50%;
}

.overlay-pill .score {
  font-size: 20px;
  font-weight: 900;
  font-family: 'Poppins', sans-serif;
}

.overlay-pill .vs {
  font-size: 11px;
  font-weight: 700;
}

.overlay-pill .status-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 900;
}

.overlay-pill .time-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
}

  background: rgba(0, 0, 0, 0.7);
}

.color-1 .score {

}

.color-1 .vs {
  color: #666;
}

.color-1 .status-pill {
  background: rgba(255, 71, 87, 0.3);
  color: #ff4757;
}

.color-1 .time-pill {
  background: rgba(0, 150, 136, 0.25);
  color: #26A69A;
}

.color-1 .variation-label {
  color: #4CAF50;
  border-color: rgba(76, 175, 80, 0.4);

/* ===== VARIATION 11: NEON GLOW ===== */
.color-11 .pill {
  background: rgba(0, 0, 0, 0.8);
  box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
  position: relative;
  border: 1px solid rgba(0, 217, 255, 0.3);
}

.color-11 .pill::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00d9ff, transparent);
  animation: glow-slide 2s infinite;
}

@keyframes glow-slide {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.color-11 .score {
  color: #00d9ff;
  text-shadow: 0 0 15px rgba(0, 217, 255, 0.7);
}

.color-11 .vs {

}

.color-11 .status-pill {
