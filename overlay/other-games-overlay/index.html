    <!-- Other Games Overlay Only -->
    <div class="other-games-overlay" id="other-games">

    <script src="other-games-view.js"></script>
    <script src="other-games-controller.js"></script>
    <script>
        // Initialize API Client
        const api = new ApiClient();
        
        // Initialize view
        const otherGamesView = new OtherGamesView();
        let otherGamesController = null;
        
        // Track if overlay should be visible
        let overlayVisible = false;
        let lastQuarterStartTime = null;
        let hasShownForCurrentQuarter = false; // Track if we've already shown overlay for this quarter
        
        // Test delay: 5 seconds (change to 120000 for production = 2 minutes)
        const SHOW_DELAY_MS = 5000;
        
        /**
         * Show overlay with fade-in animation
         */
        function showOverlay() {
            const overlay = document.querySelector('.other-games-overlay');
            if (!overlay || overlayVisible) return;
            
            // Set to display block but transparent
            overlay.style.display = 'block';
            overlay.style.opacity = '0';
            
            // Force reflow
            void overlay.offsetWidth;
            
            // Fade in
            overlay.style.transition = 'opacity 0.3s ease-in';
            overlay.style.opacity = '1';
            
            overlayVisible = true;
        }
        
        /**
         * Hide overlay with fade-out animation
         */
        function hideOverlay() {
            const overlay = document.querySelector('.other-games-overlay');
            if (!overlay || !overlayVisible) return;
            
            // Fade out
            overlay.style.transition = 'opacity 0.3s ease-out';
            overlay.style.opacity = '0';
            
            // After fade completes, set display none
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
            
            overlayVisible = false;
            if (otherGamesController) {
                otherGamesController.stopCycle();
                otherGamesController.stopCountdown();
            }
        }
        
        /**
         * Fetch and update other games data
         */
        async function updateFromAPI() {
            try {
                // Get selected game ID
                const selectionData = await api.getSelectedGame();
                const selectedGameId = selectionData ? selectionData.gameId : null;
                
                // Get quarter timing
                const quarterData = await api.getQuarter();
                
                // Determine if overlay should be visible
                const shouldShow = shouldShowOverlay(quarterData);
                
                // If overlay is already showing, let it finish cycling - don't interrupt it
                if (overlayVisible) {
                    // Just update countdown data
                    if (otherGamesController) {
                        otherGamesController.games = otherGamesController.sortGames(formattedGames);
                    }
                    return;
                }
                
                if (!shouldShow) {
                    return; // Not time to show yet
                }
                
                // Fetch all today's games
                const allGames = await NBAApi.getTodaysGames();
                
                // Filter out the selected game
                const otherGames = allGames.filter(game => game.id !== selectedGameId);
                
                if (otherGames.length === 0) {
                    return; // No other games to show
                }
                
                // Transform API data to view format
                const formattedGames = otherGames.map(game => transformGameData(game));
                
                // Show overlay (we only reach here if !overlayVisible and shouldShow is true)
                showOverlay();
                hasShownForCurrentQuarter = true; // Mark as shown for this quarter
                // Create new controller with completion callback
                otherGamesController = new OtherGamesController(otherGamesView, hideOverlay);
                otherGamesController.init(formattedGames);
                
            } catch (error) {
                // Silently handle errors
            }
        }
        
        /**
         * Check if overlay should be shown based on quarter timing
         */
        function shouldShowOverlay(quarterData) {
            if (!quarterData || !quarterData.current || !quarterData.startTime) {
                hasShownForCurrentQuarter = false;
                return false;
            }
            
            const timeSinceQuarterStart = Date.now() - quarterData.startTime;
            
            // Track quarter changes - reset flag when quarter changes
            if (quarterData.startTime !== lastQuarterStartTime) {
                lastQuarterStartTime = quarterData.startTime;
                hasShownForCurrentQuarter = false; // Reset for new quarter
            }
            
            // Don't show if we've already shown it for this quarter
            if (hasShownForCurrentQuarter) {
                return false;
            }
            
            // Show overlay if enough time has passed since quarter start
            return timeSinceQuarterStart >= SHOW_DELAY_MS;
        }
        
        /**
         * Transform ESPN API game data to view format
         */
        function transformGameData(game) {
            // Use shared utility to determine state
            const state = detectGameState(game);
            
            const baseGame = {
                state: state,
                away: {
                    logo: game.awayTeam.logo,
                    abbr: game.awayTeam.abbreviation,
                    score: parseInt(game.awayTeam.score) || 0
                },
                home: {
                    logo: game.homeTeam.logo,
                    abbr: game.homeTeam.abbreviation,
                    score: parseInt(game.homeTeam.score) || 0
                }
            };
            
            if (state === 'pregame') {
                // Use shared utility for countdown calculation
                baseGame.secondsUntilStart = calculateSecondsUntilStart(game.date);
            } else if (state === 'live') {
                // Use shared utility for formatting live status
                baseGame.quarter = formatLiveGameStatus(game.statusText).formatted;
            } else if (state === 'halftime') {
                // Halftime shows as text
                baseGame.quarter = 'Halftime';
            } else if (state === 'final') {
                baseGame.status = 'FINAL';
            }
            
            return baseGame;
        }
        
        // Start polling for updates
        updateFromAPI();
        setInterval(updateFromAPI, 5000);  // Poll every 5 seconds
