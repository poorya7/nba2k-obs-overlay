<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Games Overlay</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }
    </style>
</head>
<body>
    <!-- Other Games Overlay Only -->
    <div class="other-games-overlay" id="other-games">
        <div class="other-game-card">
            <div id="games-container">
                <!-- Games will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- NBA API utilities -->
    <script src="../_shared/config.js"></script>
    <script src="../_shared/nbaApi.js"></script>
    <script src="../_shared/gameUtils.js"></script>
    <script src="../_shared/apiClient.js"></script>
    
    <!-- Core Controllers (Refactored modular architecture) -->
    <script src="state-manager.js"></script>
    <script src="simulation-manager.js"></script>
    <script src="other-games-view.js"></script>
    <script src="other-games-controller.js"></script>
    <script src="app-controller.js"></script>
    
    <script>
        // ==================== CLEAN INITIALIZATION ====================
        // All business logic extracted into modular classes
        
        // Initialize dependencies
        const api = new ApiClient();
        const nbaApi = window.NBAApi;
        const view = new OtherGamesView();
        const stateManager = new StateManager();
        const simulationManager = new SimulationManager();
        
        // Initialize main app controller with all dependencies
        const appController = new AppController({
            api,
            nbaApi,
            view,
            stateManager,
            simulationManager
        });
        
        // Start the overlay when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            appController.start();
        });
        
        // Expose for debugging/testing
        window.appController = appController;
        window.simulationManager = simulationManager;
        
        /* OLD CODE REMOVED - Now in modular classes:
         * - showOverlay() → AppController
         * - hideOverlay() → AppController
         * - updateFromAPI() → AppController
         * - shouldShowOverlay() → AppController
         * - transformGameData() → AppController
         * - sampleGames → SimulationManager
         * - All state variables → StateManager
         */
    </script>
</body>
</html>
