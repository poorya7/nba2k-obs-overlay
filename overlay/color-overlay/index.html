<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            min-width: 100vw;
            min-height: 100vh;
            background: transparent;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            pointer-events: none; /* Body is non-interactive */
        }

        /* Color overlay that covers the entire screen */
        #color-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0);
            pointer-events: none; /* Allow clicks to pass through */
            z-index: 1; /* Low z-index so it's below other overlays */
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Color overlay layer (low z-index, only affects video) -->
    <div id="color-overlay"></div>

    <script>
        // Expose update function to parent/controls
        window.updateColorOverlay = function(color, opacity) {
            const colorOverlay = document.getElementById('color-overlay');
            if (colorOverlay) {
                const opacityValue = opacity / 100;
                const rgb = hexToRgb(color);
                if (rgb) {
                    colorOverlay.style.backgroundColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacityValue})`;
                }
            }
        };

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // Load saved settings on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedColor = localStorage.getItem('colorOverlayColor') || '#000000';
            const savedOpacity = parseInt(localStorage.getItem('colorOverlayOpacity') || '0');
            if (window.updateColorOverlay) {
                window.updateColorOverlay(savedColor, savedOpacity);
            }
        });
    </script>
</body>
</html>
