<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay Style Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        /* Video container - uses viewport units so it doesn't scale with zoom */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

        /* Video gameplay background - fixed size, doesn't scale with zoom */
        .gameplay-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ========================================
           TITLE OVERLAY (Top Left) - Static
           ======================================== */
        .title-overlay {
            position: fixed;
            top: 26px;
            left: 26px;
            z-index: 10;
        }

        .title-main {
            font-family: 'Russo One', sans-serif;
            font-size: 41.5px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 2.5px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.7),
                         0 2px 4px rgba(0, 0, 0, 0.6);
            opacity: 0.22;
        }

        .title-sub {
            font-family: 'Russo One', sans-serif;
            font-size: 22.3px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 8.5px;
            margin-top: 3px;
            margin-left: 8px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7);
            opacity: 0.24;
        }

        /* ========================================
           NBA GAME OVERLAY (Left Side) - Static
           ======================================== */
        .nba-overlay {
            position: fixed;
            left: 20px;
            top: 370px;
            z-index: 10;
            background: rgba(10, 20, 40, 1.0);
            backdrop-filter: blur(10px);
            padding: 13px 15.5px 18px 15.5px;
            border-radius: 16px;
            width: 190px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34);
            border: 1px solid rgba(59, 130, 246, 0.55);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 17px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-text {
            font-size: 16.5px;
            font-weight: 600;
            color: #60a5fa;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .nba-label {
            font-size: 13px;
            font-weight: 400;
            color: #93c5fd;
            letter-spacing: 1.5px;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin: 13px 0 11px 0;
        }

        .team {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }

        .team-abbr {
            font-size: 16.26px;
            font-weight: 500;
            color: #bfdbfe;
        }

        .score {
            font-size: 16.94px;
            font-weight: 600;
            color: #dbeafe;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            font-variant-numeric: tabular-nums;
        }

        .game-status {
            font-size: 15.42px;
            color: #86efac;
            font-weight: 400;
            margin-top: 11px;
            letter-spacing: 1.5px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ========================================
           SOCIALS OVERLAY (Bottom Right) - Static
           ======================================== */
        .socials-overlay {
            position: fixed;
            bottom: 15px;
            right: 20px;
            z-index: 10;
        }

        .social-bg {
            position: absolute;
            width: 420px;
            height: 82px;
            background: linear-gradient(90deg, transparent 0%, #1e293b 15%, #1e293b 100%);
            border-radius: 0 16px 16px 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .social-bg::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 70%;
            border: 2px solid #2a4a7a;
            border-left: none;
            border-radius: 0 16px 16px 0;
            mask: linear-gradient(90deg, transparent 0%, black 20%);
            -webkit-mask: linear-gradient(90deg, transparent 0%, black 20%);
        }

        .social-content {
            position: relative;
            z-index: 2;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .socials-icons {
            display: flex;
            gap: 11px;
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            opacity: 0.69;
        }

        .social-item i {
            font-size: 23px;
            width: 35.5px;
            height: 35.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 145, 145, 0.2);
            border-radius: 12px;
            color: #00f2f2;
        }

        .social-item .count {
            font-size: 18px;
            color: #00f2f2;
            font-weight: 700;
            background: rgba(0, 145, 145, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 145, 145, 0.4);
        }

        .social-divider {
            width: 2px;
            height: 60px;
            background: #3b5998;
        }

        .social-handle {
            font-size: 29.5px;
            font-weight: 500;
        }

        .social-handle .at,
        .social-handle .hush {
            color: #4AB5E8;
        }

        .social-handle .swish {
            color: #EB9861;
        }

        .social-subtitle {
            font-size: 15px;
            color: rgba(180, 190, 200, 0.7);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: lowercase;
            opacity: 0.73;
            margin-top: -5px;
        }

        /* ========================================
           STYLE SWITCHER UI
           ======================================== */
        .style-switcher {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .style-switcher:hover {
            opacity: 1;
        }

        .height-value-display {
            color: #60a5fa;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 12px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 0 12px 0 0;
            min-width: 60px;
            text-align: center;
        }

        /* ========================================
           CHAT OVERLAY BASE
           ======================================== */
        .chat-overlay {
            position: fixed;
            right: 19px;
            top: 38px;
            width: 281px;
            max-height: 1000px;
            z-index: 10;
            display: none;
        }

        .chat-overlay.active {
            display: block;
        }

        .chat-message {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .chat-username {
            font-weight: 600;
            margin-right: 6px;
        }

        .chat-text {
            color: #f1f5f9;
        }

        /* ========================================
           STYLE 6: MVP Star
           ======================================== */
        .chat-style-6 {
            background: transparent;
            padding: 0;
        }

        .chat-style-6 .chat-message {
            font-size: 14px;
            padding: 8px 12px;
            margin-bottom: 4px;
            background: rgba(20, 20, 35, 0.7);
            border-radius: 8px;
            opacity: 0.4;
            transition: all 0.5s ease;
        }
        
        /* Disable transition during animation */
        .chat-style-6 .chat-message[class*="anim-"] {
            transition: none;
        }

        /* Allow overflow for style 6 to show scaled message borders */
        .chat-style-6 .chat-messages-wrapper {
            overflow-x: visible;
            padding: 0 4px;
        }

        .chat-style-6 .chat-message:last-child {
            opacity: 1;
            font-size: 16px;
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(0, 50, 50, 0.9) 0%, rgba(30, 0, 50, 0.9) 50%, rgba(0, 30, 60, 0.9) 100%);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            border-top: 2px solid rgba(100, 255, 200, 0.5);
            border-right: 2px solid rgba(100, 255, 200, 0.5);
            border-bottom: 2px solid rgba(100, 255, 200, 0.5);
            border-left: 2px solid rgba(100, 255, 200, 0.5);
            box-shadow: 0 8px 32px rgba(100, 255, 200, 0.3);
            margin-top: 8px;
        }
        
        /* Apply scale only when NOT animating (no animation class present) */
        .chat-style-6 .chat-message:last-child:not([class*="anim-"]) {
            transform: scale(1.02);
        }
        
        /* For animations that complete, add scale after animation via JavaScript will handle this */
        /* Animation transforms will take precedence during animation due to animation-fill-mode: forwards */

        .chat-style-6 .chat-message:last-child .chat-username {
            color: #6ee7b7;
            font-size: 12px;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(110, 231, 183, 0.5);
        }

        .chat-style-6 .chat-username {
            color: #64748b;
        }

        .chat-style-6 .chat-text {
            color: #d1fae5;
        }

        /* Username color variations for visual interest */
        .username-cyan { color: #22d3ee !important; }
        .username-teal { color: #2dd4bf !important; }
        .username-blue { color: #60a5fa !important; }
        .username-purple { color: #a78bfa !important; }
        .username-pink { color: #f472b6 !important; }

        /* ========================================
           CHAT ANIMATIONS - Smooth ASMR-friendly
           ======================================== */
        
        /* Wrapper - fixed height, scrollable but hidden scrollbar */
        .chat-messages-wrapper {
            height: 127px;
            overflow-y: scroll;
            overflow-x: hidden;
            position: relative;
            /* Hide scrollbar */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            /* Gradient mask - fades out at top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
        }

        .chat-messages-wrapper::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Inner container that actually scrolls */
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 0px;
        }

        /* Individual messages */
        .chat-message {
            opacity: 1;
            transition: opacity 0.4s ease-out;
        }

        /* New message fades in */
        .chat-message.new-message {
            opacity: 0;
        }

        /* ========================================
           ANIMATION SWITCHER UI
           ======================================== */
        .animation-switcher {
            position: fixed;
            bottom: 80px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.7);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .animation-switcher:hover {
            opacity: 1;
        }

        .animation-switcher-label {
            color: #60a5fa;
            font-weight: 600;
            font-size: 12px;
            margin-right: 4px;
        }

        .animation-btn {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 32px;
            text-align: center;
        }

        .animation-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #60a5fa;
        }

        .animation-btn.active {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.7);
            color: #dbeafe;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        /* ========================================
           ANIMATION VARIATIONS
           ======================================== */

        /* Animation 4: Smooth Glow */
        .chat-message.anim-4.new-message {
            opacity: 0;
            filter: brightness(0.2) drop-shadow(0 0 0px rgba(100, 255, 200, 0));
        }
        .chat-message.anim-4 {
            animation: smoothGlow 1.5s ease-out forwards;
        }
        @keyframes smoothGlow {
            from {
                opacity: 0;
                filter: brightness(0.2) drop-shadow(0 0 0px rgba(100, 255, 200, 0));
            }
            to {
                opacity: 0.999;
                filter: brightness(1.2) drop-shadow(0 0 20px rgba(100, 255, 200, 0.6));
            }
        }
        .chat-style-6 .chat-message.anim-4:not(:last-child) {
            opacity: 0.4 !important;
        }

    </style>
</head>
<body>

    <!-- Gameplay Video Background -->
    <div class="video-container">
        <video class="gameplay-video" autoplay loop muted>
            <source src="../game.mp4" type="video/mp4">
        </video>
    </div>

    <!-- TITLE OVERLAY (Static) -->
    <div class="title-overlay">
        <div class="title-main">Silent Basketball</div>
        <div class="title-sub">A S M R</div>
    </div>

    <!-- NBA GAME OVERLAY (Static) -->
    <div class="nba-overlay">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        <div class="teams">
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="LAL">
                    <div class="team-abbr">LAL</div>
                </div>
                <div class="score">87</div>
            </div>
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gs.png" alt="GSW">
                    <div class="team-abbr">GSW</div>
                </div>
                <div class="score">82</div>
            </div>
        </div>
        <div class="game-status">Q3 · 8:42</div>
    </div>

    <!-- SOCIALS OVERLAY (Static) -->
    <div class="socials-overlay">
        <div class="social-bg"></div>
        <div class="social-content">
            <div class="socials-icons">
                <div class="social-item"><i class="fab fa-instagram"></i><span class="count">147.2K</span></div>
                <div class="social-item"><i class="fab fa-youtube"></i><span class="count">5.1K</span></div>
                <div class="social-item"><i class="fab fa-tiktok"></i><span class="count">510</span></div>
            </div>
            <div class="social-divider"></div>
            <div style="display: flex; flex-direction: column;">
                <span class="social-handle"><span class="at">@</span><span class="hush">hush</span><span class="swish">swish</span></span>
                <span class="social-subtitle">silent basketball</span>
            </div>
        </div>
    </div>

    <!-- STYLE SWITCHER -->
    <div class="style-switcher">
        <div class="height-value-display" id="height-value">700px</div>
    </div>


    <!-- CHAT STYLE 6: MVP Star -->
    <div class="chat-overlay chat-style-6 active" id="chat-6">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <script>
        // Username color mapping (same as chat overlay)
        const userColors = ['cyan', 'teal', 'blue', 'purple', 'pink'];
        const userColorMap = new Map();
        let userColorIndex = 0;

        function getUserColor(username) {
            if (!userColorMap.has(username)) {
                userColorMap.set(username, userColors[userColorIndex % userColors.length]);
                userColorIndex++;
            }
            return userColorMap.get(username);
        }

        let activeStyleNum = 6; // Track which style is active
        const activeAnimation = 4; // Always use animation 4 (Smooth Glow)
        let displayedMessageIds = new Set(); // Track displayed message IDs
        let lastRefreshTrigger = null;
        let serverPollInterval = null;
        const MAX_MESSAGES = 15; // Keep more messages, mask handles visual fade
        
        // Message queue for one-at-a-time display
        let messageQueue = [];
        let isProcessingQueue = false;
        let queueProcessingInterval = null;

        // Update chat height for style 6
        function updateChatHeight(height) {
            const heightPx = height + 'px';
            document.getElementById('height-value').textContent = heightPx;
            
            // Update style 6 wrapper
            const wrapper = document.querySelector('#chat-6 .chat-messages-wrapper');
            if (wrapper) {
                wrapper.style.height = heightPx;
            }
        }

        function switchStyle(styleNum) {
            // Only style 6 is available
            if (styleNum === 6) {
                document.getElementById('chat-6').classList.add('active');
                activeStyleNum = 6;
            } else {
                document.getElementById('chat-6').classList.remove('active');
                activeStyleNum = 0;
            }
        }

        function createMessageElement(serverMsg) {
            const div = document.createElement('div');
            div.className = 'chat-message new-message anim-4';
            
            // Remove @ from username if present
            let username = serverMsg.username || '';
            if (username.startsWith('@')) {
                username = username.substring(1);
            }
            const text = serverMsg.textHtml || serverMsg.text || '';
            const color = getUserColor(username);
            
            div.innerHTML = `<span class="chat-username username-${color}">${username}</span><span class="chat-text">${text}</span>`;
            
            return div;
        }

        // Smooth scroll animation - SLOW and gentle for ASMR
        function smoothScrollTo(element, targetScroll, duration) {
            const startScroll = element.scrollTop;
            const distance = targetScroll - startScroll;
            
            // If no distance to scroll, skip
            if (Math.abs(distance) < 1) return;
            
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease-out quad (gentler than cubic)
                const easeOut = 1 - Math.pow(1 - progress, 2);
                
                element.scrollTop = startScroll + (distance * easeOut);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        function showMessageOneAtATime(serverMsg) {
            // Add message to style 6 only
            const styleNum = 6;
            const wrapper = document.querySelector(`#chat-${styleNum} .chat-messages-wrapper`);
            const container = document.querySelector(`#chat-${styleNum} .chat-messages`);
            if (!container || !wrapper) return;

                const newMsg = createMessageElement(serverMsg);
                
                // Add new message at bottom
                container.appendChild(newMsg);

                // Force reflow to ensure initial state is applied
                void newMsg.offsetHeight;

                // Trigger animation by removing new-message class
                // The animation should trigger when new-message is removed
                setTimeout(() => {
                    newMsg.classList.remove('new-message');
                }, 10);

                // Smooth scroll to show new message - wait for DOM to fully update
                // Use setTimeout to ensure scrollHeight is calculated after layout
                setTimeout(() => {
                    // Calculate scroll position to show the last message fully
                    // Get the actual message height to ensure full visibility
                    const msgHeight = newMsg.offsetHeight;
                    
                    // Calculate number of lines based on message height and line height
                    const computedStyle = getComputedStyle(newMsg);
                    const lineHeight = parseFloat(computedStyle.lineHeight) || parseFloat(computedStyle.fontSize) * 1.4;
                    const paddingTop = parseFloat(computedStyle.paddingTop) || 0;
                    const paddingBottom = parseFloat(computedStyle.paddingBottom) || 0;
                    const contentHeight = msgHeight - paddingTop - paddingBottom;
                    const estimatedLines = Math.max(1, Math.round(contentHeight / lineHeight));
                    
                    // Calculate scroll duration based on line count
                    // 1 line = 1000ms, 7 lines = 2000ms, linear interpolation, cap at 2000ms
                    let duration;
                    if (estimatedLines <= 1) {
                        duration = 1000;
                    } else if (estimatedLines >= 7) {
                        duration = 2000;
                    } else {
                        // Linear interpolation: 1000ms + (lines - 1) * ((2000 - 1000) / (7 - 1))
                        duration = 1000 + (estimatedLines - 1) * (1000 / 6);
                    }
                    
                    // Check if parent container has padding (style 6 has no padding)
                    const parentContainer = wrapper.parentElement;
                    const parentPadding = parentContainer ? 
                        (parseFloat(getComputedStyle(parentContainer).paddingTop) || 0) +
                        (parseFloat(getComputedStyle(parentContainer).paddingBottom) || 0) : 0;
                    
                    // Calculate buffer: message height + parent padding + extra spacing
                    // This ensures the full message is visible even with padding
                    const buffer = msgHeight + parentPadding + 8; // 8px extra spacing for safety
                    
                    // Get the position of the new message relative to the wrapper
                    const msgRect = newMsg.getBoundingClientRect();
                    const wrapperRect = wrapper.getBoundingClientRect();
                    const msgBottom = msgRect.bottom - wrapperRect.top + wrapper.scrollTop;
                    
                    // Scroll to show the message with proper buffer accounting for padding
                    const targetScroll = msgBottom - wrapper.clientHeight + buffer;
                    const maxScroll = wrapper.scrollHeight - wrapper.clientHeight;
                    
                    // Use the minimum to ensure we don't scroll beyond max, but ensure last message is visible
                    smoothScrollTo(wrapper, Math.min(targetScroll, maxScroll), duration);
                }, 100); // Increased delay to ensure DOM is fully updated and layout is complete

            // Clean up old messages (already scrolled out of view)
            const messages = container.querySelectorAll('.chat-message');
            if (messages.length > MAX_MESSAGES) {
                messages[0].remove();
            }
        }

        // Process message queue one at a time
        function processMessageQueue() {
            // Double-check guard to prevent race conditions
            if (isProcessingQueue) {
                return; // Already processing, don't start another loop
            }
            
            if (messageQueue.length === 0) {
                return; // No messages to process
            }
            
            // Set flag IMMEDIATELY to prevent concurrent calls
            isProcessingQueue = true;
            
            // Process ONE message
            const serverMsg = messageQueue.shift();
            
            if (!serverMsg) {
                isProcessingQueue = false;
                return;
            }
            
            // Show the message
            showMessageOneAtATime(serverMsg);
            
            // Wait before showing next message (4 seconds for ASMR pace)
            setTimeout(() => {
                isProcessingQueue = false;
                // Process next message if queue has more
                if (messageQueue.length > 0) {
                    processMessageQueue();
                }
            }, 4000); // 4 seconds between messages
        }

        // Add message to queue (only if not already queued or displayed)
        function addMessageToQueue(serverMsg) {
            if (!serverMsg) return;
            
            // Check if message is already in queue or already displayed
            if (serverMsg.id) {
                if (displayedMessageIds.has(serverMsg.id)) {
                    return; // Already displayed, skip
                }
                // Check if already in queue
                if (messageQueue.some(msg => msg && msg.id === serverMsg.id)) {
                    return; // Already in queue, skip
                }
            } else {
                // If no ID, check by username + text to prevent duplicates
                const isDuplicate = messageQueue.some(msg => 
                    msg && 
                    msg.username === serverMsg.username && 
                    msg.text === serverMsg.text &&
                    Math.abs((msg.timestamp || 0) - (serverMsg.timestamp || 0)) < 1000 // Within 1 second
                );
                if (isDuplicate) {
                    return; // Duplicate, skip
                }
            }
            
            messageQueue.push(serverMsg);
            // Mark as displayed immediately to prevent duplicates from pollServerMessages
            if (serverMsg.id) {
                displayedMessageIds.add(serverMsg.id);
            }
            // Don't start processing here - let pollServerMessages start it after adding all messages
        }

        // Populate style 6 with existing messages from server
        async function prePopulate() {
            // Clear style 6
            const container = document.querySelector('#chat-6 .chat-messages');
            if (container) {
                container.innerHTML = '';
            }
            
            displayedMessageIds.clear();
            userColorMap.clear();
            userColorIndex = 0;
            messageQueue = []; // Clear queue
            isProcessingQueue = false; // Reset processing flag

            try {
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    // Sort messages by timestamp (oldest first)
                    const sortedMessages = [...data.messages].sort((a, b) => {
                        const timestampA = a.timestamp || 0;
                        const timestampB = b.timestamp || 0;
                        if (timestampA !== timestampB) {
                            return timestampA - timestampB;
                        }
                        const domOrderA = a.domOrder !== undefined ? a.domOrder : Infinity;
                        const domOrderB = b.domOrder !== undefined ? b.domOrder : Infinity;
                        return domOrderA - domOrderB;
                    });
                    
                    // Add all messages to queue (will be shown one at a time)
                    sortedMessages.forEach(serverMsg => {
                        if (serverMsg.id) {
                            displayedMessageIds.add(serverMsg.id);
                        }
                        messageQueue.push(serverMsg);
                    });
                    
                    // Start processing queue only if not already processing
                    if (messageQueue.length > 0 && !isProcessingQueue) {
                        processMessageQueue();
                    }
                }
            } catch (error) {
                console.error('Error pre-populating messages from server:', error);
            }
        }

        // Poll server for new messages (same as chat overlay)
        async function pollServerMessages() {
            try {
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                // Check if refresh is triggered
                if (data.refreshTrigger && data.refreshTrigger !== lastRefreshTrigger) {
                    lastRefreshTrigger = data.refreshTrigger;
                    await prePopulate();
                    return;
                }
                
                if (data.messages && data.messages.length > 0) {
                    // Filter out already displayed messages and sort by timestamp
                    const newMessages = data.messages
                        .filter(serverMsg => !displayedMessageIds.has(serverMsg.id))
                        .sort((a, b) => {
                            const timestampA = a.timestamp || 0;
                            const timestampB = b.timestamp || 0;
                            if (timestampA !== timestampB) {
                                return timestampA - timestampB;
                            }
                            const domOrderA = a.domOrder !== undefined ? a.domOrder : Infinity;
                            const domOrderB = b.domOrder !== undefined ? b.domOrder : Infinity;
                            return domOrderA - domOrderB;
                        });
                    
                    // Add new messages to queue (will be shown one at a time)
                    newMessages.forEach(serverMsg => {
                        addMessageToQueue(serverMsg);
                    });
                    
                    // Start processing queue only once after adding all messages
                    if (newMessages.length > 0 && !isProcessingQueue) {
                        processMessageQueue();
                    }
                }
            } catch (error) {
                // Silently fail - don't break overlay if server is unavailable
            }
        }

        // Start polling server (same interval as chat overlay: 200ms)
        function startPolling() {
            if (serverPollInterval) return;
            
            // Poll server ONCE, get all messages, keep in memory, show one at a time
            prePopulate();
            
            // No continuous polling - messages are already in queue and will be shown one at a time
        }

        // Auto-start polling
        startPolling();

        // Initialize with style 6 and height 700px
        switchStyle(6);
        updateChatHeight(700);

    </script>
