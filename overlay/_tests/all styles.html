<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay Style Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        /* Video gameplay background */
        .gameplay-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* ========================================
           TITLE OVERLAY (Top Left) - Static
           ======================================== */
        .title-overlay {
            position: fixed;
            top: 26px;
            left: 26px;
            z-index: 10;
        }

        .title-main {
            font-family: 'Russo One', sans-serif;
            font-size: 41.5px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 2.5px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.7),
                         0 2px 4px rgba(0, 0, 0, 0.6);
            opacity: 0.22;
        }

        .title-sub {
            font-family: 'Russo One', sans-serif;
            font-size: 22.3px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 8.5px;
            margin-top: 3px;
            margin-left: 8px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7);
            opacity: 0.24;
        }

        /* ========================================
           NBA GAME OVERLAY (Left Side) - Static
           ======================================== */
        .nba-overlay {
            position: fixed;
            left: 20px;
            top: 370px;
            z-index: 10;
            background: rgba(10, 20, 40, 1.0);
            backdrop-filter: blur(10px);
            padding: 13px 15.5px 18px 15.5px;
            border-radius: 16px;
            width: 190px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34);
            border: 1px solid rgba(59, 130, 246, 0.55);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 17px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-text {
            font-size: 16.5px;
            font-weight: 600;
            color: #60a5fa;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .nba-label {
            font-size: 13px;
            font-weight: 400;
            color: #93c5fd;
            letter-spacing: 1.5px;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin: 13px 0 11px 0;
        }

        .team {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }

        .team-abbr {
            font-size: 16.26px;
            font-weight: 500;
            color: #bfdbfe;
        }

        .score {
            font-size: 16.94px;
            font-weight: 600;
            color: #dbeafe;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            font-variant-numeric: tabular-nums;
        }

        .game-status {
            font-size: 15.42px;
            color: #86efac;
            font-weight: 400;
            margin-top: 11px;
            letter-spacing: 1.5px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ========================================
           SOCIALS OVERLAY (Bottom Right) - Static
           ======================================== */
        .socials-overlay {
            position: fixed;
            bottom: 15px;
            right: 20px;
            z-index: 10;
        }

        .social-bg {
            position: absolute;
            width: 420px;
            height: 82px;
            background: linear-gradient(90deg, transparent 0%, #1e293b 15%, #1e293b 100%);
            border-radius: 0 16px 16px 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .social-bg::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 70%;
            border: 2px solid #2a4a7a;
            border-left: none;
            border-radius: 0 16px 16px 0;
            mask: linear-gradient(90deg, transparent 0%, black 20%);
            -webkit-mask: linear-gradient(90deg, transparent 0%, black 20%);
        }

        .social-content {
            position: relative;
            z-index: 2;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .socials-icons {
            display: flex;
            gap: 11px;
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            opacity: 0.69;
        }

        .social-item i {
            font-size: 23px;
            width: 35.5px;
            height: 35.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 145, 145, 0.2);
            border-radius: 12px;
            color: #00f2f2;
        }

        .social-item .count {
            font-size: 18px;
            color: #00f2f2;
            font-weight: 700;
            background: rgba(0, 145, 145, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 145, 145, 0.4);
        }

        .social-divider {
            width: 2px;
            height: 60px;
            background: #3b5998;
        }

        .social-handle {
            font-size: 29.5px;
            font-weight: 500;
        }

        .social-handle .at,
        .social-handle .hush {
            color: #4AB5E8;
        }

        .social-handle .swish {
            color: #EB9861;
        }

        .social-subtitle {
            font-size: 15px;
            color: rgba(180, 190, 200, 0.7);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: lowercase;
            opacity: 0.73;
            margin-top: -5px;
        }

        /* ========================================
           STYLE SWITCHER UI
           ======================================== */
        .style-switcher {
            position: fixed;
            top: 120px;
            left: 230px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .style-switcher h3 {
            color: #60a5fa;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .style-btn {
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 6px;
            color: #93c5fd;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            color: #bfdbfe;
        }

        .style-btn.active {
            background: rgba(59, 130, 246, 0.5);
            border-color: #60a5fa;
            color: #ffffff;
        }


        /* ========================================
           CHAT OVERLAY BASE
           ======================================== */
        .chat-overlay {
            position: fixed;
            right: 19px;
            top: 38px;
            width: 281px;
            max-height: 400px;
            z-index: 10;
            display: none;
        }

        .chat-overlay.active {
            display: block;
        }

        .chat-message {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .chat-username {
            font-weight: 600;
            margin-right: 6px;
        }

        .chat-text {
            color: #f1f5f9;
        }

        /* ========================================
           STYLE 1: Glass Panel
           ======================================== */
        .chat-style-1 {
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2);
        }

        .chat-style-1 .chat-header {
            font-size: 12px;
            color: #60a5fa;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
        }

        .chat-style-1 .chat-message {
            font-size: 14px;
        }

        .chat-style-1 .chat-username {
            color: #60a5fa;
        }

        /* ========================================
           STYLE 5: Gradient Wave
           ======================================== */
        .chat-style-5 {
            background: transparent;
            padding: 8px;
        }

        .chat-style-5 .chat-message {
            font-size: 13px;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, rgba(147, 51, 234, 0.3) 100%);
            border: 1px solid rgba(147, 51, 234, 0.3);
        }

        .chat-style-5 .chat-message:nth-child(even) {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            border-color: rgba(236, 72, 153, 0.3);
        }

        .chat-style-5 .chat-username {
            color: #e879f9;
        }

        /* ========================================
           STYLE 7: Holographic
           ======================================== */
        .chat-style-7 {
            background: linear-gradient(135deg, 
                rgba(0, 255, 255, 0.1) 0%, 
                rgba(255, 0, 255, 0.1) 50%, 
                rgba(0, 255, 255, 0.1) 100%);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            animation: holoShift 3s ease-in-out infinite;
        }

        @keyframes holoShift {
            0%, 100% { border-color: rgba(0, 255, 255, 0.5); }
            50% { border-color: rgba(255, 0, 255, 0.5); }
        }

        .chat-style-7 .chat-message {
            font-size: 14px;
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 2px solid rgba(0, 255, 255, 0.5);
        }

        .chat-style-7 .chat-username {
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }

        .chat-style-7 .chat-text {
            color: rgba(255, 255, 255, 0.9);
        }

        /* ========================================
           STYLE 12: Aurora
           ======================================== */
        .chat-style-12 {
            background: linear-gradient(135deg, 
                rgba(0, 50, 50, 0.9) 0%, 
                rgba(30, 0, 50, 0.9) 50%,
                rgba(0, 30, 60, 0.9) 100%);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(100, 255, 200, 0.3);
            animation: auroraShift 5s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(0, 255, 150, 0.2);
                border-color: rgba(0, 255, 150, 0.4);
            }
            33% { 
                box-shadow: 0 0 20px rgba(100, 0, 255, 0.2);
                border-color: rgba(150, 100, 255, 0.4);
            }
            66% { 
                box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
                border-color: rgba(0, 200, 255, 0.4);
            }
        }

        .chat-style-12 .chat-message {
            font-size: 14px;
            padding: 6px 0;
        }

        .chat-style-12 .chat-username {
            color: #6ee7b7;
            text-shadow: 0 0 10px rgba(110, 231, 183, 0.5);
        }

        .chat-style-12 .chat-text {
            color: #d1fae5;
        }

        /* ========================================
           STYLE 13: Spotlight
           ======================================== */
        .chat-style-13 {
            background: transparent;
            padding: 0;
        }

        .chat-style-13 .chat-message {
            font-size: 14px;
            padding: 8px 12px;
            margin-bottom: 4px;
            background: rgba(20, 20, 30, 0.6);
            border-radius: 8px;
            opacity: 0.4;
            transition: all 0.4s ease;
        }

        .chat-style-13 .chat-message:last-child {
            opacity: 1;
            background: rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .chat-style-13 .chat-username {
            color: #60a5fa;
        }

        .chat-style-13 .chat-text {
            color: #e2e8f0;
        }

        /* ========================================
           STYLE 14: MVP Star
           ======================================== */
        .chat-style-14 {
            background: transparent;
            padding: 0;
        }

        .chat-style-14 .chat-message {
            font-size: 14px;
            padding: 8px 12px;
            margin-bottom: 4px;
            background: rgba(20, 20, 35, 0.7);
            border-radius: 8px;
            opacity: 0.4;
            transition: all 0.5s ease;
        }

        .chat-style-14 .chat-message:last-child {
            opacity: 1;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4) 0%, rgba(236, 72, 153, 0.3) 100%);
            border: 1px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
            transform: scale(1.02);
        }

        .chat-style-14 .chat-message:last-child::before {
            content: '⭐ MVP: ';
            color: #fbbf24;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .chat-style-14 .chat-message:last-child .chat-username {
            color: #c4b5fd;
            font-weight: 700;
        }

        .chat-style-14 .chat-username {
            color: #64748b;
        }

        .chat-style-14 .chat-text {
            color: #cbd5e1;
        }

        /* ========================================
           STYLE 15: Featured (big highlight)
           ======================================== */
        .chat-style-15 {
            background: transparent;
            padding: 0;
        }

        .chat-style-15 .chat-message {
            font-size: 12px;
            padding: 4px 8px;
            opacity: 0.35;
            color: #94a3b8;
            transition: all 0.5s ease;
        }

        .chat-style-15 .chat-message:last-child {
            opacity: 1;
            font-size: 16px;
            padding: 14px 18px;
            background: rgba(10, 20, 40, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 2px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
            margin-top: 8px;
        }

        .chat-style-15 .chat-message:last-child .chat-username {
            color: #60a5fa;
            font-size: 12px;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .chat-style-15 .chat-message:last-child .chat-username::before {
            content: '✨ FEATURED: ';
            color: #fbbf24;
        }

        .chat-style-15 .chat-username {
            color: #64748b;
        }

        .chat-style-15 .chat-text {
            color: #f1f5f9;
        }

        /* Username color variations for visual interest */
        .username-cyan { color: #22d3ee !important; }
        .username-teal { color: #2dd4bf !important; }
        .username-blue { color: #60a5fa !important; }
        .username-purple { color: #a78bfa !important; }
        .username-pink { color: #f472b6 !important; }

        /* ========================================
           CHAT ANIMATIONS - Smooth ASMR-friendly
           ======================================== */
        
        /* Wrapper - fixed height, scrollable but hidden scrollbar */
        .chat-messages-wrapper {
            height: 127px;
            overflow-y: scroll;
            overflow-x: hidden;
            position: relative;
            /* Hide scrollbar */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            /* Gradient mask - fades out at top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
        }

        .chat-messages-wrapper::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Inner container that actually scrolls */
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 0px;
        }

        /* Individual messages */
        .chat-message {
            opacity: 1;
            transition: opacity 0.4s ease-out;
        }

        /* New message fades in */
        .chat-message.new-message {
            opacity: 0;
        }

    </style>
</head>
<body>

    <!-- Gameplay Video Background -->
    <video class="gameplay-video" autoplay loop muted>
        <source src="../game.mp4" type="video/mp4">
    </video>

    <!-- TITLE OVERLAY (Static) -->
    <div class="title-overlay">
        <div class="title-main">Silent Basketball</div>
        <div class="title-sub">A S M R</div>
    </div>

    <!-- NBA GAME OVERLAY (Static) -->
    <div class="nba-overlay">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        <div class="teams">
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="LAL">
                    <div class="team-abbr">LAL</div>
                </div>
                <div class="score">87</div>
            </div>
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gs.png" alt="GSW">
                    <div class="team-abbr">GSW</div>
                </div>
                <div class="score">82</div>
            </div>
        </div>
        <div class="game-status">Q3 · 8:42</div>
    </div>

    <!-- SOCIALS OVERLAY (Static) -->
    <div class="socials-overlay">
        <div class="social-bg"></div>
        <div class="social-content">
            <div class="socials-icons">
                <div class="social-item"><i class="fab fa-instagram"></i><span class="count">147.2K</span></div>
                <div class="social-item"><i class="fab fa-youtube"></i><span class="count">5.1K</span></div>
                <div class="social-item"><i class="fab fa-tiktok"></i><span class="count">510</span></div>
            </div>
            <div class="social-divider"></div>
            <div style="display: flex; flex-direction: column;">
                <span class="social-handle"><span class="at">@</span><span class="hush">hush</span><span class="swish">swish</span></span>
                <span class="social-subtitle">silent basketball</span>
            </div>
        </div>
    </div>

    <!-- STYLE SWITCHER -->
    <div class="style-switcher">
        <h3>💬 CHAT STYLE</h3>
        <button class="style-btn active" onclick="switchStyle(1)">1. Glass Panel</button>
        <button class="style-btn" onclick="switchStyle(5)">5. Gradient Wave</button>
        <button class="style-btn" onclick="switchStyle(7)">7. Holographic</button>
        <button class="style-btn" onclick="switchStyle(12)">12. Aurora</button>
        <button class="style-btn" onclick="switchStyle(13)">13. Spotlight</button>
        <button class="style-btn" onclick="switchStyle(14)">14. MVP Star ⭐</button>
        <button class="style-btn" onclick="switchStyle(15)">15. Featured ✨</button>
        <button class="style-btn" onclick="switchStyle(0)" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;">Hide Chat</button>
    </div>

    <!-- CHAT STYLE 1: Glass Panel -->
    <div class="chat-overlay chat-style-1 active" id="chat-1">
        <div class="chat-header">Live Chat</div>
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <!-- CHAT STYLE 5: Gradient Wave -->
    <div class="chat-overlay chat-style-5" id="chat-5">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <!-- CHAT STYLE 7: Holographic -->
    <div class="chat-overlay chat-style-7" id="chat-7">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <!-- CHAT STYLE 12: Aurora -->
    <div class="chat-overlay chat-style-12" id="chat-12">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <!-- CHAT STYLE 13: Spotlight -->
    <div class="chat-overlay chat-style-13" id="chat-13">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <!-- CHAT STYLE 14: MVP Star -->
    <div class="chat-overlay chat-style-14" id="chat-14">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <!-- CHAT STYLE 15: Featured -->
    <div class="chat-overlay chat-style-15" id="chat-15">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>

    <script>
        // Username color mapping (same as chat overlay)
        const userColors = ['cyan', 'teal', 'blue', 'purple', 'pink'];
        const userColorMap = new Map();
        let userColorIndex = 0;

        function getUserColor(username) {
            if (!userColorMap.has(username)) {
                userColorMap.set(username, userColors[userColorIndex % userColors.length]);
                userColorIndex++;
            }
            return userColorMap.get(username);
        }

        let activeStyleNum = 1; // Track which style is active
        let displayedMessageIds = new Set(); // Track displayed message IDs
        let lastRefreshTrigger = null;
        let serverPollInterval = null;
        const MAX_MESSAGES = 15; // Keep more messages, mask handles visual fade
        
        // Message queue for one-at-a-time display
        let messageQueue = [];
        let isProcessingQueue = false;
        let queueProcessingInterval = null;

        function switchStyle(styleNum) {
            // Hide all chat overlays
            document.querySelectorAll('.chat-overlay').forEach(el => {
                el.classList.remove('active');
            });
            
            // Update button states
            document.querySelectorAll('.style-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected style
            if (styleNum > 0) {
                document.getElementById('chat-' + styleNum).classList.add('active');
                // Find button by onclick attribute
                const buttons = document.querySelectorAll('.style-btn');
                buttons.forEach(btn => {
                    if (btn.getAttribute('onclick') === `switchStyle(${styleNum})`) {
                        btn.classList.add('active');
                    }
                });
                activeStyleNum = styleNum;
            } else {
                activeStyleNum = 0;
            }
        }

        function createMessageElement(serverMsg) {
            const div = document.createElement('div');
            div.className = 'chat-message new-message';
            
            const username = serverMsg.username || '';
            const text = serverMsg.textHtml || serverMsg.text || '';
            const color = getUserColor(username);
            
            div.innerHTML = `<span class="chat-username username-${color}">${username}</span><span class="chat-text">${text}</span>`;
            
            return div;
        }

        // Smooth scroll animation - SLOW and gentle for ASMR
        function smoothScrollTo(element, targetScroll, duration) {
            const startScroll = element.scrollTop;
            const distance = targetScroll - startScroll;
            
            // If no distance to scroll, skip
            if (Math.abs(distance) < 1) return;
            
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease-out quad (gentler than cubic)
                const easeOut = 1 - Math.pow(1 - progress, 2);
                
                element.scrollTop = startScroll + (distance * easeOut);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        function showMessageOneAtATime(serverMsg) {
            // Add message to all 7 styles
            const styleNumbers = [1, 5, 7, 12, 13, 14, 15];
            
            styleNumbers.forEach(styleNum => {
                const wrapper = document.querySelector(`#chat-${styleNum} .chat-messages-wrapper`);
                const container = document.querySelector(`#chat-${styleNum} .chat-messages`);
                if (!container || !wrapper) return;

                const newMsg = createMessageElement(serverMsg);
                
                // Add new message at bottom
                container.appendChild(newMsg);

                // Force reflow
                void newMsg.offsetHeight;

                // Fade in the new message
                requestAnimationFrame(() => {
                    newMsg.classList.remove('new-message');
                });

                // Smooth scroll to show new message - 1 second duration!
                // Use double requestAnimationFrame to ensure DOM is fully updated
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const targetScroll = wrapper.scrollHeight - wrapper.clientHeight;
                        smoothScrollTo(wrapper, targetScroll, 1000);
                    });
                });

                // Clean up old messages (already scrolled out of view)
                const messages = container.querySelectorAll('.chat-message');
                if (messages.length > MAX_MESSAGES) {
                    messages[0].remove();
                }
            });
        }

        // Process message queue one at a time
        function processMessageQueue() {
            if (isProcessingQueue || messageQueue.length === 0) {
                return;
            }
            
            isProcessingQueue = true;
            const serverMsg = messageQueue.shift();
            
            if (serverMsg && serverMsg.id) {
                displayedMessageIds.add(serverMsg.id);
            }
            
            // Show the message
            showMessageOneAtATime(serverMsg);
            
            // Wait before showing next message (4 seconds for ASMR pace)
            setTimeout(() => {
                isProcessingQueue = false;
                // Process next message if queue has more
                if (messageQueue.length > 0) {
                    processMessageQueue();
                }
            }, 4000); // 4 seconds between messages
        }

        // Add message to queue
        function addMessageToQueue(serverMsg) {
            messageQueue.push(serverMsg);
            // Start processing if not already processing
            if (!isProcessingQueue) {
                processMessageQueue();
            }
        }

        // Populate all styles with existing messages from server
        async function prePopulate() {
            // Clear all styles
            const styleNumbers = [1, 5, 7, 12, 13, 14, 15];
            styleNumbers.forEach(styleNum => {
                const container = document.querySelector(`#chat-${styleNum} .chat-messages`);
                if (container) {
                    container.innerHTML = '';
                }
            });
            
            displayedMessageIds.clear();
            userColorMap.clear();
            userColorIndex = 0;
            messageQueue = []; // Clear queue
            isProcessingQueue = false; // Reset processing flag

            try {
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    // Sort messages by timestamp (oldest first)
                    const sortedMessages = [...data.messages].sort((a, b) => {
                        const timestampA = a.timestamp || 0;
                        const timestampB = b.timestamp || 0;
                        if (timestampA !== timestampB) {
                            return timestampA - timestampB;
                        }
                        const domOrderA = a.domOrder !== undefined ? a.domOrder : Infinity;
                        const domOrderB = b.domOrder !== undefined ? b.domOrder : Infinity;
                        return domOrderA - domOrderB;
                    });
                    
                    // Add all messages to queue (will be shown one at a time)
                    sortedMessages.forEach(serverMsg => {
                        if (serverMsg.id) {
                            displayedMessageIds.add(serverMsg.id);
                        }
                        messageQueue.push(serverMsg);
                    });
                    
                    // Start processing queue
                    if (messageQueue.length > 0) {
                        processMessageQueue();
                    }
                }
            } catch (error) {
                console.error('Error pre-populating messages from server:', error);
            }
        }

        // Poll server for new messages (same as chat overlay)
        async function pollServerMessages() {
            try {
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                // Check if refresh is triggered
                if (data.refreshTrigger && data.refreshTrigger !== lastRefreshTrigger) {
                    lastRefreshTrigger = data.refreshTrigger;
                    await prePopulate();
                    return;
                }
                
                if (data.messages && data.messages.length > 0) {
                    // Filter out already displayed messages and sort by timestamp
                    const newMessages = data.messages
                        .filter(serverMsg => !displayedMessageIds.has(serverMsg.id))
                        .sort((a, b) => {
                            const timestampA = a.timestamp || 0;
                            const timestampB = b.timestamp || 0;
                            if (timestampA !== timestampB) {
                                return timestampA - timestampB;
                            }
                            const domOrderA = a.domOrder !== undefined ? a.domOrder : Infinity;
                            const domOrderB = b.domOrder !== undefined ? b.domOrder : Infinity;
                            return domOrderA - domOrderB;
                        });
                    
                    // Add new messages to queue (will be shown one at a time)
                    newMessages.forEach(serverMsg => {
                        addMessageToQueue(serverMsg);
                    });
                }
            } catch (error) {
                // Silently fail - don't break overlay if server is unavailable
            }
        }

        // Start polling server (same interval as chat overlay: 200ms)
        function startPolling() {
            if (serverPollInterval) return;
            
            // Initial populate
            prePopulate();
            
            // Then poll every 200ms
            serverPollInterval = setInterval(() => {
                pollServerMessages();
            }, 200);
        }

        // Auto-start polling
        startPolling();
    </script>

</body>
