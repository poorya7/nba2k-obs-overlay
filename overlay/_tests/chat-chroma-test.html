<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay - Chroma Key Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #00ff00; /* Green for chroma key */
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }

        .chat-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #00ff00; /* Green for chroma key */
        }

        .chat-overlay-frame {
            position: absolute;
            top: 0;
            right: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            background: transparent;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <iframe 
            class="chat-overlay-frame" 
            src="../chat-overlay/index.html"
            id="chat-frame">
        </iframe>
    </div>
</body>
</html>
