<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 3: Right-Aligned Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .preview-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay-frame {
            position: absolute;
            border: none;
            background: transparent;
            pointer-events: none;
        }

        .title-overlay-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
        }

        .game-stats-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        .other-games-frame {
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        /* OPTION 3: Right-Aligned Minimal */
        .bottom-info-wrapper {
            position: absolute;
            bottom: 20px;
            right: -60px;
            z-index: 25;
            background: #161616;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 182.5px;
        }

        .bottom-info {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .social-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .social-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .social-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            opacity: 0.9;
        }

        .social-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .social-handle {
            font-size: 16px;
            color: #d1d5db;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .social-count {
            font-size: 19.5px;
            color: #ffffff;
            font-weight: 700;
        }

        /* Controls Panel */
        .controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            z-index: 1000;
            min-width: 280px;
            pointer-events: auto;
        }

        .controls-panel h3 {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .control-value {
            color: #60a5fa;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #60a5fa;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #60a5fa;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: rgba(96, 165, 250, 0.3);
            border-color: rgba(96, 165, 250, 0.5);
        }
    </style>
</head>
<body>
