<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --stage-x: -243px;
            --stage-y: 538px;
            --pic-staged: 138px;
            --pic-list: 17px;
            --font-size: 21px;
            --entry-gap: 6px;
            --bg-padding: 16px;
            --bg-alpha: 0.4;
        }
        
        body { font-family: 'Inter', sans-serif; width: 1920px; height: 1080px; background: #0a0a0a; position: relative; overflow: hidden; }
        .gameplay-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }

        /* OVERLAYS */
        .title-overlay { position: fixed; top: 26px; left: 26px; z-index: 5; }
        .title-main { font-family: 'Russo One', sans-serif; font-size: 41.5px; color: #ffffff; letter-spacing: 2.5px; text-shadow: 0 4px 8px rgba(0, 0, 0, 0.7); opacity: 0.22; }
        .title-sub { font-family: 'Russo One', sans-serif; font-size: 22.3px; color: #ffffff; letter-spacing: 8.5px; margin-top: 3px; margin-left: 8px; text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7); opacity: 0.24; }

        .nba-overlay { position: fixed; left: 20px; top: 370px; z-index: 5; background: rgba(10, 20, 40, 1.0); backdrop-filter: blur(10px); padding: 13px 15.5px 18px 15.5px; border-radius: 16px; width: 190px; box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34); border: 1px solid rgba(59, 130, 246, 0.55); }
        .live-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 17px; }
        .live-dot { width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 12px rgba(59, 130, 246, 0.8); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-text { font-size: 16.5px; font-weight: 600; color: #60a5fa; letter-spacing: 1.5px; }
        .nba-label { font-size: 13px; color: #93c5fd; letter-spacing: 1.5px; }
        .teams { display: flex; flex-direction: column; gap: 3px; margin: 13px 0 11px 0; }
        .team { display: flex; align-items: center; justify-content: space-between; }
        .team-left { display: flex; align-items: center; gap: 11px; }
        .team-logo { width: 48px; height: 48px; }
        .team-abbr { font-size: 16.26px; font-weight: 500; color: #bfdbfe; }
        .score { font-size: 16.94px; font-weight: 600; color: #dbeafe; }
        .game-status { font-size: 15.42px; color: #86efac; margin-top: 11px; letter-spacing: 1.5px; text-align: center; }

        .socials-overlay { position: fixed; bottom: 15px; right: 20px; z-index: 5; }

        /* CONTROL PANEL */
        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            width: 280px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-panel h3 {
            color: #60a5fa;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .control-group label span {
            color: #60a5fa;
            font-weight: 600;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(59, 130, 246, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
        }

        .control-divider {
            height: 1px;
            background: rgba(59, 130, 246, 0.2);
            margin: 14px 0;
        }
        .social-bg { position: absolute; width: 420px; height: 82px; background: linear-gradient(90deg, transparent 0%, #1e293b 15%, #1e293b 100%); border-radius: 0 16px 16px 0; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .social-bg::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 70%; border: 2px solid #2a4a7a; border-left: none; border-radius: 0 16px 16px 0; mask: linear-gradient(90deg, transparent 0%, black 20%); -webkit-mask: linear-gradient(90deg, transparent 0%, black 20%); }
        .social-content { position: relative; z-index: 2; padding: 20px 28px; display: flex; align-items: center; gap: 20px; }
        .socials-icons { display: flex; gap: 11px; }
        .social-item { display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0.69; }
        .social-item i { font-size: 23px; width: 35.5px; height: 35.5px; display: flex; align-items: center; justify-content: center; background: rgba(0, 145, 145, 0.2); border-radius: 12px; color: #00f2f2; }
        .social-item .count { font-size: 18px; color: #00f2f2; font-weight: 700; background: rgba(0, 145, 145, 0.2); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(0, 145, 145, 0.4); }
        .social-divider { width: 2px; height: 60px; background: #3b5998; }
        .social-handle { font-size: 29.5px; font-weight: 500; }
        .social-handle .at, .social-handle .hush { color: #4AB5E8; }
        .social-handle .swish { color: #EB9861; }
        .social-subtitle { font-size: 15px; color: rgba(180, 190, 200, 0.7); font-weight: 700; letter-spacing: 4px; opacity: 0.73; margin-top: -5px; }

        /* CHAT CANVAS - positioned dynamically */
        .chat-canvas {
            position: fixed;
            right: 31px;
            top: 5px;
            width: 281px;
            height: 500px;
            z-index: 10;
        }

        /* Message element - moves and scales */
        .message {
            position: absolute;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            transform-origin: center center;
        }

        /* Stage state - full size, centered at bottom */
        .message.staged {
            top: var(--stage-y);
            left: var(--stage-x);
            transform: scale(1);
            z-index: 10;
        }

        /* List state - EXACT Style 2 Floating Minimal + profile pic */
        /* All changes transition smoothly from staged state */
        .message.in-list {
            left: 0;
            transform: scale(1);
            z-index: 1;
        }

        .message.in-list.ghost-style .entry {
            gap: var(--entry-gap);
            line-height: 1.4;
            opacity: 0.9;
        }

        .message.in-list.ghost-style .content {
            background: rgba(100, 100, 150, 0);
            backdrop-filter: blur(0px);
            padding: 0;
            border-radius: 0;
            font-size: 15px;
            color: #f1f5f9;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8),
                         0 1px 3px rgba(0, 0, 0, 0.9);
        }

        .message.in-list.ghost-style .user {
            color: #22d3ee;
            font-weight: 600;
            margin-right: 6px;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        .message.in-list.ghost-style .profile-pic {
            width: var(--pic-list);
            height: var(--pic-list);
            filter: drop-shadow(0 0 0 transparent);
            border: 2px solid transparent;
            flex-shrink: 0;
        }

        /* Exiting state - exits upward */
        .message.exiting {
            opacity: 0 !important;
            transform: translateX(0) translateY(-30px) scale(0.5);
        }

        /* Entry container */
        .message .entry {
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =====================================================
           GHOST STYLE - Fades in spooky with profile pic
           All elements have transitions for smooth morphing
           ===================================================== */
        .ghost-style .entry {
            display: flex;
            align-items: center;
            gap: 15px;
            line-height: 1.4;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Staged entries are fully opaque */
        .ghost-style.staged .entry {
            opacity: 1;
        }

        /* List entries have reduced opacity */
        .ghost-style.in-list .entry {
            opacity: 0.9;
        }

        /* Only apply entry animation when staged */
        .ghost-style.staged .entry {
            animation: ghostEntry 1s ease-out forwards;
        }

        .ghost-style .profile-pic {
            width: var(--pic-staged);
            height: var(--pic-staged);
            border-radius: 50%;
            object-fit: cover;
            filter: drop-shadow(0 0 20px rgba(200, 200, 255, 0.6));
            border: 2px solid rgba(200, 200, 255, 0.4);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ghost-style .content {
            color: #f1f5f9;
            padding: var(--bg-padding) calc(var(--bg-padding) * 1.5);
            border-radius: 15px;
            font-size: var(--font-size);
            line-height: 1.4;
            filter: blur(0);
            opacity: 1;
            transform: scale(1);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Only apply entry animation when staged */
        .ghost-style.staged .content {
            animation: ghostEntry 1s ease-out forwards;
        }

        .ghost-style .user {
            color: #a5b4fc;
            font-weight: 600;
            margin-right: 8px;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes ghostEntry {
            0% {
                opacity: 0;
                filter: blur(15px);
                transform: scale(1.3);
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        @keyframes ghostFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

    </style>
</head>
<body>
    <video class="gameplay-video" autoplay loop muted><source src="../game.mp4" type="video/mp4"></video>

    <div class="title-overlay"><div class="title-main">Silent Basketball</div><div class="title-sub">A S M R</div></div>

    <div class="nba-overlay">
        <div class="live-indicator"><div class="live-dot"></div><span class="live-text">Live</span><span class="nba-label">NBA</span></div>
        <div class="teams">
            <div class="team"><div class="team-left"><img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="LAL"><div class="team-abbr">LAL</div></div><div class="score">87</div></div>
            <div class="team"><div class="team-left"><img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gs.png" alt="GSW"><div class="team-abbr">GSW</div></div><div class="score">82</div></div>
        </div>
        <div class="game-status">Q3 · 8:42</div>
    </div>

    <div class="socials-overlay">
        <div class="social-bg"></div>
        <div class="social-content">
            <div class="socials-icons">
                <div class="social-item"><i class="fab fa-instagram"></i><span class="count">147.2K</span></div>
                <div class="social-item"><i class="fab fa-youtube"></i><span class="count">5.1K</span></div>
                <div class="social-item"><i class="fab fa-tiktok"></i><span class="count">510</span></div>
            </div>
            <div class="social-divider"></div>
            <div style="display: flex; flex-direction: column;">
                <span class="social-handle"><span class="at">@</span><span class="hush">hush</span><span class="swish">swish</span></span>
                <span class="social-subtitle">silent basketball</span>
            </div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <h3>🎛️ Chat Controls</h3>
        
        <div class="control-group">
            <label>List X (right) <span id="val-list-x">31</span>px</label>
            <input type="range" id="ctrl-list-x" min="-500" max="1920" value="31">
        </div>
        
        <div class="control-group">
            <label>List Y (top) <span id="val-list-y">5</span>px</label>
            <input type="range" id="ctrl-list-y" min="-500" max="1080" value="5">
        </div>
        
        <div class="control-group">
            <label>Chat Gap <span id="val-gap">26</span>px</label>
            <input type="range" id="ctrl-gap" min="10" max="150" value="26">
        </div>

        <div class="control-divider"></div>
        
        <div class="control-group">
            <label>Staged X (left) <span id="val-stage-x">-243</span>px</label>
            <input type="range" id="ctrl-stage-x" min="-500" max="1920" value="-243">
        </div>
        
        <div class="control-group">
            <label>Staged Y (top) <span id="val-stage-y">538</span>px</label>
            <input type="range" id="ctrl-stage-y" min="-500" max="1080" value="538">
        </div>

        <div class="control-divider"></div>
        
        <div class="control-group">
            <label>Staged Pic Size <span id="val-pic-staged">138</span>px</label>
            <input type="range" id="ctrl-pic-staged" min="20" max="200" value="138">
        </div>
        
        <div class="control-group">
            <label>List Pic Size <span id="val-pic-list">17</span>px</label>
            <input type="range" id="ctrl-pic-list" min="10" max="100" value="17">
        </div>

        <div class="control-divider"></div>
        
        <div class="control-group">
            <label>Font Size <span id="val-font">21</span>px</label>
            <input type="range" id="ctrl-font" min="8" max="40" value="21">
        </div>
        
        <div class="control-group">
            <label>Entry Gap <span id="val-entry-gap">6</span>px</label>
            <input type="range" id="ctrl-entry-gap" min="0" max="40" value="6">
        </div>

        <div class="control-divider"></div>

        <div class="control-group">
            <label>Stage BG Padding <span id="val-bg-padding">16</span>px</label>
            <input type="range" id="ctrl-bg-padding" min="0" max="40" value="16">
        </div>

        <div class="control-group">
            <label>Stage BG Alpha <span id="val-bg-alpha">0.4</span></label>
            <input type="range" id="ctrl-bg-alpha" min="0" max="100" value="40" step="1">
        </div>

        <div class="control-group">
            <label>Stage Time <span id="val-stage-time">1800</span>ms</label>
            <input type="range" id="ctrl-stage-time" min="500" max="8000" value="1800">
        </div>

        <div class="control-divider"></div>

        <button id="export-btn" style="width: 100%; padding: 10px; background: rgba(59, 130, 246, 0.3); border: 1px solid rgba(59, 130, 246, 0.5); border-radius: 6px; color: #93c5fd; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px;">📋 Export Values</button>
        <pre id="export-output" style="display: none; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; font-size: 10px; color: #94a3b8; white-space: pre-wrap; word-break: break-all;"></pre>
    </div>

    <!-- Ghost Chat Canvas -->
    <div class="chat-canvas" id="ghost-chat"></div>

    <script>
        // ========== CONTROL PANEL ==========
        const canvas = document.getElementById('ghost-chat');
        
        // Settings object
        const settings = {
            listX: 31,
            listY: 5,
            gap: 26,
            stageX: -243,
            stageY: 538,
            picStaged: 138,
            picList: 17,
            fontSize: 21,
            entryGap: 6,
            bgPadding: 16,
            stageTime: 1800,
            bgAlpha: 0.4
        };

        // Update CSS custom properties
        function updateStyles() {
            if (!canvas) {
                console.error('Canvas not found!');
                return;
            }
            
            // Chat canvas position
            canvas.style.right = settings.listX + 'px';
            canvas.style.top = settings.listY + 'px';
            canvas.style.display = 'block'; // Ensure it's visible
            
            // Update CSS variables for dynamic styling
            document.documentElement.style.setProperty('--stage-x', settings.stageX + 'px');
            document.documentElement.style.setProperty('--stage-y', settings.stageY + 'px');
            document.documentElement.style.setProperty('--pic-staged', settings.picStaged + 'px');
            document.documentElement.style.setProperty('--pic-list', settings.picList + 'px');
            document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
            document.documentElement.style.setProperty('--entry-gap', settings.entryGap + 'px');
            document.documentElement.style.setProperty('--bg-padding', settings.bgPadding + 'px');
            
            // Update background alpha on all staged content (can't use CSS var in rgba)
            const stagedContents = document.querySelectorAll('.ghost-style.staged .content');
            stagedContents.forEach(el => {
                el.style.background = `rgba(100, 100, 150, ${settings.bgAlpha})`;
                // backdrop-filter blur makes things look more transparent, so remove it
                // The background alpha alone controls transparency
                el.style.removeProperty('backdrop-filter');
            });
            
            // Update existing messages
            if (typeof updateListPositions === 'function') {
                updateListPositions();
            }
        }

        // Wire up sliders
        function setupControls() {
            const controls = [
                { id: 'ctrl-list-x', key: 'listX', valId: 'val-list-x' },
                { id: 'ctrl-list-y', key: 'listY', valId: 'val-list-y' },
                { id: 'ctrl-gap', key: 'gap', valId: 'val-gap' },
                { id: 'ctrl-stage-x', key: 'stageX', valId: 'val-stage-x' },
                { id: 'ctrl-stage-y', key: 'stageY', valId: 'val-stage-y' },
                { id: 'ctrl-pic-staged', key: 'picStaged', valId: 'val-pic-staged' },
                { id: 'ctrl-pic-list', key: 'picList', valId: 'val-pic-list' },
                { id: 'ctrl-font', key: 'fontSize', valId: 'val-font' },
                { id: 'ctrl-entry-gap', key: 'entryGap', valId: 'val-entry-gap' },
                { id: 'ctrl-bg-padding', key: 'bgPadding', valId: 'val-bg-padding' },
                { id: 'ctrl-bg-alpha', key: 'bgAlpha', valId: 'val-bg-alpha', isFloat: true, scale: 0.01 },
                { id: 'ctrl-stage-time', key: 'stageTime', valId: 'val-stage-time' },
            ];

            controls.forEach(ctrl => {
                const slider = document.getElementById(ctrl.id);
                const valDisplay = document.getElementById(ctrl.valId);
                
                slider.addEventListener('input', (e) => {
                    if (ctrl.isFloat) {
                        settings[ctrl.key] = parseFloat(e.target.value) * ctrl.scale;
                        valDisplay.textContent = settings[ctrl.key].toFixed(2);
                    } else {
                        settings[ctrl.key] = parseInt(e.target.value);
                        valDisplay.textContent = e.target.value;
                    }
                    updateStyles();
                });
            });

            // Export button
            document.getElementById('export-btn').addEventListener('click', () => {
                const output = document.getElementById('export-output');
                const exportText = `Chat Overlay Settings:
─────────────────────
List X (right): ${settings.listX}px
List Y (top): ${settings.listY}px
Chat Gap: ${settings.gap}px
Staged X (left): ${settings.stageX}px
Staged Y (top): ${settings.stageY}px
Staged Pic Size: ${settings.picStaged}px
List Pic Size: ${settings.picList}px
Font Size: ${settings.fontSize}px
Entry Gap: ${settings.entryGap}px
Stage BG Padding: ${settings.bgPadding}px
Stage BG Alpha: ${settings.bgAlpha.toFixed(2)}
Stage Time: ${settings.stageTime}ms`;
                
                output.textContent = exportText;
                output.style.display = 'block';
                
                // Copy to clipboard
                navigator.clipboard.writeText(exportText).then(() => {
                    document.getElementById('export-btn').textContent = '✅ Copied!';
                    setTimeout(() => {
                        document.getElementById('export-btn').textContent = '📋 Export Values';
                    }, 2000);
                });
            });
        }

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setupControls();
                updateStyles(); // Initialize with default values
            });
        } else {
            setupControls();
            updateStyles(); // Initialize with default values
        }

        // ========== CHAT MESSAGES ==========
        // Sample messages with actual profile pics (using random avatar services)
        const msgs = [
            { user: 'hushswish_fan', text: 'so relaxing', avatar: 'https://i.pravatar.cc/150?img=1' },
            { user: 'bball_lover', text: 'love the vibes', avatar: 'https://i.pravatar.cc/150?img=3' },
            { user: 'nightowl23', text: 'whos winning?', avatar: 'https://i.pravatar.cc/150?img=5' },
            { user: 'silent_hoops', text: 'W stream', avatar: 'https://i.pravatar.cc/150?img=7' },
            { user: 'asmr_addict', text: 'keyboard sounds 🔥', avatar: 'https://i.pravatar.cc/150?img=8' },
            { user: 'chill_gamer', text: 'perfect vibes', avatar: 'https://i.pravatar.cc/150?img=11' },
            { user: 'zen_master', text: 'so peaceful', avatar: 'https://i.pravatar.cc/150?img=12' },
            { user: 'newbie_here', text: 'first time!', avatar: 'https://i.pravatar.cc/150?img=14' },
            { user: 'lol_master', text: 'lmaooo 💀', avatar: 'https://i.pravatar.cc/150?img=15' },
            { user: 'RTB_18', text: 'pullin up', avatar: 'https://i.pravatar.cc/150?img=18' },
            { user: 'KaponeONS', text: 'how to be 99 overall', avatar: 'https://i.pravatar.cc/150?img=20' },
            { user: 'Thatchy2k', text: 'YOUUUU', avatar: 'https://i.pravatar.cc/150?img=22' },
        ];

        const userColors = ['#f472b6', '#fb923c', '#a78bfa', '#4ade80', '#60a5fa', '#fbbf24', '#f87171', '#2dd4bf', '#c084fc', '#fb7185', '#34d399', '#38bdf8'];

        const MAX = 5;
        let msgIdx = 0;
        const messagesList = [];
        let isStaging = false; // Track if a message is currently staged

        function getGhostHTML(msg, color) {
            return `<img class="profile-pic" src="${msg.avatar}" alt="${msg.user}"><div class="content"><span class="user" style="color:${color}">${msg.user}</span>${msg.text}</div>`;
        }

        function updateListPositions() {
            const baseY = settings.listY; // Start from top
            
            messagesList.forEach((el, index) => {
                if (!el.classList.contains('exiting')) {
                    // Oldest at top (index 0), newest at bottom
                    const y = baseY + (index * settings.gap);
                    el.style.top = y + 'px';
                    // Consistent opacity (handled by CSS opacity: 0.9)
                }
            });
        }

        function addMessage() {
            // Don't add new message if one is currently staging
            if (isStaging) {
                return;
            }
            
            const msg = msgs[msgIdx % msgs.length];
            const color = userColors[msgIdx % userColors.length];
            msgIdx++;

            const canvas = document.getElementById('ghost-chat');

            const messageEl = document.createElement('div');
            messageEl.className = 'message staged ghost-style';
            messageEl.innerHTML = `<div class="entry">${getGhostHTML(msg, color)}</div>`;
            
            // Set background alpha on the content element
            const contentEl = messageEl.querySelector('.content');
            if (contentEl) {
                contentEl.style.background = `rgba(100, 100, 150, ${settings.bgAlpha})`;
                // backdrop-filter blur makes things look more transparent, so remove it
                // The background alpha alone controls transparency
                contentEl.style.removeProperty('backdrop-filter');
            }
            
            canvas.appendChild(messageEl);
            isStaging = true; // Mark as staging

            // After stage time, transition to list
            setTimeout(() => {
                messagesList.push(messageEl);
                
                // Calculate position FIRST (before class change)
                const baseY = settings.listY;
                const newIndex = messagesList.length - 1;
                const targetY = baseY + (newIndex * settings.gap);
                
                // Get content element
                const contentEl = messageEl.querySelector('.content');
                
                // Set position first
                messageEl.style.top = targetY + 'px';
                
                // Change background inline style to transparent BEFORE class change
                // This allows the transition to work since the element has transition: all
                if (contentEl) {
                    contentEl.style.background = 'rgba(100, 100, 150, 0)';
                }
                
                // Then change classes - other properties (padding, border-radius, etc.) will also transition
                messageEl.classList.add('in-list');
                messageEl.classList.remove('staged');
                
                // Update other messages positions
                updateListPositions();

                // Remove old messages if too many
                if (messagesList.length > MAX) {
                    const oldest = messagesList.shift();
                    oldest.classList.add('exiting');
                    setTimeout(() => oldest.remove(), 1200);
                    
                    // Recalculate positions for remaining messages (scroll up)
                    updateListPositions();
                }

                // After transition completes, allow new messages
                setTimeout(() => {
                    isStaging = false;
                }, 1200); // Match transition duration
            }, settings.stageTime);
        }

        // Start
        addMessage();
        setInterval(addMessage, 3500);
    </script>
</body>
</html>
