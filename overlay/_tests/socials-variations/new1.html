<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 8A - Diagonal Slash Stack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: black;
        }
        
        iframe {
            position: absolute;
            border: none;
            width: 100%;
            height: 100%;
        }
        
        .video-frame {
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .title-frame {
            top: 0;
            left: 0;
            z-index: 2;
        }
        
        .game-frame {
            top: 0;
            left: 0;
            z-index: 3;
        }
        
        .socials-frame {
            top: 0;
            left: 0;
            z-index: 4;
        }
    </style>
</head>
<body>
    <iframe class="video-frame" src="/overlay/video-background/index.html"></iframe>
    <iframe class="title-frame" src="/overlay/title-overlay/index.html"></iframe>
    <iframe class="game-frame" src="/overlay/nba-live-overlay/index.html"></iframe>
    <iframe class="socials-frame" src="/overlay/socials-overlay/index.html?layout=right-middle&scale=0.6&iconSize=36&fontSize=13&numberSize=11&verticalGap=4&style=diagonal-slash"></iframe>
</body>
</html>
