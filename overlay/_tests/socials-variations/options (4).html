<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 8D - Ribbon Banners</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        .video-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .overlay-frame { position: absolute; border: none; background: transparent; pointer-events: none; }
        .title-frame { top: 0; left: 0; width: 100%; height: 200px; z-index: 10; }
        .game-frame { top: 0; left: 0; width: 100%; height: 100%; z-index: 20; }
        .socials-frame { top: 0; left: 0; width: 100%; height: 100%; z-index: 30; }
    </style>
</head>
<body>
    <video class="video-background" autoplay loop muted playsinline>
        <source src="/overlay/game.mp4" type="video/mp4">
    </video>
    <iframe class="overlay-frame title-frame" src="/overlay/title-overlay/index.html"></iframe>
    <iframe class="overlay-frame game-frame" src="/overlay/nba-live-overlay/index.html"></iframe>
    <iframe class="overlay-frame socials-frame" src="/overlay/socials-overlay/index.html?layout=right-middle&scale=0.7&iconSize=44&fontSize=29&gap=18&padding=20&borderExtension=0&borderRadius=0&numberSize=27&verticalGap=0&style=ribbon-banners"></iframe>
</body>
</html>
