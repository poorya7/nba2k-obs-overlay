<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Overlay Preview - Press F11 for Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .preview-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }


        /* Video background */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay iframes - positioned absolutely to match OBS layout */
        .overlay-frame {
            position: absolute;
            border: none;
            background: transparent;
            pointer-events: none; /* Allow clicking through for testing */
        }

        /* Title overlay - top left */
        .title-overlay-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
        }

        /* Game stats overlay - left side, vertically centered */
        .game-stats-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        /* Other games overlay - right side, vertically centered */
        .other-games-frame {
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

    </style>
</head>
<body>
    <div class="preview-container">
        <!-- Video Background -->
        <video class="video-background" autoplay loop muted playsinline>
            <source src="../game.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <!-- Title Overlay (top left) -->
        <iframe 
            class="overlay-frame title-overlay-frame" 
            src="../title-overlay/index.html"
            id="title-frame">
        </iframe>

        <!-- Game Stats Overlay (left side) -->
        <iframe 
            class="overlay-frame game-stats-frame" 
            src="../game-stats-overlay/core/index.html"
            id="game-stats-frame">
        </iframe>

        <!-- Other Games Overlay (right side) -->
        <iframe 
            class="overlay-frame other-games-frame" 
            src="../other-games-overlay/index.html"
            id="other-games-frame">
        </iframe>
    </div>

    <script>
        console.log('🎬 Full Overlay Preview Loaded');
        console.log('📡 All overlays synced to actual files');
    </script>
</body>
</html>
