<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play-by-Play Animation Styles Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Play-by-Play Box - Same position as overlay */
        .play-by-play-box {
            position: fixed;
            z-index: 10;
            top: 738px;
            left: 30px;
            width: 502px;
            display: block;
            pointer-events: none;
        }

        .play-by-play-box .pbp-box {
            background: linear-gradient(90deg, transparent, rgba(10, 20, 40, 0.95) 20%);
            border-left: 4px solid #60a5fa;
            border-radius: 0 12px 12px 0;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34);
            position: relative;
            overflow: hidden;
        }

        .play-by-play-box .pbp-photo-container {
            width: 106px;
            height: 106px;
            border-radius: 50%;
            border: 2px solid #60a5fa;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .play-by-play-box .pbp-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-by-play-box .pbp-icon {
            font-size: 48px;
            color: #60a5fa;
        }

        .play-by-play-box .pbp-content {
            flex: 1;
        }

        .play-by-play-box .pbp-time {
            font-size: 24px;
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .play-by-play-box .pbp-text {
            font-size: 19px;
            color: #fff;
            font-weight: 600;
        }

        .play-by-play-box .pbp-player {
            color: #60a5fa;
            font-weight: 700;
        }

        .play-by-play-box .pbp-action {
            color: #fbbf24;
        }

        /* Content-only animation targets */
        .play-by-play-box.exiting .pbp-photo,
        .play-by-play-box.exiting .pbp-content,
        .play-by-play-box.exiting .pbp-icon,
        .play-by-play-box.entering .pbp-photo,
        .play-by-play-box.entering .pbp-content,
        .play-by-play-box.entering .pbp-icon {
            animation-fill-mode: forwards;
        }

        /* Animation 21: Photo fades out, Text slides right, Icon rotates out → Photo fades in, Text slides right, Icon rotates in */
        .anim-21.exiting .pbp-photo-container .pbp-photo {
            animation: photoFadeOut21 0.3s ease-in 0.5s forwards;
        }
        .anim-21.exiting .pbp-content {
            animation: textSlideOutRight21 0.5s ease-in forwards;
        }
        .anim-21.exiting .pbp-icon {
            animation: iconRotateOut21 0.5s ease-in forwards;
        }
        .anim-21.entering .pbp-photo-container .pbp-photo {
            animation: photoFadeIn21 0.3s ease-out 0s forwards;
            opacity: 0;
        }
        .anim-21.entering .pbp-content {
            animation: textSlideInRight21 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }
        .anim-21.entering .pbp-icon {
            animation: iconRotateIn21 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }
        @keyframes photoFadeOut21 {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.9); }
        }
        @keyframes textSlideOutRight21 {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(80px); opacity: 0; }
        }
        @keyframes iconRotateOut21 {
            0% { transform: rotate(0deg) scale(1); opacity: 1; }
            100% { transform: rotate(0deg) scale(0); opacity: 0; }
        }
        @keyframes photoFadeIn21 {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes textSlideInRight21 {
            0% { transform: translateX(80px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes iconRotateIn21 {
            0% { transform: rotate(0deg) scale(0); opacity: 0; }
            60% { transform: rotate(0deg) scale(1.3); opacity: 1; }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }
        .anim-22.exiting .pbp-photo {
            animation: photoSlideOutUp22 0.5s ease-in forwards;
        }
        .anim-22.exiting .pbp-content {
            animation: textBlurFadeOut22 0.5s ease-in forwards;
        }
        .anim-22.exiting .pbp-icon {
            animation: iconShrinkOut22 0.4s ease-in forwards;
        }
        .anim-22.entering .pbp-photo {
            animation: photoSlideInDown22 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .anim-22.entering .pbp-content {
            animation: textSharpFadeIn22 0.7s ease-out 0.25s forwards;
            opacity: 0;
        }
        .anim-22.entering .pbp-icon {
            animation: iconGrowIn22 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s forwards;
            opacity: 0;
        }
        @keyframes photoSlideOutUp22 {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        @keyframes textBlurFadeOut22 {
            0% { filter: blur(0); opacity: 1; transform: translateY(0); }
            100% { filter: blur(10px); opacity: 0; transform: translateY(10px); }
        }
        @keyframes iconShrinkOut22 {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes photoSlideInDown22 {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes textSharpFadeIn22 {
            0% { filter: blur(10px); opacity: 0; transform: translateY(-10px); }
            100% { filter: blur(0); opacity: 1; transform: translateY(0); }
        }
        @keyframes iconGrowIn22 {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Animation 23: Photo rotates and scales out, Text slides down, Icon flips → Photo rotates in and scales, Text slides up, Icon flips back */
        .anim-23.exiting .pbp-photo {
            animation: photoRotateScaleOut23 0.5s ease-in forwards;
        }
        .anim-23.exiting .pbp-content {
            animation: textSlideOutDown23 0.5s ease-in forwards;
        }
        .anim-23.exiting .pbp-icon {
            animation: iconFlipOut23 0.4s ease-in forwards;
        }
        .anim-23.entering .pbp-photo {
            animation: photoRotateScaleIn23 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s forwards;
            opacity: 0;
        }
        .anim-23.entering .pbp-content {
            animation: textSlideInUp23 0.6s ease-out 0.25s forwards;
            opacity: 0;
        }
        .anim-23.entering .pbp-icon {
            animation: iconFlipIn23 0.5s ease-out 0.35s forwards;
            opacity: 0;
        }
        @keyframes photoRotateScaleOut23 {
            0% { transform: rotate(0deg) scale(1); opacity: 1; }
            100% { transform: rotate(-180deg) scale(0.3); opacity: 0; }
        }
        @keyframes textSlideOutDown23 {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(60px); opacity: 0; }
        }
        @keyframes iconFlipOut23 {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(-90deg); opacity: 0; }
        }
        @keyframes photoRotateScaleIn23 {
            0% { transform: rotate(180deg) scale(0.3); opacity: 0; }
            60% { transform: rotate(-20deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }
        @keyframes textSlideInUp23 {
            0% { transform: translateY(60px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes iconFlipIn23 {
            0% { transform: rotateY(90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        /* Animation 24: Photo slides right and blurs, Text fades, Icon bounces out → Photo slides left and sharpens, Text fades in, Icon bounces in */
        .anim-24.exiting .pbp-photo {
            animation: photoSlideBlurOut24 0.5s ease-in forwards;
        }
        .anim-24.exiting .pbp-content {
            animation: textFadeOut24 0.4s ease-in forwards;
        }
        .anim-24.exiting .pbp-icon {
            animation: iconBounceOut24 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .anim-24.entering .pbp-photo {
            animation: photoSlideSharpIn24 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .anim-24.entering .pbp-content {
            animation: textFadeIn24 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }
        .anim-24.entering .pbp-icon {
            animation: iconBounceIn24 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.35s forwards;
            opacity: 0;
        }
        @keyframes photoSlideBlurOut24 {
            0% { transform: translateX(0); filter: blur(0); opacity: 1; }
            100% { transform: translateX(120px); filter: blur(15px); opacity: 0; }
        }
        @keyframes textFadeOut24 {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes iconBounceOut24 {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            60% { transform: translateY(20px) scale(1.2); }
            100% { transform: translateY(80px) scale(0.3); opacity: 0; }
        }
        @keyframes photoSlideSharpIn24 {
            0% { transform: translateX(-120px); filter: blur(15px); opacity: 0; }
            100% { transform: translateX(0); filter: blur(0); opacity: 1; }
        }
        @keyframes textFadeIn24 {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes iconBounceIn24 {
            0% { transform: translateY(-80px) scale(0.3); opacity: 0; }
            40% { transform: translateY(-10px) scale(1.15); }
            70% { transform: translateY(5px) scale(0.95); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Animation 25: Photo zooms out, Text flips vertical, Icon slides left → Photo zooms in, Text flips back, Icon slides right */
        .anim-25.exiting .pbp-photo {
            animation: photoZoomOut25 0.4s ease-in forwards;
        }
        .anim-25.exiting .pbp-content {
            animation: textFlipVerticalOut25 0.5s ease-in forwards;
        }
        .anim-25.exiting .pbp-icon {
            animation: iconSlideOutLeft25 0.4s ease-in forwards;
        }
        .anim-25.entering .pbp-photo {
            animation: photoZoomIn25 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
            opacity: 0;
        }
        .anim-25.entering .pbp-content {
            animation: textFlipVerticalIn25 0.6s ease-out 0.25s forwards;
            opacity: 0;
        }
        .anim-25.entering .pbp-icon {
            animation: iconSlideInRight25 0.5s ease-out 0.35s forwards;
            opacity: 0;
        }
        @keyframes photoZoomOut25 {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.2); opacity: 0; }
        }
        @keyframes textFlipVerticalOut25 {
            0% { transform: rotateX(0deg); opacity: 1; }
            100% { transform: rotateX(-90deg); opacity: 0; }
        }
        @keyframes iconSlideOutLeft25 {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100px); opacity: 0; }
        }
        @keyframes photoZoomIn25 {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes textFlipVerticalIn25 {
            0% { transform: rotateX(90deg); opacity: 0; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }
        @keyframes iconSlideInRight25 {
            0% { transform: translateX(100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Animation 26: Photo spins out left, Text wipes left, Icon fades up → Photo spins in right, Text wipes right, Icon fades down */
        .anim-26.exiting .pbp-photo {
            animation: photoSpinOutLeft26 0.6s ease-in forwards;
        }
        .anim-26.exiting .pbp-content {
            animation: textWipeOutLeft26 0.5s ease-in forwards;
        }
        .anim-26.exiting .pbp-icon {
            animation: iconFadeUp26 0.4s ease-in forwards;
        }
        .anim-26.entering .pbp-photo {
            animation: photoSpinInRight26 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s forwards;
            opacity: 0;
        }
        .anim-26.entering .pbp-content {
            animation: textWipeInRight26 0.6s ease-out 0.3s forwards;
            opacity: 0;
            clip-path: inset(0 100% 0 0);
        }
        .anim-26.entering .pbp-icon {
            animation: iconFadeDown26 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }
        @keyframes photoSpinOutLeft26 {
            0% { transform: rotate(0deg) translateX(0); opacity: 1; }
            100% { transform: rotate(-360deg) translateX(-150px); opacity: 0; }
        }
        @keyframes textWipeOutLeft26 {
            0% { clip-path: inset(0 0% 0 0); opacity: 1; }
            100% { clip-path: inset(0 100% 0 0); opacity: 0; }
        }
        @keyframes iconFadeUp26 {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
        @keyframes photoSpinInRight26 {
            0% { transform: rotate(360deg) translateX(150px); opacity: 0; }
            60% { transform: rotate(-10deg) translateX(-10px); }
            100% { transform: rotate(0deg) translateX(0); opacity: 1; }
        }
        @keyframes textWipeInRight26 {
            0% { clip-path: inset(0 100% 0 0); opacity: 0; }
            100% { clip-path: inset(0 0% 0 0); opacity: 1; }
        }
        @keyframes iconFadeDown26 {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Animation 27: Photo splits left, Text splits right, Icon disappears → Photo merges left, Text merges right, Icon appears */
        .anim-27.exiting .pbp-photo {
            animation: photoSplitLeft27 0.5s ease-in forwards;
        }
        .anim-27.exiting .pbp-content {
            animation: textSplitRight27 0.5s ease-in forwards;
        }
        .anim-27.exiting .pbp-icon {
            animation: iconDisappear27 0.3s ease-in forwards;
        }
        .anim-27.entering .pbp-photo {
            animation: photoMergeLeft27 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .anim-27.entering .pbp-content {
            animation: textMergeRight27 0.6s ease-out 0.25s forwards;
            opacity: 0;
        }
        .anim-27.entering .pbp-icon {
            animation: iconAppear27 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s forwards;
            opacity: 0;
        }
        @keyframes photoSplitLeft27 {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            100% { transform: translateX(-150px) scale(0.6); opacity: 0; }
        }
        @keyframes textSplitRight27 {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(150px); opacity: 0; }
        }
        @keyframes iconDisappear27 {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes photoMergeLeft27 {
            0% { transform: translateX(-150px) scale(0.6); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        @keyframes textMergeRight27 {
            0% { transform: translateX(150px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes iconAppear27 {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Animation 28: Photo slides up and fades, Text slides down and fades, Icon rotates out → Photo slides down and fades in, Text slides up and fades in, Icon rotates in */
        .anim-28.exiting .pbp-photo {
            animation: photoSlideUpFade28 0.5s ease-in forwards;
        }
        .anim-28.exiting .pbp-content {
            animation: textSlideDownFade28 0.5s ease-in forwards;
        }
        .anim-28.exiting .pbp-icon {
            animation: iconRotateOut28 0.4s ease-in forwards;
        }
        .anim-28.entering .pbp-photo {
            animation: photoSlideDownFade28 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .anim-28.entering .pbp-content {
            animation: textSlideUpFade28 0.6s ease-out 0.25s forwards;
            opacity: 0;
        }
        .anim-28.entering .pbp-icon {
            animation: iconRotateIn28 0.5s ease-out 0.35s forwards;
            opacity: 0;
        }
        @keyframes photoSlideUpFade28 {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }
        @keyframes textSlideDownFade28 {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(80px); opacity: 0; }
        }
        @keyframes iconRotateOut28 {
            0% { transform: rotate(0deg); opacity: 1; }
            100% { transform: rotate(180deg) scale(0.5); opacity: 0; }
        }
        @keyframes photoSlideDownFade28 {
            0% { transform: translateY(-80px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes textSlideUpFade28 {
            0% { transform: translateY(80px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes iconRotateIn28 {
            0% { transform: rotate(-180deg) scale(0.5); opacity: 0; }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        /* Animation 29: Photo scales and blurs out, Text elastic bounce out, Icon slides out → Photo scales and sharpens in, Text elastic bounce in, Icon slides in */
        .anim-29.exiting .pbp-photo {
            animation: photoScaleBlurOut29 0.5s ease-in forwards;
        }
        .anim-29.exiting .pbp-content {
            animation: textElasticOut29 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .anim-29.exiting .pbp-icon {
            animation: iconSlideOut29 0.4s ease-in forwards;
        }
        .anim-29.entering .pbp-photo {
            animation: photoScaleSharpIn29 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .anim-29.entering .pbp-content {
            animation: textElasticIn29 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.25s forwards;
            opacity: 0;
        }
        .anim-29.entering .pbp-icon {
            animation: iconSlideIn29 0.5s ease-out 0.4s forwards;
            opacity: 0;
        }
        @keyframes photoScaleBlurOut29 {
            0% { transform: scale(1); filter: blur(0); opacity: 1; }
            100% { transform: scale(0.8); filter: blur(12px); opacity: 0; }
        }
        @keyframes textElasticOut29 {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            60% { transform: translateX(-80px) scale(1.1); }
            100% { transform: translateX(-150px) scale(0.3); opacity: 0; }
        }
        @keyframes iconSlideOut29 {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100px); opacity: 0; }
        }
        @keyframes photoScaleSharpIn29 {
            0% { transform: scale(0.8); filter: blur(12px); opacity: 0; }
            100% { transform: scale(1); filter: blur(0); opacity: 1; }
        }
        @keyframes textElasticIn29 {
            0% { transform: translateX(150px) scale(0.3); opacity: 0; }
            40% { transform: translateX(-30px) scale(1.15); }
            70% { transform: translateX(10px) scale(0.9); }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        @keyframes iconSlideIn29 {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Animation 30: Photo flips and fades, Text slides right with scale, Icon spins out → Photo flips back and fades in, Text slides left with scale, Icon spins in */
        .anim-30.exiting .pbp-photo {
            animation: photoFlipFadeOut30 0.5s ease-in forwards;
        }
        .anim-30.exiting .pbp-content {
            animation: textSlideScaleOut30 0.5s ease-in forwards;
        }
        .anim-30.exiting .pbp-icon {
            animation: iconSpinOut30 0.5s ease-in forwards;
        }
        .anim-30.entering .pbp-photo {
            animation: photoFlipFadeIn30 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .anim-30.entering .pbp-content {
            animation: textSlideScaleIn30 0.6s ease-out 0.25s forwards;
            opacity: 0;
        }
        .anim-30.entering .pbp-icon {
            animation: iconSpinIn30 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s forwards;
            opacity: 0;
        }
        @keyframes photoFlipFadeOut30 {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(-90deg); opacity: 0; }
        }
        @keyframes textSlideScaleOut30 {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            100% { transform: translateX(100px) scale(0.8); opacity: 0; }
        }
        @keyframes iconSpinOut30 {
            0% { transform: rotate(0deg) scale(1); opacity: 1; }
            100% { transform: rotate(-360deg) scale(0); opacity: 0; }
        }
        @keyframes photoFlipFadeIn30 {
            0% { transform: rotateY(90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes textSlideScaleIn30 {
            0% { transform: translateX(-100px) scale(0.8); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        @keyframes iconSpinIn30 {
            0% { transform: rotate(360deg) scale(0); opacity: 0; }
            60% { transform: rotate(-20deg) scale(1.2); }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Play-by-Play Box -->
    <div class="play-by-play-box anim-21" id="playByPlayBox">
        <div class="pbp-box" id="pbpBoxContent">
            <div class="pbp-photo-container">
                <img class="pbp-photo" id="pbpPhoto" src="https://a.espncdn.com/i/headshots/nba/players/full/4066648.png" alt="Player">
            </div>
            <div class="pbp-icon" id="pbpIcon">⚡</div>
            <div class="pbp-content">
                <div class="pbp-time" id="pbpTime">Q4 11:18</div>
                <div class="pbp-text" id="pbpText">
                    <span class="pbp-player" id="pbpPlayer">Luka Doncic</span> <span class="pbp-action" id="pbpAction">scored 3 points</span>
                </div>

        </div>
    </div>

    <script>
        // Hardcoded play-by-play test examples
        const playByPlayExamples = [
            {
                period: 4,

            {
                period: 1,

            {

            {

            {

            {

                action: "made deep 3-pointer - 3 PTS",
                icon: "🔥"
            }
        ];

        let currentPlayIndex = 0;
        const playByPlayBox = document.getElementById('playByPlayBox');
        const pbpPhoto = document.getElementById('pbpPhoto');
        const pbpTime = document.getElementById('pbpTime');
        const pbpPlayer = document.getElementById('pbpPlayer');
        const pbpAction = document.getElementById('pbpAction');
        const pbpIcon = document.getElementById('pbpIcon');

        // Function to update play-by-play display with exit/enter animations
        function updatePlayByPlay(play) {
            if (!play) return;
            
            const pbpBox = document.getElementById('pbpBoxContent');
            
            // Remove animation state classes
            playByPlayBox.classList.remove('exiting', 'entering');
            
            // Reset styles for content animations
            {
                const photoImg = pbpPhoto;
                photoImg.style.transform = '';
                photoImg.style.opacity = '';
                photoImg.style.filter = '';
                photoImg.style.animation = '';
                photoImg.style.clipPath = '';
                
                const pbpContent = document.querySelector('.pbp-content');
                if (pbpContent) {
                    pbpContent.style.transform = '';
                    pbpContent.style.opacity = '';
                    pbpContent.style.filter = '';
                    pbpContent.style.animation = '';
                    pbpContent.style.clipPath = '';
                }
                
                pbpIcon.style.transform = '';
                pbpIcon.style.opacity = '';
                pbpIcon.style.filter = '';
                pbpIcon.style.animation = '';
                pbpIcon.style.clipPath = '';
            }
            
            // Add exit animation class
            playByPlayBox.classList.add('anim-21', 'exiting');
            
            // Force reflow
            void pbpPhoto.offsetWidth || pbpBox.offsetWidth;
            
            // Sequence: content exits (0-0.5s), then old pic fades out (0.5-0.8s), then new pic fades in (0.8-1.1s), then content enters (1.2-1.7s)
            // Update image source right when old pic finishes fading out, then trigger new pic fade in
            setTimeout(() => {
                // Update image source right as old picture finishes fading out (at 0.8s)
                pbpPhoto.src = play.playerPhoto;
                pbpPhoto.alt = play.playerName;
                
                // Update text content (will be hidden until CSS animation brings it in at 1.2s)
                pbpTime.textContent = `Q${play.period} ${play.clock}`;
                pbpPlayer.textContent = play.playerName;
                pbpAction.textContent = play.action;
                pbpIcon.textContent = play.icon;
                
                // Remove exiting, add entering (this triggers the new pic fade-in and content enter animations)
                playByPlayBox.classList.remove('exiting');
                playByPlayBox.classList.add('entering');
                
                // Reset and force reflow for enter animation
                void pbpPhoto.offsetWidth || pbpBox.offsetWidth;
                
                // After all enter animations complete, clean up
                setTimeout(() => {
                    playByPlayBox.classList.remove('entering');
                    
                    // Reset all inline styles after animation
                    const photoImg = pbpPhoto;
                    photoImg.style.opacity = '';
                    photoImg.style.clipPath = '';
                    photoImg.style.filter = '';
                    const pbpContent = document.querySelector('.pbp-content');
                    if (pbpContent) {
                        pbpContent.style.opacity = '';
                        pbpContent.style.clipPath = '';
                        pbpContent.style.filter = '';
                    }
                    pbpIcon.style.opacity = '';
                    pbpIcon.style.clipPath = '';
                    pbpIcon.style.filter = '';
                }, 700); // Max animation duration (0.1s delay + 0.5s animation + 0.1s buffer)
            }, 800); // Wait for content exit (0.5s) + old pic fade out (0.3s) = 0.8s
        }

        // Cycle through examples every 3 seconds
        function cyclePlayByPlayExamples() {
            currentPlayIndex = (currentPlayIndex + 1) % playByPlayExamples.length;
            updatePlayByPlay(playByPlayExamples[currentPlayIndex]);
        }

        // Start cycling when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            // Show first example immediately without animation
            const firstPlay = playByPlayExamples[0];
            pbpPhoto.src = firstPlay.playerPhoto;
            pbpPhoto.alt = firstPlay.playerName;
            pbpTime.textContent = `Q${firstPlay.period} ${firstPlay.clock}`;
            pbpPlayer.textContent = firstPlay.playerName;
            pbpAction.textContent = firstPlay.action;
            pbpIcon.textContent = firstPlay.icon;
            
            // Cycle through examples every 3 seconds with animations
            setTimeout(() => {
                setInterval(cyclePlayByPlayExamples, 3000);
            }, 1000); // Start after 1 second
        });

        // Expose functions for console control
        window.updatePlayByPlay = updatePlayByPlay;
        window.playByPlayExamples = playByPlayExamples;
    </script>
</body>
