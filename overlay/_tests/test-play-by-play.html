<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play-by-Play Design Preview - Press F11 for Fullscreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .preview-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Video background */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay iframes - positioned absolutely to match OBS layout */
        .overlay-frame {
            position: absolute;
            border: none;
            background: transparent;
            pointer-events: none; /* Allow clicking through for testing */
        }
        
        /* Override for interactive frames */
        .overlay-frame.game-stats-frame,
        .overlay-frame.chat-overlay-frame {
            pointer-events: auto !important;
        }

        /* Title overlay - top left */
        .title-overlay-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
        }

        /* Game stats overlay - left side, vertically centered */
        .game-stats-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: auto !important; /* Enable interactions for controls */
        }
        
        #game-stats-frame {
            pointer-events: auto !important;
        }

        /* Socials overlay - bottom right */
        .socials-overlay-frame {
            bottom: 0;
            right: 0;
            width: 100%;
            height: 150px;
            z-index: 15;
        }

        /* Chat overlay - clean version */
        .chat-overlay-frame {
            position: absolute;
            top: 0;
            right: 0;
            width: 1920px;
            height: 1080px;
            z-index: 25;
            border: none;
            background: transparent;
            pointer-events: auto; /* Enable controls interaction */
        }

        /* Play-by-Play Overlay Container */
        .pbp-container {
            position: absolute;
            z-index: 30;
            pointer-events: none; /* Allow clicking through PBP to overlays */
        }

        /* Show play-by-play design */
        .pbp-design {
            display: block;
        }
        
        /* Ensure video and overlays are visible behind PBP */
        .preview-container {
            background: #000;
        }

        /* Play-by-Play Design 11: Top Right with Style 5 Content */
        #pbp-11 {
            top: 150px;
            right: 30px;
            width: 550px;
        }

        #pbp-11 .pbp-box {
            background: linear-gradient(90deg, transparent, rgba(10, 20, 40, 0.95) 20%);
            border-left: 4px solid #60a5fa;
            border-radius: 0 12px 12px 0;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34);
        }

        #pbp-11 .pbp-photo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #60a5fa;
            object-fit: cover;
            flex-shrink: 0;
        }

        #pbp-11 .pbp-icon {
            font-size: 48px;
            color: #60a5fa;
        }

        #pbp-11 .pbp-content {
            flex: 1;
        }

        #pbp-11 .pbp-time {
            font-size: 24px;
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 8px;
        }

        #pbp-11 .pbp-text {
            font-size: 34px;
            color: #fff;
            font-weight: 600;
        }

        #pbp-11 .pbp-player {
            color: #60a5fa;
            font-weight: 700;
        }

    </style>
</head>
<body>
    <div class="preview-container">
        <!-- Video Background -->
        <video class="video-background" autoplay loop muted playsinline>
            <source src="../game.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <!-- Title Overlay (top left) -->
        <iframe 
            class="overlay-frame title-overlay-frame" 
            src="../title-overlay/index.html"
            id="title-frame">
        </iframe>

        <!-- Game Stats Overlay (left side) -->
        <iframe 
            class="overlay-frame game-stats-frame" 
            src="../nba-live-overlay/index.html"
            id="game-stats-frame">
        </iframe>

        <!-- Socials Overlay (bottom right) -->
        <iframe 
            class="overlay-frame socials-overlay-frame" 
            src="../socials-overlay/index.html"
            id="socials-frame">
        </iframe>

        <!-- Chat Overlay -->
        <iframe 
            class="overlay-frame chat-overlay-frame" 
            src="../chat-overlay/display/index.html"
            id="chat-frame">
        </iframe>

        <!-- Play-by-Play Design -->
        <div class="pbp-container pbp-design active" id="pbp-11">
            <div class="pbp-box">
                <img class="pbp-photo" src="https://a.espncdn.com/i/headshots/nba/players/full/4066648.png" alt="Luka Doncic">
                <div class="pbp-icon">⚡</div>
                <div class="pbp-content">
                    <div class="pbp-time">Q4 11:18</div>
                    <div class="pbp-text">
                        <span class="pbp-player">Luka Doncic</span> <span class="pbp-action">scored 3 points</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
