<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="chat-styles-creative.css">
</head>
<body>
    <video class="gameplay-video" autoplay loop muted><source src="../game.mp4" type="video/mp4"></video>

    <div class="title-overlay"><div class="title-main">Silent Basketball</div><div class="title-sub">A S M R</div></div>

    <div class="nba-overlay">
        <div class="live-indicator"><div class="live-dot"></div><span class="live-text">Live</span><span class="nba-label">NBA</span></div>
        <div class="teams">
            <div class="team"><div class="team-left"><img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="LAL"><div class="team-abbr">LAL</div></div><div class="score">87</div></div>
            <div class="team"><div class="team-left"><img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/gs.png" alt="GSW"><div class="team-abbr">GSW</div></div><div class="score">82</div></div>
        </div>
        <div class="game-status">Q3 · 8:42</div>
    </div>

    <div class="socials-overlay">
        <div class="social-bg"></div>
        <div class="social-content">
            <div class="socials-icons">
                <div class="social-item"><i class="fab fa-instagram"></i><span class="count">147.2K</span></div>
                <div class="social-item"><i class="fab fa-youtube"></i><span class="count">5.1K</span></div>
                <div class="social-item"><i class="fab fa-tiktok"></i><span class="count">510</span></div>
            </div>
            <div class="social-divider"></div>
            <div style="display: flex; flex-direction: column;">
                <span class="social-handle"><span class="at">@</span><span class="hush">hush</span><span class="swish">swish</span></span>
                <span class="social-subtitle">silent basketball</span>
            </div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <h3>🎛️ Chat Controls</h3>
        
        <div class="control-group">
            <label>List X (right) <span id="val-list-x">31</span>px</label>
            <input type="range" id="ctrl-list-x" min="-500" max="1920" value="31">
        </div>
        
        <div class="control-group">
            <label>List Y (top) <span id="val-list-y">5</span>px</label>
            <input type="range" id="ctrl-list-y" min="-500" max="1080" value="5">
        </div>
        
        <div class="control-group">
            <label>Chat Gap <span id="val-gap">26</span>px</label>
            <input type="range" id="ctrl-gap" min="10" max="150" value="26">
        </div>

        <div class="control-divider"></div>
        
        <div class="control-group">
            <label>Staged X (left) <span id="val-stage-x">-243</span>px</label>
            <input type="range" id="ctrl-stage-x" min="-500" max="1920" value="-243">
        </div>
        
        <div class="control-group">
            <label>Staged Y (top) <span id="val-stage-y">538</span>px</label>
            <input type="range" id="ctrl-stage-y" min="-500" max="1080" value="538">
        </div>

        <div class="control-divider"></div>
        
        <div class="control-group">
            <label>Staged Pic Size <span id="val-pic-staged">138</span>px</label>
            <input type="range" id="ctrl-pic-staged" min="20" max="200" value="138">
        </div>
        
        <div class="control-group">
            <label>List Pic Size <span id="val-pic-list">17</span>px</label>
            <input type="range" id="ctrl-pic-list" min="10" max="100" value="17">
        </div>

        <div class="control-divider"></div>
        
        <div class="control-group">
            <label>Font Size <span id="val-font">21</span>px</label>
            <input type="range" id="ctrl-font" min="8" max="40" value="21">
        </div>
        
        <div class="control-group">
            <label>Entry Gap <span id="val-entry-gap">6</span>px</label>
            <input type="range" id="ctrl-entry-gap" min="0" max="40" value="6">
        </div>

        <div class="control-divider"></div>

        <div class="control-group">
            <label>Stage BG Padding <span id="val-bg-padding">16</span>px</label>
            <input type="range" id="ctrl-bg-padding" min="0" max="40" value="16">
        </div>

        <div class="control-group">
            <label>Stage BG Alpha <span id="val-bg-alpha">0.4</span></label>
            <input type="range" id="ctrl-bg-alpha" min="0" max="100" value="40" step="1">
        </div>

        <div class="control-group">
            <label>Stage Time <span id="val-stage-time">1800</span>ms</label>
            <input type="range" id="ctrl-stage-time" min="500" max="8000" value="1800">
        </div>

        <div class="control-divider"></div>

        <button id="export-btn" style="width: 100%; padding: 10px; background: rgba(59, 130, 246, 0.3); border: 1px solid rgba(59, 130, 246, 0.5); border-radius: 6px; color: #93c5fd; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px;">📋 Export Values</button>
        <pre id="export-output" style="display: none; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; font-size: 10px; color: #94a3b8; white-space: pre-wrap; word-break: break-all;"></pre>
    </div>

    <!-- Ghost Chat Canvas -->
    <div class="chat-canvas" id="ghost-chat"></div>

    <script>
        // ========== CONTROL PANEL ==========
        const canvas = document.getElementById('ghost-chat');
        
        // Settings object
        const settings = {
            listX: 31,
            listY: 5,
            gap: 26,
            stageX: -243,
            stageY: 538,
            picStaged: 138,
            picList: 17,
            fontSize: 21,
            entryGap: 6,
            bgPadding: 16,
            stageTime: 1800,
            bgAlpha: 0.4
        };

        // Update CSS custom properties
        function updateStyles() {
            if (!canvas) {
                console.error('Canvas not found!');
                return;
            }
            
            // Chat canvas position
            canvas.style.right = settings.listX + 'px';
            canvas.style.top = settings.listY + 'px';
            canvas.style.display = 'block'; // Ensure it's visible
            
            // Update CSS variables for dynamic styling
            document.documentElement.style.setProperty('--stage-x', settings.stageX + 'px');
            document.documentElement.style.setProperty('--stage-y', settings.stageY + 'px');
            document.documentElement.style.setProperty('--pic-staged', settings.picStaged + 'px');
            document.documentElement.style.setProperty('--pic-list', settings.picList + 'px');
            document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
            document.documentElement.style.setProperty('--entry-gap', settings.entryGap + 'px');
            document.documentElement.style.setProperty('--bg-padding', settings.bgPadding + 'px');
            document.documentElement.style.setProperty('--bg-alpha', settings.bgAlpha);
            
            // Update existing messages
            if (typeof updateListPositions === 'function') {
                updateListPositions();
            }
        }

        // Wire up sliders
        function setupControls() {
            const controls = [
                { id: 'ctrl-list-x', key: 'listX', valId: 'val-list-x' },
                { id: 'ctrl-list-y', key: 'listY', valId: 'val-list-y' },
                { id: 'ctrl-gap', key: 'gap', valId: 'val-gap' },
                { id: 'ctrl-stage-x', key: 'stageX', valId: 'val-stage-x' },
                { id: 'ctrl-stage-y', key: 'stageY', valId: 'val-stage-y' },
                { id: 'ctrl-pic-staged', key: 'picStaged', valId: 'val-pic-staged' },
                { id: 'ctrl-pic-list', key: 'picList', valId: 'val-pic-list' },
                { id: 'ctrl-font', key: 'fontSize', valId: 'val-font' },
                { id: 'ctrl-entry-gap', key: 'entryGap', valId: 'val-entry-gap' },
                { id: 'ctrl-bg-padding', key: 'bgPadding', valId: 'val-bg-padding' },
                { id: 'ctrl-bg-alpha', key: 'bgAlpha', valId: 'val-bg-alpha', isFloat: true, scale: 0.01 },
                { id: 'ctrl-stage-time', key: 'stageTime', valId: 'val-stage-time' },
            ];

            controls.forEach(ctrl => {
                const slider = document.getElementById(ctrl.id);
                const valDisplay = document.getElementById(ctrl.valId);
                
                slider.addEventListener('input', (e) => {
                    if (ctrl.isFloat) {
                        settings[ctrl.key] = parseFloat(e.target.value) * ctrl.scale;
                        valDisplay.textContent = settings[ctrl.key].toFixed(2);
                    } else {
                        settings[ctrl.key] = parseInt(e.target.value);
                        valDisplay.textContent = e.target.value;
                    }
                    updateStyles();
                });
            });

            // Export button
            document.getElementById('export-btn').addEventListener('click', () => {
                const output = document.getElementById('export-output');
                const exportText = `Chat Overlay Settings:
─────────────────────
List X (right): ${settings.listX}px
List Y (top): ${settings.listY}px
Chat Gap: ${settings.gap}px
Staged X (left): ${settings.stageX}px
Staged Y (top): ${settings.stageY}px
Staged Pic Size: ${settings.picStaged}px
List Pic Size: ${settings.picList}px
Font Size: ${settings.fontSize}px
Entry Gap: ${settings.entryGap}px
Stage BG Padding: ${settings.bgPadding}px
Stage BG Alpha: ${settings.bgAlpha.toFixed(2)}
Stage Time: ${settings.stageTime}ms`;
                
                output.textContent = exportText;
                output.style.display = 'block';
                
                // Copy to clipboard
                navigator.clipboard.writeText(exportText).then(() => {
                    document.getElementById('export-btn').textContent = '✅ Copied!';
                    setTimeout(() => {
                        document.getElementById('export-btn').textContent = '📋 Export Values';
                    }, 2000);
                });
            });
        }

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setupControls();
                updateStyles(); // Initialize with default values
            });
        } else {
            setupControls();
            updateStyles(); // Initialize with default values
        }

        // ========== CHAT MESSAGES ==========
        // Sample messages with actual profile pics (using random avatar services)
        const msgs = [
            { user: 'hushswish_fan', text: 'so relaxing', avatar: 'https://i.pravatar.cc/150?img=1' },
            { user: 'bball_lover', text: 'love the vibes', avatar: 'https://i.pravatar.cc/150?img=3' },
            { user: 'nightowl23', text: 'whos winning?', avatar: 'https://i.pravatar.cc/150?img=5' },
            { user: 'silent_hoops', text: 'W stream', avatar: 'https://i.pravatar.cc/150?img=7' },
            { user: 'asmr_addict', text: 'keyboard sounds 🔥', avatar: 'https://i.pravatar.cc/150?img=8' },
            { user: 'chill_gamer', text: 'perfect vibes', avatar: 'https://i.pravatar.cc/150?img=11' },
            { user: 'zen_master', text: 'so peaceful', avatar: 'https://i.pravatar.cc/150?img=12' },
            { user: 'newbie_here', text: 'first time!', avatar: 'https://i.pravatar.cc/150?img=14' },
            { user: 'lol_master', text: 'lmaooo 💀', avatar: 'https://i.pravatar.cc/150?img=15' },
            { user: 'RTB_18', text: 'pullin up', avatar: 'https://i.pravatar.cc/150?img=18' },
            { user: 'KaponeONS', text: 'how to be 99 overall', avatar: 'https://i.pravatar.cc/150?img=20' },
            { user: 'Thatchy2k', text: 'YOUUUU', avatar: 'https://i.pravatar.cc/150?img=22' },
            { user: 'longtime_lurker', text: 'been watching for months and this is still the best asmr basketball content on the platform hands down', avatar: 'https://i.pravatar.cc/150?img=25' },
            { user: 'hoops_enthusiast', text: 'the way you handle those controls is just so smooth and satisfying to watch fr fr', avatar: 'https://i.pravatar.cc/150?img=30' },
            { user: 'midnight_viewer', text: 'this is literally perfect for falling asleep to thank you so much for this content seriously', avatar: 'https://i.pravatar.cc/150?img=33' },
        ];

        const userColors = ['#f472b6', '#fb923c', '#a78bfa', '#4ade80', '#60a5fa', '#fbbf24', '#f87171', '#2dd4bf', '#c084fc', '#fb7185', '#34d399', '#38bdf8'];

        const MAX = 5;
        let msgIdx = 0;
        const messagesList = [];
        let isStaging = false; // Track if a message is currently staged

        function getGhostHTML(msg, color) {
            return `<img class="profile-pic" src="${msg.avatar}" alt="${msg.user}"><div class="content"><span class="user" style="color:${color}">${msg.user}</span>${msg.text}</div>`;
        }

        function updateListPositions() {
            let currentY = settings.listY; // Start from top
            
            messagesList.forEach((el, index) => {
                if (!el.classList.contains('exiting')) {
                    // Position based on actual heights of previous messages
                    el.style.top = currentY + 'px';
                    // Add this message's height + gap for next message
                    currentY += el.offsetHeight + settings.gap;
                }
            });
        }

        function addMessage() {
            // Don't add new message if one is currently staging
            if (isStaging) {
                return;
            }
            
            const msg = msgs[msgIdx % msgs.length];
            const color = userColors[msgIdx % userColors.length];
            msgIdx++;

            const canvas = document.getElementById('ghost-chat');

            const messageEl = document.createElement('div');
            messageEl.className = 'message entering ghost-style';
            messageEl.innerHTML = `<div class="entry">${getGhostHTML(msg, color)}</div>`;
            
            canvas.appendChild(messageEl);
            isStaging = true; // Mark as staging

            // Trigger ghost entry transition: entering → staged
            setTimeout(() => {
                messageEl.classList.remove('entering');
                messageEl.classList.add('staged');
            }, 50); // Small delay to trigger CSS transition

            // After stage time, transition to list
            setTimeout(() => {
                messagesList.push(messageEl);
                
                // Calculate position based on actual heights of previous messages
                let targetY = settings.listY;
                for (let i = 0; i < messagesList.length - 1; i++) {
                    targetY += messagesList[i].offsetHeight + settings.gap;
                }
                
                // Set position first
                messageEl.style.top = targetY + 'px';
                
                // Change classes - all properties (background, padding, border-radius, etc.) will transition via CSS
                messageEl.classList.add('in-list');
                messageEl.classList.remove('staged');
                
                // Update other messages positions
                updateListPositions();

                // Remove old messages if too many
                if (messagesList.length > MAX) {
                    const oldest = messagesList.shift();
                    oldest.classList.add('exiting');
                    setTimeout(() => oldest.remove(), 1200);
                    
                    // Recalculate positions for remaining messages (scroll up)
                    updateListPositions();
                }

                // After transition completes, allow new messages
                setTimeout(() => {
                    isStaging = false;
                }, 1200); // Match transition duration
            }, settings.stageTime);
        }

        // Start
        addMessage();
        setInterval(addMessage, 3500);
    </script>
</body>
</html>
