<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Design Preview - Press F11 for Fullscreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .preview-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Video background */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay iframes - positioned absolutely to match OBS layout */
        .overlay-frame {
            position: absolute;
            border: none;
            background: transparent;
            pointer-events: none;
        }

        /* Title overlay - top left */
        .title-overlay-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
        }

        /* Socials overlay - bottom right */
        .socials-overlay-frame {
            bottom: 0;
            right: 0;
            width: 100%;
            height: 150px;
            z-index: 15;
        }

        /* Scoreboard container */
        .scoreboard-container {
            position: absolute;
            z-index: 30;
            pointer-events: auto;
        }

        /* ============================================
           Scoreboard: Vertical Left with Stats Rows
           ============================================ */
        #scoreboard-11 {
            top: 80px;
            left: 30px;
            width: 500px;
        }

        #scoreboard-11 .sb-header {
            background: rgba(10, 20, 40, 0.95);
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.4);
        }

        #scoreboard-11 .sb-time {
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24;
            text-align: center;
            padding: 12px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #scoreboard-11 .sb-scores {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        #scoreboard-11 .sb-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #scoreboard-11 .sb-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 12px;
        }

        #scoreboard-11 .sb-team-name {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        #scoreboard-11 .sb-score {
            font-size: 60px;
            font-weight: 800;
            color: #60a5fa;
        }

        #scoreboard-11 .sb-stats {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        #scoreboard-11 .sb-stats-title {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 15px;
            text-align: center;
        }

        #scoreboard-11 .sb-stats-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            font-size: 13px;
        }

        #scoreboard-11 .sb-stats-row:last-child {
            border-bottom: none;
        }

        #scoreboard-11 .sb-stat-label {
            font-weight: 600;
            color: #93c5fd;
        }

        #scoreboard-11 .sb-stat-value {
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        /* Position Control Panel */
        .position-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 20, 40, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            z-index: 1000;
            border: 2px solid rgba(59, 130, 246, 0.6);
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34);
            min-width: 280px;
        }

        .control-label {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .control-row label {
            color: #60a5fa;
            font-size: 13px;
            font-weight: 500;
            min-width: 45px;
        }

        .control-row input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.5);
            transition: background 0.2s;
        }

        .control-row input[type="range"]::-webkit-slider-thumb:hover {
            background: #60a5fa;
        }

        .control-row input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.5);
            transition: background 0.2s;
        }

        .control-row input[type="range"]::-moz-range-thumb:hover {
            background: #60a5fa;
        }

        .control-row span {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover {
            background: rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <!-- Video Background -->
        <video class="video-background" autoplay loop muted playsinline>
            <source src="../game.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <!-- Title Overlay (top left) -->
        <iframe 
            class="overlay-frame title-overlay-frame" 
            src="../title-overlay/index.html"
            id="title-frame">
        </iframe>

        <!-- Socials Overlay (bottom right) -->
        <iframe 
            class="overlay-frame socials-overlay-frame" 
            src="../socials-overlay/index.html"
            id="socials-frame">
        </iframe>

        <!-- Scoreboard -->
        <div class="scoreboard-container" id="scoreboard-11">
            <div class="sb-header">
                <div class="sb-time">3rd QTR - 4:15</div>
                <div class="sb-scores">
                    <div class="sb-team">
                        <img class="sb-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/nyk.png" alt="Knicks">
                        <div class="sb-team-name">Knicks</div>
                        <div class="sb-score">68</div>
                    </div>
                    <div class="sb-team">
                        <img class="sb-logo" src="https://a.espncdn.com/i/teamlogos/nba/500/ind.png" alt="Pacers">
                        <div class="sb-team-name">Pacers</div>
                        <div class="sb-score">83</div>
                    </div>
                </div>
                <div class="sb-stats">
                    <div class="sb-stats-row">
                        <div class="sb-stat-label">FGM/FGA</div>
                        <div class="sb-stat-value">28/47</div>
                        <div class="sb-stat-value">32/63</div>
                    </div>
                    <div class="sb-stats-row">
                        <div class="sb-stat-label">REB/OFF</div>
                        <div class="sb-stat-value">19/12</div>
                        <div class="sb-stat-value">18/9</div>
                    </div>
                    <div class="sb-stats-row">
                        <div class="sb-stat-label">AST/TO</div>
                        <div class="sb-stat-value">26/10</div>
                        <div class="sb-stat-value">32/11</div>
                    </div>
                    <div class="sb-stats-row">
                        <div class="sb-stat-label">3-PT</div>
                        <div class="sb-stat-value">9/28 (32.1%)</div>
                        <div class="sb-stat-value">6/24 (25.0%)</div>
                    </div>
                    <div class="sb-stats-row">
                        <div class="sb-stat-label">FT</div>
                        <div class="sb-stat-value">7/13 (53.8%)</div>
                        <div class="sb-stat-value">13/14 (92.9%)</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Position Control Panel -->
        <div class="position-controls" id="positionControls">
            <div class="control-label">Position Controls</div>
            <div class="control-row">
                <label for="topSlider">Top:</label>
                <input type="range" id="topSlider" min="0" max="1000" value="80" step="1">
                <span id="topValue">80px</span>
            </div>
            <div class="control-row">
                <label for="leftSlider">Left:</label>
                <input type="range" id="leftSlider" min="0" max="2000" value="30" step="1">
                <span id="leftValue">30px</span>
            </div>
            <button id="copyPositionBtn" class="copy-btn">Copy Position Values</button>
        </div>
    </div>

    <script>
        // Position Controls
        window.addEventListener('DOMContentLoaded', () => {
            const topSlider = document.getElementById('topSlider');
            const leftSlider = document.getElementById('leftSlider');
            const topValue = document.getElementById('topValue');
            const leftValue = document.getElementById('leftValue');
            const copyBtn = document.getElementById('copyPositionBtn');
            const scoreboard = document.getElementById('scoreboard-11');

            if (!topSlider || !leftSlider || !scoreboard) {
                console.warn('Position controls elements not found');
                return;
            }

            // Initialize sliders with current values
            const computedStyle = window.getComputedStyle(scoreboard);
            const currentTop = parseInt(computedStyle.top) || 80;
            const currentLeft = parseInt(computedStyle.left) || 30;
            topSlider.value = currentTop;
            leftSlider.value = currentLeft;
            topValue.textContent = currentTop + 'px';
            leftValue.textContent = currentLeft + 'px';

            // Update position on slider change
            topSlider.addEventListener('input', (e) => {
                const value = parseInt(e.target.value);
                scoreboard.style.top = value + 'px';
                topValue.textContent = value + 'px';
            });

            leftSlider.addEventListener('input', (e) => {
                const value = parseInt(e.target.value);
                scoreboard.style.left = value + 'px';
                leftValue.textContent = value + 'px';
            });

            // Copy position values to clipboard
            copyBtn.addEventListener('click', () => {
                const top = parseInt(topSlider.value);
                const left = parseInt(leftSlider.value);
                const text = `top: ${top}px; left: ${left}px;`;
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => {
                            copyBtn.textContent = 'Copy Position Values';
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy:', err);
                        // Fallback for older browsers
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => {
                            copyBtn.textContent = 'Copy Position Values';
                        }, 2000);
                    });
                } else {
                    // Fallback for older browsers
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = 'Copy Position Values';
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>
