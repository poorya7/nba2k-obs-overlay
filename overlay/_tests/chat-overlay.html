<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        /* ========================================
           CHAT OVERLAY BASE
           ======================================== */
        .chat-overlay {
            position: fixed;
            right: 19px;
            top: -14px;
            width: 281px;
            z-index: 10;
            display: none;
        }

        .chat-overlay.active {
            display: block;
        }

        .chat-username {
            font-weight: 600;
            margin-right: 6px;
            overflow-wrap: break-word;
            word-break: normal;
        }

        .chat-text {
            color: #f1f5f9;
            overflow-wrap: break-word;
            word-break: normal;
        }

        /* ========================================
           STYLE 13: Spotlight
           ======================================== */
        .chat-style-13 {
            background: transparent;
            padding: 0;
        }

        .chat-style-13 .chat-message {
            font-size: 14px;
            padding: 8px 12px;
            margin-bottom: 4px;
            background: rgba(20, 20, 30, 0.6);
            border-radius: 8px;
            opacity: 0.4;
            transition: all 0.4s ease;
            overflow-wrap: break-word;
            word-break: normal;
        }

        /* Newest message: Midnight Blue - NEON GLOW */
        .chat-style-13 .chat-message:last-child {
            opacity: 1;
            background: rgba(28, 49, 91, 0.65);
            border: 3px solid rgba(28, 49, 91, 0.8);
            box-shadow: 
                0 0 1.75px rgba(28, 49, 91, 0.21),
                0 0 5.25px rgba(28, 49, 91, 0.175),
                0 0 10.5px rgba(28, 49, 91, 0.14),
                0 0 17.5px rgba(28, 49, 91, 0.0875),
                0 0 28px rgba(28, 49, 91, 0.0525),
                inset 0 0 5.25px rgba(28, 49, 91, 0.035);
            font-size: 22px;
            padding: 18px 27px;
            line-height: 1.5;
            min-height: auto;
            height: auto;
            overflow: visible;
            text-shadow: 0 0 3.5px rgba(28, 49, 91, 0.105);
        }

        .chat-style-13 .chat-username {
            color: #60a5fa;
        }

        .chat-style-13 .chat-text {
            color: #e2e8f0;
        }

        /* Username color variations for visual interest */
        .username-cyan { color: #22d3ee !important; }
        .username-teal { color: #2dd4bf !important; }
        .username-blue { color: #60a5fa !important; }
        .username-purple { color: #a78bfa !important; }
        .username-pink { color: #f472b6 !important; }

        /* ========================================
           CHAT ANIMATIONS - Smooth ASMR-friendly
           ======================================== */
        
        /* Wrapper - fixed height, scrollable but hidden scrollbar */
        .chat-messages-wrapper {
            height: 572px;
            overflow-y: scroll;
            overflow-x: hidden;
            position: relative;
            /* Hide scrollbar */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            /* Gradient mask - fades out at top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
        }

        .chat-messages-wrapper::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Inner container that actually scrolls */
        .chat-messages {
            display: flex;
            flex-direction: column;
        }

        /* New message fades in */
        .chat-message.new-message {
            opacity: 0;
        }

    </style>
</head>
<body>

    <!-- CHAT STYLE 13: Spotlight -->
    <div class="chat-overlay chat-style-13 active" id="chat-13">
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
    </div>


    <script>
        // Username color mapping (same as chat overlay)
        const userColors = ['cyan', 'teal', 'blue', 'purple', 'pink'];
        const userColorMap = new Map();
        let userColorIndex = 0;

        function getUserColor(username) {
            if (!userColorMap.has(username)) {
                userColorMap.set(username, userColors[userColorIndex % userColors.length]);
                userColorIndex++;
            }
            return userColorMap.get(username);
        }

        let displayedMessageIds = new Set(); // Track displayed message IDs
        let lastRefreshTrigger = null;
        let serverPollInterval = null;
        const MAX_MESSAGES = 15; // Keep more messages, mask handles visual fade
        const STYLE_NUM = 13; // Only style 13
        
        // Message queue for one-at-a-time display
        let messageQueue = [];
        let isProcessingQueue = false;
        let processingScheduled = false; // Track if processing has been scheduled
        let activeTimeoutId = null; // Track active setTimeout to prevent duplicates
        let processMessageQueueLock = false; // Lock to ensure only one processMessageQueue call executes

        // Truncate text to max length with ellipsis (preserves emojis)
        function truncateText(text, maxLength = 110) {
            if (!text) return '';
            
            // Get plain text length for comparison
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = text;
            const plainText = tempDiv.textContent || tempDiv.innerText || '';
            
            if (plainText.length <= maxLength) {
                return text; // Return ORIGINAL text with HTML/emojis intact
            }
            
            // Need to truncate - strip to plain text and truncate
            return plainText.substring(0, maxLength) + '...';
        }

        // Wrap words to prevent mid-word breaks (preserves HTML tags like emoji <img>)
        function wrapWords(text) {
            if (!text) return '';
            
            // Check if text contains HTML tags (like emoji <img>)
            const hasHtml = /<[^>]+>/.test(text);
            
            if (hasHtml) {
                // Text has HTML - extract tags, process text, restore tags
                const parts = [];
                const tagRegex = /(<[^>]+>)/g;
                let lastIndex = 0;
                let match;
                
                while ((match = tagRegex.exec(text)) !== null) {
                    // Text before this tag
                    if (match.index > lastIndex) {
                        const textPart = text.substring(lastIndex, match.index);
                        parts.push(wrapPlainText(textPart));
                    }
                    // The tag itself (don't wrap)
                    parts.push(match[1]);
                    lastIndex = tagRegex.lastIndex;
                }
                // Remaining text after last tag
                if (lastIndex < text.length) {
                    parts.push(wrapPlainText(text.substring(lastIndex)));
                }
                return parts.join('');
            }
            
            // No HTML - simple word wrapping
            return wrapPlainText(text);
        }
        
        // Helper: wrap plain text words
        function wrapPlainText(text) {
            if (!text) return '';
            const words = text.split(' ');
            const wrapped = words.map(word => {
                if (!word) return '';
                // If word is too long (20+ chars), let it break naturally
                if (word.length > 20) {
                    return word;
                }
                // Wrap normal words in nowrap span to keep them together
                return `<span style="white-space:nowrap">${word}</span>`;
            });
            return wrapped.join(' ');
        }

        // Color @mentions with the mentioned user's color
        function colorMentions(text) {
            if (!text) return '';
            
            // Match @username patterns (alphanumeric, underscores, hyphens)
            const mentionRegex = /@([a-zA-Z0-9_-]+)/g;
            
            return text.replace(mentionRegex, (match, username) => {
                // Get or assign color for the mentioned user
                const color = getUserColor(username);
                return `<span class="username-${color}" style="font-weight:600">@${username}</span>`;
            });
        }

        function createMessageElement(serverMsg) {
            const div = document.createElement('div');
            div.className = 'chat-message new-message';
            
            // Remove @ from username if present
            let username = serverMsg.username || '';
            username = username.replace(/^@/, '');
            
            // Wrap username if short enough (≤20 chars), otherwise let it break
            const wrappedUsername = username.length <= 20 
                ? `<span style="white-space:nowrap">${username}</span>` 
                : username;
            
            const rawText = serverMsg.textHtml || serverMsg.text || '';
            const truncatedText = truncateText(rawText, 110);
            const coloredText = colorMentions(truncatedText);
            const wrappedText = wrapWords(coloredText);
            const color = getUserColor(username);
            
            // Get plain text length for line-fit calculation
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = truncatedText;
            const plainTextLength = (tempDiv.textContent || '').length;
            
            // If username + message won't fit on one line (~17 chars), put message on new line
            const charsPerLine = 17;
            const separator = (username.length + plainTextLength + 1) > charsPerLine ? '<br>' : ' ';
            
            div.innerHTML = `<span class="chat-username username-${color}">${wrappedUsername}</span>${separator}<span class="chat-text">${wrappedText}</span>`;
            
            return div;
        }

        // Smooth scroll animation - SLOW and gentle for ASMR
        function smoothScrollTo(element, targetScroll, duration) {
            const startScroll = element.scrollTop;
            const distance = targetScroll - startScroll;
            
            // If no distance to scroll, skip
            if (Math.abs(distance) < 1) return;
            
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease-out quad (gentler than cubic)
                const easeOut = 1 - Math.pow(1 - progress, 2);
                
                element.scrollTop = startScroll + (distance * easeOut);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        function showMessageOneAtATime(serverMsg) {
            // Add message to style 13 only
            const styleNum = STYLE_NUM;
            const wrapper = document.querySelector(`#chat-${styleNum} .chat-messages-wrapper`);
            const container = document.querySelector(`#chat-${styleNum} .chat-messages`);
            if (!container || !wrapper) return;

            const newMsg = createMessageElement(serverMsg);
            
            // Add new message at bottom
            container.appendChild(newMsg);

            // Force reflow
            void newMsg.offsetHeight;

            // Fade in the new message
            requestAnimationFrame(() => {
                newMsg.classList.remove('new-message');
            });

            // Smooth scroll to show new message - 1 second duration!
            // Use double requestAnimationFrame to ensure DOM is fully updated
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    const targetScroll = wrapper.scrollHeight - wrapper.clientHeight;
                    smoothScrollTo(wrapper, targetScroll, 1000);
                });
            });

            // Clean up old messages (already scrolled out of view)
            const messages = container.querySelectorAll('.chat-message');
            if (messages.length > MAX_MESSAGES) {
                messages[0].remove();
            }
        }

        // Process message queue one at a time
        function processMessageQueue() {
            // CRITICAL: Lock check must be FIRST and ATOMIC
            // If lock is already set, another call is executing - return immediately
            if (processMessageQueueLock) {
                return;
            }
            
            // ATOMIC CHECK-AND-SET: Set lock IMMEDIATELY after lock check
            // This prevents any other call from entering, even if they passed the initial check
            processMessageQueueLock = true;
            
            // Now check other conditions
            if (isProcessingQueue || messageQueue.length === 0) {
                processMessageQueueLock = false; // Release lock before returning
                return;
            }
            
            // Set processing flag
            isProcessingQueue = true;
            processingScheduled = false; // Reset scheduled flag now that we're processing
            
            const serverMsg = messageQueue.shift();
            
            if (!serverMsg) {
                isProcessingQueue = false;
                processMessageQueueLock = false; // Release lock
                return;
            }
            
            // Mark as displayed AFTER we start showing it (prevents duplicates)
            if (serverMsg.id) {
                displayedMessageIds.add(serverMsg.id);
                
                // Keep displayed IDs manageable (only last 500)
                if (displayedMessageIds.size > 500) {
                    const idsArray = Array.from(displayedMessageIds);
                    displayedMessageIds = new Set(idsArray.slice(-500));
                }
            }
            
            // Show the message
            showMessageOneAtATime(serverMsg);
            
            // Wait before showing next message (4 seconds for ASMR pace)
            // Clear any existing timeout to prevent multiple timers
            if (activeTimeoutId !== null) {
                clearTimeout(activeTimeoutId);
                activeTimeoutId = null;
            }
            
            activeTimeoutId = setTimeout(() => {
                // Clear the timeout ID since this callback is executing
                activeTimeoutId = null;
                
                // Reset flags and process next message if queue has more
                isProcessingQueue = false;
                processMessageQueueLock = false; // Release lock
                if (messageQueue.length > 0 && !processingScheduled) {
                    processingScheduled = true;
                    // Use setTimeout(0) to defer, ensuring flag is set before processMessageQueue executes
                    setTimeout(() => processMessageQueue(), 0);
                }
            }, 4000); // 4 seconds between messages
        }

        // Add message to queue
        function addMessageToQueue(serverMsg) {
            messageQueue.push(serverMsg);
            // Start processing if not already processing or scheduled
            // ATOMIC CHECK-AND-SET: Check both flags, then set processingScheduled immediately
            if (!isProcessingQueue && !processingScheduled && messageQueue.length > 0) {
                // Set flag IMMEDIATELY to prevent race condition
                processingScheduled = true;
                // Call directly (not setTimeout) - processMessageQueue will handle the flag
                processMessageQueue();
            }
        }

        // Pre-populate chat list with ALL existing messages from server
        // EXACT COPY of logic from working chat-controller.js prePopulate()
        // Sorted by message timestamp, added to queue (will be shown one at a time)
        async function prePopulate() {
            // Clear style 13 only
            const styleNum = STYLE_NUM;
            const container = document.querySelector(`#chat-${styleNum} .chat-messages`);
            if (container) {
                container.innerHTML = '';
            }
            
            displayedMessageIds.clear();
            userColorMap.clear();
            userColorIndex = 0;
            messageQueue = []; // Clear queue
            isProcessingQueue = false; // Reset processing flag
            processingScheduled = false; // Reset scheduled flag
            processMessageQueueLock = false; // Reset lock
            // Clear any active timeout
            if (activeTimeoutId !== null) {
                clearTimeout(activeTimeoutId);
                activeTimeoutId = null;
            }

            try {
                // Fetch ALL existing messages from server
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    // Sort messages by timestamp (oldest first) - use message timestamp, not server time
                    // Use domOrder as tiebreaker when timestamps are equal (preserves YouTube DOM order)
                    const sortedMessages = [...data.messages].sort((a, b) => {
                        const timestampA = a.timestamp || 0;
                        const timestampB = b.timestamp || 0;
                        if (timestampA !== timestampB) {
                            return timestampA - timestampB; // Oldest first
                        }
                        // Timestamps are equal - use DOM order as tiebreaker
                        const domOrderA = a.domOrder !== undefined ? a.domOrder : Infinity;
                        const domOrderB = b.domOrder !== undefined ? b.domOrder : Infinity;
                        return domOrderA - domOrderB; // Lower DOM order (earlier in YouTube) comes first
                    });
                    
                    // Add ALL messages to queue (will be shown one at a time)
                    sortedMessages.forEach(serverMsg => {
                        // Mark as displayed
                        if (serverMsg.id) {
                            displayedMessageIds.add(serverMsg.id);
                        }
                        messageQueue.push(serverMsg);
                    });
                    
                    // Start processing queue - use processingScheduled flag to prevent race
                    if (messageQueue.length > 0 && !isProcessingQueue && !processingScheduled) {
                        processingScheduled = true;
                        processMessageQueue();
                    }
                }
            } catch (error) {
                console.error('Error pre-populating messages from server:', error);
                // Don't break overlay if server is unavailable - just start with empty list
            }
        }

        // Poll server for new messages (EXACT COPY from working chat-controller.js)
        async function pollServerMessages() {
            try {
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                // Check if refresh is triggered
                if (data.refreshTrigger && data.refreshTrigger !== lastRefreshTrigger) {
                    lastRefreshTrigger = data.refreshTrigger;
                    // Trigger full refresh
                    await prePopulate();
                    return; // Skip normal polling this cycle
                }
                
                if (data.messages && data.messages.length > 0) {
                    // Filter out already displayed messages and sort by timestamp (oldest first)
                    // Use domOrder as tiebreaker when timestamps are equal (preserves YouTube DOM order)
                    const newMessages = data.messages
                        .filter(serverMsg => !displayedMessageIds.has(serverMsg.id))
                        .sort((a, b) => {
                            const timestampA = a.timestamp || 0;
                            const timestampB = b.timestamp || 0;
                            if (timestampA !== timestampB) {
                                return timestampA - timestampB; // Oldest first
                            }
                            // Timestamps are equal - use DOM order as tiebreaker
                            const domOrderA = a.domOrder !== undefined ? a.domOrder : Infinity;
                            const domOrderB = b.domOrder !== undefined ? b.domOrder : Infinity;
                            return domOrderA - domOrderB; // Lower DOM order (earlier in YouTube) comes first
                        });
                    
                    // Process each message in timestamp order
                    newMessages.forEach(serverMsg => {
                        // Add new messages to queue (will be shown one at a time)
                        // Don't mark as displayed yet - that happens when message is actually shown
                        addMessageToQueue(serverMsg);
                    });
                }
            } catch (error) {
                console.error('Error fetching messages from server:', error);
                // Don't break overlay if server is unavailable - just silently fail
            }
        }

        // Start polling server (same interval as chat overlay: 200ms)
        function startPolling() {
            if (serverPollInterval) return;
            
            // Initial populate
            prePopulate();
            
            // Then poll every 200ms
            serverPollInterval = setInterval(() => {
                pollServerMessages();
            }, 200);
        }

        // Auto-start polling
        startPolling();

    </script>

</body>
</html>
