<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Overlay Preview - Press F11 for Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .preview-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }


        /* Video background */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay iframes - positioned absolutely to match OBS layout */
        .overlay-frame {
            position: absolute;
            border: none;
            background: transparent;
            pointer-events: none; /* Allow clicking through for testing */
        }
        
        /* Override for interactive frames */
        .overlay-frame.game-stats-frame,
        .overlay-frame.chat-overlay-frame {
            pointer-events: auto !important;
        }

        /* Title overlay - top left */
        .title-overlay-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
        }

        /* Game stats overlay - left side, vertically centered */
        .game-stats-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: auto !important; /* Enable interactions for controls */
        }
        
        #game-stats-frame {
            pointer-events: auto !important;
        }

        /* Socials overlay - bottom right */
        .socials-overlay-frame {
            bottom: 0;
            right: 0;
            width: 100%;
            height: 150px;
            z-index: 15;
        }

        /* Chat overlay - clean version */
        .chat-overlay-frame {
            position: absolute;
            top: 0;
            right: 0;
            width: 1920px;
            height: 1080px;
            z-index: 25;
            border: none;
            background: transparent;
            pointer-events: auto; /* Enable controls interaction */
        }


        </style>
</head>
<body>
    <div class="preview-container">
        <!-- Video Background -->
        <video class="video-background" autoplay loop muted playsinline>
            <source src="../game.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <!-- Title Overlay (top left) -->
        <iframe 
            class="overlay-frame title-overlay-frame" 
            src="../title-overlay/index.html"
            id="title-frame">
        </iframe>

        <!-- Game Stats Overlay (left side) -->
        <iframe 
            class="overlay-frame game-stats-frame" 
            src="../nba-live-overlay/index.html"
            id="game-stats-frame">
        </iframe>

        <!-- Socials Overlay (bottom right) -->
        <iframe 
            class="overlay-frame socials-overlay-frame" 
            src="../socials-overlay/index.html"
            id="socials-frame">
        </iframe>

        <!-- Chat Overlay -->
        <iframe 
            class="overlay-frame chat-overlay-frame" 
            src="../chat-overlay/display/index.html"
            id="chat-frame">
        </iframe>
        
    </div>

    <!-- Team Spacing Slider -->
    <div class="spacing-slider-container">
        <label class="slider-label">Team Spacing</label>
        <div class="slider-controls">
            <button class="spacing-btn" id="spacing-decrease">−</button>
            <input type="range" id="team-spacing-slider" min="0" max="400" value="200" step="5">
            <button class="spacing-btn" id="spacing-increase">+</button>
        </div>
        <span class="slider-value" id="spacing-value">200px</span>
    </div>

    <script>
        const slider = document.getElementById('team-spacing-slider');
        const valueDisplay = document.getElementById('spacing-value');
        const decreaseBtn = document.getElementById('spacing-decrease');
        const increaseBtn = document.getElementById('spacing-increase');
        const gameFrame = document.getElementById('game-stats-frame');

        function updateSpacing(value) {
            valueDisplay.textContent = value + 'px';
            console.log('Sending spacing update:', value);
            
            // Send message to iframe to update spacing
            if (gameFrame && gameFrame.contentWindow) {
                gameFrame.contentWindow.postMessage({
                    type: 'UPDATE_TEAM_SPACING',
                    spacing: value
                }, '*');
            }
        }

        slider.addEventListener('input', (e) => {
            updateSpacing(e.target.value);
        });

        decreaseBtn.addEventListener('click', () => {
            slider.value = Math.max(0, parseInt(slider.value) - 10);
            updateSpacing(slider.value);
        });

        increaseBtn.addEventListener('click', () => {
            slider.value = Math.min(400, parseInt(slider.value) + 10);
            updateSpacing(slider.value);
        });

        // Wait for iframe to fully load before initializing
        gameFrame.addEventListener('load', () => {
            console.log('Game frame loaded, setting initial spacing');
            setTimeout(() => {
                updateSpacing(slider.value);
            }, 500);
        });
    </script>

    <style>
        .spacing-slider-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999999;
            background: rgba(10, 20, 40, 0.98);
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid rgba(59, 130, 246, 0.8);
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.5);
            min-width: 280px;
        }

        .slider-label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slider-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spacing-btn {
            width: 35px;
            height: 35px;
            border: 2px solid rgba(59, 130, 246, 0.8);
            background: rgba(59, 130, 246, 0.3);
            color: #fff;
            font-size: 20px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .spacing-btn:hover {
            background: rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
        }

        .spacing-btn:active {
            transform: scale(0.95);
        }

        #team-spacing-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(59, 130, 246, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        #team-spacing-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            border: 2px solid #fff;
        }

        #team-spacing-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            border: 2px solid #fff;
        }

        .slider-value {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-top: 8px;
        }
    </style>
</body>
</html>
