<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 2K Overlay Control</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #1f2937;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      color: #1f2937;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover {
      border-color: #667eea;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .preview-card {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      display: none;
    }

    .preview-card.show {
      display: block;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .preview-time {
      font-size: 13px;
      color: #6b7280;
    }

    .preview-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-scheduled {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-live {
      background: #fee2e2;
      color: #991b1b;
      animation: pulse 2s infinite;
    }

    .status-final {
      background: #d1fae5;
      color: #065f46;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .preview-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .preview-team {
      flex: 1;
      text-align: center;
    }

    .preview-team img {
      width: 40px;
      height: 40px;
      margin-bottom: 6px;
    }

    .preview-team-name {
      font-weight: 600;
      color: #1f2937;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .preview-team-score {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
      margin-top: 4px;
    }

    .preview-vs {
      font-size: 14px;
      color: #9ca3af;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      border: 2px solid #fecaca;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #eff6ff;
      border: 2px solid #dbeafe;
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      color: #1e40af;
      line-height: 1.6;
    }

    .info-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }

    .refresh-btn:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .refresh-btn:active {
      transform: translateY(0);
    }

    /* Quarter Buttons */
    .quarter-buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .quarter-btn {
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quarter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .quarter-btn.active {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }

    .quarter-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .done-btn {
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .done-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .done-btn.active {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }

    .done-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mvp-toggle-btn {
      padding: 10px 24px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      color: #6b7280;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 80px;
    }

    .mvp-toggle-btn:hover {
      border-color: #10b981;
      color: #10b981;
    }

    .mvp-toggle-btn[data-state="on"] {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }

    /* Quarter Timer */
    .quarter-timer {
      margin-top: 16px;
      padding: 16px;
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      display: none;
    }

    .quarter-timer.show {
      display: block;
    }

    .timer-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .timer-label {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timer-value {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', monospace;
    }

    .timer-info {
      font-size: 13px;
      color: #6b7280;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .timer-milestone {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .timer-milestone:last-child {
      margin-bottom: 0;
    }

    .milestone-label {
      color: #374151;
      font-weight: 500;
    }

    .milestone-status {
      font-weight: 600;
    }

    .milestone-status.pending {
      color: #f59e0b;
    }

    .milestone-status.passed {
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏀 NBA Game Overlay Control</h1>

    <div id="error" class="error" style="display: none;"></div>

    <div class="section">
      <label class="section-title" for="gameSelect">Today's Games</label>
      <select id="gameSelect">
        <option value="">Loading games...</option>
      </select>
    </div>

    <div class="section" id="quarterSection" style="display: none;">
      <div class="section-title">🏀 Quarter Tracking</div>
      <div class="quarter-buttons">
        <button class="quarter-btn" data-quarter="Q1">Q1</button>
        <button class="quarter-btn" data-quarter="Q2">Q2</button>
        <button class="quarter-btn" data-quarter="Q3">Q3</button>
        <button class="quarter-btn" data-quarter="Q4">Q4</button>
        <button class="done-btn" id="doneBtn">Done</button>
      </div>
      
      <!-- Quarter Timer -->
      <div class="quarter-timer" id="quarterTimer">
        <div class="timer-main">
          <div class="timer-label">Time Since Quarter Start</div>
          <div class="timer-value" id="timerValue">00:00</div>
        </div>
        <div class="timer-info">
          <div class="timer-milestone">
            <span class="milestone-label">📊 Other Games Overlay:</span>
            <span class="milestone-status pending" id="otherGamesStatus">Shows at 01:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div id="loading" class="loading">Select a game to see preview</div>
      <div id="preview" class="preview-card"></div>
    </div>

    <div class="section">
      <div class="section-title">🎮 Simulation Mode (Testing)</div>
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="simulationToggle" style="width: 20px; height: 20px; cursor: pointer;">
          <span style="font-size: 14px; font-weight: 600; color: #1f2937;">Enable Simulation Mode</span>
        </label>
      </div>
      <div id="simulationControls" style="display: none;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
          <div style="flex: 1;">
            <div id="currentState" style="font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 4px;">Pregame</div>
            <div style="font-size: 12px; color: #6b7280;">Current game state</div>
          </div>
          <button id="nextStateBtn" class="refresh-btn" style="margin-top: 0;">▶ Next State</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px;">
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px;">Simulated MVP</div>
            <div style="font-size: 12px; color: #6b7280;">Show test MVP in overlay</div>
          </div>
          <button id="simMVPToggle" class="mvp-toggle-btn" data-state="off">OFF</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/overlay/_shared/config.js"></script>
  <script src="/overlay/_shared/nbaApi.js"></script>
  <script src="/overlay/_shared/apiClient.js"></script>
  <script src="/overlay/_dashboard/dashboard.js"></script>
</body>
</html>
