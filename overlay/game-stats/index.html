<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Game Stats Overlay</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/overlay/game-stats/styles.css">
</head>
<body>
  <div id="overlay" class="overlay-container">
    <!-- Game overlay will be injected here -->
  </div>

  <!-- Shared utilities -->
  <script src="/overlay/shared/config.js"></script>
  <script src="/overlay/shared/nbaApi.js"></script>
  
  <!-- Modular overlay components -->
  <script src="/overlay/game-stats/StateRenderer.js"></script>
  <script src="/overlay/game-stats/StateTransitions.js"></script>
  <script src="/overlay/game-stats/GameOverlay.js"></script>
  
  <!-- Main entry point -->
  <script src="/overlay/game-stats/overlay.js"></script>
</body>
</html>
