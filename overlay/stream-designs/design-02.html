<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 2: Neon Futuristic</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Neon title top-center */
    .neon-title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Poppins', sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      text-shadow: 
        0 0 10px #00e5ff,
        0 0 20px #00e5ff,
        0 0 40px #00e5ff,
        0 0 80px #00e5ff;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Player bubble top-right */
    .player-bubble {
      position: absolute;
      top: 120px;
      right: 30px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(156, 39, 176, 0.3), rgba(233, 30, 99, 0.3));
      backdrop-filter: blur(15px);
      border: 3px solid #e91e63;
      box-shadow: 0 0 30px rgba(233, 30, 99, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .player-image {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 0;
    }

    .player-bubble > * {
      position: relative;
      z-index: 1;
    }

    .player-label {
      font-size: 10px;
      color: #ff4081;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .player-name {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
    }

    .player-stats {
      font-size: 28px;
      font-weight: 900;
      color: #e91e63;
      text-shadow: 0 0 15px rgba(233, 30, 99, 0.8);
    }

    .player-stat-label {
      font-size: 11px;
      color: #ce93d8;
    }

    /* Score box bottom-left - now with expandable player section */
    .score-box {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(15px);
      padding: 20px 30px;
      border-radius: 15px;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      min-width: 320px;
    }

    .score-with-player {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .score-section {
      flex: 1;
    }

    .player-section {
      width: 80px;
      text-align: center;
      border-left: 2px solid rgba(0, 229, 255, 0.3);
      padding-left: 20px;
      opacity: 0.8;
    }

    .player-mini-image {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e91e63;
      margin: 0 auto 5px;
      display: block;
    }

    .player-mini-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }

    .player-mini-stat {
      font-size: 18px;
      font-weight: 900;
      color: #e91e63;
      text-shadow: 0 0 10px rgba(233, 30, 99, 0.6);
    }

    .player-mini-label {
      font-size: 9px;
      color: #ce93d8;
    }

    .score-teams {
      display: flex;
      gap: 30px;
      align-items: center;
      margin-bottom: 10px;
    }

    .score-team {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-team-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .score-value {
      font-size: 36px;
      font-weight: 900;
      color: #00e5ff;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
    }

    .score-time {
      font-size: 16px;
      color: #ce93d8;
      font-weight: 600;
      text-align: center;
    }

    /* ASMR badge bottom-right */
    .asmr-badge {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 25px rgba(233, 30, 99, 0.6);
      letter-spacing: 3px;
    }

    /* Vertical stats bar */
    .stats-bar {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 20px 15px;
      border-radius: 12px;
      border: 2px solid rgba(156, 39, 176, 0.5);
      box-shadow: 0 0 20px rgba(156, 39, 176, 0.3);
    }

    .stat-item {
      text-align: center;
      margin-bottom: 20px;
    }

    .stat-item:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      font-size: 10px;
      color: #ce93d8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 900;
      color: #fff;
    }

    .stat-bar-visual {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      background: linear-gradient(to right, #00e5ff, #e91e63);
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="overlay-container">
    <!-- Neon Title -->
    <div class="neon-title pulse">
      SILENT BASKETBALL
    </div>

    <!-- Player Bubble (Alternative: Can replace bubble with integrated version in score box) -->
    <!-- Now integrated into score box above -->

    <!-- Score Box with Integrated Player -->
    <div class="score-box fade-in">
      <div class="score-with-player">
        <div class="score-section">
          <div class="score-teams">
            <div class="score-team">
              <span class="score-team-name">PHI</span>
              <span class="score-value">87</span>
            </div>
            <div class="score-team">
              <span class="score-value">92</span>
              <span class="score-team-name">MIL</span>
            </div>
          </div>
          <div class="score-time">Q3 • 6:42</div>
        </div>
        <div class="player-section player-cycle">
          <img src="https://a.espncdn.com/i/headshots/nba/players/full/3032977.png" alt="Giannis" class="player-mini-image">
          <div class="player-mini-name">Giannis</div>
          <div class="player-mini-stat">31</div>
          <div class="player-mini-label">PTS</div>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar fade-in">
      <div class="stat-item">
        <div class="stat-label">FG%</div>
        <div class="stat-value">48</div>
        <div class="stat-bar-visual">
          <div class="stat-bar-fill" style="width: 48%"></div>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-label">3PT%</div>
        <div class="stat-value">35</div>
        <div class="stat-bar-visual">
          <div class="stat-bar-fill" style="width: 35%"></div>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-label">REB</div>
        <div class="stat-value">42</div>
        <div class="stat-bar-visual">
          <div class="stat-bar-fill" style="width: 70%"></div>
        </div>
      </div>
    </div>

    <!-- ASMR Badge -->
    <div class="asmr-badge glow">
      ASMR
    </div>
  </div>
</body>
</html>
