<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 13: Court Heat Vision</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Large court heatmap overlay */
    .court-heatmap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 600px;
      opacity: 0.25;
      pointer-events: none;
      border: 3px solid rgba(255, 0, 100, 0.6);
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 100, 0.3) 0%, transparent 60%);
    }

    .heat-spots {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .heat-spot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 0, 100, 0.8), transparent);
      animation: pulse-heat 2s ease-in-out infinite;
    }

    @keyframes pulse-heat {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .heat-spot.spot-1 {
      top: 30%;
      left: 20%;
      width: 150px;
      height: 150px;
      animation-delay: 0s;
    }

    .heat-spot.spot-2 {
      top: 50%;
      right: 25%;
      width: 200px;
      height: 200px;
      animation-delay: 0.5s;
    }

    .heat-spot.spot-3 {
      bottom: 20%;
      left: 35%;
      width: 120px;
      height: 120px;
      animation-delay: 1s;
    }

    /* Shot chart panel */
    .shot-chart {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 280px;
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #FF0064;
      padding: 20px;
    }

    .chart-title {
      font-size: 14px;
      color: #FF0064;
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-align: center;
    }

    .shot-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .shot-marker {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 0, 100, 0.3);
      position: relative;
    }

    .shot-marker.made {
      background: rgba(0, 255, 100, 0.6);
      border-color: #00FF64;
      box-shadow: 0 0 10px rgba(0, 255, 100, 0.8);
    }

    .shot-marker.missed {
      background: rgba(255, 0, 100, 0.4);
      border-color: #FF0064;
    }

    .shot-stats {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 0, 100, 0.3);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: #888;
      font-family: 'Arial', sans-serif;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #FF0064;
      margin-top: 5px;
    }

    /* Score display */
    .score-display {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #FF0064;
      padding: 25px;
      min-width: 300px;
    }

    .logo-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 50px;
      height: 50px;
    }

    .brand-text {
      font-family: 'Arial', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FF0064;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .teams-score {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 30px;
    }

    .team-info {
      text-align: center;
    }

    .team-name {
      font-size: 14px;
      color: #888;
      font-family: 'Arial', sans-serif;
      margin-bottom: 10px;
    }

    .team-score {
      font-size: 52px;
      font-weight: 900;
      color: #FF0064;
      font-family: 'Impact', sans-serif;
      text-shadow: 0 0 20px rgba(255, 0, 100, 0.8);
    }

    /* Real-time stats ticker */
    .stats-ticker {
      position: absolute;
      bottom: 30px;
      left: 30px;
      right: 30px;
      height: 80px;
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #FF0064;
      overflow: hidden;
    }

    .ticker-content {
      display: flex;
      align-items: center;
      height: 100%;
      animation: ticker 20s linear infinite;
      padding: 0 20px;
      gap: 50px;
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 15px;
      white-space: nowrap;
      font-family: 'Arial', sans-serif;
    }

    .ticker-label {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
    }

    .ticker-value {
      font-size: 24px;
      font-weight: 700;
      color: #FF0064;
    }

    /* Beat visualizer */
    .beat-viz {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .beat-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FF0064;
      box-shadow: 0 0 20px #FF0064;
      animation: beatPulse 0.8s ease-in-out infinite;
    }

    @keyframes beatPulse {
      0%, 100% { transform: scale(0.5); opacity: 0.3; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    .beat-circle:nth-child(1) { animation-delay: 0s; }
    .beat-circle:nth-child(2) { animation-delay: 0.1s; }
    .beat-circle:nth-child(3) { animation-delay: 0.2s; }
    .beat-circle:nth-child(4) { animation-delay: 0.3s; }
    .beat-circle:nth-child(5) { animation-delay: 0.4s; }
    .beat-circle:nth-child(6) { animation-delay: 0.5s; }
    .beat-circle:nth-child(7) { animation-delay: 0.6s; }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Court Heatmap Overlay -->
  <div class="court-heatmap fade-in">
    <div class="heat-spots">
      <div class="heat-spot spot-1"></div>
      <div class="heat-spot spot-2"></div>
      <div class="heat-spot spot-3"></div>
    </div>
  </div>

  <div class="overlay-container">
    <!-- Score Display -->
    <div class="score-display fade-in">
      <div class="logo-header">
        <img src="logo.png" alt="Logo" class="logo-img">
        <div class="brand-text">Silent<br>Basketball</div>
      </div>
      <div class="teams-score">
        <div class="team-info">
          <div class="team-name">NETS</div>
          <div class="team-score">112</div>
        </div>
        <div class="team-info">
          <div class="team-name">BULLS</div>
          <div class="team-score">108</div>
        </div>
      </div>
    </div>

    <!-- Shot Chart -->
    <div class="shot-chart fade-in">
      <div class="chart-title">Live Shot Chart</div>
      <div class="shot-grid">
        <div class="shot-marker made"></div>
        <div class="shot-marker missed"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker missed"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker missed"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker missed"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker missed"></div>
        <div class="shot-marker made"></div>
        <div class="shot-marker missed"></div>
        <div class="shot-marker made"></div>
      </div>
      <div class="shot-stats">
        <div class="stat-item">
          <div class="stat-label">FG%</div>
          <div class="stat-value">61%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">3PT%</div>
          <div class="stat-value">38%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">FT%</div>
          <div class="stat-value">85%</div>
        </div>
      </div>
    </div>

    <!-- Beat Visualizer -->
    <div class="beat-viz fade-in">
      <div class="beat-circle"></div>
      <div class="beat-circle"></div>
      <div class="beat-circle"></div>
      <div class="beat-circle"></div>
      <div class="beat-circle"></div>
      <div class="beat-circle"></div>
      <div class="beat-circle"></div>
    </div>

    <!-- Stats Ticker -->
    <div class="stats-ticker fade-in">
      <div class="ticker-content">
        <div class="ticker-item">
          <span class="ticker-label">Q3</span>
          <span class="ticker-value">8:42</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">ASMR</span>
          <span class="ticker-value">●</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">Lead</span>
          <span class="ticker-value">+4</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">Fast Break</span>
          <span class="ticker-value">12</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">Dunks</span>
          <span class="ticker-value">8</span>
        </div>
        <!-- Duplicate for seamless loop -->
        <div class="ticker-item">
          <span class="ticker-label">Q3</span>
          <span class="ticker-value">8:42</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">ASMR</span>
          <span class="ticker-value">●</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">Lead</span>
          <span class="ticker-value">+4</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">Fast Break</span>
          <span class="ticker-value">12</span>
        </div>
        <div class="ticker-item">
          <span class="ticker-label">Dunks</span>
          <span class="ticker-value">8</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
