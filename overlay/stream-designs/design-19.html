<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 19: Minimalist Tech</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Minimal tech lines */
    .tech-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFD700, transparent);
      animation: line-glow 3s ease-in-out infinite;
    }

    @keyframes line-glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .tech-line.top {
      top: 100px;
      left: 0;
      right: 0;
    }

    .tech-line.bottom {
      bottom: 200px;
      left: 0;
      right: 0;
      animation-delay: 1.5s;
    }

    .tech-line.vertical {
      width: 2px;
      height: 100%;
      top: 0;
    }

    .tech-line.left {
      left: 380px;
      animation-delay: 0.5s;
    }

    .tech-line.right {
      right: 380px;
      animation-delay: 1s;
    }

    /* Main score widget - minimal */
    .minimal-score {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      text-align: center;
    }

    .minimal-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      filter: drop-shadow(0 0 30px #FFD700);
      animation: logo-pulse 4s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .minimal-brand {
      font-size: 36px;
      font-weight: 900;
      color: #FFD700;
      font-family: 'Impact', sans-serif;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #FFD700;
      margin-bottom: 15px;
    }

    .minimal-subtitle {
      font-size: 18px;
      color: #888;
      font-family: 'Arial', sans-serif;
      letter-spacing: 4px;
      margin-bottom: 50px;
    }

    .minimal-teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 80px;
    }

    .minimal-team {
      flex: 1;
      text-align: center;
    }

    .minimal-team-name {
      font-size: 24px;
      color: #FFD700;
      font-family: 'Impact', sans-serif;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #FFD700;
    }

    .minimal-team-score {
      font-size: 120px;
      font-weight: 900;
      color: #FFD700;
      font-family: 'Impact', sans-serif;
      text-shadow: 0 0 50px #FFD700;
      line-height: 1;
    }

    .minimal-vs {
      font-size: 28px;
      color: #444;
      font-weight: 700;
    }

    /* Corner data displays */
    .corner-data {
      position: absolute;
      width: 300px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #FFD700;
      padding: 20px;
    }

    .corner-data.top-left {
      top: 30px;
      left: 30px;
    }

    .corner-data.top-right {
      top: 30px;
      right: 30px;
    }

    .corner-title {
      font-size: 12px;
      color: #FFD700;
      font-family: 'Impact', sans-serif;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #FFD700;
    }

    .data-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      font-family: 'Arial', sans-serif;
    }

    .data-item-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }

    .data-item-value {
      font-size: 18px;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 0 10px #FFD700;
    }

    /* Audio wave - minimal circles */
    .minimal-wave {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #FFD700;
      padding: 20px;
    }

    .wave-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid #FFD700;
      background: transparent;
      box-shadow: 0 0 15px #FFD700, inset 0 0 10px #FFD700;
      animation: circle-beat 1s ease-in-out infinite;
    }

    @keyframes circle-beat {
      0%, 100% { transform: scale(0.7); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .wave-circle:nth-child(1) { animation-delay: 0s; }
    .wave-circle:nth-child(2) { animation-delay: 0.1s; }
    .wave-circle:nth-child(3) { animation-delay: 0.2s; }
    .wave-circle:nth-child(4) { animation-delay: 0.3s; }
    .wave-circle:nth-child(5) { animation-delay: 0.4s; }
    .wave-circle:nth-child(6) { animation-delay: 0.5s; }
    .wave-circle:nth-child(7) { animation-delay: 0.6s; }
    .wave-circle:nth-child(8) { animation-delay: 0.7s; }

    /* Quarter time display */
    .quarter-display {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'Impact', sans-serif;
      font-size: 20px;
      color: #FFD700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #FFD700;
    }

    /* Decorative dots */
    .deco-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #FFD700;
      border-radius: 50%;
      box-shadow: 0 0 15px #FFD700;
      animation: dot-glow 2s ease-in-out infinite;
    }

    @keyframes dot-glow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .deco-dot.dot-1 {
      top: 100px;
      left: 370px;
      animation-delay: 0s;
    }

    .deco-dot.dot-2 {
      top: 100px;
      right: 370px;
      animation-delay: 0.5s;
    }

    .deco-dot.dot-3 {
      bottom: 200px;
      left: 370px;
      animation-delay: 1s;
    }

    .deco-dot.dot-4 {
      bottom: 200px;
      right: 370px;
      animation-delay: 1.5s;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Tech lines -->
  <div class="tech-line top"></div>
  <div class="tech-line bottom"></div>
  <div class="tech-line vertical left"></div>
  <div class="tech-line vertical right"></div>

  <!-- Decorative dots -->
  <div class="deco-dot dot-1"></div>
  <div class="deco-dot dot-2"></div>
  <div class="deco-dot dot-3"></div>
  <div class="deco-dot dot-4"></div>

  <div class="overlay-container">
    <!-- Quarter display -->
    <div class="quarter-display fade-in">Q3 • 8:42</div>

    <!-- Corner data top left -->
    <div class="corner-data top-left fade-in">
      <div class="corner-title">SHOOTING</div>
      <div class="data-item">
        <span class="data-item-label">FG%</span>
        <span class="data-item-value">52%</span>
      </div>
      <div class="data-item">
        <span class="data-item-label">3PT%</span>
        <span class="data-item-value">41%</span>
      </div>
      <div class="data-item">
        <span class="data-item-label">FT%</span>
        <span class="data-item-value">88%</span>
      </div>
    </div>

    <!-- Corner data top right -->
    <div class="corner-data top-right fade-in">
      <div class="corner-title">TEAM STATS</div>
      <div class="data-item">
        <span class="data-item-label">Rebounds</span>
        <span class="data-item-value">46</span>
      </div>
      <div class="data-item">
        <span class="data-item-label">Assists</span>
        <span class="data-item-value">32</span>
      </div>
      <div class="data-item">
        <span class="data-item-label">Blocks</span>
        <span class="data-item-value">9</span>
      </div>
    </div>

    <!-- Main score -->
    <div class="minimal-score fade-in">
      <img src="logo.png" alt="Logo" class="minimal-logo">
      <div class="minimal-brand">SILENT BASKETBALL</div>
      <div class="minimal-subtitle">A S M R</div>
      <div class="minimal-teams">
        <div class="minimal-team">
          <div class="minimal-team-name">HEAT</div>
          <div class="minimal-team-score">95</div>
        </div>
        <div class="minimal-vs">–</div>
        <div class="minimal-team">
          <div class="minimal-team-name">JAZZ</div>
          <div class="minimal-team-score">92</div>
        </div>
      </div>
    </div>

    <!-- Minimal wave -->
    <div class="minimal-wave fade-in">
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
      <div class="wave-circle"></div>
    </div>
  </div>
</body>
</html>
