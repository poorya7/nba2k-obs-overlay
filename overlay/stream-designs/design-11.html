<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 11: Terminator HUD</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* HUD Grid overlay */
    .hud-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    /* Corner brackets */
    .corner-bracket {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid #00ff88;
      pointer-events: none;
    }

    .corner-bracket.top-left {
      top: 20px;
      left: 20px;
      border-right: none;
      border-bottom: none;
    }

    .corner-bracket.top-right {
      top: 20px;
      right: 20px;
      border-left: none;
      border-bottom: none;
    }

    .corner-bracket.bottom-left {
      bottom: 20px;
      left: 20px;
      border-right: none;
      border-top: none;
    }

    .corner-bracket.bottom-right {
      bottom: 20px;
      right: 20px;
      border-left: none;
      border-top: none;
    }

    /* Top HUD bar */
    .hud-top-bar {
      position: absolute;
      top: 30px;
      left: 120px;
      right: 120px;
      height: 60px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
      border-top: 2px solid #00ff88;
      border-bottom: 2px solid #00ff88;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      font-family: 'Courier New', monospace;
    }

    .hud-logo {
      height: 40px;
      filter: drop-shadow(0 0 10px #00ff88);
    }

    .hud-title {
      font-size: 24px;
      font-weight: 700;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
      letter-spacing: 4px;
    }

    .hud-timestamp {
      font-size: 16px;
      color: #00ff88;
      opacity: 0.8;
    }

    /* Live data panel left */
    .data-panel-left {
      position: absolute;
      top: 120px;
      left: 30px;
      width: 320px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff88;
      border-left: 4px solid #00ff88;
      padding: 20px;
    }

    .panel-header {
      font-size: 14px;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
      font-family: 'Courier New', monospace;
    }

    .data-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }

    .data-value {
      font-size: 16px;
      font-weight: 700;
      color: #00ff88;
      text-shadow: 0 0 5px #00ff88;
    }

    /* Scanning line animation */
    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

    .scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(to bottom, transparent, #00ff88, transparent);
      animation: scan 3s linear infinite;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Heat map visualization */
    .heat-map {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 200px;
      height: 180px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff88;
      padding: 15px;
    }

    .heat-map-title {
      font-size: 11px;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .heat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .heat-cell {
      aspect-ratio: 1;
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .heat-cell.hot {
      background: rgba(255, 50, 50, 0.6);
      box-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
    }

    .heat-cell.warm {
      background: rgba(255, 150, 0, 0.5);
    }

    .heat-cell.cool {
      background: rgba(0, 255, 136, 0.3);
    }

    /* Audio visualizer */
    .audio-viz {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 300px;
      height: 100px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff88;
      padding: 15px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .viz-bar {
      flex: 1;
      background: linear-gradient(to top, #00ff88, #00ff88);
      border-radius: 2px 2px 0 0;
      box-shadow: 0 0 10px #00ff88;
      animation: pulse 0.5s ease-in-out infinite;
    }

    .viz-bar:nth-child(1) { height: 30%; animation-delay: 0s; }
    .viz-bar:nth-child(2) { height: 60%; animation-delay: 0.1s; }
    .viz-bar:nth-child(3) { height: 80%; animation-delay: 0.2s; }
    .viz-bar:nth-child(4) { height: 50%; animation-delay: 0.3s; }
    .viz-bar:nth-child(5) { height: 70%; animation-delay: 0.4s; }
    .viz-bar:nth-child(6) { height: 40%; animation-delay: 0.5s; }
    .viz-bar:nth-child(7) { height: 90%; animation-delay: 0.6s; }
    .viz-bar:nth-child(8) { height: 60%; animation-delay: 0.7s; }

    /* Score display */
    .score-hud {
      position: absolute;
      top: 120px;
      right: 30px;
      width: 280px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff88;
      border-right: 4px solid #00ff88;
      padding: 20px;
    }

    .score-teams-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .score-team-hud {
      text-align: center;
    }

    .score-team-name-hud {
      font-size: 14px;
      color: #888;
      font-family: 'Courier New', monospace;
      margin-bottom: 8px;
    }

    .score-value-hud {
      font-size: 42px;
      font-weight: 900;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 15px #00ff88;
    }

    .score-vs-hud {
      font-size: 12px;
      color: #555;
    }

    .score-status-hud {
      text-align: center;
      font-size: 14px;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 255, 136, 0.3);
    }

    /* Glitch effect */
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      33% { transform: translate(-2px, 2px); }
      66% { transform: translate(2px, -2px); }
    }

    .glitch {
      animation: glitch 5s infinite;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <!-- HUD Grid -->
  <div class="hud-grid"></div>

  <!-- Corner Brackets -->
  <div class="corner-bracket top-left"></div>
  <div class="corner-bracket top-right"></div>
  <div class="corner-bracket bottom-left"></div>
  <div class="corner-bracket bottom-right"></div>

  <!-- Scan Line -->
  <div class="scan-line"></div>

  <div class="overlay-container">
    <!-- Top HUD Bar -->
    <div class="hud-top-bar fade-in glitch">
      <img src="logo.png" alt="Logo" class="hud-logo">
      <div class="hud-title">SILENT BASKETBALL :: ASMR</div>
      <div class="hud-timestamp">Q3 • 6:42</div>
    </div>

    <!-- Data Panel Left -->
    <div class="data-panel-left fade-in">
      <div class="panel-header">▼ Live Stats Analysis</div>
      <div class="data-row">
        <span class="data-label">Field Goal %</span>
        <span class="data-value">48.2%</span>
      </div>
      <div class="data-row">
        <span class="data-label">3-Point %</span>
        <span class="data-value">35.7%</span>
      </div>
      <div class="data-row">
        <span class="data-label">Rebounds</span>
        <span class="data-value">42</span>
      </div>
      <div class="data-row">
        <span class="data-label">Assists</span>
        <span class="data-value">28</span>
      </div>
      <div class="data-row">
        <span class="data-label">Turnovers</span>
        <span class="data-value">11</span>
      </div>
      <div class="data-row">
        <span class="data-label">Fast Break</span>
        <span class="data-value">18</span>
      </div>
      <div class="scan-line"></div>
    </div>

    <!-- Score HUD -->
    <div class="score-hud fade-in">
      <div class="score-teams-hud">
        <div class="score-team-hud">
          <div class="score-team-name-hud">PHI</div>
          <div class="score-value-hud">87</div>
        </div>
        <div class="score-vs-hud">VS</div>
        <div class="score-team-hud">
          <div class="score-value-hud">92</div>
          <div class="score-team-name-hud">MIL</div>
        </div>
      </div>
      <div class="score-status-hud">QUARTER 3 • 6:42</div>
    </div>

    <!-- Heat Map -->
    <div class="heat-map fade-in">
      <div class="heat-map-title">▼ Shot Chart</div>
      <div class="heat-grid">
        <div class="heat-cell cool"></div>
        <div class="heat-cell warm"></div>
        <div class="heat-cell hot"></div>
        <div class="heat-cell warm"></div>
        <div class="heat-cell cool"></div>
        <div class="heat-cell warm"></div>
        <div class="heat-cell hot"></div>
        <div class="heat-cell hot"></div>
        <div class="heat-cell warm"></div>
        <div class="heat-cell cool"></div>
        <div class="heat-cell cool"></div>
        <div class="heat-cell warm"></div>
        <div class="heat-cell warm"></div>
        <div class="heat-cell cool"></div>
        <div class="heat-cell warm"></div>
      </div>
    </div>

    <!-- Audio Visualizer -->
    <div class="audio-viz fade-in">
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
      <div class="viz-bar"></div>
    </div>
  </div>
</body>
</html>
