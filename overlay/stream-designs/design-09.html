<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 9: Zen Minimal</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Tiny branding top-left */
    .zen-branding {
      position: absolute;
      top: 25px;
      left: 25px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Ultra minimal bottom line - with expandable player */
    .zen-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      font-family: 'Inter', sans-serif;
    }

    .zen-player-inline {
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.75;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 40px;
    }

    .zen-player-inline img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .zen-player-inline-info {
      text-align: left;
    }

    .zen-player-inline-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    .zen-player-inline-stat {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
    }

    .zen-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .zen-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .zen-value {
      font-size: 20px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
    }

    .zen-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Small ASMR text corner */
    .zen-asmr {
      position: absolute;
      bottom: 70px;
      right: 25px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Occasional player card */
    .zen-player {
      position: absolute;
      top: 50%;
      right: 80px;
      transform: translateY(-50%);
      background: rgba(240, 240, 240, 0.08);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      min-width: 200px;
      opacity: 0.9;
    }

    .zen-player-image {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      margin: 0 auto 12px;
      display: block;
    }

    .zen-player-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .zen-player-name {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .zen-player-stats {
      display: flex;
      justify-content: space-around;
      gap: 15px;
    }

    .zen-player-stat {
      text-align: center;
    }

    .zen-player-stat-value {
      font-size: 26px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 4px;
    }

    .zen-player-stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    /* Breathing indicator dot */
    .breathing-dot {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* Fade animation for player card */
    @keyframes gentleFade {
      0%, 100% {
        opacity: 0.9;
      }
      50% {
        opacity: 0.7;
      }
    }

    .zen-player {
      animation: gentleFade 8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="overlay-container">
    <!-- Tiny Branding -->
    <div class="zen-branding fade-in">
      Silent Basketball
    </div>

    <!-- Breathing Dot -->
    <div class="breathing-dot"></div>

    <!-- Ultra Minimal Bottom Line with Inline Player -->
    <div class="zen-bottom fade-in">
      <div class="zen-item">
        <span class="zen-label">Away</span>
        <span class="zen-value">PHI 87</span>
      </div>
      
      <div class="zen-divider"></div>
      
      <div class="zen-item">
        <span class="zen-label">Time</span>
        <span class="zen-value">Q3 6:42</span>
      </div>
      
      <div class="zen-divider"></div>
      
      <div class="zen-item">
        <span class="zen-value">92 MIL</span>
        <span class="zen-label">Home</span>
      </div>

      <!-- Player Inline (appears occasionally) -->
      <div class="zen-player-inline player-cycle">
        <img src="https://a.espncdn.com/i/headshots/nba/players/full/3032977.png" alt="Giannis">
        <div class="zen-player-inline-info">
          <div class="zen-player-inline-name">Giannis</div>
          <div class="zen-player-inline-stat">31 PTS</div>
        </div>
      </div>
    </div>

    <!-- Small ASMR Text -->
    <div class="zen-asmr fade-in">
      ASMR
    </div>

    <!-- Player now integrated inline in bottom bar above -->
  </div>
</body>
</html>
