<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 17: Split Screen Analytics</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Split screen effect */
    .split-overlay {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.7), transparent);
      pointer-events: none;
    }

    .split-overlay.left {
      left: 0;
    }

    .split-overlay.right {
      right: 0;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.7), transparent);
    }

    /* Team stats panels */
    .team-panel {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 400px;
      background: rgba(0, 0, 0, 0.9);
      padding: 30px;
    }

    .team-panel.left {
      left: 40px;
      border-left: 5px solid #FF4757;
    }

    .team-panel.right {
      right: 40px;
      border-right: 5px solid #3742FA;
    }

    .team-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    .team-name-split {
      font-size: 28px;
      font-weight: 900;
      font-family: 'Impact', sans-serif;
      margin-bottom: 10px;
    }

    .team-panel.left .team-name-split {
      color: #FF4757;
      text-shadow: 0 0 20px #FF4757;
    }

    .team-panel.right .team-name-split {
      color: #3742FA;
      text-shadow: 0 0 20px #3742FA;
    }

    .team-score-split {
      font-size: 64px;
      font-weight: 900;
      font-family: 'Impact', sans-serif;
    }

    .team-panel.left .team-score-split {
      color: #FF4757;
      text-shadow: 0 0 30px #FF4757;
    }

    .team-panel.right .team-score-split {
      color: #3742FA;
      text-shadow: 0 0 30px #3742FA;
    }

    .team-stat-split {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: 'Arial', sans-serif;
    }

    .stat-label-split {
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
    }

    .stat-value-split {
      font-size: 20px;
      font-weight: 700;
    }

    .team-panel.left .stat-value-split {
      color: #FF4757;
    }

    .team-panel.right .stat-value-split {
      color: #3742FA;
    }

    /* Center logo and branding */
    .center-brand {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #FFA502;
      padding: 25px 40px;
      box-shadow: 0 0 40px rgba(255, 165, 2, 0.5);
    }

    .center-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      filter: drop-shadow(0 0 15px #FFA502);
    }

    .brand-name-split {
      font-size: 22px;
      font-weight: 900;
      color: #FFA502;
      font-family: 'Impact', sans-serif;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #FFA502;
    }

    .brand-subtitle {
      font-size: 14px;
      color: #888;
      font-family: 'Arial', sans-serif;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* Wave comparison */
    .wave-comparison {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 150px;
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #FFA502;
      padding: 20px;
      box-shadow: 0 0 40px rgba(255, 165, 2, 0.5);
    }

    .wave-title {
      font-size: 14px;
      color: #FFA502;
      font-family: 'Impact', sans-serif;
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #FFA502;
    }

    .wave-display {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      gap: 4px;
    }

    .wave-bar-split {
      width: 10px;
      border-radius: 5px;
      animation: wave-split 0.8s ease-in-out infinite;
    }

    @keyframes wave-split {
      0%, 100% { height: 20%; }
      50% { height: var(--height-split); }
    }

    .wave-bar-split:nth-child(odd) {
      background: linear-gradient(to top, #FF4757, #FF6348);
      box-shadow: 0 0 10px #FF4757;
    }

    .wave-bar-split:nth-child(even) {
      background: linear-gradient(to top, #3742FA, #5F71FF);
      box-shadow: 0 0 10px #3742FA;
    }

    .wave-bar-split:nth-child(1) { --height-split: 50%; animation-delay: 0s; }
    .wave-bar-split:nth-child(2) { --height-split: 70%; animation-delay: 0.1s; }
    .wave-bar-split:nth-child(3) { --height-split: 60%; animation-delay: 0.2s; }
    .wave-bar-split:nth-child(4) { --height-split: 85%; animation-delay: 0.3s; }
    .wave-bar-split:nth-child(5) { --height-split: 45%; animation-delay: 0.4s; }
    .wave-bar-split:nth-child(6) { --height-split: 75%; animation-delay: 0.5s; }
    .wave-bar-split:nth-child(7) { --height-split: 55%; animation-delay: 0.6s; }
    .wave-bar-split:nth-child(8) { --height-split: 90%; animation-delay: 0.7s; }
    .wave-bar-split:nth-child(9) { --height-split: 65%; animation-delay: 0.8s; }
    .wave-bar-split:nth-child(10) { --height-split: 50%; animation-delay: 0.9s; }

    /* Comparison bars */
    .comparison-bar {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .comparison-fill-left {
      position: absolute;
      left: 0;
      height: 100%;
      width: 48%;
      background: linear-gradient(to right, #FF4757, #FF6348);
      box-shadow: 0 0 20px #FF4757;
    }

    .comparison-fill-right {
      position: absolute;
      right: 0;
      height: 100%;
      width: 52%;
      background: linear-gradient(to left, #3742FA, #5F71FF);
      box-shadow: 0 0 20px #3742FA;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Split overlays -->
  <div class="split-overlay left"></div>
  <div class="split-overlay right"></div>

  <div class="overlay-container">
    <!-- Left Team Panel -->
    <div class="team-panel left fade-in">
      <div class="team-header">
        <div class="team-name-split">RAPTORS</div>
        <div class="team-score-split">102</div>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Field Goal %</span>
        <span class="stat-value-split">48%</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">3-Point %</span>
        <span class="stat-value-split">38%</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Rebounds</span>
        <span class="stat-value-split">44</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Assists</span>
        <span class="stat-value-split">26</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Steals</span>
        <span class="stat-value-split">9</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Blocks</span>
        <span class="stat-value-split">6</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Turnovers</span>
        <span class="stat-value-split">11</span>
      </div>
    </div>

    <!-- Right Team Panel -->
    <div class="team-panel right fade-in">
      <div class="team-header">
        <div class="team-name-split">BUCKS</div>
        <div class="team-score-split">108</div>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Field Goal %</span>
        <span class="stat-value-split">52%</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">3-Point %</span>
        <span class="stat-value-split">42%</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Rebounds</span>
        <span class="stat-value-split">48</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Assists</span>
        <span class="stat-value-split">31</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Steals</span>
        <span class="stat-value-split">12</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Blocks</span>
        <span class="stat-value-split">8</span>
      </div>
      <div class="team-stat-split">
        <span class="stat-label-split">Turnovers</span>
        <span class="stat-value-split">8</span>
      </div>
    </div>

    <!-- Center Brand -->
    <div class="center-brand fade-in">
      <img src="logo.png" alt="Logo" class="center-logo">
      <div class="brand-name-split">SILENT BASKETBALL</div>
      <div class="brand-subtitle">ASMR STREAM</div>
    </div>

    <!-- Comparison Bar -->
    <div class="comparison-bar fade-in">
      <div class="comparison-fill-left"></div>
      <div class="comparison-fill-right"></div>
    </div>

    <!-- Wave Comparison -->
    <div class="wave-comparison fade-in">
      <div class="wave-title">LIVE AUDIO VISUALIZATION</div>
      <div class="wave-display">
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
        <div class="wave-bar-split"></div>
      </div>
    </div>
  </div>
</body>
</html>
