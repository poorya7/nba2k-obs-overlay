<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 20: Data Storm</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Particle storm background */
    .particle-storm {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .data-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #FF2E63;
      border-radius: 50%;
      opacity: 0.5;
      animation: particle-storm 8s linear infinite;
      box-shadow: 0 0 10px #FF2E63;
    }

    @keyframes particle-storm {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0;
      }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0.2);
        opacity: 0;
      }
    }

    .data-particle:nth-child(1) {
      top: 10%;
      left: 5%;
      --tx: 200px;
      --ty: 300px;
      animation-delay: 0s;
    }

    .data-particle:nth-child(2) {
      top: 30%;
      left: 90%;
      --tx: -250px;
      --ty: 200px;
      animation-delay: 1s;
    }

    .data-particle:nth-child(3) {
      top: 60%;
      left: 10%;
      --tx: 300px;
      --ty: -150px;
      animation-delay: 2s;
    }

    .data-particle:nth-child(4) {
      top: 80%;
      left: 85%;
      --tx: -200px;
      --ty: -250px;
      animation-delay: 3s;
    }

    .data-particle:nth-child(5) {
      top: 20%;
      left: 50%;
      --tx: 150px;
      --ty: 350px;
      animation-delay: 4s;
    }

    .data-particle:nth-child(6) {
      top: 70%;
      left: 30%;
      --tx: -180px;
      --ty: -200px;
      animation-delay: 5s;
    }

    /* Central data hub */
    .data-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      background: rgba(0, 0, 0, 0.9);
      border: 4px solid #FF2E63;
      padding: 40px;
      clip-path: polygon(
        0 30px,
        30px 0,
        calc(100% - 30px) 0,
        100% 30px,
        100% calc(100% - 30px),
        calc(100% - 30px) 100%,
        30px 100%,
        0 calc(100% - 30px)
      );
      box-shadow: 0 0 60px rgba(255, 46, 99, 0.6),
                  inset 0 0 40px rgba(255, 46, 99, 0.1);
    }

    .hub-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .hub-logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 30px #FF2E63);
      animation: hub-rotate 20s linear infinite;
    }

    @keyframes hub-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hub-title {
      font-size: 42px;
      font-weight: 900;
      color: #FF2E63;
      font-family: 'Impact', sans-serif;
      letter-spacing: 6px;
      text-shadow: 0 0 40px #FF2E63;
      margin-bottom: 10px;
    }

    .hub-subtitle {
      font-size: 20px;
      color: #08D9D6;
      font-family: 'Impact', sans-serif;
      letter-spacing: 5px;
      text-shadow: 0 0 20px #08D9D6;
    }

    .hub-scores {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 60px;
      margin-bottom: 30px;
    }

    .hub-team {
      flex: 1;
      text-align: center;
      padding: 30px;
      background: rgba(255, 46, 99, 0.05);
      border: 2px solid rgba(255, 46, 99, 0.3);
      clip-path: polygon(20px 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
    }

    .hub-team-name {
      font-size: 20px;
      color: #08D9D6;
      font-family: 'Impact', sans-serif;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #08D9D6;
    }

    .hub-team-score {
      font-size: 92px;
      font-weight: 900;
      color: #FF2E63;
      font-family: 'Impact', sans-serif;
      text-shadow: 0 0 50px #FF2E63;
      line-height: 1;
    }

    .hub-vs {
      font-size: 32px;
      color: #08D9D6;
      font-weight: 900;
      text-shadow: 0 0 20px #08D9D6;
    }

    /* Data grid */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .grid-cell {
      background: rgba(8, 217, 214, 0.05);
      border: 2px solid rgba(8, 217, 214, 0.3);
      padding: 15px;
      text-align: center;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .grid-label {
      font-size: 11px;
      color: #888;
      font-family: 'Arial', sans-serif;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .grid-value {
      font-size: 24px;
      font-weight: 900;
      color: #08D9D6;
      font-family: 'Impact', sans-serif;
      text-shadow: 0 0 15px #08D9D6;
    }

    /* Mega wave visualizer */
    .mega-wave {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
      height: 180px;
      background: rgba(0, 0, 0, 0.9);
      border: 4px solid #08D9D6;
      padding: 25px;
      clip-path: polygon(
        0 20px,
        20px 0,
        calc(100% - 20px) 0,
        100% 20px,
        100% calc(100% - 20px),
        calc(100% - 20px) 100%,
        20px 100%,
        0 calc(100% - 20px)
      );
      box-shadow: 0 0 60px rgba(8, 217, 214, 0.6);
    }

    .mega-wave-title {
      font-size: 16px;
      color: #08D9D6;
      font-family: 'Impact', sans-serif;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #08D9D6;
    }

    .mega-wave-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 90px;
      gap: 6px;
    }

    .mega-bar {
      flex: 1;
      background: linear-gradient(to top, #FF2E63, #08D9D6);
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(255, 46, 99, 0.6);
      animation: mega-beat 0.8s ease-in-out infinite;
    }

    @keyframes mega-beat {
      0%, 100% { height: 20%; opacity: 0.5; }
      50% { height: var(--mega-height); opacity: 1; }
    }

    .mega-bar:nth-child(1) { --mega-height: 65%; animation-delay: 0s; }
    .mega-bar:nth-child(2) { --mega-height: 85%; animation-delay: 0.05s; }
    .mega-bar:nth-child(3) { --mega-height: 45%; animation-delay: 0.1s; }
    .mega-bar:nth-child(4) { --mega-height: 95%; animation-delay: 0.15s; }
    .mega-bar:nth-child(5) { --mega-height: 55%; animation-delay: 0.2s; }
    .mega-bar:nth-child(6) { --mega-height: 75%; animation-delay: 0.25s; }
    .mega-bar:nth-child(7) { --mega-height: 60%; animation-delay: 0.3s; }
    .mega-bar:nth-child(8) { --mega-height: 90%; animation-delay: 0.35s; }
    .mega-bar:nth-child(9) { --mega-height: 50%; animation-delay: 0.4s; }
    .mega-bar:nth-child(10) { --mega-height: 70%; animation-delay: 0.45s; }
    .mega-bar:nth-child(11) { --mega-height: 80%; animation-delay: 0.5s; }
    .mega-bar:nth-child(12) { --mega-height: 55%; animation-delay: 0.55s; }
    .mega-bar:nth-child(13) { --mega-height: 75%; animation-delay: 0.6s; }
    .mega-bar:nth-child(14) { --mega-height: 85%; animation-delay: 0.65s; }

    /* Corner indicators */
    .corner-indicator {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 3px solid #FF2E63;
      animation: corner-pulse 3s ease-in-out infinite;
    }

    @keyframes corner-pulse {
      0%, 100% { opacity: 0.3; box-shadow: 0 0 10px #FF2E63; }
      50% { opacity: 1; box-shadow: 0 0 30px #FF2E63; }
    }

    .corner-indicator.tl {
      top: 20px;
      left: 20px;
      border-right: none;
      border-bottom: none;
    }

    .corner-indicator.tr {
      top: 20px;
      right: 20px;
      border-left: none;
      border-bottom: none;
      animation-delay: 0.5s;
    }

    .corner-indicator.bl {
      bottom: 20px;
      left: 20px;
      border-right: none;
      border-top: none;
      animation-delay: 1s;
    }

    .corner-indicator.br {
      bottom: 20px;
      right: 20px;
      border-left: none;
      border-top: none;
      animation-delay: 1.5s;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Particle storm -->
  <div class="particle-storm">
    <div class="data-particle"></div>
    <div class="data-particle"></div>
    <div class="data-particle"></div>
    <div class="data-particle"></div>
    <div class="data-particle"></div>
    <div class="data-particle"></div>
  </div>

  <!-- Corner indicators -->
  <div class="corner-indicator tl"></div>
  <div class="corner-indicator tr"></div>
  <div class="corner-indicator bl"></div>
  <div class="corner-indicator br"></div>

  <div class="overlay-container">
    <!-- Data Hub -->
    <div class="data-hub fade-in">
      <div class="hub-header">
        <img src="logo.png" alt="Logo" class="hub-logo">
        <div class="hub-title">SILENT BASKETBALL</div>
        <div class="hub-subtitle">A S M R</div>
      </div>
      <div class="hub-scores">
        <div class="hub-team">
          <div class="hub-team-name">CLIPPERS</div>
          <div class="hub-team-score">128</div>
        </div>
        <div class="hub-vs">VS</div>
        <div class="hub-team">
          <div class="hub-team-name">SUNS</div>
          <div class="hub-team-score">124</div>
        </div>
      </div>
      <div class="data-grid">
        <div class="grid-cell">
          <div class="grid-label">FG%</div>
          <div class="grid-value">54%</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">3PT%</div>
          <div class="grid-value">42%</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">REB</div>
          <div class="grid-value">51</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">AST</div>
          <div class="grid-value">35</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">STL</div>
          <div class="grid-value">14</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">BLK</div>
          <div class="grid-value">9</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">TO</div>
          <div class="grid-value">10</div>
        </div>
        <div class="grid-cell">
          <div class="grid-label">LEAD</div>
          <div class="grid-value">+4</div>
        </div>
      </div>
    </div>

    <!-- Mega Wave Visualizer -->
    <div class="mega-wave fade-in">
      <div class="mega-wave-title">◆◆◆ LIVE AUDIO SPECTRUM ANALYSIS ◆◆◆</div>
      <div class="mega-wave-bars">
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
        <div class="mega-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
