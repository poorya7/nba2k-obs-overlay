<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 5: Gradient Flow</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Top gradient banner */
    .gradient-banner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, 
        rgba(106, 27, 154, 0.7) 0%,
        rgba(69, 90, 190, 0.7) 35%,
        rgba(0, 150, 136, 0.7) 70%,
        rgba(76, 175, 80, 0.7) 100%);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(106, 27, 154, 0.4);
    }

    .banner-content h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 3px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Side gradient bar */
    .gradient-sidebar {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100px;
      height: 500px;
      background: linear-gradient(180deg,
        rgba(156, 39, 176, 0.6) 0%,
        rgba(103, 58, 183, 0.6) 25%,
        rgba(63, 81, 181, 0.6) 50%,
        rgba(33, 150, 243, 0.6) 75%,
        rgba(0, 188, 212, 0.6) 100%);
      backdrop-filter: blur(10px);
      border-radius: 20px 0 0 20px;
      padding: 25px 15px;
      box-shadow: -4px 0 20px rgba(156, 39, 176, 0.3);
    }

    .sidebar-stat {
      margin-bottom: 35px;
      text-align: center;
    }

    .sidebar-stat:last-child {
      margin-bottom: 0;
    }

    .sidebar-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .sidebar-value {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .sidebar-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 5px;
      overflow: hidden;
    }

    .sidebar-bar-fill {
      height: 100%;
      background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0.6));
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    /* Bottom gradient panel - now with integrated player */
    .gradient-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(135deg,
        rgba(76, 175, 80, 0.7) 0%,
        rgba(0, 150, 136, 0.7) 30%,
        rgba(0, 188, 212, 0.7) 60%,
        rgba(3, 169, 244, 0.7) 100%);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 60px;
      box-shadow: 0 -4px 20px rgba(76, 175, 80, 0.3);
    }

    .panel-section.with-player {
      display: flex;
      gap: 20px;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px 25px;
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .player-in-panel {
      text-align: center;
    }

    .player-in-panel img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(233, 30, 99, 0.6);
      margin-bottom: 5px;
    }

    .player-in-panel-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .panel-section {
      text-align: center;
    }

    .panel-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .panel-value {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .panel-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Floating gradient card */
    .gradient-card {
      position: absolute;
      top: 220px;
      left: 50px;
      width: 250px;
      background: linear-gradient(135deg,
        rgba(233, 30, 99, 0.6),
        rgba(156, 39, 176, 0.6));
      backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(233, 30, 99, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .card-player-image {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.3);
      margin: 0 auto 15px;
      display: block;
    }

    .card-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .card-player {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .card-stats {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .card-stat {
      text-align: center;
    }

    .card-stat-value {
      font-size: 24px;
      font-weight: 900;
      color: #fff;
    }

    .card-stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
    }

    /* ASMR indicator corner */
    .asmr-corner {
      position: absolute;
      top: 120px;
      right: 120px;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg,
        rgba(255, 193, 7, 0.7),
        rgba(255, 152, 0, 0.7));
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(255, 193, 7, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .asmr-text {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="overlay-container">
    <!-- Top Banner -->
    <div class="gradient-banner fade-in">
      <div class="banner-content">
        <h1>SILENT BASKETBALL</h1>
      </div>
    </div>

    <!-- Side Bar -->
    <div class="gradient-sidebar fade-in">
      <div class="sidebar-stat">
        <div class="sidebar-label">FG%</div>
        <div class="sidebar-value">48</div>
        <div class="sidebar-bar">
          <div class="sidebar-bar-fill" style="width: 48%"></div>
        </div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-label">3PT</div>
        <div class="sidebar-value">12</div>
        <div class="sidebar-bar">
          <div class="sidebar-bar-fill" style="width: 75%"></div>
        </div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-label">REB</div>
        <div class="sidebar-value">42</div>
        <div class="sidebar-bar">
          <div class="sidebar-bar-fill" style="width: 85%"></div>
        </div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-label">AST</div>
        <div class="sidebar-value">28</div>
        <div class="sidebar-bar">
          <div class="sidebar-bar-fill" style="width: 60%"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Panel with Integrated Player -->
    <div class="gradient-panel fade-in">
      <div class="panel-section">
        <div class="panel-label">Away</div>
        <div class="panel-value">87</div>
        <div class="panel-sub">PHI</div>
      </div>
      <div class="panel-section">
        <div class="panel-label">Quarter</div>
        <div class="panel-value">Q3</div>
        <div class="panel-sub">6:42</div>
      </div>
      <div class="panel-section">
        <div class="panel-label">Home</div>
        <div class="panel-value">92</div>
        <div class="panel-sub">MIL</div>
      </div>
      <div class="panel-section with-player player-cycle">
        <div class="player-in-panel">
          <img src="https://a.espncdn.com/i/headshots/nba/players/full/3032977.png" alt="Giannis">
          <div class="player-in-panel-name">Giannis</div>
        </div>
        <div>
          <div class="panel-label">Hot Hand</div>
          <div class="panel-value" style="font-size: 28px;">31</div>
          <div class="panel-sub">PTS</div>
        </div>
      </div>
    </div>

    <!-- Player now integrated into bottom panel above -->

    <!-- ASMR Corner -->
    <div class="asmr-corner fade-in pulse">
      <div class="asmr-text">ASMR</div>
    </div>
  </div>
</body>
</html>
