<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 18: Holographic Overlay</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #0a0e27;
    }

    /* Holographic effect */
    @keyframes holo-shimmer {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .holo-border {
      animation: holo-shimmer 3s ease-in-out infinite;
    }

    /* Floating hexagons */
    .hexagon-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hexagon {
      position: absolute;
      width: 80px;
      height: 80px;
      opacity: 0.1;
      animation: float-hex 10s ease-in-out infinite;
    }

    @keyframes float-hex {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-100px) rotate(180deg); }
    }

    .hexagon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #00FFF0, #7B61FF);
      clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
    }

    .hexagon.hex-1 {
      top: 10%;
      left: 15%;
      animation-delay: 0s;
    }

    .hexagon.hex-2 {
      top: 30%;
      left: 80%;
      animation-delay: 2s;
    }

    .hexagon.hex-3 {
      top: 60%;
      left: 10%;
      animation-delay: 4s;
    }

    .hexagon.hex-4 {
      top: 75%;
      left: 85%;
      animation-delay: 6s;
    }

    /* Main holographic scoreboard */
    .holo-scoreboard {
      position: absolute;
      top: 300px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      background: linear-gradient(135deg, rgba(0, 255, 240, 0.05), rgba(123, 97, 255, 0.05));
      border: 3px solid;
      border-image: linear-gradient(135deg, #00FFF0, #7B61FF) 1;
      padding: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 60px rgba(0, 255, 240, 0.3),
                  inset 0 0 30px rgba(123, 97, 255, 0.1);
    }

    .holo-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .holo-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 20px #00FFF0);
      animation: holo-rotate 10s linear infinite;
    }

    @keyframes holo-rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    .holo-title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #00FFF0, #7B61FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: 'Impact', sans-serif;
      letter-spacing: 4px;
      text-shadow: 0 0 30px rgba(0, 255, 240, 0.5);
    }

    .holo-subtitle {
      font-size: 16px;
      color: #00FFF0;
      font-family: 'Arial', sans-serif;
      letter-spacing: 3px;
      margin-top: 10px;
      text-shadow: 0 0 15px #00FFF0;
    }

    .holo-teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 40px;
      margin-top: 30px;
    }

    .holo-team {
      text-align: center;
      flex: 1;
      padding: 20px;
      background: rgba(0, 255, 240, 0.03);
      border: 2px solid rgba(0, 255, 240, 0.3);
      border-radius: 10px;
    }

    .holo-team-name {
      font-size: 18px;
      color: #00FFF0;
      font-family: 'Arial', sans-serif;
      margin-bottom: 15px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00FFF0;
    }

    .holo-team-score {
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(135deg, #00FFF0, #7B61FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: 'Impact', sans-serif;
      filter: drop-shadow(0 0 20px rgba(0, 255, 240, 0.8));
    }

    /* Holographic data panels */
    .holo-data-panel {
      position: absolute;
      top: 50px;
      width: 320px;
      background: linear-gradient(135deg, rgba(0, 255, 240, 0.05), rgba(123, 97, 255, 0.05));
      border: 2px solid;
      border-image: linear-gradient(135deg, #00FFF0, #7B61FF) 1;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .holo-data-panel.left {
      left: 50px;
    }

    .holo-data-panel.right {
      right: 50px;
    }

    .holo-panel-title {
      font-size: 14px;
      color: #00FFF0;
      font-family: 'Impact', sans-serif;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #00FFF0;
    }

    .holo-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 255, 240, 0.2);
    }

    .holo-stat-label {
      font-size: 12px;
      color: #7B61FF;
      font-family: 'Arial', sans-serif;
      text-transform: uppercase;
      text-shadow: 0 0 10px #7B61FF;
    }

    .holo-stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #00FFF0;
      font-family: 'Impact', sans-serif;
      text-shadow: 0 0 10px #00FFF0;
    }

    /* Spectrum analyzer */
    .holo-spectrum {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 140px;
      background: linear-gradient(135deg, rgba(0, 255, 240, 0.05), rgba(123, 97, 255, 0.05));
      border: 3px solid;
      border-image: linear-gradient(135deg, #00FFF0, #7B61FF) 1;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .holo-spectrum-title {
      font-size: 14px;
      color: #00FFF0;
      font-family: 'Impact', sans-serif;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 15px;
      text-shadow: 0 0 15px #00FFF0;
    }

    .holo-spectrum-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 70px;
      gap: 5px;
    }

    .holo-bar {
      flex: 1;
      background: linear-gradient(to top, #00FFF0, #7B61FF);
      border-radius: 3px;
      box-shadow: 0 0 15px rgba(0, 255, 240, 0.6);
      animation: holo-pulse 0.9s ease-in-out infinite;
    }

    @keyframes holo-pulse {
      0%, 100% { height: 20%; opacity: 0.6; }
      50% { height: var(--holo-height); opacity: 1; }
    }

    .holo-bar:nth-child(1) { --holo-height: 55%; animation-delay: 0s; }
    .holo-bar:nth-child(2) { --holo-height: 75%; animation-delay: 0.1s; }
    .holo-bar:nth-child(3) { --holo-height: 45%; animation-delay: 0.2s; }
    .holo-bar:nth-child(4) { --holo-height: 90%; animation-delay: 0.3s; }
    .holo-bar:nth-child(5) { --holo-height: 60%; animation-delay: 0.4s; }
    .holo-bar:nth-child(6) { --holo-height: 80%; animation-delay: 0.5s; }
    .holo-bar:nth-child(7) { --holo-height: 50%; animation-delay: 0.6s; }
    .holo-bar:nth-child(8) { --holo-height: 70%; animation-delay: 0.7s; }
    .holo-bar:nth-child(9) { --holo-height: 85%; animation-delay: 0.8s; }
    .holo-bar:nth-child(10) { --holo-height: 55%; animation-delay: 0.9s; }
    .holo-bar:nth-child(11) { --holo-height: 65%; animation-delay: 1s; }
    .holo-bar:nth-child(12) { --holo-height: 75%; animation-delay: 1.1s; }

    /* Scan lines */
    .scan-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 240, 0.03),
        rgba(0, 255, 240, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Scan lines -->
  <div class="scan-lines"></div>

  <!-- Floating hexagons -->
  <div class="hexagon-field">
    <div class="hexagon hex-1"></div>
    <div class="hexagon hex-2"></div>
    <div class="hexagon hex-3"></div>
    <div class="hexagon hex-4"></div>
  </div>

  <div class="overlay-container">
    <!-- Left Data Panel -->
    <div class="holo-data-panel left fade-in holo-border">
      <div class="holo-panel-title">OFFENSE</div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Field Goal</span>
        <span class="holo-stat-value">48%</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">3-Point</span>
        <span class="holo-stat-value">38%</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Paint Pts</span>
        <span class="holo-stat-value">52</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Assists</span>
        <span class="holo-stat-value">28</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Fast Break</span>
        <span class="holo-stat-value">16</span>
      </div>
    </div>

    <!-- Right Data Panel -->
    <div class="holo-data-panel right fade-in holo-border">
      <div class="holo-panel-title">DEFENSE</div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Steals</span>
        <span class="holo-stat-value">11</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Blocks</span>
        <span class="holo-stat-value">8</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Deflections</span>
        <span class="holo-stat-value">22</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Rebounds</span>
        <span class="holo-stat-value">46</span>
      </div>
      <div class="holo-stat-row">
        <span class="holo-stat-label">Opp TO</span>
        <span class="holo-stat-value">13</span>
      </div>
    </div>

    <!-- Main Scoreboard -->
    <div class="holo-scoreboard fade-in holo-border">
      <div class="holo-header">
        <img src="logo.png" alt="Logo" class="holo-logo">
        <div class="holo-title">SILENT BASKETBALL</div>
        <div class="holo-subtitle">ASMR</div>
      </div>
      <div class="holo-teams">
        <div class="holo-team">
          <div class="holo-team-name">KNICKS</div>
          <div class="holo-team-score">116</div>
        </div>
        <div class="holo-team">
          <div class="holo-team-name">NETS</div>
          <div class="holo-team-score">121</div>
        </div>
      </div>
    </div>

    <!-- Spectrum Analyzer -->
    <div class="holo-spectrum fade-in holo-border">
      <div class="holo-spectrum-title">◆ AUDIO SPECTRUM ANALYSIS ◆</div>
      <div class="holo-spectrum-bars">
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
        <div class="holo-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
