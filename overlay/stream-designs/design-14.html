<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 14: Radar Analytics</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000814;
    }

    /* Radar chart */
    .radar-chart {
      position: absolute;
      top: 50%;
      right: 50px;
      transform: translateY(-50%);
      width: 350px;
      height: 350px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #00D9FF;
      border-radius: 50%;
      padding: 40px;
      box-shadow: 0 0 40px rgba(0, 217, 255, 0.4);
    }

    .radar-grid {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .radar-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(0, 217, 255, 0.2);
      border-radius: 50%;
    }

    .radar-ring.ring-1 {
      width: 100%;
      height: 100%;
      border-color: rgba(0, 217, 255, 0.4);
    }

    .radar-ring.ring-2 {
      width: 70%;
      height: 70%;
      border-color: rgba(0, 217, 255, 0.3);
    }

    .radar-ring.ring-3 {
      width: 40%;
      height: 40%;
      border-color: rgba(0, 217, 255, 0.2);
    }

    .radar-line {
      position: absolute;
      width: 1px;
      height: 50%;
      background: rgba(0, 217, 255, 0.2);
      top: 0;
      left: 50%;
      transform-origin: bottom center;
    }

    .radar-line.line-1 { transform: rotate(0deg); }
    .radar-line.line-2 { transform: rotate(72deg); }
    .radar-line.line-3 { transform: rotate(144deg); }
    .radar-line.line-4 { transform: rotate(216deg); }
    .radar-line.line-5 { transform: rotate(288deg); }

    .radar-label {
      position: absolute;
      font-size: 11px;
      color: #00D9FF;
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
    }

    .radar-label.label-1 {
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .radar-label.label-2 {
      top: 20%;
      right: -50px;
    }

    .radar-label.label-3 {
      bottom: 20%;
      right: -50px;
    }

    .radar-label.label-4 {
      bottom: 20%;
      left: -60px;
    }

    .radar-label.label-5 {
      top: 20%;
      left: -60px;
    }

    .radar-data {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80%;
      height: 80%;
      transform: translate(-50%, -50%);
      border: 2px solid #00D9FF;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.2), transparent);
      animation: radar-pulse 3s ease-in-out infinite;
    }

    @keyframes radar-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Performance bars */
    .performance-panel {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 320px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #00D9FF;
      padding: 20px;
    }

    .panel-title {
      font-size: 16px;
      color: #00D9FF;
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-align: center;
    }

    .perf-bar {
      margin-bottom: 18px;
    }

    .perf-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888;
      font-family: 'Arial', sans-serif;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .perf-value {
      color: #00D9FF;
      font-weight: 700;
    }

    .perf-bar-container {
      width: 100%;
      height: 12px;
      background: rgba(0, 217, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .perf-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00D9FF, #0080FF);
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.8);
      animation: bar-fill 2s ease-out;
    }

    @keyframes bar-fill {
      from { width: 0; }
    }

    /* Frequency analyzer */
    .freq-analyzer {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 120px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #00D9FF;
      padding: 15px;
      overflow: hidden;
    }

    .freq-title {
      font-size: 12px;
      color: #00D9FF;
      font-family: 'Arial', sans-serif;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .freq-bars {
      display: flex;
      align-items: flex-end;
      height: 70px;
      gap: 4px;
      justify-content: space-around;
    }

    .freq-bar {
      flex: 1;
      background: linear-gradient(to top, #00D9FF, #0080FF);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.6);
      animation: freq-dance 0.6s ease-in-out infinite;
    }

    @keyframes freq-dance {
      0%, 100% { height: 30%; }
      50% { height: var(--peak-height); }
    }

    .freq-bar:nth-child(1) { --peak-height: 50%; animation-delay: 0s; }
    .freq-bar:nth-child(2) { --peak-height: 70%; animation-delay: 0.05s; }
    .freq-bar:nth-child(3) { --peak-height: 90%; animation-delay: 0.1s; }
    .freq-bar:nth-child(4) { --peak-height: 60%; animation-delay: 0.15s; }
    .freq-bar:nth-child(5) { --peak-height: 80%; animation-delay: 0.2s; }
    .freq-bar:nth-child(6) { --peak-height: 50%; animation-delay: 0.25s; }
    .freq-bar:nth-child(7) { --peak-height: 70%; animation-delay: 0.3s; }
    .freq-bar:nth-child(8) { --peak-height: 95%; animation-delay: 0.35s; }
    .freq-bar:nth-child(9) { --peak-height: 60%; animation-delay: 0.4s; }
    .freq-bar:nth-child(10) { --peak-height: 40%; animation-delay: 0.45s; }
    .freq-bar:nth-child(11) { --peak-height: 70%; animation-delay: 0.5s; }
    .freq-bar:nth-child(12) { --peak-height: 85%; animation-delay: 0.55s; }

    /* Score widget */
    .score-widget {
      position: absolute;
      bottom: 190px;
      left: 50px;
      width: 280px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #00D9FF;
      padding: 20px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 217, 255, 0.3);
    }

    .brand-logo {
      width: 35px;
      height: 35px;
    }

    .brand-name {
      font-size: 14px;
      color: #00D9FF;
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
    }

    .score-teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-team {
      text-align: center;
    }

    .score-team-abbr {
      font-size: 12px;
      color: #888;
      font-family: 'Arial', sans-serif;
      margin-bottom: 8px;
    }

    .score-points {
      font-size: 38px;
      font-weight: 900;
      color: #00D9FF;
      font-family: 'Impact', sans-serif;
      text-shadow: 0 0 15px rgba(0, 217, 255, 0.8);
    }

    /* ASMR indicator */
    .asmr-indicator {
      position: absolute;
      top: 50px;
      right: 50px;
      background: rgba(0, 217, 255, 0.2);
      border: 2px solid #00D9FF;
      padding: 15px 30px;
      font-family: 'Impact', sans-serif;
      font-size: 28px;
      color: #00D9FF;
      letter-spacing: 3px;
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
      animation: glow-pulse 2s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.5); }
      50% { box-shadow: 0 0 50px rgba(0, 217, 255, 0.9); }
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>

  <div class="overlay-container">
    <!-- Performance Panel -->
    <div class="performance-panel fade-in">
      <div class="panel-title">Team Analytics</div>
      <div class="perf-bar">
        <div class="perf-label">
          <span>Field Goal %</span>
          <span class="perf-value">52%</span>
        </div>
        <div class="perf-bar-container">
          <div class="perf-bar-fill" style="width: 52%;"></div>
        </div>
      </div>
      <div class="perf-bar">
        <div class="perf-label">
          <span>3-Point %</span>
          <span class="perf-value">41%</span>
        </div>
        <div class="perf-bar-container">
          <div class="perf-bar-fill" style="width: 41%;"></div>
        </div>
      </div>
      <div class="perf-bar">
        <div class="perf-label">
          <span>Free Throw %</span>
          <span class="perf-value">88%</span>
        </div>
        <div class="perf-bar-container">
          <div class="perf-bar-fill" style="width: 88%;"></div>
        </div>
      </div>
      <div class="perf-bar">
        <div class="perf-label">
          <span>Offensive Eff.</span>
          <span class="perf-value">76%</span>
        </div>
        <div class="perf-bar-container">
          <div class="perf-bar-fill" style="width: 76%;"></div>
        </div>
      </div>
    </div>

    <!-- ASMR Indicator -->
    <div class="asmr-indicator fade-in">ASMR</div>

    <!-- Radar Chart -->
    <div class="radar-chart fade-in">
      <div class="radar-grid">
        <div class="radar-ring ring-1"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-ring ring-3"></div>
        <div class="radar-line line-1"></div>
        <div class="radar-line line-2"></div>
        <div class="radar-line line-3"></div>
        <div class="radar-line line-4"></div>
        <div class="radar-line line-5"></div>
        <div class="radar-label label-1">OFFENSE</div>
        <div class="radar-label label-2">DEFENSE</div>
        <div class="radar-label label-3">REBOUNDS</div>
        <div class="radar-label label-4">ASSISTS</div>
        <div class="radar-label label-5">BLOCKS</div>
        <div class="radar-data"></div>
      </div>
    </div>

    <!-- Score Widget -->
    <div class="score-widget fade-in">
      <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo">
        <div class="brand-name">Silent Basketball</div>
      </div>
      <div class="score-teams">
        <div class="score-team">
          <div class="score-team-abbr">GSW</div>
          <div class="score-points">104</div>
        </div>
        <div class="score-team">
          <div class="score-team-abbr">BOS</div>
          <div class="score-points">99</div>
        </div>
      </div>
    </div>

    <!-- Frequency Analyzer -->
    <div class="freq-analyzer fade-in">
      <div class="freq-title">◆ Audio Frequency ◆</div>
      <div class="freq-bars">
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
        <div class="freq-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
