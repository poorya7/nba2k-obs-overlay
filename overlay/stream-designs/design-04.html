<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 4: Floating Bubbles</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Bubble base styles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Player bubbles */
    .player-bubble {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, rgba(255, 182, 193, 0.25), rgba(255, 192, 203, 0.35));
      border: 3px solid rgba(255, 182, 193, 0.6);
      overflow: hidden;
      position: relative;
    }

    .player-bubble-image {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 0;
    }

    .player-bubble > * {
      position: relative;
      z-index: 1;
    }

    .player-bubble.player-1 {
      top: 150px;
      right: 100px;
    }

    .player-bubble.player-2 {
      bottom: 200px;
      left: 80px;
    }

    .player-name-bubble {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .player-stat-bubble {
      font-size: 32px;
      font-weight: 900;
      color: #ffb6c1;
      text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
    }

    .player-label-bubble {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Score bubble - expanded to include player */
    .score-bubble {
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      height: 220px;
      background: linear-gradient(135deg, rgba(173, 216, 230, 0.25), rgba(135, 206, 235, 0.35));
      border: 3px solid rgba(135, 206, 235, 0.6);
      display: flex;
      gap: 15px;
      padding: 20px;
    }

    .score-bubble-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-bubble-player {
      width: 100px;
      text-align: center;
      border-left: 2px solid rgba(255, 182, 193, 0.4);
      padding-left: 15px;
      opacity: 0.8;
    }

    .score-bubble-player-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 182, 193, 0.6);
      margin: 0 auto 8px;
      display: block;
    }

    .score-bubble-player-name {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .score-bubble-player-stat {
      font-size: 24px;
      font-weight: 900;
      color: #ffb6c1;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
    }

    .score-bubble-player-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
    }

    .score-bubble-teams {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .score-bubble-team {
      text-align: center;
    }

    .score-bubble-abbr {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .score-bubble-value {
      font-size: 38px;
      font-weight: 900;
      color: #87ceeb;
      text-shadow: 0 0 15px rgba(135, 206, 235, 0.8);
    }

    .score-bubble-vs {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .score-bubble-status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 10px;
      font-weight: 600;
    }

    /* Branding bubble */
    .branding-bubble {
      top: 350px;
      left: 120px;
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, rgba(216, 191, 216, 0.25), rgba(221, 160, 221, 0.35));
      border: 3px solid rgba(221, 160, 221, 0.6);
    }

    .branding-bubble h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* ASMR badge bubble */
    .asmr-bubble {
      bottom: 80px;
      right: 120px;
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, rgba(255, 218, 185, 0.25), rgba(255, 228, 196, 0.35));
      border: 3px solid rgba(255, 218, 185, 0.6);
    }

    .asmr-bubble-text {
      font-size: 24px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    /* Momentum bubble */
    .momentum-bubble {
      bottom: 300px;
      right: 200px;
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, rgba(152, 251, 152, 0.25), rgba(144, 238, 144, 0.35));
      border: 3px solid rgba(144, 238, 144, 0.6);
    }

    .momentum-label-bubble {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .momentum-value-bubble {
      font-size: 28px;
      font-weight: 900;
      color: #90ee90;
      text-shadow: 0 0 15px rgba(144, 238, 144, 0.8);
    }

    .momentum-bar-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      position: relative;
      margin-top: 8px;
    }

    .momentum-fill-circle {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #90ee90;
      border-right-color: #90ee90;
      border-bottom-color: #90ee90;
      transform: rotate(45deg);
    }

    /* Float animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .bubble {
      animation: float 4s ease-in-out infinite;
    }

    .player-bubble.player-2 {
      animation: float 5s ease-in-out infinite;
    }

    .score-bubble {
      animation: float 3.5s ease-in-out infinite;
    }

    .asmr-bubble {
      animation: float 4.5s ease-in-out infinite;
    }

    .momentum-bubble {
      animation: float 3.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="overlay-container">
    <!-- Score Bubble with Integrated Player -->
    <div class="bubble score-bubble fade-in">
      <div class="score-bubble-main">
        <div class="score-bubble-teams">
          <div class="score-bubble-team">
            <div class="score-bubble-abbr">PHI</div>
            <div class="score-bubble-value">87</div>
          </div>
          <div class="score-bubble-vs">vs</div>
          <div class="score-bubble-team">
            <div class="score-bubble-value">92</div>
            <div class="score-bubble-abbr">MIL</div>
          </div>
        </div>
        <div class="score-bubble-status">Q3 • 6:42</div>
      </div>
      <div class="score-bubble-player player-cycle">
        <img src="https://a.espncdn.com/i/headshots/nba/players/full/3032977.png" alt="Giannis" class="score-bubble-player-img">
        <div class="score-bubble-player-name">Giannis</div>
        <div class="score-bubble-player-stat">31</div>
        <div class="score-bubble-player-label">PTS</div>
      </div>
    </div>

    <!-- Player now integrated into score bubble above -->

    <!-- Branding Bubble -->
    <div class="bubble branding-bubble fade-in">
      <h1>SILENT<br>BASKETBALL</h1>
    </div>

    <!-- ASMR Bubble -->
    <div class="bubble asmr-bubble fade-in">
      <div class="asmr-bubble-text">ASMR</div>
    </div>

    <!-- Momentum Bubble -->
    <div class="bubble momentum-bubble fade-in">
      <div class="momentum-label-bubble">Momentum</div>
      <div class="momentum-value-bubble">MIL</div>
      <div class="momentum-bar-circle">
        <div class="momentum-fill-circle"></div>
      </div>
    </div>
  </div>
</body>
</html>
