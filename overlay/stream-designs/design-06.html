<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 6: Geometric Modern</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Angular top-left cluster - expanded for player */
    .angular-cluster {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 500px;
      height: 180px;
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.95), rgba(50, 50, 50, 0.95));
      backdrop-filter: blur(15px);
      clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
      border: 2px solid #ff6b35;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.4);
      padding: 25px 30px;
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .angular-cluster-main {
      flex: 1;
    }

    .angular-cluster-player {
      text-align: center;
      border-left: 2px solid rgba(255, 107, 53, 0.3);
      padding-left: 25px;
      opacity: 0.8;
    }

    .angular-cluster-player img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff6b35;
      margin-bottom: 8px;
    }

    .angular-cluster-player-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .angular-cluster-player-stat {
      font-size: 26px;
      font-weight: 900;
      color: #ff6b35;
      text-shadow: 0 0 10px rgba(255, 107, 53, 0.6);
    }

    .cluster-branding {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 15px;
      letter-spacing: 2px;
      line-height: 1.2;
    }

    .cluster-branding .accent {
      color: #ff6b35;
    }

    .cluster-score {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 15px;
    }

    .cluster-team {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cluster-team-abbr {
      font-size: 16px;
      font-weight: 700;
      color: #ccc;
    }

    .cluster-score-value {
      font-size: 36px;
      font-weight: 900;
      color: #ff6b35;
      text-shadow: 0 0 15px rgba(255, 107, 53, 0.6);
    }

    .cluster-vs {
      font-size: 14px;
      color: #666;
    }

    /* Hexagonal player card */
    .hex-player {
      position: absolute;
      top: 300px;
      right: 120px;
      width: 200px;
      height: 230px;
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.95), rgba(50, 50, 50, 0.95));
      backdrop-filter: blur(15px);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      border: 2px solid #ff6b35;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .hex-player-image {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff6b35;
      margin-bottom: 10px;
    }

    .hex-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .hex-player-name {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .hex-stat {
      font-size: 42px;
      font-weight: 900;
      color: #ff6b35;
      text-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
    }

    .hex-stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }

    /* Triangular momentum indicator */
    .triangle-momentum {
      position: absolute;
      bottom: 200px;
      left: 80px;
      width: 0;
      height: 0;
      border-left: 80px solid transparent;
      border-right: 80px solid transparent;
      border-bottom: 140px solid rgba(30, 30, 30, 0.95);
      position: relative;
      filter: drop-shadow(0 8px 20px rgba(255, 107, 53, 0.3));
    }

    .triangle-content {
      position: absolute;
      top: 80px;
      left: -50px;
      width: 100px;
      text-align: center;
    }

    .triangle-label {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .triangle-value {
      font-size: 24px;
      font-weight: 900;
      color: #ff6b35;
      text-shadow: 0 0 15px rgba(255, 107, 53, 0.7);
    }

    .triangle-border {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 0;
      height: 0;
      border-left: 82px solid transparent;
      border-right: 82px solid transparent;
      border-bottom: 142px solid #ff6b35;
      z-index: -1;
    }

    /* Geometric bottom bar */
    .geometric-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(90deg, rgba(30, 30, 30, 0.95), rgba(50, 50, 50, 0.95));
      backdrop-filter: blur(15px);
      border-top: 3px solid #ff6b35;
      box-shadow: 0 -4px 20px rgba(255, 107, 53, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 60px;
      clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
    }

    .bar-stat {
      text-align: center;
    }

    .bar-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .bar-value {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
    }

    .bar-sub {
      font-size: 13px;
      color: #ff6b35;
      margin-top: 3px;
      font-weight: 700;
    }

    /* Sharp ASMR badge */
    .sharp-asmr {
      position: absolute;
      top: 240px;
      left: 50px;
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.95), rgba(50, 50, 50, 0.95));
      backdrop-filter: blur(15px);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      border: 2px solid #ff6b35;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sharp-asmr-text {
      font-size: 18px;
      font-weight: 800;
      color: #ff6b35;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 107, 53, 0.7);
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="overlay-container">
    <!-- Angular Cluster with Integrated Player -->
    <div class="angular-cluster fade-in">
      <div class="angular-cluster-main">
        <div class="cluster-branding">
          SILENT<br>
          <span class="accent">BASKETBALL</span>
        </div>
        <div class="cluster-score">
          <div class="cluster-team">
            <span class="cluster-team-abbr">PHI</span>
            <span class="cluster-score-value">87</span>
          </div>
          <span class="cluster-vs">VS</span>
          <div class="cluster-team">
            <span class="cluster-score-value">92</span>
            <span class="cluster-team-abbr">MIL</span>
          </div>
        </div>
      </div>
      <div class="angular-cluster-player player-cycle">
        <img src="https://a.espncdn.com/i/headshots/nba/players/full/3032977.png" alt="Giannis">
        <div class="angular-cluster-player-name">Giannis</div>
        <div class="angular-cluster-player-stat">31</div>
      </div>
    </div>

    <!-- Player now integrated into angular cluster above -->

    <!-- Triangle Momentum -->
    <div class="triangle-momentum fade-in">
      <div class="triangle-border"></div>
      <div class="triangle-content">
        <div class="triangle-label">Momentum</div>
        <div class="triangle-value">MIL</div>
      </div>
    </div>

    <!-- Sharp ASMR Badge -->
    <div class="sharp-asmr fade-in glow">
      <div class="sharp-asmr-text">ASMR</div>
    </div>

    <!-- Geometric Bar -->
    <div class="geometric-bar fade-in">
      <div class="bar-stat">
        <div class="bar-label">Quarter</div>
        <div class="bar-value">Q3</div>
        <div class="bar-sub">6:42</div>
      </div>
      <div class="bar-stat">
        <div class="bar-label">Field Goals</div>
        <div class="bar-value">48%</div>
      </div>
      <div class="bar-stat">
        <div class="bar-label">3-Pointers</div>
        <div class="bar-value">12</div>
      </div>
      <div class="bar-stat">
        <div class="bar-label">Rebounds</div>
        <div class="bar-value">42</div>
      </div>
    </div>
  </div>
</body>
</html>
