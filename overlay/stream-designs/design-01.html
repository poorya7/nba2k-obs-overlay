<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 1: Soundwave Minimalist</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Soundwave at top */
    .soundwave {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(to bottom, rgba(0, 150, 136, 0.3), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 50px;
    }

    .wave-bar {
      width: 3px;
      background: linear-gradient(to top, #00bfa5, #4dd0e1);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(77, 208, 225, 0.6);
    }

    .wave-bar:nth-child(1) { height: 15px; }
    .wave-bar:nth-child(2) { height: 28px; }
    .wave-bar:nth-child(3) { height: 42px; }
    .wave-bar:nth-child(4) { height: 35px; }
    .wave-bar:nth-child(5) { height: 20px; }
    .wave-bar:nth-child(6) { height: 38px; }
    .wave-bar:nth-child(7) { height: 45px; }
    .wave-bar:nth-child(8) { height: 30px; }
    .wave-bar:nth-child(9) { height: 25px; }
    .wave-bar:nth-child(10) { height: 40px; }
    .wave-bar:nth-child(11) { height: 35px; }
    .wave-bar:nth-child(12) { height: 22px; }

    /* Branding top-left */
    .branding {
      position: absolute;
      top: 80px;
      left: 30px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      padding: 15px 25px;
      border-radius: 12px;
      border-left: 4px solid #00bfa5;
    }

    .branding h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
      letter-spacing: 1px;
    }

    .branding p {
      font-size: 14px;
      color: #4dd0e1;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* NBA Score pill top-right */
    .nba-score {
      position: absolute;
      top: 80px;
      right: 30px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(15px);
      padding: 18px 30px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 25px;
      border: 2px solid rgba(0, 191, 165, 0.3);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-abbr {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .score {
      font-size: 32px;
      font-weight: 900;
      color: #00bfa5;
      text-shadow: 0 0 15px rgba(0, 191, 165, 0.5);
    }

    .game-status {
      font-size: 14px;
      color: #4dd0e1;
      font-weight: 600;
    }

    /* Social handle bottom-right */
    .social {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: #b0bec5;
      font-weight: 500;
    }

    /* Momentum indicator */
    .momentum {
      position: absolute;
      bottom: 120px;
      right: 30px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      border-radius: 10px;
      text-align: center;
      min-width: 140px;
    }

    .momentum-label {
      font-size: 11px;
      color: #90a4ae;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .momentum-value {
      font-size: 24px;
      font-weight: 800;
      color: #00bfa5;
      text-shadow: 0 0 10px rgba(0, 191, 165, 0.4);
    }

    .momentum-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .momentum-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(to right, #00bfa5, #4dd0e1);
      box-shadow: 0 0 10px rgba(0, 191, 165, 0.6);
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="overlay-container">
    <!-- Soundwave -->
    <div class="soundwave">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- Branding -->
    <div class="branding fade-in">
      <h1>SILENT BASKETBALL</h1>
      <p>ASMR</p>
    </div>

    <!-- NBA Score -->
    <div class="nba-score fade-in">
      <div class="team">
        <span class="team-abbr">PHI</span>
        <span class="score">87</span>
      </div>
      <div class="game-status">Q3 • 6:42</div>
      <div class="team">
        <span class="score">92</span>
        <span class="team-abbr">MIL</span>
      </div>
    </div>

    <!-- Momentum -->
    <div class="momentum fade-in">
      <div class="momentum-label">Momentum</div>
      <div class="momentum-value">MIL</div>
      <div class="momentum-bar">
        <div class="momentum-fill"></div>
      </div>
    </div>

    <!-- Social -->
    <div class="social fade-in">
      @SilentBasketball
    </div>
  </div>
</body>
</html>
