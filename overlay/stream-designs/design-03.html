<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design 3: Framed Elegance</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      background: #000;
    }

    /* Decorative frame around entire screen */
    .frame-border {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border: 3px solid;
      border-image: linear-gradient(135deg, #ffd700, #fff, #ffd700) 1;
      pointer-events: none;
      box-shadow: inset 0 0 30px rgba(255, 215, 0, 0.2);
    }

    /* Corner decorations */
    .corner-frame {
      position: absolute;
      width: 200px;
      height: 80px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      border: 2px solid #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .corner-frame.top-left {
      top: 30px;
      left: 30px;
      border-radius: 0 0 15px 0;
      padding: 15px 20px;
    }

    .corner-frame.top-right {
      top: 30px;
      right: 30px;
      border-radius: 0 0 0 15px;
      padding: 15px 20px;
      text-align: right;
    }

    .frame-label {
      font-size: 10px;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .frame-content {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    /* Center top branding */
    .center-branding {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      padding: 20px 50px;
      border: 2px solid #ffd700;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    }

    .center-branding h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffd700;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .center-branding .separator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ffd700;
      border-radius: 50%;
      margin: 0 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    /* Score display bottom-left frame */
    .score-frame {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      padding: 25px 35px;
      border: 2px solid #ffd700;
      border-radius: 15px 15px 0 0;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
      min-width: 300px;
    }

    .score-frame-title {
      font-size: 11px;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }

    .score-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
    }

    .team-score {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .team-score-value {
      font-size: 42px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .vs-separator {
      font-size: 14px;
      color: #999;
      font-weight: 600;
    }

    .quarter-time {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
      font-weight: 600;
    }

    /* Real NBA game tracker bottom-right */
    .nba-tracker {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      padding: 20px 30px;
      border: 2px solid #ffd700;
      border-radius: 15px 15px 0 0;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
      min-width: 280px;
    }

    .nba-tracker-title {
      font-size: 11px;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }

    .nba-game {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .nba-game:last-child {
      margin-bottom: 0;
    }

    .nba-team {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .nba-score {
      font-size: 16px;
      font-weight: 800;
      color: #ffd700;
    }

    .nba-status {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="game-background">
    <video autoplay loop muted playsinline>
      <source src="../../game.mp4" type="video/mp4">
    </video>
  </div>
  
  <!-- Frame Border -->
  <div class="frame-border"></div>

  <div class="overlay-container">
    <!-- Corner Frames -->
    <div class="corner-frame top-left fade-in">
      <div class="frame-label">Stream</div>
      <div class="frame-content">LIVE NOW</div>
    </div>

    <div class="corner-frame top-right fade-in">
      <div class="frame-label">Mode</div>
      <div class="frame-content">MyCareer</div>
    </div>

    <!-- Center Branding -->
    <div class="center-branding fade-in">
      <h1>SILENT BASKETBALL<span class="separator"></span>ASMR</h1>
    </div>

    <!-- Score Frame -->
    <div class="score-frame fade-in">
      <div class="score-frame-title">Current Game</div>
      <div class="score-display">
        <div class="team-score">
          <div class="team-name">PHI</div>
          <div class="team-score-value">87</div>
        </div>
        <div class="vs-separator">VS</div>
        <div class="team-score">
          <div class="team-name">MIL</div>
          <div class="team-score-value">92</div>
        </div>
      </div>
      <div class="quarter-time">Q3 • 6:42</div>
    </div>

    <!-- NBA Tracker -->
    <div class="nba-tracker fade-in">
      <div class="nba-tracker-title">Real NBA Games</div>
      <div class="nba-game">
        <span class="nba-team">LAL</span>
        <span class="nba-score">102</span>
        <span class="vs-separator">-</span>
        <span class="nba-score">98</span>
        <span class="nba-team">BOS</span>
      </div>
      <div class="nba-game">
        <span class="nba-team">GSW</span>
        <span class="nba-score">115</span>
        <span class="vs-separator">-</span>
        <span class="nba-score">108</span>
        <span class="nba-team">DAL</span>
      </div>
      <div class="nba-status">Live</div>
    </div>
  </div>
</body>
</html>
