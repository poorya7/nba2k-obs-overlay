<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Loading Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button.export {
            background: #2196F3;
        }
        
        button.export:hover {
            background: #0b7dda;
        }
        
        .stats {
            margin-bottom: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .avatar-item {
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 2px solid transparent;
        }
        
        .avatar-item.loaded {
            border-color: #4CAF50;
        }
        
        .avatar-item.failed {
            border-color: #f44336;
        }
        
        .avatar-item.loading {
            border-color: #ff9800;
        }
        
        .avatar-item img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin-bottom: 10px;
            border: 2px solid #444;
        }
        
        .avatar-item.failed img {
            border-color: #f44336;
        }
        
        .avatar-item.loaded img {
            border-color: #4CAF50;
        }
        
        .avatar-info {
            font-size: 12px;
            color: #aaa;
        }
        
        .avatar-info strong {
            color: #fff;
            display: block;
            margin-bottom: 5px;
        }
        
        .status {
            margin-top: 5px;
            padding: 5px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .status.loaded {
            background: #4CAF50;
            color: white;
        }
        
        .status.failed {
            background: #f44336;
            color: white;
        }
        
        .status.loading {
            background: #ff9800;
            color: white;
        }
        
        #exportData {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 5px;
            display: none;
        }
        
        #exportData.visible {
            display: block;
        }
        
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Avatar Loading Test</h1>
    
    <div class="controls">
        <button onclick="loadAvatars()">Load All Avatars</button>
        <button class="export" onclick="exportData()">Export Results</button>
    </div>
    
    <div class="stats" id="stats">
        <strong>Status:</strong> Click "Load All Avatars" to start
    </div>
    
    <div class="avatar-grid" id="avatarGrid"></div>
    
    <div id="exportData"></div>
    
    <script>
        let avatarData = [];
        
        async function loadAvatars() {
            const grid = document.getElementById('avatarGrid');
            const stats = document.getElementById('stats');
            
            grid.innerHTML = '';
            avatarData = [];
            
            try {
                const response = await fetch('http://localhost:3000/api/chat');
                const data = await response.json();
                
                if (!data.messages || data.messages.length === 0) {
                    stats.innerHTML = '<strong>Status:</strong> No messages found';
                    return;
                }
                
                stats.innerHTML = `<strong>Status:</strong> Loading ${data.messages.length} avatars...`;
                
                // Get unique avatars (by URL)
                const uniqueAvatars = new Map();
                data.messages.forEach(msg => {
                    if (msg.avatar && msg.avatar.trim() !== '') {
                        if (!uniqueAvatars.has(msg.avatar)) {
                            uniqueAvatars.set(msg.avatar, {
                                url: msg.avatar,
                                username: msg.username,
                                id: msg.id,
                                timestamp: msg.timestamp
                            });
                        }
                    }
                });
                
                const avatarArray = Array.from(uniqueAvatars.values());
                stats.innerHTML = `<strong>Status:</strong> Testing ${avatarArray.length} unique avatars...`;
                
                // Test each avatar - simulate chat overlay behavior
                avatarArray.forEach((avatarInfo, index) => {
                    const item = document.createElement('div');
                    item.className = 'avatar-item loading';
                    item.id = `avatar-${index}`;
                    
                    // Simulate chat overlay structure: create message element like overlay does
                    const messageEl = document.createElement('div');
                    messageEl.className = 'message entering ghost-style';
                    messageEl.innerHTML = `<div class="entry"><img class="profile-pic" src="${avatarInfo.url}" alt="${avatarInfo.username}"><div class="content"><span class="user">${avatarInfo.username}</span>Test message</div></div>`;
                    
                    // Append to a canvas-like container (simulate chat overlay)
                    const canvas = document.createElement('div');
                    canvas.style.position = 'absolute';
                    canvas.style.top = '-9999px';
                    canvas.style.left = '-9999px';
                    document.body.appendChild(canvas);
                    canvas.appendChild(messageEl);
                    
                    // Get the profile pic element (like chat overlay does)
                    const profilePic = messageEl.querySelector('.profile-pic');
                    
                    const img = profilePic; // Use the actual img from the message structure
                    img.alt = avatarInfo.username;
                    
                    const info = document.createElement('div');
                    info.className = 'avatar-info';
                    info.innerHTML = `
                        <strong>${avatarInfo.username || 'Unknown'}</strong>
                        <div>URL: ${avatarInfo.url.substring(0, 50)}...</div>
                        <div class="status loading">Loading...</div>
                    `;
                    
                    item.appendChild(img);
                    item.appendChild(info);
                    grid.appendChild(item);
                    
                    // Track loading - simulate chat overlay behavior
                    const startTime = Date.now();
                    let loaded = false;
                    let failed = false;
                    let animationStarted = false;
                    
                    // Simulate chat overlay: wait for image to load before "starting animation"
                    const startAnimation = () => {
                        if (animationStarted) return;
                        animationStarted = true;
                        
                        // Check if image is actually visible/loaded
                        const isVisible = img.complete && img.naturalHeight !== 0 && img.offsetWidth > 0;
                        const elapsed = Date.now() - startTime;
                        
                        if (isVisible) {
                            loaded = true;
                            updateStatus(index, avatarInfo, true, elapsed);
                        } else {
                            failed = true;
                            updateStatus(index, avatarInfo, false, elapsed, 'Image not visible after load');
                        }
                        
                        // Clean up
                        document.body.removeChild(canvas);
                    };
                    
                    // Simulate chat overlay logic
                    if (!img.src || img.src.trim() === '') {
                        failed = true;
                        updateStatus(index, avatarInfo, false, Date.now() - startTime, 'No src');
                        document.body.removeChild(canvas);
                    } else if (img.complete && img.naturalHeight !== 0) {
                        // Already loaded
                        startAnimation();
                    } else {
                        // Wait for load (like chat overlay does)
                        img.addEventListener('load', startAnimation, { once: true });
                        img.addEventListener('error', () => {
                            failed = true;
                            const elapsed = Date.now() - startTime;
                            updateStatus(index, avatarInfo, false, elapsed, 'Image error');
                            document.body.removeChild(canvas);
                        }, { once: true });
                        
                        // Fallback timeout: 500ms (same as chat overlay)
                        setTimeout(() => {
                            if (!animationStarted) {
                                startAnimation();
                            }
                        }, 500);
                    }
                    
                    // Store data
                    const dataEntry = {
                        index,
                        username: avatarInfo.username,
                        url: avatarInfo.url,
                        messageId: avatarInfo.id,
                        timestamp: avatarInfo.timestamp,
                        loaded: null,
                        loadTime: null,
                        error: null
                    };
                    avatarData.push(dataEntry);
                    
                    // Store reference in closure for updateStatus
                    img.dataset.index = index;
                });
                
            } catch (error) {
                stats.innerHTML = `<strong>Status:</strong> Error: ${error.message}`;
                console.error('Error loading avatars:', error);
            }
        }
        
        function updateStatus(index, avatarInfo, success, elapsed, errorMsg = null) {
            const item = document.getElementById(`avatar-${index}`);
            if (!item) {
                console.error('Item not found for index:', index);
                return;
            }
            
            const statusDiv = item.querySelector('.status');
            if (!statusDiv) {
                console.error('Status div not found for index:', index);
                return;
            }
            
            const dataEntry = avatarData[index];
            if (!dataEntry) {
                console.error('Data entry not found for index:', index, 'avatarData length:', avatarData.length);
                return;
            }
            
            if (success) {
                item.className = 'avatar-item loaded';
                statusDiv.className = 'status loaded';
                statusDiv.textContent = `Loaded (${elapsed}ms)`;
                dataEntry.loaded = true;
                dataEntry.loadTime = elapsed;
            } else {
                item.className = 'avatar-item failed';
                statusDiv.className = 'status failed';
                statusDiv.textContent = `Failed (${elapsed}ms)${errorMsg ? ': ' + errorMsg : ''}`;
                dataEntry.loaded = false;
                dataEntry.loadTime = elapsed;
                dataEntry.error = errorMsg || 'Failed to load';
            }
            
            // Update stats
            const loaded = avatarData.filter(a => a && a.loaded === true).length;
            const failed = avatarData.filter(a => a && a.loaded === false).length;
            const loading = avatarData.filter(a => a && a.loaded === null).length;
            
            document.getElementById('stats').innerHTML = `
                <strong>Status:</strong> 
                <span style="color: #4CAF50">Loaded: ${loaded}</span> | 
                <span style="color: #f44336">Failed: ${failed}</span> | 
                <span style="color: #ff9800">Loading: ${loading}</span>
            `;
        }
        
        function exportData() {
            if (!avatarData || avatarData.length === 0) {
                alert('No data to export. Please load avatars first.');
                return;
            }
            
            const results = {
                timestamp: new Date().toISOString(),
                total: avatarData.length,
                loaded: avatarData.filter(a => a && a.loaded === true).length,
                failed: avatarData.filter(a => a && a.loaded === false).length,
                loading: avatarData.filter(a => a && a.loaded === null).length,
                avatars: avatarData.filter(a => a).map(a => ({
                    username: a.username || 'Unknown',
                    url: a.url || '',
                    loaded: a.loaded,
                    loadTime: a.loadTime,
                    error: a.error || null
                }))
            };
            
            const json = JSON.stringify(results, null, 2);
            
            // Copy to clipboard automatically
            navigator.clipboard.writeText(json).then(() => {
                alert('Data copied to clipboard!');
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = json;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Data copied to clipboard!');
            });
        }
    </script>
</body>
</html>
