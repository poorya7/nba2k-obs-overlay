<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Message Box Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .test-container {
            width: 281px;
        }
        
        .chat-style-13 {
            background: transparent;
            padding: 0;
        }
        
        /* Disable animation for test page */
        .chat-style-13 .chat-message:last-child .profile-pic {
            animation: none;
        }
        
        .inputs-container {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            color: #60a5fa;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .input-group input,
        .input-group textarea {
            width: 300px;
            padding: 8px 12px;
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.55);
            border-radius: 4px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: vertical;
        }
        
        .input-group textarea {
            min-height: 80px;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        
        .options-container {
            margin-top: 20px;
        }
        
        .options-container label {
            display: block;
            color: #60a5fa;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .option-btn {
            padding: 6px 12px;
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.55);
            border-radius: 4px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .option-btn:hover {
            background: rgba(10, 20, 40, 1);
            border-color: rgba(59, 130, 246, 0.8);
        }
        
        .option-btn.active {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
            color: #93c5fd;
        }
        
        /* Option 1: Ellipsis truncation */
        .chat-style-13 .option-1.chat-message:last-child .chat-username {
            max-width: 120px !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            display: inline-block !important;
        }
        
        /* Option 2: Username on own line */
        .chat-style-13 .option-2.chat-message:last-child .chat-username {
            display: block !important;
            margin-bottom: 4px !important;
        }
        
        /* Option 4: Character limit break */
        .chat-style-13 .option-4.chat-message:last-child .chat-username {
            word-break: break-all !important;
        }
        
        .chat-style-13 .option-4.chat-message:last-child .chat-text {
            word-break: break-word !important;
        }
        
        /* Option 5: Two-column layout */
        .chat-style-13 .option-5.chat-message:last-child .message-content {
            display: flex !important;
            flex-direction: column !important;
            margin-left: 0 !important;
        }
        
        .chat-style-13 .option-5.chat-message:last-child .chat-username {
            display: block !important;
            margin-bottom: 4px !important;
        }
        
        .chat-style-13 .option-5.chat-message:last-child .chat-text {
            display: block !important;
            margin-left: 0 !important;
        }
        
        /* Option 6: Character break + smart font adjustment */
        .chat-style-13 .option-6.chat-message:last-child .chat-username {
            word-break: break-all !important;
        }
        
        .chat-style-13 .option-6.chat-message:last-child .chat-text {
            word-break: break-word !important;
        }

        /* ==============================
           Option 8: Avatar Hug Wrap (Pro)
           Minimal overrides; does not touch other options.
           ============================== */

        /* contain the float so the message box height doesn't collapse */
        .chat-style-13 .option-8.chat-message:last-child::after {
            content: "";
            display: block;
            clear: both;
        }

        /* float the avatar and let text wrap around its circular shape */
        .chat-style-13 .option-8.chat-message:last-child .profile-pic {
            float: left !important;
            shape-outside: circle(50%) !important;
            clip-path: circle(50%) !important;
            border-radius: 50% !important;
            margin-right: 10px !important;
            margin-bottom: 6px !important;
            /* no width/height changes here to avoid breaking your base sizing */
        }

        /* keep username and text inline so they wrap naturally around the float */
        .chat-style-13 .option-8.chat-message:last-child .chat-username,
        .chat-style-13 .option-8.chat-message:last-child .chat-text {
            display: inline !important;
        }
    </style>
</head>
<body>
    <div class="inputs-container">
        <div class="input-group">
            <label for="username-input">Username:</label>
            <input type="text" id="username-input" value="BespokeExclamation">
        </div>
        <div class="input-group">
            <label for="message-input">Message:</label>
            <textarea id="message-input" rows="4">Point they needed to attract talent</textarea>
        </div>
        <div class="options-container">
            <label>Layout Options:</label>
            <div class="option-buttons">
                <button class="option-btn active" data-option="0">Current (Default)</button>
                <button class="option-btn" data-option="1">Option 1: Ellipsis Truncate</button>
                <button class="option-btn" data-option="2">Option 2: Username Own Line</button>
                <button class="option-btn" data-option="4">Option 4: Character Break</button>
                <button class="option-btn" data-option="6">Option 6: Character Break + Smart Fit</button>
                <button class="option-btn" data-option="5">Option 5: Two-Column</button>
                <!-- Added button: Option 8 -->
                <button class="option-btn" data-option="8">Option 8: Avatar Hug Wrap (Pro)</button>
            </div>
        </div>
    </div>
    
    <div class="test-container">
        <div class="chat-style-13">
            <div class="chat-message" id="message-box">
                <img class="profile-pic" src="https://via.placeholder.com/60/ff6b35/ffffff?text=11" alt="">
                <div class="message-content">
                    <span class="chat-username username-blue" id="username-display" title="">BespokeExclamation</span> 
                    <span class="chat-text" id="message-display">Point they needed to attract talent</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const usernameInput = document.getElementById('username-input');
        const messageInput = document.getElementById('message-input');
        const usernameDisplay = document.getElementById('username-display');
        const messageDisplay = document.getElementById('message-display');
        const messageBox = document.getElementById('message-box');
        const optionButtons = document.querySelectorAll('.option-btn');
        
        let currentOption = 0;
        
        // Update display when inputs change
        messageInput.addEventListener('input', () => {
            messageDisplay.textContent = messageInput.value;
            if (currentOption === 6) {
                applySmartFit();
            }
        });
        
        usernameInput.addEventListener('input', () => {
            usernameDisplay.textContent = usernameInput.value;
            if (currentOption === 6) {
                applySmartFit();
            }
        });
        
        // Handle option button clicks
        optionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const option = parseInt(btn.dataset.option);
                
                // Remove active class from all buttons
                optionButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Remove all option classes from message box (now includes option-8)
                messageBox.classList.remove('option-1', 'option-2', 'option-4', 'option-5', 'option-6', 'option-8');
                
                // Apply selected option
                currentOption = option;
                if (option > 0 && option !== 3) {
                    messageBox.classList.add(`option-${option}`);
                }
                
                // Clear any tooltip
                usernameDisplay.title = '';
                
                // Apply smart fit for option 6
                if (option === 6) {
                    applySmartFit();
                } else {
                    // Reset font sizes
                    messageDisplay.style.fontSize = '';
                    usernameDisplay.style.fontSize = '';
                }
            });
        });
        
        // Smart fit function for Option 6
        function applySmartFit() {
            const messageBoxEl = messageBox;
            const textEl = messageDisplay;
            
            // Reset font sizes first
            textEl.style.fontSize = '';
            
            // Force a reflow
            void messageBoxEl.offsetHeight;
            
            // Get base font size
            const computedStyle = window.getComputedStyle(textEl);
            const baseFontSize = parseFloat(computedStyle.fontSize);
            
            // Get text content
            const fullText = textEl.textContent.trim();
            if (!fullText) return;
            
            const words = fullText.split(/\s+/);
            if (words.length < 2) return;
            
            // Check actual rendered layout to find line breaks
            function getLineBreaks() {
                const range = document.createRange();
                const lineBreaks = [];
                
                // Get text node
                const textNode = textEl.firstChild;
                if (!textNode || textNode.nodeType !== Node.TEXT_NODE) return [];
                
                const actualText = textNode.textContent;
                let lastTop = null;
                
                // Find position of each word in the actual text
                let searchPos = 0;
                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const wordIndex = actualText.indexOf(word, searchPos);
                    if (wordIndex === -1) break;
                    
                    // Create range for this word
                    try {
                        range.setStart(textNode, wordIndex);
                        range.setEnd(textNode, wordIndex + word.length);
                        const rect = range.getBoundingClientRect();
                        
                        if (lastTop !== null && Math.abs(rect.top - lastTop) > 2) {
                            // Line break detected before this word (more than 2px difference)
                            lineBreaks.push(i);
                        }
                        lastTop = rect.top;
                        searchPos = wordIndex + word.length;
                    } catch (e) {
                        break;
                    }
                }
                return lineBreaks;
            }
            
            // Get initial line breaks
            let lineBreaks = getLineBreaks();
            
            // If no line breaks, nothing to optimize
            if (lineBreaks.length === 0) return;
            
            // Calculate available width for text
            const boxWidth = messageBoxEl.offsetWidth;
            const profilePicWidth = 60;
            const profilePicMargin = 12;
            const padding = 27 * 2;
            const availableWidth = boxWidth - profilePicWidth - profilePicMargin - padding;
            
            // Get font family for measurements
            const fontFamily = computedStyle.fontFamily;
            
            // For each breaking word, calculate how close it is to fitting
            const candidates = [];
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `${baseFontSize}px ${fontFamily}`;
            
            for (const breakIndex of lineBreaks) {
                if (breakIndex >= words.length) continue;
                
                const word = words[breakIndex];
                const wordWidth = context.measureText(word + ' ').width;
                
                // Calculate how much space was available before this word
                // We need to measure text up to this word
                const textBefore = words.slice(0, breakIndex).join(' ') + ' ';
                const textBeforeWidth = context.measureText(textBefore).width;
                const spaceAvailable = availableWidth - textBeforeWidth;
                
                // Calculate ratio (how close word is to fitting)
                const ratio = spaceAvailable / wordWidth;
                
                // If word is 85-100% of available space, it's a candidate
                if (ratio >= 0.85 && ratio < 1.0) {
                    candidates.push({
                        wordIndex: breakIndex,
                        word: word,
                        ratio: ratio,
                        spaceAvailable: spaceAvailable,
                        wordWidth: wordWidth
                    });
                }
            }
            
            // If no candidates, nothing to optimize
            if (candidates.length === 0) return;
            
            // Sort by ratio (closest to 1.0 = best candidate)
            candidates.sort((a, b) => b.ratio - a.ratio);
            const bestCandidate = candidates[0];
            
            // Calculate needed font reduction to fit this word
            const neededReduction = 1.0 - bestCandidate.ratio;
            const maxReduction = 0.1; // Don't reduce more than 10% (about 2px for 22px font)
            const actualReduction = Math.min(neededReduction * 1.1, maxReduction); // 1.1 = small buffer
            const targetFontSize = baseFontSize * (1 - actualReduction);
            
            // Don't reduce more than 2px
            if (baseFontSize - targetFontSize > 2) {
                return;
            }
            
            // Try the calculated font size
            textEl.style.fontSize = `${targetFontSize}px`;
            
            // Force reflow
            void messageBoxEl.offsetHeight;
            
            // Verify it worked - check if the word moved up
            const newLineBreaks = getLineBreaks();
            const wordMovedUp = !newLineBreaks.includes(bestCandidate.wordIndex);
            
            if (!wordMovedUp) {
                // Didn't work, try slightly smaller
                const smallerFontSize = targetFontSize - 0.1;
                if (smallerFontSize >= baseFontSize - 2) {
                    textEl.style.fontSize = `${smallerFontSize}px`;
                    void messageBoxEl.offsetHeight;
                } else {
                    // Give up, reset
                    textEl.style.fontSize = '';
                }
            }
        }
    </script>
</body>
</html>
