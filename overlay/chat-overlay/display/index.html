<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight Chat Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CHAT STYLE 13: Spotlight -->
    <div class="chat-overlay chat-style-13 active anim-style-1" id="chat-13">
        <!-- Chat list -->
        <div class="chat-messages-wrapper">
            <div class="chat-messages">
                <!-- Messages loaded from server -->
            </div>
        </div>
        
        <!-- Stage area for spotlight message (after chat list) -->
        <div class="chat-stage" id="chat-stage">
            <!-- Stage message appears here temporarily -->
        </div>
    </div>

    <!-- Animation Style Navigation -->
    <div class="animation-nav">
        <button class="animation-nav-btn active" data-style="1" title="Style 1: Gentle Scale + Fade">1</button>
        <button class="animation-nav-btn" data-style="2" title="Style 2: Zoom Dissolve">2</button>
        <button class="animation-nav-btn" data-style="3" title="Style 3: Ripple Blur">3</button>
        <button class="animation-nav-btn" data-style="4" title="Style 4: Glow Morph">4</button>
    </div>

    <!-- Load modules in dependency order -->
    <script src="config.js"></script>
    <script src="state-manager.js"></script>
    <script src="utils/data-formatter.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
    <script src="utils/message-box-styles.js"></script>
    
    <!-- Bootstrap: Wire dependencies and start -->
    <script>
        // Create instances with dependency injection
        const stateManager = new SpotlightStateManager();
        const dataFormatter = new SpotlightDataFormatter(SpotlightConfig);
        const view = new SpotlightView(SpotlightConfig);
        
        const controller = new SpotlightController({
            view: view,
            stateManager: stateManager,
            dataFormatter: dataFormatter,
            config: SpotlightConfig
        });
        
        // Start the overlay
        controller.start();
        
        // Set chat list height to 630px
        const chatOverlay = document.getElementById('chat-13');
        chatOverlay.style.setProperty('--chat-list-height', '630px');

        // Animation style navigation
        let currentAnimStyle = 1;
        const animNavBtns = document.querySelectorAll('.animation-nav-btn');
        const chatOverlayEl = document.getElementById('chat-13');

        function setAnimationStyle(styleNum) {
            currentAnimStyle = styleNum;
            
            // Remove all animation classes
            for (let i = 1; i <= 4; i++) {
                chatOverlayEl.classList.remove(`anim-style-${i}`);
            }
            
            // Add new animation class
            chatOverlayEl.classList.add(`anim-style-${styleNum}`);
            
            // Update button states
            animNavBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.style) === styleNum);
            });
            
            // Save to localStorage
            localStorage.setItem('chatAnimationStyle', styleNum);
        }

        // Button clicks
        animNavBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setAnimationStyle(parseInt(btn.dataset.style));
            });
        });

        // Keyboard navigation (left/right arrows)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                const newStyle = currentAnimStyle > 1 ? currentAnimStyle - 1 : 4;
                setAnimationStyle(newStyle);
            } else if (e.key === 'ArrowRight') {
                const newStyle = currentAnimStyle < 4 ? currentAnimStyle + 1 : 1;
                setAnimationStyle(newStyle);
            }
        });

        // Always start on style 1
        setAnimationStyle(1);
    </script>

</body>
</html>
