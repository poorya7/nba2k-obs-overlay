<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Message Box Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- IMPORTANT: this powers your base chat box visuals -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .test-container {
            width: 281px;
        }
        
        .chat-style-13 {
            background: transparent;
            padding: 0;
        }
        
        /* Disable animation for test page */
        .chat-style-13 .chat-message:last-child .profile-pic {
            animation: none;
        }
        
        .inputs-container {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            color: #60a5fa;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .input-group input,
        .input-group textarea {
            width: 300px;
            padding: 8px 12px;
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.55);
            border-radius: 4px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: vertical;
        }
        
        .input-group textarea {
            min-height: 80px;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        
        .options-container {
            margin-top: 20px;
        }
        
        .options-container label {
            display: block;
            color: #60a5fa;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .option-btn {
            padding: 6px 12px;
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.55);
            border-radius: 4px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .option-btn:hover {
            background: rgba(10, 20, 40, 1);
            border-color: rgba(59, 130, 246, 0.8);
        }
        
        .option-btn.active {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
            color: #93c5fd;
        }
        
        /* Option 1: Ellipsis truncation */
        .chat-style-13 .option-1.chat-message:last-child .chat-username {
            max-width: 120px !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            display: inline-block !important;
        }
        
        /* Option 2: Username on own line */
        .chat-style-13 .option-2.chat-message:last-child .chat-username {
            display: block !important;
            margin-bottom: 4px !important;
        }
        
        /* Option 4: Character limit break */
        .chat-style-13 .option-4.chat-message:last-child .chat-username {
            word-break: break-all !important;
        }
        
        .chat-style-13 .option-4.chat-message:last-child .chat-text {
            word-break: break-word !important;
        }
        
        /* Option 5: Two-column layout */
        .chat-style-13 .option-5.chat-message:last-child .message-content {
            display: flex !important;
            flex-direction: column !important;
            margin-left: 0 !important;
        }
        
        .chat-style-13 .option-5.chat-message:last-child .chat-username {
            display: block !important;
            margin-bottom: 4px !important;
        }
        
        .chat-style-13 .option-5.chat-message:last-child .chat-text {
            display: block !important;
            margin-left: 0 !important;
        }
        
        /* Option 6: Character break + smart font adjustment */
        .chat-style-13 .option-6.chat-message:last-child .chat-username {
            word-break: break-all !important;
        }
        
        .chat-style-13 .option-6.chat-message:last-child .chat-text {
            word-break: break-word !important;
        }

        /* ==============================
           Option 8: Avatar Hug Wrap (Pro)
           ============================== */

        .chat-style-13 .option-8.chat-message:last-child::after {
            content: "";
            display: block;
            clear: both;
        }

        .chat-style-13 .option-8.chat-message:last-child .profile-pic {
            float: left !important;
            shape-outside: circle(50%) !important;
            clip-path: circle(50%) !important;
            border-radius: 50% !important;
            margin-right: 10px !important;
            margin-bottom: 6px !important;
        }

        .chat-style-13 .option-8.chat-message:last-child .chat-username,
        .chat-style-13 .option-8.chat-message:last-child .chat-text {
            display: inline !important;
        }
    </style>
</head>
<body>
    <div class="inputs-container">
        <div class="input-group">
            <label for="username-input">Username:</label>
            <input type="text" id="username-input" value="BespokeExclamation">
        </div>
        <div class="input-group">
            <label for="message-input">Message:</label>
            <textarea id="message-input" rows="4">Point they needed to attract talent</textarea>
        </div>
        <div class="options-container">
            <label>Layout Options:</label>
            <div class="option-buttons">
                <button class="option-btn active" data-option="0">Current (Default)</button>
                <button class="option-btn" data-option="1">Option 1: Ellipsis Truncate</button>
                <button class="option-btn" data-option="2">Option 2: Username Own Line</button>
                <button class="option-btn" data-option="4">Option 4: Character Break</button>
                <button class="option-btn" data-option="6">Option 6: Character Break + Smart Fit</button>
                <button class="option-btn" data-option="5">Option 5: Two-Column</button>
                <button class="option-btn" data-option="8">Option 8: Avatar Hug Wrap (Pro)</button>
            </div>
        </div>
    </div>
    
    <div class="test-container">
        <div class="chat-style-13">
            <div class="chat-message" id="message-box">
                <img class="profile-pic" src="https://via.placeholder.com/60/ff6b35/ffffff?text=11" alt="">
                <div class="message-content">
                    <span class="chat-username username-blue" id="username-display" title="">BespokeExclamation</span> 
                    <span class="chat-text" id="message-display">Point they needed to attract talent</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const usernameInput = document.getElementById('username-input');
        const messageInput = document.getElementById('message-input');
        const usernameDisplay = document.getElementById('username-display');
        const messageDisplay = document.getElementById('message-display');
        const messageBox = document.getElementById('message-box');
        const optionButtons = document.querySelectorAll('.option-btn');
        
        let currentOption = 0;
        
        // Update display when inputs change
        messageInput.addEventListener('input', () => {
            messageDisplay.textContent = messageInput.value;
            if (currentOption === 6) {
                requestAnimationFrame(applySmartFit);
            }
        });
        
        usernameInput.addEventListener('input', () => {
            usernameDisplay.textContent = usernameInput.value;
            if (currentOption === 6) {
                requestAnimationFrame(applySmartFit);
            }
        });
        
        // Handle option button clicks
        optionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const option = parseInt(btn.dataset.option);
                
                optionButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Remove all option classes
                messageBox.classList.remove('option-1', 'option-2', 'option-4', 'option-5', 'option-6', 'option-8');
                
                currentOption = option;
                if (option > 0 && option !== 3) {
                    messageBox.classList.add(`option-${option}`);
                }
                
                usernameDisplay.title = '';
                
                if (option === 6) {
                    requestAnimationFrame(applySmartFit);
                } else {
                    // Reset font sizes when switching away
                    messageDisplay.style.fontSize = '';
                    usernameDisplay.style.fontSize = '';
                }
            });
        });
        
        // Smart fit function for Option 6 (with rAF + improved detection)
        function applySmartFit() {
            const textEl = messageDisplay;
            const nameEl = usernameDisplay;

            // Reset first
            textEl.style.fontSize = '';
            nameEl.style.fontSize = '';
            void messageBox.offsetHeight;

            textEl.style.display = 'inline';
void textEl.offsetHeight; // ensure layout flush
const computedStyle = window.getComputedStyle(textEl);

            const baseFontSize = parseFloat(computedStyle.fontSize);
            const fontFamily = computedStyle.fontFamily;

            const fullText = textEl.textContent.trim();
            if (!fullText) return;

            const words = fullText.split(/\s+/);
            if (words.length < 2) return;

            // Detect line breaks robustly
            const getLineBreaks = () => {
                const range = document.createRange();
                const textNode = textEl.firstChild;
                if (!textNode || textNode.nodeType !== Node.TEXT_NODE) return [];
                const actualText = textNode.textContent;
                const breaks = [];
                let lastTop = null;
                let searchPos = 0;

                for (let i = 0; i < words.length; i++) {
                    const w = words[i];
                    const idx = actualText.indexOf(w, searchPos);
                    if (idx === -1) break;
                    range.setStart(textNode, idx);
                    range.setEnd(textNode, idx + w.length);
                    const rect = range.getBoundingClientRect();
                    if (lastTop !== null && rect.top - lastTop > 1.5) breaks.push(i);
                    lastTop = rect.top;
                    searchPos = idx + w.length;
                }
                return breaks;
            };

            const initialBreaks = getLineBreaks();
            if (initialBreaks.length === 0) return;

            // Compute available width numerically
            const boxWidth = messageBox.offsetWidth;
            const pic = messageBox.querySelector('.profile-pic');
            const profilePicWidth = pic ? pic.offsetWidth : 60;

            // Try to account for inner paddings/margins around text
            const textStyle = window.getComputedStyle(textEl);
            const padLeft = parseFloat(textStyle.paddingLeft) || 0;
            const padRight = parseFloat(textStyle.paddingRight) || 0;
            // a small empirical safety buffer (~54 px) as in your original logic
            const availableWidth = boxWidth - profilePicWidth - (padLeft + padRight + 54);

            // Canvas-based measurement at current font
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = `${baseFontSize}px ${fontFamily}`;

            const candidates = [];
            for (const breakIndex of initialBreaks) {
                const word = words[breakIndex];
                const wordWidth = ctx.measureText(word + ' ').width;

                const textBefore = words.slice(0, breakIndex).join(' ') + ' ';
                const widthBefore = ctx.measureText(textBefore).width;
                const spaceAvailable = availableWidth - widthBefore;
                const ratio = spaceAvailable / wordWidth;

                // Wider tolerance window (0.80 .. < 1.0)
                if (ratio >= 0.80 && ratio < 1.0) {
                    candidates.push({ wordIndex: breakIndex, ratio, wordWidth, spaceAvailable });
                }
            }

            if (candidates.length === 0) return;

            // Choose the closest-to-fitting
            candidates.sort((a, b) => b.ratio - a.ratio);
            const best = candidates[0];

            // Compute shrink — allow up to 5px
            const neededReduction = 1.0 - best.ratio;
            // slight buffer 1.1; clamp to 20% max
            const reductionFactor = Math.min(neededReduction * 1.1, 0.20);
            let targetSize = baseFontSize * (1 - reductionFactor);
            if ((baseFontSize - targetSize) > 5) {
                targetSize = baseFontSize - 5;
            }

            // Apply to BOTH username + text
            textEl.style.fontSize = `${targetSize}px`;
            nameEl.style.fontSize = `${targetSize}px`;

            // Reflow and verify the target word moved up
            void messageBox.offsetHeight;
            const newBreaks = getLineBreaks();
            const stillBreaksAtSameIndex = newBreaks.includes(best.wordIndex);

            if (stillBreaksAtSameIndex) {
                // Nudge slightly smaller if still within 5px cap
                const nudged = targetSize - 0.2;
                if ((baseFontSize - nudged) <= 5) {
                    textEl.style.fontSize = `${nudged}px`;
                    nameEl.style.fontSize = `${nudged}px`;
                }
            }
			textEl.style.display = '';

        }
    </script>
</body>
</html>
