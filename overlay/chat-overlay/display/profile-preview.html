<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture Style Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        .preview-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
        }

        .message-box {
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.55);
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.34);
            border-radius: 16px;
            padding: 18px 27px;
            font-size: 22px;
            line-height: 1.5;
            position: relative;
            min-height: 120px;
        }

        .username {
            color: #60a5fa;
            font-weight: 600;
            margin-right: 6px;
        }

        .text {
            color: #e2e8f0;
        }

        /* Profile Picture Base */
        .profile-pic {
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(59, 130, 246, 0.6);
        }

        /* Style 1: Top-left corner */
        .style-1 .profile-pic {
            width: 40px;
            height: 40px;
            position: absolute;
            top: -8px;
            left: -8px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* Style 2: Left side, vertical center */
        .style-2 {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .style-2 .profile-pic {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        /* Style 3: Above username */
        .style-3 {
            text-align: center;
        }
        .style-3 .profile-pic {
            width: 60px;
            height: 60px;
            display: block;
            margin: 0 auto 10px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Style 4: Right side, vertical center */
        .style-4 {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .style-4 .profile-pic {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            order: 2;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }
        .style-4 .content {
            order: 1;
        }

        /* Style 5: Bottom-right corner */
        .style-5 .profile-pic {
            width: 35px;
            height: 35px;
            position: absolute;
            bottom: -6px;
            right: -6px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
        }

        /* Style 6: Left side, connected line */
        .style-6 {
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
        }
        .style-6 .profile-pic {
            width: 60px;
            height: 60px;
            margin-right: 15px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .style-6::before {
            content: '';
            position: absolute;
            left: 60px;
            width: 15px;
            height: 2px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.8), transparent);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* Style 7: Above box, centered */
        .style-7 {
            position: relative;
        }
        .style-7 .profile-pic {
            width: 70px;
            height: 70px;
            position: absolute;
            top: -85px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.7), 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* Style 8: Left side, diagonal connector */
        .style-8 {
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
        }
        .style-8 .profile-pic {
            width: 65px;
            height: 65px;
            margin-right: 20px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .style-8::before {
            content: '';
            position: absolute;
            left: 65px;
            width: 20px;
            height: 2px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), transparent);
            transform: rotate(-45deg);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* Style 9: Right side, curved connector */
        .style-9 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .style-9 .profile-pic {
            width: 60px;
            height: 60px;
            order: 2;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .style-9 .content {
            order: 1;
        }
        .style-9::after {
            content: '';
            position: absolute;
            right: 60px;
            width: 20px;
            height: 2px;
            background: linear-gradient(270deg, rgba(59, 130, 246, 0.8), transparent);
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* Style 10: Top-left, floating */
        .style-10 .profile-pic {
            width: 55px;
            height: 55px;
            position: absolute;
            top: -70px;
            left: 0;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Style 11: Glowing border ring */
        .style-11 {
            position: relative;
        }
        .style-11 .profile-pic {
            width: 60px;
            height: 60px;
            position: absolute;
            top: 10px;
            left: 10px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8), 0 0 40px rgba(59, 130, 246, 0.4);
            animation: pulse-ring 2s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8), 0 0 40px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 30px rgba(59, 130, 246, 1), 0 0 60px rgba(59, 130, 246, 0.6); }
        }
        .style-11 .content {
            margin-left: 80px;
        }

        /* Style 12: Neon outline + pulse */
        .style-12 {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .style-12 .profile-pic {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8), inset 0 0 10px rgba(59, 130, 246, 0.3);
            animation: neon-pulse 2s ease-in-out infinite;
        }
        @keyframes neon-pulse {
            0%, 100% { border-color: rgba(59, 130, 246, 0.8); box-shadow: 0 0 15px rgba(59, 130, 246, 0.8), inset 0 0 10px rgba(59, 130, 246, 0.3); }
            50% { border-color: rgba(59, 130, 246, 1); box-shadow: 0 0 25px rgba(59, 130, 246, 1), inset 0 0 15px rgba(59, 130, 246, 0.5); }
        }

        /* Style 13: Gradient mask overlay */
        .style-13 {
            position: relative;
            overflow: hidden;
        }
        .style-13 .profile-pic {
            width: 70px;
            height: 70px;
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            opacity: 0.3;
            filter: blur(2px);
        }
        .style-13 .content {
            position: relative;
            z-index: 1;
        }

        /* Style 14: Floating orb style */
        .style-14 {
            position: relative;
        }
        .style-14 .profile-pic {
            width: 50px;
            height: 50px;
            position: absolute;
            top: -60px;
            right: 10px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.9), 0 0 50px rgba(59, 130, 246, 0.5);
            animation: orb-float 3s ease-in-out infinite;
        }
        @keyframes orb-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .style-14::before {
            content: '';
            position: absolute;
            top: -50px;
            right: 35px;
            width: 2px;
            height: 10px;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.6), transparent);
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.4);
        }

        /* Style 15: Split design */
        .style-15 {
            display: flex;
            gap: 0;
        }
        .style-15 .profile-pic {
            width: 60px;
            height: 60px;
            margin-right: 20px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .style-15 .content {
            flex: 1;
            border-left: 2px solid rgba(59, 130, 246, 0.4);
            padding-left: 20px;
            box-shadow: -2px 0 10px rgba(59, 130, 246, 0.2);
        }

        /* Navigation */
        .nav-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-button {
            background: rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.6);
            color: #60a5fa;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-button:hover {
            background: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .style-number {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="message-box" id="messageBox">
            <img class="profile-pic" id="profilePic" src="https://yt3.ggpht.com/ytc/default.jpg" alt="User">
            <div class="content">
                <span class="username">ASTROGOTY24</span>
                <span class="text">I think Half Life 3 is real but Valve probably fooled these leakers</span>
            </div>
        </div>
    </div>

    <div class="nav-container">
        <button class="nav-button" id="prevBtn">← Prev</button>
        <div class="style-number" id="styleNumber">Style 1</div>
        <button class="nav-button" id="nextBtn">Next →</button>
    </div>

    <script>
        let currentStyle = 1;
        const totalStyles = 15;

        const messageBox = document.getElementById('messageBox');
        const styleNumber = document.getElementById('styleNumber');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function updateStyle(styleNum) {
            // Remove all style classes
            messageBox.className = 'message-box';
            
            // Add new style class
            messageBox.classList.add(`style-${styleNum}`);
            
            // Update style number display
            styleNumber.textContent = `Style ${styleNum}`;
        }

        function nextStyle() {
            currentStyle = (currentStyle % totalStyles) + 1;
            updateStyle(currentStyle);
        }

        function prevStyle() {
            currentStyle = currentStyle === 1 ? totalStyles : currentStyle - 1;
            updateStyle(currentStyle);
        }

        // Button clicks
        nextBtn.addEventListener('click', nextStyle);
        prevBtn.addEventListener('click', prevStyle);

        // Arrow keys
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextStyle();
            } else if (e.key === 'ArrowLeft') {
                prevStyle();
            }
        });

        // Initialize
        updateStyle(1);
    </script>
</body>
</html>
