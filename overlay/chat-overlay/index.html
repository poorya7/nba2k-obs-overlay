<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay Only</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/overlay/chat-overlay/styles.css">
</head>
<body style="margin: 0; padding: 0; background: transparent; width: 1920px; height: 1080px; overflow: hidden;">

    <!-- Ghost Chat Canvas -->
    <div class="chat-canvas" id="ghost-chat">
        <!-- Chat List Background -->
        <div class="chat-list-background" id="chat-list-bg"></div>
    </div>

    <!-- Chat overlay display modules -->
    <script src="/overlay/chat-overlay/display/chat-config.js"></script>
    <script src="/overlay/chat-overlay/display/chat-state-manager.js"></script>
    <script src="/overlay/chat-overlay/display/chat-data-formatter.js"></script>
    <script src="/overlay/chat-overlay/display/chat-view.js"></script>
    <script src="/overlay/chat-overlay/display/stage-animator.js"></script>
    <script src="/overlay/chat-overlay/display/chat-controller.js"></script>
    
    <!-- Initialize chat overlay -->
    <script>
        // Initialize after DOM loads
        document.addEventListener('DOMContentLoaded', () => {
            // Create dependencies
            const config = ChatConfig;
            const stateManager = new ChatStateManager();
            const dataFormatter = new ChatDataFormatter(config);
            const chatView = new ChatView(config);
            const stageAnimator = new StageAnimator(config, chatView, stateManager);
            
            // Create controller with dependency injection
            const chatController = new ChatController({
                chatView: chatView,
                stateManager: stateManager,
                dataFormatter: dataFormatter,
                stageAnimator: stageAnimator,
                config: config
            });
            
            // Start the chat overlay
            chatController.start();
            
            // Listen for style changes from parent window
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'changeStyle') {
                    const style = event.data.style;
                    // Remove all style classes
                    for (let i = 1; i <= 21; i++) {
                        document.body.classList.remove(`chat-style-option-${i}`);
                    }
                    // Add selected style class
                    if (style) {
                        document.body.classList.add(`chat-style-${style}`);
                    }
                    // Pre-populate messages for the new style
                    chatController.prePopulate();
                }
                
                // Listen for font size changes
                if (event.data && event.data.type === 'changeFontSize') {
                    const fontSize = event.data.fontSize;
                    if (fontSize && fontSize >= 10 && fontSize <= 30) {
                        chatController.config.settings.listFontSize = fontSize;
                        chatController.updateStyles();
                    }
                }
            });
        });
    </script>
</body>
</html>
