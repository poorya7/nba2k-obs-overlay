<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <link rel="stylesheet" href="chat-overlay.css">
</head>
<body>
    <div class="controls">
        <input type="text" id="usernameInput" placeholder="Username">
        <textarea id="textInput" placeholder="Message text" rows="4"></textarea>
    </div>
    <div class="chat-message" id="chatMessage">
        <div class="profile-pic"></div>
        <span class="username" id="username">TestUser123</span>
        <span class="chat-text" id="chatText">This is a test message for the chat overlay!</span>
    </div>

    <script src="chat-overlay.js"></script>
</body>
</html>
