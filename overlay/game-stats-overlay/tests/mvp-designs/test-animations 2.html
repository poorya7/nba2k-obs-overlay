<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP Option 4d - Vertical Layout</title>
    <link rel="stylesheet" href="../../core/styles.css">
    <style>
        :root {
            --mvp-label-size: 10px;
            --player-name-size: 11.5px;
            --stat-value-size: 15px;
            --stat-label-size: 10px;
            --player-pic-size: 86px;
            --stats-gap: 10px;
            --name-to-stats-gap: 11px;
            --mvp-vertical-position: 5px;
            --overlay-vertical-offset: 120px;
            --box-top-position: 210px;
            --open-box-duration: 500;
            --open-delay: 300;
            --open-fade-duration: 300;
            --slide-amount: 15px;
            --close-fade-duration: 350;
            --close-delay: 300;
            --close-box-duration: 500;
        }

        .game-stats {
            padding-bottom: 16px !important;
            bottom: auto !important;
            top: var(--box-top-position) !important;
        }

        .mvp-section {
            margin-top: var(--mvp-vertical-position);
            padding-top: 12px;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
            overflow: hidden;
            transition: height 0.5s ease-out, padding-top 0.5s ease-out, margin-top 0.5s ease-out;
        }

        .mvp-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: opacity 0.3s ease-in, transform 0.3s ease-out;
        }

        .mvp-content .player-pic {
            width: var(--player-pic-size);
            height: var(--player-pic-size);
            border-radius: 50%;
            border: 2px solid #60a5fa;
            object-fit: cover;
        }

        .mvp-content .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .mvp-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-bottom: var(--name-to-stats-gap);
        }

        .mvp-label {
            font-size: var(--mvp-label-size);
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 0.5px;
        }

        .mvp-content .player-name {
            font-size: var(--player-name-size);
            font-weight: 600;
            color: #93c5fd;
        }

        .mvp-content .player-stats {
            display: flex;
            gap: var(--stats-gap);
            justify-content: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: var(--stat-value-size);
            font-weight: 700;
            color: #bfdbfe;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .stat-label {
            font-size: var(--stat-label-size);
            font-weight: 600;
            color: #60a5fa;
            margin-top: 1px;
        }

        /* Test Button */
        .test-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 8px;
            color: #bfdbfe;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 1000;
        }

        .test-button:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: #60a5fa;
        }
    </style>
</head>
<body>
    <!-- Test Button -->
    <button class="test-button">Toggle MVP</button>

    <video id="gameplay-video" autoplay loop muted>
        <source src="../../../game.mp4" type="video/mp4">
    </video>

    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <div class="team" data-team="home">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Home Team">
                    <div class="team-abbr" data-abbr="home">LAL</div>
                </div>
                <div class="score" data-score="home">102</div>
            </div>
            
            <div class="team" data-team="away">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Away Team">
                    <div class="team-abbr" data-abbr="away">GSW</div>
                </div>
                <div class="score" data-score="away">98</div>
            </div>
        </div>
        
        <div class="game-status" data-status>Q3 · 8:32</div>

        <div class="mvp-section">
            <div class="mvp-content">
                <img class="player-pic" src="https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/1966.png" alt="LeBron James">
                <div class="player-info">
                    <div class="mvp-header">
                        <span class="mvp-label">⭐ MVP</span>
                        <span class="player-name">LeBron James</span>
                    </div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <div class="stat-value">34</div>
                            <div class="stat-label">PTS</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">8</div>
                            <div class="stat-label">REB</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">7</div>
                            <div class="stat-label">AST</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const button = document.querySelector('.test-button');
        const mvpSection = document.querySelector('.mvp-section');
        const mvpContent = document.querySelector('.mvp-content');
        let isVisible = false;

        // Animation values
        const openBoxMs = 500;
        const openDelay = 300;
        const openFadeMs = 300;
        const slideAmount = 15;
        const closeFadeMs = 350;
        const closeDelay = 300;
        const closeBoxMs = 500;

        // Set initial hidden state
        mvpSection.style.height = '0px';
        mvpSection.style.paddingTop = '0px';
        mvpSection.style.marginTop = '0px';
        mvpSection.style.borderTop = 'none';
        mvpContent.style.opacity = '0';
        mvpContent.style.transform = `translateX(-${slideAmount}px)`;
        
        button.addEventListener('click', () => {

            if (isVisible) {
                // Hide: fade out content only (no horizontal movement)
                mvpContent.style.opacity = '0';
                mvpContent.style.transition = `opacity ${closeFadeMs}ms ease-in`;
                
                // Then collapse box with close duration
                setTimeout(() => {
                    mvpSection.style.transition = `height ${closeBoxMs}ms ease-out, padding-top ${closeBoxMs}ms ease-out, margin-top ${closeBoxMs}ms ease-out`;
                    mvpSection.style.height = '0px';
                    mvpSection.style.paddingTop = '0px';
                    mvpSection.style.marginTop = '0px';
                    mvpSection.style.borderTop = 'none';
                }, closeDelay);
                
                // Reset position for next opening
                setTimeout(() => {
                    mvpContent.style.transform = `translateX(-${slideAmount}px)`;
                }, closeDelay + closeBoxMs);
                
                isVisible = false;
            } else {
                // Show: expand box first with open duration
                mvpSection.style.transition = `height ${openBoxMs}ms ease-out, padding-top ${openBoxMs}ms ease-out, margin-top ${openBoxMs}ms ease-out`;
                mvpSection.style.height = '174px';
                mvpSection.style.paddingTop = '12px';
                mvpSection.style.marginTop = '5px';
                mvpSection.style.borderTop = '1px solid rgba(59, 130, 246, 0.3)';
                
                // Then fade in content with open fade duration and slide from left
                setTimeout(() => {
                    mvpContent.style.transition = `opacity ${openFadeMs}ms ease-in, transform ${openFadeMs}ms ease-out`;
                    mvpContent.style.opacity = '1';
                    mvpContent.style.transform = 'translateX(0)';
                }, openDelay);
                
                isVisible = true;
            }
        });
    </script>
</body>
</html>
