<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game States Test</title>
    <link rel="stylesheet" href="../core/styles.css">
    <style>
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 12px;
            min-width: 200px;
        }

        .controls h3 {
            color: #60a5fa;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .controls button:hover {
            background: rgba(59, 130, 246, 0.4);
            color: #dbeafe;
        }

        .controls button.active {
            background: rgba(59, 130, 246, 0.6);
            color: #ffffff;
            border-color: #3b82f6;
        }

        .current-state {
            color: #86efac;
            font-size: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../game.mp4" type="video/mp4">
    </video>

    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>

        <div class="teams">
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Lakers">
                    <div class="team-abbr" data-abbr="home">LAL</div>
                </div>
                <div class="score" data-score="home">0</div>
            </div>
            
            <div class="team">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Warriors">
                    <div class="team-abbr" data-abbr="away">GSW</div>
                </div>
                <div class="score" data-score="away">0</div>
            </div>
        </div>

        <div class="game-status" data-status>Q1 · 12:00</div>
    </div>

    <div class="controls">
        <h3>Game States</h3>
        <button id="btn-pregame">Pre-Game</button>
        <button id="btn-live-q1">Live (Q1)</button>
        <button id="btn-live-q3">Live (Q3)</button>
        <button id="btn-halftime">Halftime</button>
        <button id="btn-final">Final</button>
        <div class="current-state">Current: <span id="state-display">Live</span></div>
        
        <h3 style="margin-top: 20px;">Score Test</h3>
        <button id="btn-home-score">+1 Home (Slide)</button>
        <button id="btn-away-score">+1 Away (Slide)</button>
    </div>

    <!-- Load GameView class from external file -->
    <script src="../core/game-view.js"></script>

    <script>
        // Test controls and demo data
        // Initialize GameView
        const gameView = new GameView();
        
        // Track last state to mimic production behavior
        let lastState = null;
        let lastScores = { home: 0, away: 0 };
        let isFirstLoad = true;

        // Sample data
        const sampleData = {
            homeTeam: { abbr: 'LAL', logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png' },
            awayTeam: { abbr: 'GSW', logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/gsw.png' }
        };

        // Smart update function (mimics production behavior)
        function smartUpdate(stateName, data) {
            const homeScore = data.home?.score || 0;
            const awayScore = data.away?.score || 0;
            
            if (isFirstLoad) {
                // First load - full transition
                console.log('📊 First load - full transition');
                gameView.transitionToState(stateName, data);
                isFirstLoad = false;
            } else if (lastState !== stateName) {
                // State changed - switch instantly
                console.log('🔄 State changed - switching without animation');
                gameView.switchToState(stateName, data);
            } else if (lastScores.home !== homeScore || lastScores.away !== awayScore) {
                // Only scores changed - slide animation
                console.log('🎯 Scores changed - updating with slide animation');
                if (lastScores.home !== homeScore) {
                    gameView.updateScore('home', homeScore, true);
                }
                if (lastScores.away !== awayScore) {
                    gameView.updateScore('away', awayScore, true);
                }
            } else {
                console.log('⏭️ No significant changes');
            }
            
            lastState = stateName;
            lastScores = { home: homeScore, away: awayScore };
        }

        // Button handlers
        function updateActiveButton(buttonId) {
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(buttonId).classList.add('active');
            document.getElementById('state-display').textContent = gameView.getCurrentState();
        }

        document.getElementById('btn-pregame').addEventListener('click', () => {
            smartUpdate('pregame', {
                homeTeam: sampleData.homeTeam,
                awayTeam: sampleData.awayTeam,
                countdown: '02:15:34'
            });
            updateActiveButton('btn-pregame');
        });

        document.getElementById('btn-live-q1').addEventListener('click', () => {
            smartUpdate('live', {
                home: { ...sampleData.homeTeam, score: 18 },
                away: { ...sampleData.awayTeam, score: 22 },
                quarter: 'Q1',
                time: '7:32'
            });
            updateActiveButton('btn-live-q1');
        });

        document.getElementById('btn-live-q3').addEventListener('click', () => {
            smartUpdate('live', {
                home: { ...sampleData.homeTeam, score: 67 },
                away: { ...sampleData.awayTeam, score: 64 },
                quarter: 'Q3',
                time: '4:18'
            });
            updateActiveButton('btn-live-q3');
        });

        document.getElementById('btn-halftime').addEventListener('click', () => {
            smartUpdate('halftime', {
                home: { ...sampleData.homeTeam, score: 54 },
                away: { ...sampleData.awayTeam, score: 48 }
            });
            updateActiveButton('btn-halftime');
        });

        document.getElementById('btn-final').addEventListener('click', () => {
            smartUpdate('final', {
                home: { ...sampleData.homeTeam, score: 112 },
                away: { ...sampleData.awayTeam, score: 108 }
            });
            updateActiveButton('btn-final');
        });

        // Score increment buttons (with slide animation)
        document.getElementById('btn-home-score').addEventListener('click', () => {
            const currentScore = parseInt(gameView.elements.homeScore.textContent) || 0;
            const newScore = currentScore + 1;
            gameView.updateScore('home', newScore, true); // Uses default 'slide' animation
            lastScores.home = newScore; // Update tracking
        });

        document.getElementById('btn-away-score').addEventListener('click', () => {
            const currentScore = parseInt(gameView.elements.awayScore.textContent) || 0;
            const newScore = currentScore + 1;
            gameView.updateScore('away', newScore, true); // Uses default 'slide' animation
            lastScores.away = newScore; // Update tracking
        });

        // Set initial active button
        updateActiveButton('btn-live-q1');
    </script>
</body>
</html>
