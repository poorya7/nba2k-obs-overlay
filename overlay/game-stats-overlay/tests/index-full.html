<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR Basketball - Full Layout Preview</title>
    <link rel="stylesheet" href="../core/styles.css">
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../game.mp4" type="video/mp4">
    </video>

    <!-- Channel Branding -->
    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <!-- Game Stats Overlay -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <!-- Home Team -->
            <div class="team" data-team="home">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="" alt="Home Team">
                    <div class="team-abbr" data-abbr="home">---</div>
                </div>
                <div class="score" data-score="home">0</div>
            </div>
            
            <!-- Away Team -->
            <div class="team" data-team="away">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="" alt="Away Team">
                    <div class="team-abbr" data-abbr="away">---</div>
                </div>
                <div class="score" data-score="away">0</div>
            </div>
        </div>
        
        <div class="game-status" data-status>Q1 · 12:00</div>
    </div>

    <script src="../core/game-view.js"></script>
    <script>
        // Initialize with demo data
        const gameView = new GameView();
        
        gameView.updateAll({
            home: {
                abbr: 'LAL',
                logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png',
                score: 82
            },
            away: {
                abbr: 'GSW',
                logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/gsw.png',
                score: 78
            },
            quarter: 'Q3',
            time: '8:32'
        });

        // Make gameView globally available for testing in console
        window.gameView = gameView;
    </script>
</body>
</html>
