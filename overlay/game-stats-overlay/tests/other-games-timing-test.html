<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Games - Timing Test</title>
    <link rel="stylesheet" href="../core/styles.css">
    <style>
        /* Other Games Overlay */
        .other-games-overlay {
            position: fixed;
            top: 155px;
            right: 20px;
            z-index: 10;
        }
        
        .other-game-card {
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 14px;
            box-shadow: 0 8px 40px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.4);
            opacity: 0.7;
            min-width: 160px;
        }
        
        .game-in-card {
            display: flex;
            flex-direction: column;
        }
        
        .other-game-teams {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        
        .other-game-team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        
        .other-game-team-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        
        .other-game-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        
        .other-game-abbr {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        
        .other-game-score {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            min-width: 24px;
            text-align: right;
        }
        
        .other-game-status {
            text-align: center;
            font-size: 9px;
            font-weight: 600;
            color: #a5b4fc;
            letter-spacing: 0.5px;
            padding-top: 6px;
        }
        
        .other-game-status.live {
            color: #3b82f6;
            padding-top: 0;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            margin-bottom: 8px;
        }
        
        .other-game-status.final {
            color: #4ade80;
        }
        
        .other-game-status.pregame {
            color: #fbbf24;
        }
        
        .game-time {
            color: #4ade80;
        }
        
        .game-divider.thick {
            height: 2px;
            background: rgba(59, 130, 246, 0.5);
            margin: 12px 0;
        }
        
    </style>
</head>
<body>
    <video id="gameplay-video" autoplay loop muted>
        <source src="../../game.mp4" type="video/mp4">
    </video>

    <!-- Channel Branding -->
    <div class="channel-branding">
        <div class="main-text">Silent Basketball</div>
        <div class="sub-text">ASMR</div>
    </div>

    <!-- Current Game Stats Overlay -->
    <div class="game-stats">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
            <span class="nba-label">NBA</span>
        </div>
        
        <div class="teams">
            <div class="team" data-team="home">
                <div class="team-left">
                    <img class="team-logo" data-logo="home" src="https://a.espncdn.com/i/teamlogos/nba/500/lal.png" alt="Home Team">
                    <div class="team-abbr" data-abbr="home">LAL</div>
                </div>
                <div class="score" data-score="home">82</div>
            </div>
            
            <div class="team" data-team="away">
                <div class="team-left">
                    <img class="team-logo" data-logo="away" src="https://a.espncdn.com/i/teamlogos/nba/500/gsw.png" alt="Away Team">
                    <div class="team-abbr" data-abbr="away">GSW</div>
                </div>
                <div class="score" data-score="away">78</div>
            </div>
        </div>
        
        <div class="game-status" data-status>Q3 · 8:32</div>
    </div>

    <!-- Other Games Overlay -->
    <div class="other-games-overlay" id="other-games">
        <div class="other-game-card">
            <div id="games-container">
                <!-- Games will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script src="../core/game-view.js"></script>
    <script>
        // Initialize main game view
        const gameView = new GameView();
        gameView.updateAll({
            home: { abbr: 'LAL', logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png', score: 82 },
            away: { abbr: 'GSW', logoUrl: 'https://a.espncdn.com/i/teamlogos/nba/500/gsw.png', score: 78 },
            quarter: 'Q3',
            time: '8:32'
        });
        window.gameView = gameView;

        // Sample 10 games with different states (unsorted)
        const unsortedGames = [
            { 
                state: 'pregame', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/bos.png', abbr: 'BOS' },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/mia.png', abbr: 'MIA' },
                secondsUntilStart: 8130 // 2:15:30
            },
            { 
                state: 'live', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/den.png', abbr: 'DEN', score: 94 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/phx.png', abbr: 'PHX', score: 88 },
                quarter: 'Q4 · 5:23'
            },
            { 
                state: 'final', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/dal.png', abbr: 'DAL', score: 112 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/sac.png', abbr: 'SAC', score: 108 },
                status: 'FINAL'
            },
            { 
                state: 'pregame', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/chi.png', abbr: 'CHI' },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/mil.png', abbr: 'MIL' },
                secondsUntilStart: 13500 // 3:45:00
            },
            { 
                state: 'live', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/mem.png', abbr: 'MEM', score: 55 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/nyk.png', abbr: 'NYK', score: 62 },
                quarter: 'Q2 · 8:15'
            },
            { 
                state: 'live', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/atl.png', abbr: 'ATL', score: 78 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/cle.png', abbr: 'CLE', score: 81 },
                quarter: 'Q3 · 2:34'
            },
            { 
                state: 'final', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/uta.png', abbr: 'UTA', score: 98 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/okc.png', abbr: 'OKC', score: 105 },
                status: 'FINAL'
            },
            { 
                state: 'pregame', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/por.png', abbr: 'POR' },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/lac.png', abbr: 'LAC' },
                secondsUntilStart: 15615 // 4:20:15
            },
            { 
                state: 'live', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/min.png', abbr: 'MIN', score: 42 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/ind.png', abbr: 'IND', score: 38 },
                quarter: 'Q1 · 4:52'
            },
            { 
                state: 'final', 
                away: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/det.png', abbr: 'DET', score: 87 },
                home: { logo: 'https://a.espncdn.com/i/teamlogos/nba/500/tor.png', abbr: 'TOR', score: 92 },
                status: 'FINAL'
            }
        ];

        // Sort games: Final (most recent) -> Live -> Pregame
        function sortGames(games) {
            const statePriority = {
                'final': 1,
                'live': 2,
                'pregame': 3
            };
            
            return [...games].sort((a, b) => {
                // First sort by state priority
                if (statePriority[a.state] !== statePriority[b.state]) {
                    return statePriority[a.state] - statePriority[b.state];
                }
                
                // For final games, you could add logic to sort by recency
                // For now, keep their original order within same state
                return 0;
            });
        }

        const allGames = sortGames(unsortedGames);
        console.log('Games sorted:', allGames.map(g => g.state));

        // Cycling logic
        let currentSet = 0;
        const gamesPerSet = 3;
        const displayDuration = 16000; // 16 seconds
        const fadeDuration = 200; // 0.2 seconds
        let cycleInterval = null;

        const gamesContainer = document.getElementById('games-container');
        const overlay = document.getElementById('other-games');
        let countdownInterval = null;

        function formatCountdown(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateCountdowns() {
            // Update countdown for all visible pregame games
            document.querySelectorAll('.countdown-timer').forEach(el => {
                const gameIndex = parseInt(el.dataset.gameIndex);
                if (allGames[gameIndex] && allGames[gameIndex].secondsUntilStart > 0) {
                    allGames[gameIndex].secondsUntilStart--;
                    el.textContent = 'Starts in ' + formatCountdown(allGames[gameIndex].secondsUntilStart);
                }
            });
        }

        function renderGames(startIndex) {
            const gamesToShow = allGames.slice(startIndex, startIndex + gamesPerSet);
            
            let html = '';
            gamesToShow.forEach((game, index) => {
                const actualGameIndex = startIndex + index; // Track actual game index in allGames array
                
                if (game.state === 'pregame') {
                    html += `
                        <div class="game-in-card">
                            <div class="other-game-teams">
                                <div class="other-game-team">
                                    <div class="other-game-team-left">
                                        <img class="other-game-logo" src="${game.away.logo}" alt="${game.away.abbr}">
                                        <span class="other-game-abbr">${game.away.abbr}</span>
                                        <span style="margin: 0 4px; color: #94a3b8; font-size: 10px;">@</span>
                                        <img class="other-game-logo" src="${game.home.logo}" alt="${game.home.abbr}">
                                        <span class="other-game-abbr">${game.home.abbr}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="other-game-status pregame countdown-timer" data-game-index="${actualGameIndex}">Starts in ${formatCountdown(game.secondsUntilStart)}</div>
                        </div>
                    `;
                } else if (game.state === 'live') {
                    html += `
                        <div class="game-in-card">
                            <div class="other-game-status live">LIVE</div>
                            <div class="other-game-teams">
                                <div class="other-game-team">
                                    <div class="other-game-team-left">
                                        <img class="other-game-logo" src="${game.away.logo}" alt="${game.away.abbr}">
                                        <span class="other-game-abbr">${game.away.abbr}</span>
                                    </div>
                                    <span class="other-game-score">${game.away.score}</span>
                                </div>
                                <div class="other-game-team">
                                    <div class="other-game-team-left">
                                        <img class="other-game-logo" src="${game.home.logo}" alt="${game.home.abbr}">
                                        <span class="other-game-abbr">${game.home.abbr}</span>
                                    </div>
                                    <span class="other-game-score">${game.home.score}</span>
                                </div>
                            </div>
                            <div class="other-game-status"><span class="game-time" style="color: #4ade80;">${game.quarter}</span></div>
                        </div>
                    `;
                } else { // final
                    html += `
                        <div class="game-in-card">
                            <div class="other-game-teams">
                                <div class="other-game-team">
                                    <div class="other-game-team-left">
                                        <img class="other-game-logo" src="${game.away.logo}" alt="${game.away.abbr}">
                                        <span class="other-game-abbr">${game.away.abbr}</span>
                                    </div>
                                    <span class="other-game-score">${game.away.score}</span>
                                </div>
                                <div class="other-game-team">
                                    <div class="other-game-team-left">
                                        <img class="other-game-logo" src="${game.home.logo}" alt="${game.home.abbr}">
                                        <span class="other-game-abbr">${game.home.abbr}</span>
                                    </div>
                                    <span class="other-game-score">${game.home.score}</span>
                                </div>
                            </div>
                            <div class="other-game-status final">${game.status}</div>
                        </div>
                    `;
                }
                
                if (index < gamesToShow.length - 1) {
                    html += '<div class="game-divider thick"></div>';
                }
            });
            
            gamesContainer.innerHTML = html;
        }

        function fadeOut() {
            return new Promise(resolve => {
                gamesContainer.style.transition = `opacity ${fadeDuration / 1000}s ease`;
                gamesContainer.style.opacity = '0';
                setTimeout(resolve, fadeDuration);
            });
        }

        function fadeIn() {
            return new Promise(resolve => {
                gamesContainer.style.transition = `opacity ${fadeDuration / 1000}s ease`;
                gamesContainer.style.opacity = '1';
                setTimeout(resolve, fadeDuration);
            });
        }

        async function nextSet() {
            await fadeOut();
            currentSet = (currentSet + 1) % Math.ceil(allGames.length / gamesPerSet);
            renderGames(currentSet * gamesPerSet);
            await fadeIn();
        }

        function startCycle() {
            if (cycleInterval) clearInterval(cycleInterval);
            cycleInterval = setInterval(nextSet, displayDuration);
        }

        // Initialize
        renderGames(0);
        startCycle();
        
        // Start countdown timer (updates every second)
        countdownInterval = setInterval(updateCountdowns, 1000);

        console.log('Timing locked: 16s display, 0.2s fade | Total games:', allGames.length);
    </script>
</body>
</html>
